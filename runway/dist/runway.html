<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RUNWAY — เกมจำลองการทำธุรกิจ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* RUNWAY — flight-deck dashboard. Layout: fixed instrument bar on top (runway lights = months of cash),
   left rail of departments, panels on a cool ledger-grey ground. */
:root {
  --bg: #eceff0;
  --panel: #fbfcfc;
  --panel2: #f3f5f6;
  --ink: #0f1b2a;
  --ink2: #44505f;
  --muted: #727c8a;
  --line: #d7dce0;
  --line2: #e6e9ec;
  --accent: #2856d0;
  --accent-soft: #e3eafb;
  --accent-ink: #ffffff;
  --good: #11804f;
  --good-bg: #e2f3ea;
  --warn: #9a6100;
  --warn-bg: #fbf0d9;
  --crit: #c22f2f;
  --crit-bg: #fbe4e2;
  --lamp-on: #18b35f;
  --lamp-warn: #f0a81c;
  --lamp-crit: #e2463f;
  --lamp-off: #cfd5da;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --s4: #6250d6;
  --grid: #e1e4e7;
  --shadow: 0 1px 2px rgba(15, 27, 42, 0.06), 0 4px 16px rgba(15, 27, 42, 0.05);
  --f-display: "Chakra Petch", "IBM Plex Sans Thai", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Thai", "Noto Sans Thai", "Sarabun", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  --topbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0f15; --panel: #111922; --panel2: #16202b; --ink: #e4eaf1; --ink2: #a8b3c1; --muted: #7b8796;
    --line: #233142; --line2: #1b2733; --accent: #7fa3ff; --accent-soft: #1b2a4a; --accent-ink: #0a0f15;
    --good: #43d08d; --good-bg: #10301f; --warn: #f2b640; --warn-bg: #33270c; --crit: #ff7a72; --crit-bg: #3a1615;
    --lamp-on: #2fd47a; --lamp-warn: #f5b437; --lamp-crit: #ff5c54; --lamp-off: #26323f;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #9085e9; --grid: #1f2a36;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0f15; --panel: #111922; --panel2: #16202b; --ink: #e4eaf1; --ink2: #a8b3c1; --muted: #7b8796;
  --line: #233142; --line2: #1b2733; --accent: #7fa3ff; --accent-soft: #1b2a4a; --accent-ink: #0a0f15;
  --good: #43d08d; --good-bg: #10301f; --warn: #f2b640; --warn-bg: #33270c; --crit: #ff7a72; --crit-bg: #3a1615;
  --lamp-on: #2fd47a; --lamp-warn: #f5b437; --lamp-crit: #ff5c54; --lamp-off: #26323f;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #9085e9; --grid: #1f2a36;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: 0.01em; }
h2 { font-size: 20px; }
h3 { font-size: 15px; }
.num, .tnum, td.n, th.n { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink2); }
.small { font-size: 12px; }
.tiny { font-size: 11px; }
.good { color: var(--good); }
.warn { color: var(--warn); }
.crit { color: var(--crit); }
.nowrap { white-space: nowrap; }
.right { text-align: right; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- App shell ---------- */
#app { min-height: 100%; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 14px; padding: 8px 16px; min-height: var(--topbar-h); flex-wrap: wrap;
}
.brand { display: flex; flex-direction: column; min-width: 0; margin-right: 4px; }
.brand b { font-family: var(--f-display); font-size: 17px; letter-spacing: 0.14em; }
.brand span { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
.gauges { display: flex; gap: 6px; flex: 1; flex-wrap: wrap; min-width: 0; }
.gauge { display: flex; flex-direction: column; padding: 2px 10px; border-left: 1px solid var(--line2); min-width: 0; }
.gauge:first-child { border-left: 0; }
.gauge label { font-size: 10.5px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
.gauge strong { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.gauge .sub { font-size: 11px; color: var(--muted); white-space: nowrap; }
.lights { display: flex; gap: 2px; margin-top: 3px; }
.lights i { width: 6px; height: 6px; border-radius: 1px; background: var(--lamp-off); display: block; }
.lights i.on { background: var(--lamp-on); box-shadow: 0 0 4px color-mix(in srgb, var(--lamp-on) 60%, transparent); }
.lights i.w { background: var(--lamp-warn); }
.lights i.c { background: var(--lamp-crit); }
.controls { display: flex; gap: 6px; align-items: center; margin-left: auto; }
.date { font-family: var(--f-display); font-size: 13px; color: var(--ink2); white-space: nowrap; }

.shell { display: grid; grid-template-columns: 208px minmax(0, 1fr); min-height: calc(100vh - var(--topbar-h)); background: linear-gradient(to right, var(--panel) 207px, var(--line) 207px, var(--line) 208px, transparent 208px); }
.rail { border-right: 1px solid var(--line); background: var(--panel); padding: 10px 8px; position: sticky; top: var(--topbar-h); height: calc(100vh - var(--topbar-h)); overflow-y: auto; }
.rail button { display: flex; align-items: center; justify-content: space-between; gap: 6px; width: 100%; text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 8px; cursor: pointer; color: var(--ink2); }
.rail button:hover { background: var(--panel2); color: var(--ink); }
.rail button.on { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.rail .sep { height: 1px; background: var(--line2); margin: 8px 6px; }
.badge { font-size: 11px; min-width: 18px; height: 18px; padding: 0 6px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: inline-flex; align-items: center; justify-content: center; font-weight: 600; }
.badge.crit { background: var(--crit); color: #fff; }
.main { padding: 18px 20px 60px; min-width: 0; }

/* ---------- Building blocks ---------- */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.page-head p { margin: 2px 0 0; color: var(--ink2); max-width: 70ch; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-side { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0; }
.panel > h3 { margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.panel > h3 small { font-family: var(--f-body); font-weight: 400; color: var(--muted); font-size: 12px; }
.panel.flush { padding: 0; }
.panel.flush > h3 { padding: 14px 16px 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.stack > .btn { align-self: flex-start; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; font-size: 13px; }
.kv > span:nth-child(odd) { color: var(--ink2); }
.kv > span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; min-width: 0; }
.tile label { display: block; font-size: 12px; color: var(--ink2); }
.tile strong { display: block; font-size: 20px; font-weight: 600; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .sub { font-size: 12px; color: var(--muted); }
.tile.good { box-shadow: inset 3px 0 0 var(--good); }
.tile.warn { box-shadow: inset 3px 0 0 var(--lamp-warn); }
.tile.crit { box-shadow: inset 3px 0 0 var(--crit); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel2); color: var(--ink2); white-space: nowrap; }
.pill.good { background: var(--good-bg); color: var(--good); border-color: transparent; }
.pill.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.pill.crit { background: var(--crit-bg); color: var(--crit); border-color: transparent; }
.pill.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.meter { height: 6px; background: var(--line2); border-radius: 3px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.meter.good > i { background: var(--lamp-on); }
.meter.warn > i { background: var(--lamp-warn); }
.meter.crit > i { background: var(--lamp-crit); }
.bar-label { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 3px; gap: 8px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: 13px; white-space: nowrap; color: var(--ink); }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.danger { color: var(--crit); }
.btn.danger:hover:not(:disabled) { border-color: var(--crit); }
.btn.sm { padding: 3px 8px; font-size: 12px; border-radius: 6px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.go { font-family: var(--f-display); font-size: 14px; padding: 8px 14px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 5px 10px; cursor: pointer; font-size: 12.5px; color: var(--ink2); border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button.on { background: var(--accent-soft); color: var(--ink); font-weight: 600; }

input[type="number"], input[type="text"], select, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; min-width: 0; }
input[type="number"] { width: 130px; font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.field { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--ink2); }
.slider-row { display: grid; grid-template-columns: minmax(110px, 180px) minmax(0, 1fr) 56px; gap: 10px; align-items: center; font-size: 13px; }
.slider-row output { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11.5px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; letter-spacing: 0.02em; }
.tbl td { padding: 6px 8px; border-bottom: 1px solid var(--line2); vertical-align: top; }
.tbl td.n, .tbl th.n { text-align: right; white-space: nowrap; }
.tbl tr.sub td { color: var(--ink2); }
.tbl tr.total td { font-weight: 600; border-top: 1px solid var(--line); }
.tbl tr:hover td { background: color-mix(in srgb, var(--accent-soft) 40%, transparent); }
.tbl td.neg { color: var(--crit); }

.alert { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; font-size: 13px; background: var(--panel2); }
.alert .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--muted); }
.alert.crit { background: var(--crit-bg); }
.alert.crit .dot { background: var(--lamp-crit); }
.alert.warn { background: var(--warn-bg); }
.alert.warn .dot { background: var(--lamp-warn); }
.alert.good .dot { background: var(--lamp-on); }

.mail { display: grid; grid-template-columns: 8px minmax(0, 1fr); gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line2); cursor: pointer; }
.mail:hover { background: var(--panel2); }
.mail .t { font-weight: 500; }
.mail.unread .t { font-weight: 700; }
.mail .b { color: var(--ink2); font-size: 12.5px; white-space: pre-line; }
.mail .d { font-size: 11px; color: var(--muted); }
.mail .tone { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; background: var(--line); }
.mail .tone.good { background: var(--lamp-on); }
.mail .tone.bad { background: var(--lamp-crit); }
.mail .tone.warn { background: var(--lamp-warn); }

.tag { font-size: 11px; color: var(--muted); border: 1px dashed var(--line); padding: 0 6px; border-radius: 4px; }
.empty { padding: 20px; text-align: center; color: var(--muted); font-size: 13px; }
.note { font-size: 12.5px; color: var(--ink2); background: var(--panel2); border-radius: 8px; padding: 8px 10px; }
.divider { height: 1px; background: var(--line2); margin: 6px 0; }

/* tooltips for jargon */
[data-tip] { position: relative; text-decoration: underline dotted var(--muted); text-underline-offset: 3px; cursor: help; }
[data-tip]:hover::after, [data-tip]:focus::after {
  content: attr(data-tip); position: absolute; left: 0; top: 100%; margin-top: 6px; z-index: 50; width: max-content; max-width: 280px;
  background: var(--ink); color: var(--panel); padding: 7px 9px; border-radius: 7px; font-size: 12px; line-height: 1.45; font-weight: 400; white-space: normal; text-transform: none; letter-spacing: 0;
}

/* charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 8px; padding: 6px 8px; font-size: 12px; white-space: nowrap; z-index: 5; display: none; }
.chart .tip b { display: block; font-size: 11px; color: var(--muted); font-weight: 500; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--ink2); margin-bottom: 6px; }
.legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
.stackbar { display: flex; height: 18px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--panel); }
.stackbar > i { display: block; height: 100%; min-width: 2px; }

/* modal */
.modal-back { position: fixed; inset: 0; background: rgba(8, 12, 18, 0.55); z-index: 80; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; max-width: 640px; width: 100%; max-height: calc(100vh - 32px); overflow-y: auto; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); }
.modal header { padding: 16px 18px 6px; }
.modal header .cat { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.modal header h2 { font-size: 19px; margin-top: 2px; }
.modal .body { padding: 6px 18px 4px; white-space: pre-line; color: var(--ink2); font-size: 14px; }
.modal .choices { padding: 12px 18px 18px; display: flex; flex-direction: column; gap: 8px; }
.choice { text-align: left; border: 1px solid var(--line); background: var(--panel2); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.choice:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.choice:disabled { opacity: 0.5; cursor: not-allowed; }
.choice b { display: block; font-weight: 600; color: var(--ink); }
.choice span { font-size: 12.5px; color: var(--muted); }
.result { margin: 0 18px 14px; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); font-size: 13.5px; }

.toasts { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 90; display: flex; flex-direction: column; gap: 8px; max-width: min(380px, calc(100vw - 32px)); }
.toast { background: var(--ink); color: var(--panel); padding: 9px 12px; border-radius: 9px; font-size: 13px; box-shadow: var(--shadow); animation: tin 0.2s ease-out; }
.toast.bad { background: var(--crit); color: #fff; }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }

/* setup / title */
.title-screen { max-width: 980px; margin: 0 auto; padding: 28px 16px 60px; }
.hero { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 24px; align-items: center; margin-bottom: 22px; }
.hero h1 { font-size: clamp(40px, 7vw, 72px); letter-spacing: 0.12em; line-height: 1; }
.hero .tag-line { font-size: 17px; color: var(--ink2); margin-top: 10px; max-width: 46ch; }
.strip { display: flex; gap: 5px; margin-top: 16px; }
.strip i { width: 12px; height: 12px; border-radius: 2px; background: var(--lamp-on); opacity: 0.25; animation: lamp 2.4s infinite; }
@keyframes lamp { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .strip i { animation: none; opacity: 0.8; } }
.facts { display: grid; gap: 8px; font-size: 13px; color: var(--ink2); }
.facts div { display: flex; gap: 10px; }
.facts b { font-family: var(--f-display); color: var(--ink); min-width: 72px; }
.choices-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.card-opt { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.card-opt:hover { border-color: var(--accent); }
.card-opt.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.card-opt b { font-size: 14.5px; }
.card-opt span { font-size: 12.5px; color: var(--ink2); }
.step { margin-bottom: 18px; }
.step > h3 { margin-bottom: 8px; display: flex; gap: 8px; align-items: baseline; }
.step > h3 .n { font-family: var(--f-display); color: var(--accent); }

.end { max-width: 760px; margin: 30px auto; }
.end .rank { font-family: var(--f-display); font-size: 38px; }
.epilogue { border-left: 2px solid var(--accent); padding: 2px 0 2px 14px; display: grid; gap: 10px; }
.epi b { font-family: var(--f-display); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.epi p { margin: 2px 0 0; color: var(--ink2); line-height: 1.65; }

/* responsive */
@media (max-width: 1100px) {
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g-side { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .date { display: none; }
  .btn.go { padding: 7px 10px; font-size: 13px; }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: sticky; top: 0; height: auto; display: flex; overflow-x: auto; gap: 2px; padding: 6px 10px; border-right: 0; border-bottom: 1px solid var(--line); z-index: 20; }
  .rail button { width: auto; white-space: nowrap; padding: 6px 10px; }
  .rail .sep { display: none; }
  .topbar { position: static; gap: 8px; padding: 8px 12px; }
  .shell { background: none; }
  .brand { flex-direction: row; align-items: baseline; gap: 8px; }
  .controls { margin-left: auto; }
  .gauges { order: 3; flex-basis: 100%; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; }
  .gauge { flex: none; }
  .main { padding: 14px 16px 60px; }
  .g2, .g3, .g4 { grid-template-columns: minmax(0, 1fr); }
  .hero { grid-template-columns: minmax(0, 1fr); }
  .gauge { padding: 2px 6px; }
  .slider-row { grid-template-columns: minmax(90px, 120px) minmax(0, 1fr) 48px; }
}

</style>

      layoffsW: -999, history: { hired: 0, quit: 0, fired: 0, laidOff: 0 }
    };
  };

  T.active = function (state) { return state.team.emps.filter(function (e) { return e.startW <= state.time.w && !e.gone; }); };
  T.all = function (state) { return state.team.emps.filter(function (e) { return !e.gone; }); };
  T.headcount = function (state) { return T.all(state).length; };

  T.wageIndex = function (state) { return state.world ? state.world.wageIndex : 1; };

  T.marketSalary = function (state, role, level, skill) {
    var r = RW.ROLES[role];
    var base = r.salary[level];
    var band = LEVEL_SKILL[level];
    var mid = (band[0] + band[1]) / 2;
    var adj = 1 + U.clamp((skill - mid) / 60, -0.25, 0.35);
    return Math.round(base * adj * T.wageIndex(state) / 500) * 500;
  };

  T.genCandidate = function (state, op) {
    var ch = CHANNELS[op.channel];
    var band = LEVEL_SKILL[op.level];
    var skill = U.clamp(R.normal((band[0] + band[1]) / 2 + ch.quality * 0.6 + (state.team.brand - 40) / 12, (band[1] - band[0]) / 3.2), 15, 99);
    var traits = [];
    var tkeys = Object.keys(RW.TRAITS);
    var nTraits = R.chance(0.55) ? 1 : R.chance(0.35) ? 2 : 0;
    for (var i = 0; i < nTraits; i++) {
      var t = R.weighted(tkeys, function (k) {
        if (traits.indexOf(k) >= 0) return 0;
        var w = RW.TRAITS[k].hidden ? 0.8 : 1;
        if (op.channel === 'referral' && (k === 'toxic' || k === 'slacker' || k === 'jobhopper')) w *= 0.35;
        if (op.channel === 'agency' && k === 'jobhopper') w *= 1.6;
        if (k === 'rockstar') w *= skill > 75 ? 1.2 : 0.3;
        if (k === 'leader' && op.level < 3) w *= 0.3;
        return w;
      });
      if (t) traits.push(t);
    }
    var mkt = T.marketSalary(state, op.role, op.level, skill);
    // interview estimate error shrinks with hiring skill
    var hireSkill = T.interviewSkill(state);
    var errSd = U.lerp(16, 5, hireSkill);
    return {
      id: 'c' + (state.team.nextId++), name: RW.Names.person(), nick: RW.Names.nick(), role: op.role, level: op.level,
      skill: Math.round(skill), est: Math.round(U.clamp(skill + R.normal(0, errSd), 10, 99)), errSd: Math.round(errSd),
      traits: traits, ask: Math.round(mkt * R.range(0.95, 1.2) / 500) * 500,
      wantsEquity: op.level >= 3 && R.chance(0.5),
      opId: op.id, expires: state.time.w + R.int(2, 4), notice: op.level >= 2 && RW.ROLES[op.role].dept !== 'cogs' ? 4 : R.int(1, 2),
      interestBase: R.range(-0.4, 0.4)
    };
  };

  // How good the company is at judging candidates (0..1)
  T.interviewSkill = function (state) {
    var f = state.founder;
    var hr = T.capOf(state, 'hr');
    return U.clamp((f.skills.leadership - 20) / 120 + hr * 0.12 + (state.founder.focus.team || 0) / 200, 0.05, 0.95);
  };

  T.openPosition = function (state, role, level, channel) {
    var ch = CHANNELS[channel];
    var op = { id: 'o' + (state.team.nextId++), role: role, level: level, channel: channel, openedW: state.time.w };
    state.team.openings.push(op);
    if (ch.cost) L.spend(state.fin, 'recruit', ch.cost);
    return op;
  };

  T.closePosition = function (state, opId) {
    state.team.openings = state.team.openings.filter(function (o) { return o.id !== opId; });
    state.team.candidates = state.team.candidates.filter(function (c) { return c.opId !== opId; });
  };

  // Probability a candidate accepts an offer
  T.acceptProb = function (state, c, salary, equityPct) {
    var payRatio = salary / c.ask;
    var x = 0.9 + (payRatio - 1) * 9 + c.interestBase; // they applied: meeting the ask usually works
    x += (state.team.brand - 45) / 25;
    // stage credibility: funded companies are safer bets
    var stageIdx = RW.STAGE_ORDER.indexOf(state.funding.stage);
    x += stageIdx >= 0 ? (stageIdx + 1) * 0.18 : -0.3;
    var runway = state.kpi ? state.kpi.runway : 12;
    if (runway < 6) x -= (6 - runway) * 0.15;
    if (equityPct > 0) x += Math.min(1.2, equityPct * 100 * (c.wantsEquity ? 1.2 : 0.5));
    else if (c.wantsEquity) x -= 0.6;
    if (state.time.w - state.team.layoffsW < 26) x -= 0.5;
    x += (state.founder.skills.leadership - 50) / 60;
    return U.clamp(U.sigmoid(x), 0.02, 0.98);
  };

  T.makeOffer = function (state, candId, salary, equityShares) {
    var c = state.team.candidates.find(function (x) { return x.id === candId; });
    if (!c) return { ok: false, msg: 'ผู้สมัครไม่อยู่แล้ว' };
    var fd = RW.Funding.fullyDiluted(state);
    var pct = equityShares > 0 ? equityShares / fd : 0;
    var p = T.acceptProb(state, c, salary, pct);
    var r = R.f();
    if (r < p) {
      var e = T.hire(state, c, salary, equityShares);
      return { ok: true, emp: e, msg: c.name + ' ตอบรับข้อเสนอ เริ่มงานในอีก ' + c.notice + ' สัปดาห์' };
    }
    // maybe counter-offer
    if (r < p + 0.3 && salary < c.ask * 1.15) {
      c.ask = Math.round(Math.max(c.ask, salary * R.range(1.06, 1.15)) / 500) * 500;
      c.countered = true;
      return { ok: false, counter: true, msg: c.name + ' ขอต่อรองเงินเดือนเป็น ' + RW.F.b(c.ask) };
    }
    state.team.candidates = state.team.candidates.filter(function (x) { return x.id !== candId; });
    return { ok: false, msg: c.name + ' ปฏิเสธข้อเสนอ (' + R.pick(['ได้ข้อเสนอที่ดีกว่าจากบริษัทใหญ่', 'ไม่มั่นใจในความมั่นคงของบริษัท', 'ครอบครัวไม่อยากให้ย้ายไปสตาร์ทอัพ', 'เงินเดือนต่ำกว่าที่คาด']) + ')' };
  };

  // second-round interview / work sample: sharper skill estimate, may reveal a hidden trait, costs founder energy
  T.deepInterview = function (state, candId) {
    var c = state.team.candidates.find(function (x) { return x.id === candId; });
    if (!c) return { ok: false, msg: 'ผู้สมัครไม่อยู่แล้ว' };
    if (c.deep) return { ok: false, msg: 'สัมภาษณ์เชิงลึกไปแล้ว' };
    if (state.founder.energy < 6) return { ok: false, msg: 'คุณเหนื่อยเกินไป' };
    state.founder.energy -= 4;
    c.deep = true;
    c.errSd = Math.max(2, Math.round(c.errSd / 2.2));
    c.est = Math.round(U.clamp(c.skill + R.normal(0, c.errSd), 10, 99));
    var hidden = c.traits.filter(function (t) { return RW.TRAITS[t].hidden; });
    var found = hidden.length && R.chance(0.55) ? R.pick(hidden) : null;
    if (found) c.seen = (c.seen || []).concat([found]);
    if (R.chance(0.12)) { c.expires = state.time.w; return { ok: true, msg: c.name + ' รับข้อเสนอที่อื่นระหว่างรอขั้นตอนเพิ่ม — รีบตัดสินใจกว่านี้ครั้งหน้า' }; }
    return { ok: true, msg: 'ทำแบบทดสอบงานจริงกับ ' + c.name + ': ฝีมือ ~' + c.est + ' ±' + c.errSd + (found ? ' · สังเกตเห็นว่า "' + RW.TRAITS[found].n + '"' : ' · ไม่พบสัญญาณอันตราย') };
  };

  T.hire = function (state, c, salary, equityShares) {
    var op = state.team.openings.find(function (o) { return o.id === c.opId; });
    var e = {
      id: 'e' + (state.team.nextId++), name: c.name, nick: c.nick, role: c.role, level: c.level,
      skill: c.skill, est: c.est, salary: salary, traits: c.traits.slice(), known: c.traits.filter(function (t) { return !RW.TRAITS[t].hidden || (c.seen && c.seen.indexOf(t) >= 0); }),
      hiredW: state.time.w, startW: state.time.w + c.notice, ramp: 0, morale: 70, stress: 20,
      lastRaiseW: state.time.w, promoW: state.time.w, options: 0, gone: false, perf: 1
    };
    state.team.emps.push(e);
    if (equityShares > 0) RW.Funding.grantOptions(state, e, equityShares);
    if (op) {
      var ch = CHANNELS[op.channel];
      if (ch.fee) L.spend(state.fin, 'recruit', Math.round(salary * 12 * ch.fee));
      if (ch.bonus) L.spend(state.fin, 'recruit', ch.bonus);
      T.closePosition(state, op.id);
    }
    state.team.candidates = state.team.candidates.filter(function (x) { return x.id !== c.id; });
    state.team.history.hired++;
    // laptop etc.
    L.buyAsset(state, 'อุปกรณ์ทำงาน ' + c.name, RW.ROLES[c.role].dept === 'cogs' && state.industry === 'fnb' ? 3000 : 38000, 36);
    return e;
  };

  T.find = function (state, id) { return state.team.emps.find(function (e) { return e.id === id; }); };

  T.tenureWeeks = function (state, e) { return Math.max(0, state.time.w - e.startW); };

  T.severanceCost = function (state, e) {
    var days = L.severanceDays(T.tenureWeeks(state, e));
    var notice = e.startW > state.time.w ? 0 : e.salary; // pay in lieu of notice (one pay cycle)
    return Math.round(e.salary / 30 * days + notice);
  };

  // remove an employee; mode: 'fire' | 'layoff' | 'quit' | 'cancel'
  T.remove = function (state, e, mode) {
    e.gone = true; e.goneW = state.time.w; e.goneMode = mode;
    if (mode === 'fire' || mode === 'layoff') {
      var cost = T.severanceCost(state, e);
      if (cost > 0) L.spend(state.fin, 'severance', cost);
      state.team.history[mode === 'fire' ? 'fired' : 'laidOff']++;
    }
    if (mode === 'quit') state.team.history.quit++;
    RW.Funding.forfeitOptions(state, e);
    // knowledge loss hooks
    var M = RW.Models && RW.Models[state.industry];
    if (M && M.onEmployeeLeft) M.onEmployeeLeft(state, e, mode);
    // purge from storage after a while (keep for history)
    state.team.emps = state.team.emps.filter(function (x) { return !x.gone || state.time.w - x.goneW < 60; });
  };

  T.fire = function (state, id) {
    var e = T.find(state, id);
    if (!e || e.gone) return 0;
    var cost = T.severanceCost(state, e);
    T.remove(state, e, 'fire');
    var toxic = e.traits.indexOf('toxic') >= 0 && e.known.indexOf('toxic') >= 0;
    T.addMod(state, toxic ? 5 : -3, 8, toxic ? 'ทีมโล่งใจที่คนเป็นพิษออกไป' : 'เพื่อนร่วมงานถูกเลิกจ้าง');
    return cost;
  };

  T.layoff = function (state, ids) {
    var total = 0, n = 0;
    ids.forEach(function (id) {
      var e = T.find(state, id);
      if (e && !e.gone) { total += T.severanceCost(state, e); T.remove(state, e, 'layoff'); n++; }
    });
    if (n > 0) {
      var share = n / Math.max(1, T.headcount(state) + n);
      T.addMod(state, -Math.round(8 + share * 40), 26, 'เลย์ออฟ ' + n + ' คน — คนที่เหลือกลัวว่าจะเป็นรายต่อไป');
      state.team.layoffsW = state.time.w;
      state.team.brand = Math.max(0, state.team.brand - 6 - share * 30);
      state.founder.rep = Math.max(0, state.founder.rep - Math.min(8, n * 0.6));
    }
    return { cost: total, n: n };
  };

  T.giveRaise = function (state, id, pct) {
    var e = T.find(state, id);
    if (!e) return;
    e.salary = Math.round(e.salary * (1 + pct) / 500) * 500;
    e.morale = U.clamp(e.morale + pct * 120, 0, 100);
    e.lastRaiseW = state.time.w;
  };

  T.promote = function (state, id) {
    var e = T.find(state, id);
    if (!e || e.level >= 5) return false;
    e.level++;
    var mk = T.marketSalary(state, e.role, e.level, e.skill);
    e.salary = Math.max(Math.round(e.salary * 1.12 / 500) * 500, Math.round(mk * 0.95 / 500) * 500);
    e.morale = U.clamp(e.morale + 15, 0, 100);
    e.promoW = state.time.w; e.lastRaiseW = state.time.w;
    return true;
  };

  T.addMod = function (state, v, weeks, why) {
    state.team.mods.push({ v: v, weeks: weeks, total: weeks, why: why });
  };
  T.modTotal = function (state) {
    return U.sum(state.team.mods, function (m) { return m.v * (m.weeks / m.total); });
  };

  // ---------- Capacity ----------
  T.mgmtSpan = function (state) {
    var f = state.founder;
    var founderSpan = (4 + f.skills.leadership / 14) * (0.6 + (f.focus.team || 0) / 60) * RW.Founder.effectiveness(state);
    var span = founderSpan;
    T.active(state).forEach(function (e) {
      if (e.level >= 4) span += (e.level === 5 ? 8 : 6) * (e.traits.indexOf('leader') >= 0 ? 1.4 : 1) * e.ramp;
    });
    (state.cofounders || []).forEach(function (c) { if (c.active) span += 6; });
    return span;
  };

  T.mgmtEfficiency = function (state) {
    var n = T.active(state).length;
    if (n === 0) return 1;
    var span = T.mgmtSpan(state);
    var eff = n <= span ? 1 : Math.pow(span / n, 0.55);
    // communication overhead grows with size (Brooks)
    var comm = 1 - 0.035 * Math.log2(Math.max(1, n / 6));
    return U.clamp(eff * comm, 0.35, 1);
  };

  T.officeCapacity = function (state) {
    var o = state.company.office;
    var need = RW.POLICIES.workmode[state.team.policy.workmode].officeNeed;
    return Math.floor(o.seats / Math.max(0.1, need));
  };

  T.outputOf = function (state, e) {
    var pol = state.team.policy;
    var out = Math.pow(e.skill / 60, 1.3);
    out *= e.ramp;
    out *= 0.7 + 0.6 * e.morale / 100;
    e.traits.forEach(function (t) { if (RW.TRAITS[t].out) out *= RW.TRAITS[t].out; });
    out *= RW.POLICIES.hours[pol.hours].prod * RW.POLICIES.workmode[pol.workmode].prod;
    if (e.stress > 80) out *= 0.8;
    return out;
  };

  T.computeCaps = function (state) {
    var caps = {};
    var eff = T.mgmtEfficiency(state);
    var over = T.headcount(state) + 1 > T.officeCapacity(state) ? 0.88 : 1;
    T.active(state).forEach(function (e) {
      var r = RW.ROLES[e.role];
      var o = T.outputOf(state, e) * eff * over;
      e.lastOut = o;
      for (var k in r.cap) caps[k] = (caps[k] || 0) + o * r.cap[k];
      // executives boost their department
      if (e.level >= 4) caps['lead_' + e.role] = (caps['lead_' + e.role] || 0) + e.skill / 100 * e.ramp;
    });
    // co-founders behave like senior employees of their role
    (state.cofounders || []).forEach(function (c) {
      if (!c.active) return;
      var r = RW.ROLES[c.role];
      var o = Math.pow(c.skill / 60, 1.3) * (0.7 + 0.6 * c.morale / 100) * eff;
      for (var k in r.cap) caps[k] = (caps[k] || 0) + o * r.cap[k];
      caps['lead_' + c.role] = (caps['lead_' + c.role] || 0) + c.skill / 100;
    });
    // founder contributions
    var fc = RW.Founder.contribution(state);
    for (var k2 in fc) caps[k2] = (caps[k2] || 0) + fc[k2];
    caps.mgmtEff = eff;
    state.caps = caps;
    return caps;
  };
  T.capOf = function (state, k) { return (state.caps && state.caps[k]) || 0; };

  // ---------- Weekly update ----------
  T.weekly = function (state) {
    var w = state.time.w, team = state.team, pol = team.policy;
    // decay morale modifiers
    team.mods.forEach(function (m) { m.weeks--; });
    team.mods = team.mods.filter(function (m) { return m.weeks > 0; });

    // candidates for openings
    team.openings.forEach(function (op) {
      var ch = CHANNELS[op.channel];
      var lam = ch.flow * (0.6 + team.brand / 80) * (state.world ? state.world.talentSupply : 1) * (op.channel === 'linkedin' ? 0.6 + (state.founder.focus.team || 0) / 25 : 1);
      lam *= state.founder.bg ? RW.BACKGROUNDS[state.founder.bg].net.talent : 1;
      lam *= (1 + T.capOf(state, 'hr') * 0.35) * RW.Engine.tm(state, 'hire');
      if (op.level >= 4) lam *= 0.55;
      if (state.industry === 'fnb' && RW.ROLES[op.role].dept === 'cogs') lam *= 1.6;
      var n = R.poisson(lam);
      for (var i = 0; i < n; i++) team.candidates.push(T.genCandidate(state, op));
      if (op.channel === 'board' && (w - op.openedW) % 4 === 3) L.spend(state.fin, 'recruit', ch.cost); // job-board renewal
    });
    team.candidates = team.candidates.filter(function (c) { return c.expires >= w; });

    // employees
    var toxicCount = T.active(state).filter(function (e) { return e.traits.indexOf('toxic') >= 0; }).length;
    var hc = Math.max(1, T.active(state).length);
    var modT = T.modTotal(state);
    var momentum = state.kpi ? state.kpi.momentum || 0 : 0;
    var runway = state.kpi ? state.kpi.runway : 24;
    var eff = state.caps ? state.caps.mgmtEff || 1 : 1;
    var officeOver = T.headcount(state) + 1 > T.officeCapacity(state);
    var training = RW.POLICIES.culture[pol.culture].train || 1;
    var mentors = T.active(state).filter(function (e) { return e.traits.indexOf('mentor') >= 0; }).length;

    T.all(state).forEach(function (e) {
      if (e.startW > w) return;
      if (e.startW === w) {
        state.inbox && RW.Engine.mail(state, 'team', e.name + ' เริ่มงานวันแรก', RW.ROLES[e.role].n + ' (' + RW.LEVELS[e.level] + ') — ต้องใช้เวลาประมาณ ' + RAMP_WEEKS[e.level] + ' สัปดาห์จึงจะทำงานได้เต็มที่');
      }
      // ramp-up
      var rw = RAMP_WEEKS[e.level] * (T.capOf(state, 'hr') > 0.5 ? 0.85 : 1);
      e.ramp = Math.min(1, e.ramp + 1 / rw);
      // morale target
      var mk = T.marketSalary(state, e.role, e.level, e.skill);
      var target = 58;
      target += U.clamp((e.salary / mk - 1) * 60, -22, 14);
      target += RW.POLICIES.benefits[pol.benefits].morale + RW.POLICIES.culture[pol.culture].morale;
      target += RW.POLICIES.workmode[pol.workmode].morale + RW.POLICIES.hours[pol.hours].morale;
      target += RW.OFFICES[state.company.office.type].morale;
      target += U.clamp(momentum, -10, 10);
      if (runway < 3) target -= 14; else if (runway < 6) target -= 6;
      target += modT + RW.Engine.tm(state, 'morale');
      target += (state.founder.skills.leadership - 50) / 6;
      if (eff < 0.8) target -= (0.8 - eff) * 30;
      if (officeOver) target -= 5;
      if (toxicCount > 0 && e.traits.indexOf('toxic') < 0) target -= Math.min(12, toxicCount * 30 / hc);
      if (e.stress > 55) target -= (e.stress - 55) / 3;
      var sinceRaise = w - e.lastRaiseW;
      if (sinceRaise > 78) target -= 6; else if (sinceRaise < 30) target += 2;
      if (e.traits.indexOf('ambitious') >= 0 && w - e.promoW > 80) target -= 8;
      if (e.options > 0) target += Math.min(6, 2 + RW.Funding.optionValue(state, e) / (e.salary * 24) * 6);
      if (state.flags.payrollMissed && w - state.flags.payrollMissed < 12) target -= 25;
      e.mtarget = U.clamp(target, 0, 100);
      e.morale = U.clamp(U.approach(e.morale, e.mtarget, 0.14) + R.normal(0, 0.8), 0, 100);
      // stress
      var st = RW.POLICIES.hours[pol.hours].stress * (e.traits.indexOf('hustler') >= 0 ? 1.6 : 1) + RW.Engine.tm(state, 'stress') * 0.15;
      var load = state.kpi && state.kpi.workload ? state.kpi.workload[RW.ROLES[e.role].dept] || 1 : 1;
      st += (load - 1) * 4;
      e.stress = U.clamp(e.stress + st - (e.stress > 30 ? 1.5 : 0.5), 0, 100);
      // skill growth
      var g = 0.045 * training * (1 + mentors * 0.25 / hc * 4) * (e.traits.indexOf('ambitious') >= 0 ? 1.6 : 1) * (1 - e.skill / 105);
      e.skill = Math.min(99, e.skill + g);
      // trait reveal
      if (w - e.startW > 6 && e.known.length < e.traits.length && R.chance(0.06)) {
        var hidden = e.traits.filter(function (t) { return e.known.indexOf(t) < 0; });
        var t = R.pick(hidden);
        e.known.push(t);
        RW.Engine.mail(state, 'team', 'คุณเริ่มรู้จัก ' + e.name + ' มากขึ้น', 'ลักษณะที่เพิ่งเห็นชัด: "' + RW.TRAITS[t].n + '" — ' + RW.TRAITS[t].d);
      }
      // estimate converges toward truth over time
      e.est = Math.round(U.approach(e.est, e.skill, 0.05));
      // attrition
      if (!e.leaving) {
        var annual = 0.11;
        var q = U.weeklyFromMonthly(annual / 12);
        q *= Math.exp((55 - e.morale) / 14);
        e.traits.forEach(function (tt) { if (RW.TRAITS[tt].quit) q *= RW.TRAITS[tt].quit; });
        q *= (state.world ? state.world.poach : 1) * RW.Engine.tm(state, 'quit');

    var bar = Fn.BAR[stage];
    // early-stage investors bet on founders; later stages are numbers-driven
    var div = { preseed: 11, seed: 9, A: 7, B: 7, C: 7, D: 7 }[stage] || 7;
    var x = (tr - bar) / div + (stage === 'preseed' ? 0.35 : stage === 'seed' ? 0.15 : 0);
    x += (inv.fit[state.industry] || 0.8) - 1;
    x += (state.founder.rep - 25) / 45 + (state.founder.skills.pitch - 50) / 40;
    x += (Fn.climate(state) - 1) * 2.2;
    x += inv.warm * 0.6;
    if (state.funding.raise && state.funding.raise.leadId) x += 0.9; // FOMO once a lead is in
    var fair = Fn.fairPre(state, stage, inv);
    var gap = askPre / fair - 1;
    if (gap > 0) x -= gap * 3.2; else x += Math.min(0.6, -gap * 1.2);
    // red flags
    if (state.flags.cofounderLeftUnvested) x -= 0.8;
    if (state.flags.fraudRisk) x -= 0.6;
    if (state.funding.raise && state.funding.raise.startW && state.time.w - state.funding.raise.startW > 16) x -= 0.5; // stale round
    if (state.flags.failedRaiseW && state.time.w - state.flags.failedRaiseW < 26) x -= 0.6;
    var runway = state.kpi.runway;
    if (runway < 3) x -= 0.6; // desperation shows
    var bgNet = RW.BACKGROUNDS[state.founder.bg].net.investors;
    x += (bgNet - 1) * 1.5;
    if (inv.type === 'accelerator') {
      // accelerators bet on teams and progress, not revenue
      var M2 = RW.Models[state.industry];
      var prog = state.biz && (state.biz.launched || (state.biz.skus && state.biz.skus.length) || (state.biz.branches && state.biz.branches.length)) ? 0.6 : 0;
      x = 0.2 + prog + (state.founder.skills.pitch - 50) / 40 + (state.founder.rep - 20) / 50 + ((state.cofounders || []).some(function (c) { return c.active; }) ? 0.4 : 0) - Math.max(0, askPre / fair - 1.5);
    }
    if (inv.type === 'angel' && stage === 'preseed') x += 0.4;
    return U.clamp(U.sigmoid(x), 0.01, 0.97);
  };

  // ---------- Raise process ----------
  Fn.eligibleInvestors = function (state, stage) {
    return state.funding.investors.filter(function (inv) {
      return inv.stages.indexOf(stage) >= 0 && inv.passedUntil < state.time.w;
    });
  };

  Fn.startRaise = function (state, opt) {
    var fund = state.funding;
    if (fund.raise) return false;
    fund.raise = {
      stage: opt.stage, instrument: opt.instrument, target: opt.target, minClose: opt.minClose || opt.target * 0.6,
      ask: opt.ask, discount: opt.discount || 0.2, startW: state.time.w, pipeline: [], termSheets: [], commits: [],
      leadId: null, leadTerms: null, status: 'active', closingW: null, log: []
    };
    (opt.investors || []).forEach(function (id) { Fn.pitch(state, id); });
    Fn.raiseLog(state, 'เปิดระดมทุน ' + RW.STAGES[opt.stage].n + ' เป้า ' + F.m(opt.target) + (opt.instrument === 'safe' ? ' (SAFE, Valuation cap ' + F.m(opt.ask) + ')' : ' (Pre-money ที่ขอ ' + F.m(opt.ask) + ')'));
    return true;
  };

  Fn.raiseLog = function (state, msg) {
    var r = state.funding.raise;
    if (r) { r.log.unshift({ w: state.time.w, m: msg }); if (r.log.length > 40) r.log.pop(); }
  };

  Fn.pipelineCap = function (state) {
    var u = RW.Team.capOf(state, 'f_fundraise') + RW.Team.capOf(state, 'lead_finance') * 0.5;
    return Math.floor(3 + u * 10);
  };

  Fn.pitch = function (state, invId) {
    var r = state.funding.raise;
    if (!r) return false;
    if (r.pipeline.find(function (p) { return p.invId === invId; })) return false;
    var inv = state.funding.investors.find(function (i) { return i.id === invId; });
    if (!inv) return false;
    r.pipeline.push({ invId: invId, step: 0, status: 'active', weeks: 0, prog: 0 });
    return true;
  };

  Fn.STEPS = ['ขอ intro / ส่ง deck', 'ประชุมครั้งแรก', 'ประชุม Partner / ส่งตัวเลข', 'Due Diligence', 'ยื่น Term Sheet'];

  Fn.activePitches = function (state) {
    var r = state.funding.raise;
    return r ? r.pipeline.filter(function (p) { return p.status === 'active'; }).length : 0;
  };

  Fn.weekly = function (state) {
    var fund = state.funding, r = fund.raise;
    // investor warmth decays slowly
    fund.investors.forEach(function (i) { i.warm = Math.max(0, i.warm - 0.004); });
    if (!r) return;
    if (r.status === 'closing') {
      if (state.time.w >= r.closingW) Fn.closeRound(state);
      return;
    }
    var effort = RW.Team.capOf(state, 'f_fundraise') + RW.Team.capOf(state, 'lead_finance') * 0.3;
    var cap = Fn.pipelineCap(state);
    var active = r.pipeline.filter(function (p) { return p.status === 'active'; });
    // only the first `cap` active conversations move forward
    active.slice(0, cap).forEach(function (p) {
      var inv = fund.investors.find(function (i) { return i.id === p.invId; });
      p.weeks++;
      var speed = (0.5 + effort * 0.8) / inv.speed * 1.6;
      if (inv.type === 'angel' || inv.type === 'accelerator') speed *= 1.3;
      p.prog += speed * R.range(0.6, 1.4);
      if (p.prog < 1) return;
      p.prog = 0;
      var interest = Fn.interest(state, inv, r.stage, r.ask);
      p.interest = interest;
      // drop-off at each gate
      var passP = (1 - interest) * (p.step === 0 ? 0.7 : 0.6);
      if (R.chance(passP)) {
        p.status = 'passed';
        p.reason = Fn.passReason(state, inv, r);
        inv.passedUntil = state.time.w + 26;
        inv.history.push({ w: state.time.w, m: 'ปฏิเสธ: ' + p.reason });
        Fn.raiseLog(state, inv.name + ' ขอผ่าน — "' + p.reason + '"');
        return;
      }
      p.step++;
      // angels and SAFEs skip heavy DD
      var light = r.instrument === 'safe' || inv.type === 'angel' || inv.type === 'accelerator';
      if (light && p.step === 2) p.step = 4;
      if (p.step === 3) Fn.raiseLog(state, inv.name + ' เริ่มทำ Due Diligence — ขอเอกสารบัญชี สัญญา และข้อมูลลูกค้า');
      if (p.step >= 4) Fn.investorDecides(state, inv, p, interest);
      else Fn.raiseLog(state, inv.name + ': ' + Fn.STEPS[p.step]);
    });
    // timeout
    if (state.time.w - r.startW > 30 && r.status === 'active' && !r.leadId && r.commits.length === 0) {
      Fn.failRaise(state, 'ระดมทุนนานเกิน 7 เดือนโดยไม่มีใครนำรอบ — ตลาดเริ่มมองว่าเป็น "ดีลค้างตลาด"');
    }
  };

  Fn.passReason = function (state, inv, r) {
    var M = RW.Models[state.industry];
    var tr = M.traction(state).score;
    var bar = Fn.BAR[r.stage];
    var fair = Fn.fairPre(state, r.stage, inv);
    if (r.ask > fair * 1.35) return 'ราคาที่ขอสูงเกินไปมากสำหรับตัวเลขตอนนี้';
    if (tr < bar * 0.7) return 'ยังเร็วไปสำหรับเรา ขอดู traction อีก 6-12 เดือน';
    if (inv.fit[state.industry] < 0.8) return 'ไม่ตรงกับ thesis ของกองทุน';
    if (Fn.climate(state) < 0.75) return 'ตอนนี้กองทุนเน้นดูแลพอร์ตเดิม ชะลอการลงทุนใหม่';
    return R.pick(['ตลาดดูเล็กไปสำหรับขนาดกองทุนเรา', 'ห่วงเรื่องคู่แข่งที่มีเงินทุนมากกว่า', 'ทีมยังขาดคนสำคัญบางตำแหน่ง', 'unit economics ยังไม่ชัดพอ', 'partner คนอื่นในกองทุนไม่เห็นด้วย']);
  };

  Fn.investorDecides = function (state, inv, p, interest) {
    var r = state.funding.raise;
    // final investment committee
    if (!R.chance(interest * 1.1)) {
      p.status = 'passed';
      p.reason = Fn.passReason(state, inv, r);
      inv.passedUntil = state.time.w + 26;
      Fn.raiseLog(state, inv.name + ' (คณะกรรมการลงทุน) ตัดสินใจไม่ลงทุน — "' + p.reason + '"');
      return;
    }
    var need = Math.max(0, r.target - Fn.committed(state));
    if (r.instrument === 'safe') {
      need = Math.max(0, r.target - (r.raised || 0));
      if (need < 100000 && inv.type !== 'accelerator') { p.status = 'passed'; p.reason = 'รอบเต็มแล้ว'; return; }
      var amt = U.clamp(need * R.range(0.3, 0.7), inv.check[0], Math.min(inv.check[1], Math.max(need, inv.check[0])));
      if (inv.type === 'accelerator') amt = inv.check[0];
      amt = Math.round(amt / 100000) * 100000;
      p.status = 'termsheet';
      var ts = {
        id: R.id('ts'), invId: inv.id, kind: 'safe', amount: amt, cap: r.ask, discount: r.discount, expires: state.time.w + 2, lead: false,
        fixedPct: inv.fixedPct
      };
      if (inv.type === 'accelerator') { ts.kind = 'accelerator'; ts.cap = inv.fixedPct ? amt / inv.fixedPct : 0; }
      r.termSheets.push(ts);
      RW.Events.queue(state, 'term_sheet', { ts: ts.id });
      return;
    }
    // priced round
    if (!r.leadId) {
      if (!inv.lead) {
        p.status = 'waiting';
        Fn.raiseLog(state, inv.name + ' สนใจ แต่จะร่วมลงทุนเมื่อมี Lead investor แล้วเท่านั้น');
        return;
      }
      var fair = Fn.fairPre(state, r.stage, inv);
      var maxPre = fair * (1 + 0.25 * interest);
      var pre = r.ask <= maxPre ? r.ask : Math.round(fair * R.range(0.85, 1.0) / 1e6) * 1e6;
      var amtL = U.clamp(r.target * R.range(0.45, 0.75), inv.check[0], inv.check[1]);
      amtL = Math.round(amtL / 1e6) * 1e6;
      var harsh = (100 - inv.friendly) / 100 + (1 - Fn.climate(state)) * 0.8;
      var ts2 = {
        id: R.id('ts'), invId: inv.id, kind: 'priced', amount: amtL, pre: pre, lead: true, expires: state.time.w + R.int(1, 3),
        pref: harsh > 0.85 ? '2x' : harsh > 0.6 ? '1xp' : '1x', anti: harsh > 0.95 ? 'full' : 'broad',
        boardSeat: r.stage !== 'preseed', poolPct: r.stage === 'seed' ? 0.10 : r.stage === 'A' ? 0.12 : 0.08,
        proRata: true, founderVesting: !state.flags.founderVested && r.stage !== 'preseed' && R.chance(0.5),
        flip: !state.funding.flipped && (r.stage === 'A' || r.stage === 'B') && R.chance(0.5)
      };
      p.status = 'termsheet';
      r.termSheets.push(ts2);
      RW.Events.queue(state, 'term_sheet', { ts: ts2.id });
    } else {
      Fn.followerCommit(state, inv, p);
    }
  };

  Fn.followerCommit = function (state, inv, p) {
    var r = state.funding.raise;
    var need = Math.max(0, r.target * 1.2 - Fn.committed(state));
    if (need < inv.check[0] * 0.5) { p.status = 'passed'; p.reason = 'รอบเต็มแล้ว'; return; }
    var amt = Math.round(U.clamp(need * R.range(0.3, 0.8), inv.check[0], inv.check[1]) / 1e5) * 1e5;
    r.commits.push({ invId: inv.id, amount: amt });
    p.status = 'committed';
    Fn.raiseLog(state, inv.name + ' ยืนยันร่วมลงทุน ' + F.m(amt) + ' ตามเงื่อนไขของ Lead');
  };

  Fn.committed = function (state) {
    var r = state.funding.raise;
    if (!r) return 0;
    return U.sum(r.commits, function (c) { return c.amount; });
  };

  Fn.findTS = function (state, id) {
    var r = state.funding.raise;
    return r ? r.termSheets.find(function (t) { return t.id === id; }) : null;
  };

  // player response to a term sheet: 'accept' | 'counter' | 'decline'
  Fn.respondTS = function (state, tsId, action, counterPre) {
    var r = state.funding.raise;
    var ts = Fn.findTS(state, tsId);
    if (!ts || !r) return { ok: false, msg: 'Term sheet หมดอายุแล้ว' };
    var inv = state.funding.investors.find(function (i) { return i.id === ts.invId; });
    var p = r.pipeline.find(function (x) { return x.invId === ts.invId; });
    r.termSheets = r.termSheets.filter(function (t) { return t.id !== tsId; });
    if (action === 'decline') {
      if (p) p.status = 'declined';
      Fn.raiseLog(state, 'คุณปฏิเสธข้อเสนอของ ' + inv.name);
      return { ok: true, msg: 'ปฏิเสธข้อเสนอแล้ว' };
    }
    if (action === 'counter') {
      var interest = Fn.interest(state, inv, r.stage, ts.kind === 'priced' ? counterPre : ts.cap);
      var fair = Fn.fairPre(state, r.stage, inv);
      var base = ts.kind === 'priced' ? ts.pre : ts.cap;
      var ratio = counterPre / Math.max(1, base);
      var pAccept = U.clamp(interest * 1.1 - (ratio - 1) * 2.2 - (counterPre > fair * 1.3 ? 0.3 : 0), 0.03, 0.9);
      var roll = R.f();
      if (roll < pAccept) {
        if (ts.kind === 'priced') ts.pre = counterPre; else ts.cap = counterPre;
        Fn.raiseLog(state, inv.name + ' ยอมรับราคาที่คุณต่อรอง ' + F.m(counterPre));
        return Fn.acceptTS(state, ts, inv, p);
      }
      if (roll < pAccept + 0.35) {
        // meet in the middle
        var mid = Math.round((base + counterPre) / 2 / 1e5) * 1e5;
        if (ts.kind === 'priced') ts.pre = mid; else ts.cap = mid;
        ts.expires = state.time.w + 1;
        r.termSheets.push(ts);
        Fn.raiseLog(state, inv.name + ' เสนอกลับที่ ' + F.m(mid) + ' — ข้อเสนอสุดท้าย');
        RW.Events.queue(state, 'term_sheet', { ts: ts.id, final: true });
        return { ok: true, msg: inv.name + ' เสนอกลับที่ ' + F.m(mid) };
      }
      if (p) p.status = 'passed';
      inv.passedUntil = state.time.w + 26;
      Fn.raiseLog(state, inv.name + ' ถอนข้อเสนอหลังการต่อรอง');
      return { ok: false, msg: inv.name + ' ถอนตัวจากดีล — คุณต่อรองแรงเกินไป' };
    }
    return Fn.acceptTS(state, ts, inv, p);
  };

  Fn.acceptTS = function (state, ts, inv, p) {
    var r = state.funding.raise;
    if (ts.kind === 'safe' || ts.kind === 'accelerator') {
      // rolling close: money arrives within ~2 weeks
      if (ts.kind === 'accelerator') {
        if (ts.fixedPct > 0) Fn.issuePriced(state, inv, ts.amount, ts.amount / ts.fixedPct - ts.amount, 'Accelerator', { pref: '1x' }, true);
        else L.post(state.fin, { cash: ts.amount, other_income: -ts.amount }, 'op');
        state.flags.accelerator = { until: state.time.w + 12, inv: inv.id };
        state.founder.rep += 6;
        state.funding.investors.forEach(function (i) { if (i.type === 'vc' || i.type === 'angel') i.warm = Math.min(1.5, i.warm + 0.3); });
      } else {
        var room = r.target * 1.2 - (r.raised || 0);
        if (room < 100000) { if (p) p.status = 'passed'; Fn.raiseLog(state, 'รอบเต็มแล้ว — ขอบคุณ ' + inv.name); return { ok: false, msg: 'รอบนี้ระดมทุนครบแล้ว' }; }
        ts.amount = Math.min(ts.amount, Math.round(room / 100000) * 100000);
        Fn.issueSafe(state, inv, ts.amount, ts.cap, ts.discount);
        r.raised = (r.raised || 0) + ts.amount;
        if (r.raised >= r.target) {
          Fn.raiseLog(state, 'ระดมทุนครบเป้าแล้ว');
          r.termSheets = [];
          state.funding.raise = null;
          RW.Engine.mail(state, 'funding', 'ปิดรอบ SAFE ครบเป้า', 'ได้รับเงินรวม ' + F.m(r.raised) + ' ที่ valuation cap ' + F.m(r.ask) + ' — SAFE จะแปลงเป็นหุ้นในรอบ priced ถัดไป', 'good');
          state.events.pending = state.events.pending.filter(function (e) { return e.id !== 'term_sheet'; });
        }
      }
      if (p) p.status = 'committed';
      inv.warm += 0.5;
      Fn.raiseLog(state, 'ปิดดีลกับ ' + inv.name + ' ' + F.m(ts.amount) + ' — เงินเข้าบัญชีแล้ว');
      return { ok: true, msg: 'ได้รับเงิน ' + F.m(ts.amount) + ' จาก ' + inv.name };
    }
    // priced lead accepted
    r.leadId = inv.id;
    r.leadTerms = ts;
    r.ask = ts.pre;
    r.commits.push({ invId: inv.id, amount: ts.amount, lead: true });
    if (p) p.status = 'committed';
    Fn.raiseLog(state, inv.name + ' เป็น Lead investor ' + F.m(ts.amount) + ' ที่ pre-money ' + F.m(ts.pre));
    // investors waiting for a lead now decide
    r.pipeline.forEach(function (q) {
      if (q.status === 'waiting') {
        var i2 = state.funding.investors.find(function (i) { return i.id === q.invId; });
        if (R.chance(Fn.interest(state, i2, r.stage, r.ask) + 0.2)) Fn.followerCommit(state, i2, q);
        else { q.status = 'passed'; q.reason = 'ไม่ร่วมรอบนี้'; }
      }
    });
    return { ok: true, msg: 'ได้ Lead investor แล้ว! หานักลงทุนร่วมต่อ แล้วกด "ปิดรอบ" เมื่อพร้อม' };
  };

  Fn.startClosing = function (state) {
    var r = state.funding.raise;
    if (!r || !r.leadId) return false;
    r.status = 'closing';
    var weeks = R.int(3, 6) - (RW.Team.capOf(state, 'lead_finance') > 0.4 ? 1 : 0);
    r.closingW = state.time.w + weeks;
    Fn.raiseLog(state, 'เริ่มขั้นตอนปิดรอบ: ทนายร่างสัญญา SHA/SSA และ Due Diligence ฉบับเต็ม (~' + weeks + ' สัปดาห์)');
    // DD can surface problems
    RW.Events.queue(state, 'dd_check', {}, state.time.w + Math.max(1, weeks - 2));
    return true;
  };

  Fn.closeRound = function (state) {
    var fund = state.funding, r = fund.raise;
    var ts = r.leadTerms;
    var total = Fn.committed(state);
    var lead = fund.investors.find(function (i) { return i.id === r.leadId; });
    // pre-money option pool top-up (the "option pool shuffle")
    var preFD = Fn.fullyDiluted(state);
    var safeSharesEst = 0;
    var pre = ts.pre;
    // pool target is % of post-money FD; created pre-money so it dilutes only existing holders
    var post = pre + total;
    var poolTarget = ts.poolPct;
    // iterate to solve for pool & SAFE conversion
    var pps = pre / preFD, newPool = 0;
    for (var it = 0; it < 6; it++) {
      safeSharesEst = Fn.safeSharesAt(state, pps, preFD);
      var postFD = (preFD + newPool + safeSharesEst) + total / pps;
      var poolWanted = Math.max(0, poolTarget * postFD - fund.pool);
      newPool = poolWanted;
      pps = pre / (preFD + newPool + safeSharesEst);
    }
    fund.pool += Math.round(newPool);
    Fn.convertSafes(state, pps, preFD);
    var cls = RW.STAGES[r.stage].n;
    var downRound = fund.lastPPS > 0 && pps < fund.lastPPS;
    if (downRound) Fn.antiDilution(state, pps, total / pps);
    fund.classes[cls] = { n: cls, seniority: Object.keys(fund.classes).length, pref: ts.pref, pps: pps, invested: total };
    r.commits.forEach(function (c) {
      var inv = fund.investors.find(function (i) { return i.id === c.invId; });
      Fn.addHolder(state, { id: inv.id, name: inv.name, kind: 'investor', cls: cls, shares: Math.round(c.amount / pps), invested: c.amount });
      inv.warm += 0.5;
      inv.history.push({ w: state.time.w, m: 'ลงทุน ' + F.m(c.amount) + ' ในรอบ ' + cls });
    });
    L.post(state.fin, { cash: total, capital: -total }, 'fin');
    var legal = Math.max(250000, total * 0.012) * (ts.flip ? 2.2 : 1);
    L.spend(state.fin, 'prof', legal);
    fund.rounds.push({ stage: r.stage, w: state.time.w, amount: total, pre: pre, post: pre + total, pps: pps, lead: lead.name, instrument: 'priced', down: downRound, terms: ts });
    fund.stage = r.stage;
    fund.lastPost = pre + total;
    fund.lastPPS = pps;
    if (ts.boardSeat) { fund.board.investorSeats++; fund.board.members.push({ who: lead.name, kind: 'investor' }); }
    // at Series A founders typically secure a second common-holder seat; an independent chair joins
    if (r.stage === 'A' && fund.board.founderSeats < 2) { fund.board.founderSeats = 2; fund.board.independent = 1; }
    if (ts.founderVesting) state.flags.founderVested = state.time.w;
    if (ts.flip) fund.flipped = true;
    if (lead.rofr) state.flags.rofr = lead.id;
    fund.board.confidence = 70;
    RW.Team.addMod(state, downRound ? -8 : 8, 16, downRound ? 'Down round — มูลค่าบริษัทลดลง' : 'ระดมทุนสำเร็จ ทีมมั่นใจขึ้น');
    state.founder.rep += downRound ? -4 : 5 + RW.STAGE_ORDER.indexOf(r.stage);

      state.cofounders.push({ id: c.id, name: c.name, nick: c.nick, role: c.role, skill: c.skill, salary: c.salary, trait: c.trait, morale: 75, conflict: c.trait === 'stubborn' ? 20 : 5, active: true, joinW: 0, boardSeat: true, equity: c.ask });
      RW.Funding.addHolder(state, { id: c.id, name: c.name + ' (ผู้ร่วมก่อตั้ง)', kind: 'cofounder', cls: 'common', shares: cfShares });
      state.funding.board.founderSeats = 1;
      if (opt.vesting) state.flags.cofounderVesting = 1;
      if (c.cash > 0) {
        L.post(state.fin, { cash: c.cash, capital: -c.cash }, 'fin');
      }
    }
    h.shares = fShares;
    var cap = Math.min(opt.capital || 0, state.founder.cash);
    if (cap > 0) {
      state.founder.cash -= cap;
      L.post(state.fin, { cash: cap, capital: -cap }, 'fin');
    }
    state.fin.month = L.blankMonth();
    state.flags.ipNotAssigned = 1;
    state.flags.booksMessy = 1;
    EN.computeKPIs(state);
    EN.mail(state, 'system', 'ยินดีต้อนรับสู่วันแรกของ ' + state.company.name, M.welcome(state), 'info');
    return state;
  };

  // bring older saves up to date
  EN.migrate = function (s) {
    Object.keys(RW.ACCOUNTS).forEach(function (k) { if (s.fin.bal[k] == null) s.fin.bal[k] = 0; });
    s.founder.focus.consult = s.founder.focus.consult || 0;
    if (!s.research) s.research = [];
    if (!s.challenge) s.challenge = 'none';
    if (!s.maxW) s.maxW = RW.MAX_WEEKS;
    return s;
  };

  // ---------- Annual strategy themes ----------
  EN.THEMES = {
    blitz: { n: 'Blitzscaling — โตให้เร็วที่สุด', d: 'การตลาดได้ผลขึ้น 12% จ้างคนได้เร็วขึ้น แต่ทีมเครียดขึ้น บอร์ดชอบการเติบโต', mkt: 1.12, dev: 1, morale: -2, quit: 1.1, opex: 1, hire: 1.3, stress: 3 },
    alive: { n: 'Default alive — มุ่งสู่จุดคุ้มทุน', d: 'ค่าใช้จ่ายสำนักงานลด 15% ทุกคนประหยัด บอร์ดและนักลงทุนเห็นวินัย แต่ทีมรู้สึกว่าบริษัทไม่โต', mkt: 0.97, dev: 1, morale: -1, quit: 1, opex: 0.85, hire: 0.9, stress: 0 },
    product: { n: 'Product excellence — สินค้าต้องดีที่สุด', d: 'ทีมพัฒนาสินค้า/R&D ทำงานได้ผลขึ้น 12% คุณภาพดีขึ้น แต่การขายไม่ได้แรงพิเศษ', mkt: 1, dev: 1.12, morale: 1, quit: 1, opex: 1, hire: 1, stress: 0 },
    people: { n: 'People first — ทีมคือทุกอย่าง', d: 'ขวัญกำลังใจ +6 คนลาออกน้อยลง 25% และสรรหาคนง่ายขึ้น แต่ต้องใช้เวลาและงบดูแลคน', mkt: 1, dev: 1, morale: 6, quit: 0.75, opex: 1.05, hire: 1.15, stress: -2 }
  };
  EN.theme = function (state) {
    var t = state.flags.theme;
    return t && t.until > state.time.w ? EN.THEMES[t.k] : null;
  };
  EN.tm = function (state, key) { var t = EN.theme(state); return t ? t[key] : (key === 'morale' || key === 'stress' ? 0 : 1); };

  // ---------- Mail / inbox ----------
  EN.mail = function (state, cat, title, body, tone) {

  // ---------- Paid market research (results arrive after a few weeks) ----------
  EN.researchWeekly = function (state) {
    var M = RW.Models[state.industry], w = state.time.w;
    if (!state.research || !state.research.length || !M.RESEARCH) return;
    state.research = state.research.filter(function (j) {
      if (j.due > w) return true;
      var r = M.RESEARCH[j.k];
      var msg = r ? r.done(state, j.arg) : '';
      if (msg) EN.mail(state, 'product', 'ผลวิจัยมาแล้ว: ' + r.n, msg, 'good');
      return false;
    });
  };

  // ---------- Weekly tick ----------
  EN.tick = function (state) {
    if (state.over) return;
    R.bind(state.rng);
    var M = RW.Models[state.industry];
    state.time.w++;
    var w = state.time.w;
    var info = T.info(w);
    state.fin.week = { op: 0, inv: 0, fin: 0 };

    // flags that expire
    if (state.flags.frozen && w >= state.flags.frozen.until) {
      var amt = state.flags.frozen.amt;
      L.post(state.fin, { cash: amt, prepaid: -amt }, 'op');
      EN.mail(state, 'finance', 'เงินฝากที่ถูกแช่แข็งได้คืนแล้ว', F.b(amt) + ' กลับเข้าบัญชีบริษัท', 'good');
      state.flags.frozen = null;
    }
    if (state.flags.registering && w >= state.flags.registering) {
      state.company.registered = true; state.company.registerW = w; state.flags.registering = 0;
      EN.mail(state, 'admin', 'จดทะเบียนบริษัทสำเร็จ', 'บริษัท ' + state.company.name + ' จำกัด ได้รับเลขทะเบียนนิติบุคคลแล้ว เปิดบัญชีธนาคารบริษัท ขึ้นทะเบียนนายจ้างประกันสังคมได้ ออกใบกำกับภาษีได้ ระดมทุนได้', 'good');
    }
    if (state.flags.accelerator && w >= state.flags.accelerator.until) {
      state.flags.accelerator = null;
      state.funding.investors.forEach(function (i) { if (i.type !== 'growth') i.warm = Math.min(1.5, i.warm + 0.35); });
      state.founder.rep += 4;
      EN.mail(state, 'funding', 'Demo Day!', 'คุณพิตช์ต่อหน้านักลงทุนกว่า 100 ราย หลายรายขอนัดคุยต่อ — ถ้าจะระดมทุน ตอนนี้คือจังหวะดี', 'good');
    }
    if (state.flags.burnPromise && w >= state.flags.burnPromise.w) {
      var ok = (state.kpi.burn || 0) <= state.flags.burnPromise.burn * 1.05;
      state.funding.board.confidence = U.clamp(state.funding.board.confidence + (ok ? 12 : -22), 0, 100);
      EN.mail(state, 'funding', ok ? 'คุณลด burn ได้ตามที่สัญญาบอร์ด' : 'คุณผิดสัญญาที่ให้ไว้กับบอร์ด', ok ? 'ความเชื่อมั่นของบอร์ดดีขึ้น' : 'Burn ยังสูงกว่าที่สัญญาไว้ ความน่าเชื่อถือของคุณในสายตาบอร์ดลดลงมาก', ok ? 'good' : 'bad');
      state.flags.burnPromise = null;
    }
    if (state.flags.ipo && w >= state.flags.ipo.w) { EN.completeIPO(state); if (state.over) return; }

    RW.Team.computeCaps(state);
    if (state.flags.companyOff && state.flags.companyOff >= w) {
      Object.keys(state.caps).forEach(function (k) { if (k !== 'mgmtEff') state.caps[k] *= 0.15; });
    }
    if (state.flags.accelerator) Object.keys(state.caps).forEach(function (k) { if (k.indexOf('f_') === 0 || k === 'dev' || k === 'sales') state.caps[k] *= 0.88; });
    RW.Founder.weekly(state);
    RW.Founder.cofounderWeekly(state);
    RW.Team.weekly(state);
    M.weekly(state, info);
    EN.researchWeekly(state);
    var ci = RW.Founder.consultIncome(state);
    if (ci > 0) {
      if (state.company.registered) L.invoice(state, 'rev_consult', ci, w + 4, { wht: true, name: 'งานที่ปรึกษา/รับจ้าง' });
      else state.founder.cash += ci * 0.9;
      state.stats.consult = (state.stats.consult || 0) + ci;
    }
    var ar = L.collectAR(state);
    if (ar.badDebt > 0) EN.mail(state, 'finance', 'ตัดหนี้สูญ ' + F.b(ar.badDebt), 'ลูกค้าบางรายค้างชำระเกิน 4 เดือนและติดต่อไม่ได้', 'bad');
    if (state.flags.whtRefund && w >= state.flags.whtRefund.week) {
      var wr = Math.min(state.flags.whtRefund.amt, state.fin.bal.whtc);
      if (wr > 0) { L.post(state.fin, { cash: wr, whtc: -wr }, 'op'); EN.mail(state, 'finance', 'ได้รับคืนภาษีหัก ณ ที่จ่าย', F.b(wr) + ' — หลังจากรอสรรพากรพิจารณาหลายเดือน', 'good'); }
      state.flags.whtRefund = null;
    }
    RW.Funding.weekly(state);
    if (info.monthEnd) EN.monthEnd(state, info);
    RW.Events.weekly(state);
    // weekly cash flow record
    var wk = state.fin.week;
    state.hist.weekly.push({ w: w, cash: state.fin.bal.cash, op: wk.op, inv: wk.inv, fin: wk.fin, rev: state.biz.weekRev || 0 });
    if (state.hist.weekly.length > 160) state.hist.weekly.shift();
    EN.computeKPIs(state);
    EN.checkSolvency(state, info);
    EN.checkAchievements(state);
    state.stats.peakHC = Math.max(state.stats.peakHC, RW.Team.headcount(state));
    if (w >= EN.maxW(state) && !state.over && !state.flags.endless) EN.timeUp(state);
  };

  EN.monthEnd = function (state, info) {
    var M = RW.Models[state.industry];
    var fin = state.fin, w = state.time.w;
    // payroll
    var pr = RW.Team.payroll(state, info);
    var cashBefore = fin.bal.cash + fin.creditLine;
    RW.Team.postPayroll(state, pr);
    if (cashBefore < pr.gross && pr.gross > 0) {
      state.flags.payrollMissed = w;
      state.stats.missedPayroll = (state.stats.missedPayroll || 0) + 1;
      RW.Team.addMod(state, -25, 16, 'บริษัทจ่ายเงินเดือนไม่ได้');
      state.team.brand = Math.max(0, state.team.brand - 20);
      EN.mail(state, 'finance', 'จ่ายเงินเดือนไม่ครบ!', 'เงินในบัญชีไม่พอจ่ายเงินเดือนพนักงาน (ต้องการ ' + F.b(pr.gross) + ') พนักงานตกใจและเริ่มหางานใหม่ หากค้างจ่ายต่อเนื่อง พนักงานสามารถร้องเรียนพนักงานตรวจแรงงานได้', 'bad');
    }
    // office & overhead
    var o = state.company.office;
    var rent = o.type === 'cowork' ? o.seats * RW.OFFICES.cowork.rentPerSeat + RW.OFFICES.cowork.fixed : o.rent || 0;
    if (rent) L.spend(fin, 'rent', rent);
    if (o.type === 'small' || o.type === 'gradeA') L.spend(fin, 'utilities', Math.round(o.seats * 900));
    var hc = RW.Team.headcount(state) + 1 + (state.cofounders || []).filter(function (c) { return c.active; }).length;
    L.spend(fin, 'software', 1500 + hc * (state.industry === 'fnb' ? 400 : 1800));
    var hasFinance = RW.Team.capOf(state, 'finance') > 0.3;
    if (state.company.registered && !hasFinance) L.spend(fin, 'prof', 6500 + Math.min(25000, (state.kpi.revenueMonthly || 0) * 0.004));
    if (state.company.extraAdmin) L.spend(fin, 'prof', state.company.extraAdmin);
    if (state.company.insured) L.spend(fin, 'insurance', RW.Events.insuranceCost(state));
    L.spend(fin, 'office', Math.round((hc * 600 + 1000) * EN.tm(state, 'opex')));
    // model month end (hosting, inventory valuation, branch costs...)
    M.monthly(state, info);
    // loans & depreciation
    var revThisMonth = -L.sumGroup(fin.month.pl, 'rev');
    L.serviceLoans(state, revThisMonth);
    L.depreciate(state);
    // interest on cash (bank savings)
    if (fin.bal.cash > 1e6) { var ii = fin.bal.cash * state.world.macro.rate * 0.6 / 12; L.post(fin, { cash: ii, int_income: -ii }, 'op'); }
    // founder personal finances
    RW.Founder.monthly(state);
    // world
    RW.World.monthly(state);
    // annual cycles
    if (info.month === 3 && state.company.registered && state.time.w > 20) {
      var auditFee = state.flags.auditor === 'big4' ? Math.max(450000, revThisMonth * 12 * 0.004) : Math.max(35000, Math.min(250000, revThisMonth * 12 * 0.002));
      L.spend(fin, 'prof', auditFee);
      EN.mail(state, 'admin', 'ค่าสอบบัญชีประจำปี', 'จ่ายค่าผู้สอบบัญชีรับอนุญาต (CPA) ' + F.b(auditFee) + ' เพื่อยื่นงบการเงินต่อกรมพัฒนาธุรกิจการค้าและสรรพากร');
      state.flags.booksMessy = 0;
    }
    if (fin.taxDue && w >= fin.taxDue.dueWeek - 2) {
      var paid = L.payTax(state);
      if (paid > 0) EN.mail(state, 'finance', 'ชำระภาษีเงินได้นิติบุคคล (ภ.ง.ด.50)', 'จ่ายภาษี ' + F.b(paid) + ' (หักเครดิตภาษีถูกหัก ณ ที่จ่ายแล้ว)');
    }
    if (info.month === 11) {
      var tx = L.yearEndTax(state);
      L.closeYear(fin);
      state.ytdClosed = tx;
      EN.mail(state, 'finance', 'ปิดงบประจำปี ' + info.be, 'กำไร(ขาดทุน)ก่อนภาษี ' + F.b(tx.profit) + (tx.tax > 0 ? ' · ภาษีที่ต้องจ่ายในเดือน พ.ค. ' + F.b(tx.tax) + (tx.sme ? ' (อัตรา SME)' : '') : ' · ขาดทุนสะสมยกไปใช้ลดภาษีได้ 5 ปี'), tx.profit > 0 ? 'good' : 'info');
      if (tx.profit > 0) state.achievements.profitable_year = state.achievements.profitable_year || w;
      if (RW.Team.active(state).length > 0) RW.Events.queue(state, 'year_end_bonus', {});
    }
    if (info.month === 0 && state.time.w > 10 && RW.Team.active(state).length > 0) RW.Events.queue(state, 'annual_review', {});
    if (info.month === 11) RW.Events.queue(state, 'annual_strategy', {}, state.time.w + 1);
    // VAT threshold
    var ttm = EN.revenueTTM(state) + revThisMonth;
    if (!fin.vat.registered && !fin.vat.required && ttm > 1.8e6) { fin.vat.required = true; RW.Events.queue(state, 'vat_register', {}); }
    // quarter: board
    if (info.quarterEnd) { EN.computeKPIs(state); RW.Funding.boardQuarterly(state); }
    if (state.funding.updates && state.funding.rounds.length) {
      state.funding.relations = U.clamp(state.funding.relations + 1.2, 0, 100);
    }
    RW.Funding.maybeAcquisitionOffer(state);
    // snapshot & reset
    var pl = fin.month.pl;
    var p = L.pnl(pl);
    var bs = L.balanceSheet(fin);
    var mk = M.monthKPIs ? M.monthKPIs(state) : {};
    var snap = {
      m: info.monthsElapsed, label: T.monthLabel(info.monthsElapsed), w: w, pl: U.deepCopy(pl), p: p, cf: U.deepCopy(fin.month.cf),
      bal: U.deepCopy(fin.bal), bs: bs, hc: RW.Team.headcount(state), cash: fin.bal.cash, k: mk,
      morale: RW.Team.avgMorale(state), founderPct: RW.Funding.founderPct(state), valuation: state.funding.lastPost, payroll: pr.gross
    };
    state.hist.monthly.push(snap);
    if (state.hist.monthly.length > 132) state.hist.monthly.shift();
    state.stats.maxRevenueMonth = Math.max(state.stats.maxRevenueMonth, p.rev);
    fin.month = L.blankMonth();
    EN.monthlyReport(state, snap);
  };

  EN.revenueTTM = function (state) {
    return U.sum(U.last(state.hist.monthly, 12), function (m) { return m.p.rev; });
  };

  EN.monthlyReport = function (state, s) {
    var prev = state.hist.monthly.length > 1 ? state.hist.monthly[state.hist.monthly.length - 2] : null;
    var g = prev && prev.p.rev > 0 ? s.p.rev / prev.p.rev - 1 : null;
    var M = RW.Models[state.industry];
    var body = 'รายได้ ' + F.b(s.p.rev) + (g != null ? ' (' + F.spct(g) + ' MoM)' : '') + ' · กำไรขั้นต้น ' + F.pct(s.p.gm) + ' · EBITDA ' + F.b(s.p.ebitda) +
      '\nเงินสดปลายเดือน ' + F.b(s.cash) + ' · Burn ' + F.b(state.kpi.burn) + '/เดือน · Runway ' + F.months(state.kpi.runway) + ' · พนักงาน ' + s.hc + ' คน' +
      (M.reportLine ? '\n' + M.reportLine(state) : '');
    EN.mail(state, 'report', 'สรุปผลประกอบการ ' + T.MONTHS_FULL[s.m % 12] + ' ' + (T.START_YEAR + Math.floor(s.m / 12) + 543), body, s.p.ebitda >= 0 ? 'good' : 'info');
  };

  // ---------- KPIs ----------
  EN.computeKPIs = function (state) {
    var M = RW.Models[state.industry];
    var k = state.kpi || {};
    var hm = state.hist.monthly;
    var wk = state.hist.weekly;
    k.cash = state.fin.bal.cash;
    // burn: net operating + investing outflow, averaged over last ~13 weeks
    var n = Math.min(13, wk.length);
    var burn;
    if (n >= 4) {
      var net = U.sum(U.last(wk, n), function (x) { return x.op + x.inv; });
      burn = -net / n * 4.333;
    } else {
      burn = EN.forecastMonthlyCost(state) - (M.forecastRevenue ? M.forecastRevenue(state) : 0);
    }
    k.burn = burn;
    k.runway = burn > 0 ? Math.max(0, k.cash) / burn : Infinity;
    var last = hm.length ? hm[hm.length - 1] : null;
    // operating KPIs exclude the founder's side consulting (investors don't count it as traction)
    var core = function (m) { return m ? m.p.rev + (m.pl.rev_consult || 0) + (m.pl.rev_oneoff || 0) : 0; };
    k.revenueMonthly = core(last);
    k.revenueTotal = last ? last.p.rev : 0;
    k.revenueTTM = U.sum(U.last(hm, 12), core);
    k.ebitdaTTM = U.sum(U.last(hm, 12), function (m) { return m.p.ebitda; });
    k.ebitdaMargin = last && last.p.rev > 0 ? last.p.ebitda / last.p.rev : -1;
    k.gm = last ? last.p.gm : 0;
    var r3 = hm.length >= 4 ? core(hm[hm.length - 4]) : 0;
    var r0 = core(last);
    k.qoqGrowth = r3 > 0 && last ? r0 / r3 - 1 : 0;
    var r1 = hm.length >= 2 ? core(hm[hm.length - 2]) : 0;
    k.momGrowth = r1 > 0 && last ? r0 / r1 - 1 : 0;
    k.cmgr3 = r3 > 0 && r0 > 0 ? Math.pow(r0 / r3, 1 / 3) - 1 : 0;
    var prevTTM = hm.length >= 24 ? U.sum(hm.slice(-24, -12), core) : 0;
    k.yoyGrowth = prevTTM > 0 ? k.revenueTTM / prevTTM - 1 : 0;
    k.headcount = RW.Team.headcount(state);
    k.morale = RW.Team.avgMorale(state);
    k.founderPct = RW.Funding.founderPct(state);
    // model-specific metrics (arr, customers, traction, share, workload, momentum...)
    var mk = M.kpis(state);
    for (var key in mk) k[key] = mk[key];
    // momentum for morale: revenue growth and press
    k.momentum = U.clamp((k.cmgr3 || 0) * 60, -10, 10) + (state.funding.raise && state.funding.raise.leadId ? 3 : 0);
    // burn multiple: net burn / net new ARR (annualized revenue added)
    var newRunRate = last && hm.length >= 4 ? (r0 - r3) * 12 / 3 : 0;
    k.burnMultiple = newRunRate > 0 && burn > 0 ? burn * 12 / 3 / (newRunRate / 4) : (burn > 0 ? 99 : 0);
    k.defaultAlive = EN.defaultAlive(state);
    var tr = M.traction(state);
    k.traction = tr.score * (state.flags.inflate && state.flags.inflate > state.time.w ? 1.2 : 1);
    k.tractionInfo = tr;
    state.kpi = k;
    return k;
  };

  EN.forecastMonthlyCost = function (state) {
    var M = RW.Models[state.industry];
    var o = state.company.office;
    var rent = o.type === 'cowork' ? o.seats * RW.OFFICES.cowork.rentPerSeat + RW.OFFICES.cowork.fixed : o.rent || 0;
    return RW.Team.monthlyCost(state) + rent + (M.forecastCost ? M.forecastCost(state) : 0) + 8000;
  };

  // 12-month cash projection for planning. opt: { g: monthly growth, cut: share of non-payroll fixed costs cut,
  // freeze: cancel hires not yet started, hires: extra headcount, salary: their monthly salary }
  EN.cashForecast = function (state, opt) {
    opt = opt || {};
    var hm = U.last(state.hist.monthly, 3), w = state.time.w, M = RW.Models[state.industry];
    var pol = state.team.policy;
    function empCost(sal) { return sal + L.socialSecurity(sal) + RW.POLICIES.benefits[pol.benefits].cost + RW.POLICIES.culture[pol.culture].cost; }
    var rev0 = 0, varR = 0, fixed0, collect = 1, side0 = 0;
    // cash collected per baht of revenue: annual prepayments raise it, slow-paying invoices lower it
    var h4 = U.last(state.hist.monthly, 4);
    if (h4.length >= 2) {
      var rc = 0, rv = 0;
      for (var j = 1; j < h4.length; j++) {
        var a = h4[j], pv = h4[j - 1];
        rv += a.p.rev;
        rc += a.p.rev - ((a.bal.ar || 0) - (pv.bal.ar || 0)) - ((a.bal.deferred || 0) - (pv.bal.deferred || 0));
      }

    var cut = opt.cut || 0, cash = state.fin.bal.cash, out = [], zeroAt = null, beAt = null;
    var info = T.info(w), m0 = info.monthsElapsed;
    var loans = state.fin.loans.map(function (l) { return { kind: l.kind, bal: l.balance + (l.feeLeft || 0), pay: l.payment || 0, rate: l.rate, io: l.interestOnly, age: Math.floor((w - l.startW) / 4.33), months: l.months, share: l.revShare }; });
    for (var i = 1; i <= 12; i++) {
