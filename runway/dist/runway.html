  // Paul Graham's "default alive": with current expenses and growth, profitable before cash runs out?
  EN.defaultAlive = function (state) {
    var hm = state.hist.monthly;
    if (hm.length < 3) return null;
    var last = hm[hm.length - 1];
    var rev = last.p.rev + (last.pl.rev_oneoff || 0); // one-off deals don't keep a company alive
    var exp = rev + Math.max(0, state.kpi.burn || 0);
    if (state.kpi.burn <= 0) return { alive: true, months: 0 };
    if (rev < 30000) return { alive: false, months: 0, tooEarly: true };
    // growth on a tiny base is noise: be conservative
    var g = U.clamp(state.kpi.cmgr3 || 0, -0.1, rev < 300000 ? 0.08 : 0.15);
    var cash = state.fin.bal.cash;
    for (var m = 1; m <= 72; m++) {
      rev *= 1 + g;
      exp *= 1.004;
      cash += rev - exp;
      if (rev >= exp) return { alive: true, months: m };
      if (cash < 0) return { alive: false, months: m };
    }
    return { alive: false, months: 72 };
  };

  // ---------- Solvency / game over ----------
  EN.checkSolvency = function (state, info) {
    var fin = state.fin;
    if (fin.bal.cash + fin.creditLine < 0) {
      fin.unpaid.weeksNeg++;
      if (fin.unpaid.weeksNeg === 1) EN.mail(state, 'finance', 'เงินสดติดลบ!', 'บริษัทไม่มีเงินพอจ่ายภาระ ค่าใช้จ่ายค้างชำระกำลังพอกพูน เจ้าหนี้เริ่มโทรตาม คุณมีเวลาไม่กี่สัปดาห์ก่อนต้องปิดกิจการ — ระดมทุน กู้ เอาเงินส่วนตัวใส่ ลดคน หรือขายบริษัท', 'bad');
      if (fin.unpaid.weeksNeg >= 6) EN.gameOver(state, 'bankrupt', 'เงินสดติดลบต่อเนื่อง 6 สัปดาห์ เจ้าหนี้ยื่นฟ้องล้มละลาย บริษัทต้องปิดกิจการ');
    } else fin.unpaid.weeksNeg = 0;
    var f = state.founder;
    if (f.cash < -Math.max(600000, f.burn * 10)) EN.gameOver(state, 'personal', 'หนี้ส่วนตัวพอกพูนจนคุณไม่สามารถทำบริษัทต่อได้ ต้องกลับไปหางานประจำเพื่อใช้หนี้');
  };

  EN.founderLoan = function (state) {
    return U.sum(state.fin.loans.filter(function (l) { return l.kind === 'founder'; }), function (l) { return l.balance; });
  };

  EN.gameOver = function (state, reason, text) {
    if (state.over) return;
    var M = RW.Models[state.industry];
    var equityValue = 0;
    if (reason === 'bankrupt') {
      // SME loans carry the director's personal guarantee: the bank recovers what liquidation does not cover
      var guaranteed = U.sum(state.fin.loans.filter(function (l) { return l.kind === 'bank'; }), function (l) { return l.balance; });
      if (guaranteed > 0) {
        var callOn = Math.round(guaranteed * 0.55);
        state.founder.cash -= callOn;
        state.stats.guaranteeCalled = callOn;
        text += ' — ธนาคารเรียกให้คุณชำระหนี้ตามสัญญาค้ำประกันส่วนตัว ' + F.m(callOn);
      }
    }
    if (reason === 'fired' || reason === 'timeup') {
      var v = Math.max(M.valuation(state) * RW.Funding.climate(state), 0);
      var wf = RW.Funding.waterfall(state, v);
      equityValue = wf.founder * (reason === 'timeup' ? 0.6 : 0.45); // illiquid private shares
    }
    if (reason === 'quit' && state.kpi.revenueMonthly > 0) {
      equityValue = 0;
    }
    state.over = { reason: reason, text: text, w: state.time.w, equity: equityValue, personal: state.founder.cash, wealth: state.founder.cash + equityValue };
    EN.finalize(state);
  };

  EN.maxW = function (state) { return state.maxW || RW.MAX_WEEKS; };
  EN.timeUp = function (state) {
    EN.gameOver(state, 'timeup', 'ครบ ' + Math.round(EN.maxW(state) / 52) + ' ปีของการเดินทาง — มาดูกันว่าคุณสร้างอะไรไว้');
  };

  EN.exit = function (state, kind, offer) {
    var wf = RW.Funding.waterfall(state, offer.price);
    var founderGross = wf.founder;
    var cash = founderGross * offer.cash;
    var stock = founderGross * (1 - offer.cash) * 0.8;
    // earn-out portion is uncertain: count half of it
    var proceeds = cash + stock - (offer.earnout ? founderGross * offer.earnout * 0.5 : 0);
    // buyer settles the company's debts at closing, including the founder's shareholder loan
    var loanBack = EN.founderLoan(state);
    state.founder.cash += proceeds + loanBack;
    state.over = { reason: kind, text: 'ขายกิจการให้ ' + offer.buyer + ' มูลค่า ' + F.m(offer.price) + (loanBack > 0 ? ' (ได้เงินกู้ผู้ก่อตั้งคืน ' + F.m(loanBack) + ')' : ''), w: state.time.w, price: offer.price, waterfall: wf, equity: proceeds, personal: state.founder.cash - proceeds, wealth: state.founder.cash, buyer: offer.buyer, offerKind: offer.kind, earnout: offer.earnout || 0 };
    state.achievements.exit = state.time.w;
    EN.finalize(state);
  };

  EN.ipoCheck = function (state) {
    var k = state.kpi;
    var hm = state.hist.monthly;

    var age = state.time.w / 52;
    var hasCFO = RW.Team.active(state).some(function (e) { return e.role === 'finance' && e.level >= 5; });

      case 'acquired':

          o.offerKind === 'pe' ? o.buyer + ' เข้ามาบริหาร ' + name + ' แบบเน้นกำไร ตัดต้นทุนทุกบรรทัด แล้ววางแผนขายต่อในอีก 4–5 ปี' :
            name + ' กลายเป็นหนึ่งในหน่วยธุรกิจของ ' + o.buyer + ' แบรนด์ยังอยู่ แต่การตัดสินใจทั้งหมดต้องผ่านสำนักงานใหญ่') +
          (o.earnout ? ' — เงื่อนไข earn-out ทำให้คุณต้องทำงานต่อให้ผู้ซื้ออีกสองปีเต็ม เป็นสองปีที่ยาวที่สุดในชีวิต' : '');
        break;
      case 'ipo':
        co = 'เช้าวันแรกของการซื้อขาย หุ้น ' + name + ' ' + pick(['เปิดสูงกว่าราคาจองเกือบ 30%', 'ยืนเหนือราคาจองได้อย่างหวุดหวิด', 'ผันผวนตลอดวันก่อนปิดบวกเล็กน้อย']) + ' คุณกับทีมรุ่นแรกยืนเคาะระฆังด้วยกัน จากนี้ทุกไตรมาสคือการสอบต่อหน้านักลงทุนรายย่อยนับหมื่นคน';
        break;
      default:
        if (profitable && growth > 0.2) co = 'ครบ ' + Math.round(yrs) + ' ปี ' + name + ' ยังโตแรงและมีกำไร ' + (ind === 'fnb' ? 'มี ' + branches + ' สาขา ' : '') + 'นักลงทุนและผู้ซื้อกิจการเริ่มเข้ามาเคาะประตูบ่อยขึ้น เกมจริงอาจเพิ่งเริ่มต้น';
        else if (profitable) co = 'ครบ ' + Math.round(yrs) + ' ปี ' + name + ' กลายเป็นธุรกิจที่มั่นคงและมีกำไร ไม่หวือหวาแต่จ่ายเงินเดือนทุกคนตรงเวลาทุกเดือน — สิ่งที่สตาร์ทอัพส่วนใหญ่ไม่เคยทำได้';
        else if ((k.runway || 0) < 6) co = 'ครบ ' + Math.round(yrs) + ' ปี ' + name + ' ยังมีลมหายใจ แต่เงินสดเหลืออีกไม่กี่เดือน ทุกคนรู้ดีว่าปีหน้าคือปีตัดสิน';
        else co = 'ครบ ' + Math.round(yrs) + ' ปี ' + name + ' ยังไม่ทำกำไร และการเติบโตก็ช้าลง ภาษาวงการเรียกว่า "บริษัทซอมบี้" — ไม่ตาย แต่ก็ไม่โต';
    }
    out.push({ h: 'บริษัท', t: co });

    // 2) the team
    var team;
    if (peak === 0) team = 'คุณทำทุกอย่างด้วยตัวเองมาตลอด ไม่เคยต้องจ่ายเงินเดือนใคร และไม่เคยต้องบอกใครว่าบริษัทไม่มีเงิน';
    else if (o.reason === 'bankrupt') team = (hc > 0 ? 'พนักงาน ' + hc + ' คนสุดท้ายต้องหางานใหม่' + (state.stats.missedPayroll ? ' บางคนยังได้เงินเดือนเดือนสุดท้ายไม่ครบและต้องยื่นเรื่องต่อพนักงานตรวจแรงงาน' : ' ส่วนใหญ่ได้งานใหม่ภายในไม่กี่เดือน') : 'ทีมทยอยลาออกไปก่อนหน้านั้น คนสุดท้ายที่อยู่จนวันปิดคือตัวคุณเอง') + (peak >= 10 ? ' หลายคนยังเรียกช่วงเวลาที่ ' + name + ' ว่า "โรงเรียนที่แพงที่สุด"' : '');
    else if (esop > 1e5) team = 'พนักงานที่ถือ ESOP ได้รับเงินรวม ' + F.m(esop) + ' — บางคนเอาไปดาวน์บ้านหลังแรก บางคนเอาไปเริ่มบริษัทของตัวเอง';
    else team = 'ตลอดเส้นทางมีคนเคยทำงานกับคุณสูงสุด ' + peak + ' คนพร้อมกัน' + (state.stats.layoffs ? ' และคุณเคยต้องเลิกจ้าง ' + state.stats.layoffs + ' คน — ทุกครั้งยังจำหน้าได้' : '');
    if (peak >= 12) team += ' · ศิษย์เก่าอย่างน้อย ' + (Math.floor(peak / 12) + 1) + ' คนออกไปเปิดบริษัทของตัวเองในภายหลัง';
    var cofLeft = (state.cofounders || []).filter(function (c) { return !c.active; });
    if (cofLeft.length) team += ' · ' + cofLeft[0].nick + ' ผู้ร่วมก่อตั้งที่แยกทางกันไป ' + pick(['ส่งข้อความมาแสดงความยินดี/ให้กำลังใจ', 'ยังไม่ได้คุยกับคุณอีกเลย', 'กลายเป็นเพื่อนกันอีกครั้งหลังผ่านไปหลายปี'], 3);
    out.push({ h: 'ทีม', t: team });

    // 3) the investors
    if (invIn > 0) {
      var inv;
      if (o.reason === 'acquired') {
        var mult = invOut / invIn;
        inv = 'นักลงทุนลงเงินรวม ' + F.m(invIn) + ' ได้คืน ' + F.m(invOut) + ' (' + mult.toFixed(1) + 'x) ' + (mult >= 5 ? '— ดีลนี้จะถูกใช้เป็นตัวอย่างในพิตช์ระดมทุนกองต่อไปของพวกเขา' : mult >= 1 ? '— ไม่เลวร้าย แต่ไม่ใช่ผลตอบแทนที่ VC ฝันไว้' : '— ขาดทุน แต่ liquidation preference ช่วยให้ได้เงินคืนก่อนผู้ก่อตั้ง');
      } else if (o.reason === 'ipo') inv = 'นักลงทุนทุกรอบได้ผลตอบแทนหลายเท่าบนกระดาษ หลังพ้น lock-up หลายรายทยอยขายหุ้นออก';
      else if (o.reason === 'bankrupt' || o.reason === 'personal' || o.reason === 'quit') inv = 'เงินลงทุน ' + F.m(invIn) + ' ถูกตัดเป็นศูนย์ ' + (state.funding.board.confidence >= 50 ? 'นักลงทุนรายหนึ่งส่งข้อความว่า "ขอบคุณที่สู้จนวินาทีสุดท้าย ถ้าเปิดบริษัทใหม่ บอกผมเป็นคนแรก"' : 'บางรายไม่ตอบข้อความคุณอีกเลย');
      else inv = 'นักลงทุนที่ลงเงินรวม ' + F.m(invIn) + ' ยังรอการ exit ที่จะทำให้ตัวเลขในพอร์ตเป็นจริง';
      out.push({ h: 'นักลงทุน', t: inv });
    }

    // 4) the founder
    var me = [];
    if (f.health < 45) me.push('ร่างกายคุณใช้เวลาเกือบปีกว่าจะฟื้นตัวจากปีที่ทำงานหนัก');
    else if (state.achievements.burnout) me.push('อาการหมดไฟที่เคยเป็นสอนให้คุณรู้ขีดจำกัดของตัวเอง');
    if (f.life < 35) me.push('ความสัมพันธ์กับครอบครัวและคนใกล้ตัวต้องใช้เวลาซ่อมแซมนานกว่าบริษัทไหนๆ');
    else if (f.life >= 65) me.push(pick(['คนที่คุณรักยังอยู่ข้างคุณตลอดทาง', 'คุณยังมีเวลาให้ครอบครัวแม้ในปีที่หนักที่สุด และนั่นคือสิ่งที่คุณภูมิใจที่สุด', 'เพื่อนเก่ายังนัดกินข้าวกับคุณเหมือนเดิม ไม่มีใครถามเรื่อง valuation'], 5));
    if (state.stats.guaranteeCalled) me.push('หนี้ค้ำประกันธนาคาร ' + F.m(state.stats.guaranteeCalled) + ' จะตามคุณไปอีกหลายปี');
    me.push('ความมั่งคั่งสุทธิตอนจบ ' + F.m(o.wealth) + ' — ' + o.rank.desc);
    out.push({ h: 'ตัวคุณ', t: me.join(' · ') });

    // 5) the lesson
    var lesson;
    var payrollHeavy = peak >= 6 && maxRev < peak * 60000;
    if (o.reason === 'bankrupt' && maxRev < 150000) lesson = 'บริษัทส่วนใหญ่ไม่ได้ตายเพราะคู่แข่ง แต่ตายเพราะสร้างสิ่งที่คนไม่ยอมจ่ายเงินซื้อ — หาลูกค้าที่ยอมจ่ายจริงให้เร็วกว่านี้ แล้วค่อยขยาย';
    else if ((o.reason === 'bankrupt' || o.reason === 'fired') && payrollHeavy) lesson = 'ทีมโตเร็วกว่ารายได้ การจ้างหนึ่งคนคือการผูกเงินสดไว้ 12–18 เดือน — จ้างเมื่อคอขวดชัด ไม่ใช่เมื่อรู้สึกว่าควรโต';
    else if (o.reason === 'bankrupt' && state.stats.raised > 0) lesson = 'เงินหมดก่อนถึง milestone ถัดไป — เริ่มระดมทุนเมื่อยังเหลือ runway อย่างน้อย 9 เดือน และวางแผนให้ถึงเป้าหมายด้วยเงินแค่ 70% ของที่ระดมได้';
    else if (o.reason === 'bankrupt') lesson = 'กระแสเงินสดสำคัญกว่ากำไรบนกระดาษ — ดูเงินสดรายสัปดาห์ เก็บหนี้ให้เร็ว และอย่าใช้เงินที่ยังไม่ได้รับ';
    else if (o.reason === 'personal') lesson = 'ผู้ก่อตั้งก็มี runway ของตัวเอง เงินเดือนผู้ก่อตั้งที่พออยู่ได้ไม่ใช่ความฟุ่มเฟือย แต่คือสิ่งที่ทำให้บริษัทไม่ต้องจบเพราะคุณถังแตกก่อน';
    else if (o.reason === 'fired') lesson = 'เมื่อนักลงทุนคุมบอร์ด ความเชื่อมั่นคือสกุลเงินของคุณ — สัญญาให้น้อย ทำให้ได้มากกว่า และอย่าปล่อยให้บอร์ดได้ยินข่าวร้ายจากคนอื่น';
    else if (o.reason === 'acquired' || o.reason === 'ipo') lesson = 'จังหวะสำคัญพอๆ กับฝีมือ — คุณสร้างสิ่งที่คนอื่นยอมจ่ายเงินก้อนใหญ่เพื่อเป็นเจ้าของ และนั่นคือนิยามของการสร้างคุณค่า';
    else if (o.reason === 'shutdown') lesson = 'การรู้ว่าเมื่อไรควรหยุดคือทักษะของผู้ก่อตั้งที่ไม่มีใครสอน — คุณหยุดได้ก่อนที่มันจะทำร้ายคนรอบตัว';
    else if (profitable) lesson = 'ธุรกิจที่ดีคือธุรกิจที่ยังอยู่ ความอดทนและวินัยเรื่องเงินสดคือความได้เปรียบที่คนประเมินค่าต่ำที่สุด';
    else lesson = 'การอยู่รอดไม่เท่ากับการชนะ — ถ้ายังหา product-market fit ไม่เจอหลังหลายปี การเปลี่ยนทิศอย่างกล้าหาญอาจดีกว่าการประคองต่อ';
    out.push({ h: 'บทเรียน', t: lesson });
    return out;
  };

  // ---------- Achievements ----------
  EN.ACH = {

    ch_crisis: ['เกิดกลางพายุ', 'โหมดเริ่มกลางวิกฤต: บริษัทอยู่รอดครบ 3 ปี'],
    ch_sprint: ['วิ่งสุดแรง', 'โหมด Sprint 5 ปี: ความมั่งคั่ง ≥ ฿100M เมื่อจบเกม']

  EN.checkAchievements = function (state) {
    var a = state.achievements, w = state.time.w, k = state.kpi;
    function set(id) { if (!a[id]) { a[id] = w; EN.mail(state, 'system', 'ปลดล็อกความสำเร็จ: ' + EN.ACH[id][0], EN.ACH[id][1], 'good'); } }
    if (state.company.registered) set('registered');
    if ((k.customers || 0) > 0) set('first_customer');
    var hc = RW.Team.headcount(state);
    if (hc >= 1 || (state.industry === 'fnb' && state.biz.branches.some(function (b) { return b.state === 'open'; }))) set('first_hire');
    if (hc >= 10) set('team10');
    if (hc >= 50) set('team50');
    if (hc >= 200) set('team200');
    if (k.revenueMonthly >= 1e6) set('rev1m');
    if (k.revenueMonthly >= 10e6) set('rev10m');
    if (k.revenueMonthly >= 100e6) set('rev100m');
    var hm = state.hist.monthly;
    if (hm.length && hm[hm.length - 1].cf.op + (hm[hm.length - 1].pl.rev_oneoff || 0) > 0 && hm[hm.length - 1].p.rev + (hm[hm.length - 1].pl.rev_oneoff || 0) > 50000) set('ramen');
    if (k.defaultAlive && k.defaultAlive.alive && k.burn > 0 && k.revenueMonthly > 100000 && k.runway > 6 && k.ebitdaMargin > -0.6) set('default_alive');
    ['seed', 'A', 'B', 'C'].forEach(function (s) { if (state.funding.rounds.some(function (r) { return r.stage === s; })) set('raised_' + s); });
    if (state.funding.lastPost >= 35e9) set('unicorn');
    if (state.challenge === 'crisis' && w >= 156) set('ch_crisis');
    if (k.revenueTTM >= 100e6 && state.funding.rounds.length === 0 && state.funding.safes.length === 0) set('bootstrapped');
    if (state.world.phase === 'recovery' && state.flags.sawRecession) set('survived_recession');
    if (state.world.phase === 'recession') state.flags.sawRecession = 1;
    if (state.founder.burnout > 0) set('burnout');
    if (state.stats.missedPayroll) set('missed_payroll');
  };

  // ---------- Advisor ----------
  EN.advice = function (state) {
    var out = [], k = state.kpi, f = state.founder;
    var M = RW.Models[state.industry];
    function add(lvl, t) { out.push({ lvl: lvl, t: t }); }
    if (!state.company.registered && !state.flags.registering) add('warn', 'ยังไม่ได้จดทะเบียนบริษัท — จ้างพนักงาน เก็บเงินลูกค้าองค์กร และระดมทุนไม่ได้จนกว่าจะจด (หน้า "บริษัท")');
    if (k.runway < 3) add('crit', 'Runway เหลือไม่ถึง 3 เดือน! การระดมทุนใช้เวลา 3-6 เดือน ต้องตัดสินใจเรื่องลดค่าใช้จ่ายทันที');
    else if (k.runway < 6 && !state.funding.raise) add('warn', 'Runway ต่ำกว่า 6 เดือน — ควรเริ่มระดมทุนหรือหาทางทำกำไรตั้งแต่ตอนนี้ (ระดมทุนมักใช้เวลา 3-6 เดือน)');
    if (state.fin.bal.cash < 0) add('crit', 'เงินสดติดลบ — ภายใน 6 สัปดาห์บริษัทจะล้มละลาย');
    var pr = RW.Team.payroll(state, T.info(state.time.w));
    var info = T.info(state.time.w);

      segs: segs, ch: ch, brand: 8, buzz: [], annualDiscount: 0.15, maxDiscount: 0.1, discTarget: 'sme',
      impl: 0, accounts: [], support: { backlog: 0, tickets: 0, cap: 0, csat: 0.8 }, markets: {}, weekRev: 0,
      lifetime: { customers: 0, churned: 0 }, cacHist: [], hype: c.hype || 1, chanMonthHist: []
    };
    state.biz = biz;
    c.comps.forEach(function (x) {

    });

  };

  M.welcome = function (state) {
    var b = state.biz, c = CONCEPTS[b.concept];
    return 'คุณลาออกจากงานประจำเพื่อสร้าง "' + c.n + '" — ' + c.d + '\n\nสิ่งที่ต้องทำช่วงแรก:\n1) จดทะเบียนบริษัท (หน้าบริษัท)\n2) สร้าง MVP (Core ระดับ 1) — ดูหน้าสินค้า\n3) ใช้เวลาคุยกับลูกค้า (Discovery) เพื่อรู้ว่าแต่ละกลุ่มต้องการอะไรจริงๆ\n4) หาลูกค้ารายแรก แล้วค่อยตัดสินใจว่าจะระดมทุนหรือโตด้วยตัวเอง\n\nเงินในบริษัทคือเวลาที่เหลืออยู่ — ดู Runway ที่มุมบนเสมอ';
  };

  // ---------- Helpers ----------
  M.customers = function (b, k) { return U.sum(b.segs[k].cohorts, function (c) { return c.n; }) + (k === 'ent' ? b.accounts.length : 0); };
  M.totalCustomers = function (b) { return U.sum(SEGS, function (k) { return M.customers(b, k); }); };
  M.segMRR = function (b, k) {
    var s = U.sum(b.segs[k].cohorts, function (c) { return c.n * c.arpa * c.exp; });
    if (k === 'ent') s += U.sum(b.accounts, function (a) { return a.acv / 12; });
    return s;
  };
  M.mrr = function (b) { return U.sum(SEGS, function (k) { return M.segMRR(b, k); }); };

  M.marketMult = function (state) {
    var b = state.biz, m = 1;
    for (var k in b.markets) m += MARKETS[k].mult * b.markets[k].ramp * 0.7;
    return m;
  };
  M.inMarket = function (state, k) {
    var c = CONCEPTS[state.biz.concept];
    var demand = state.world.macro.demand * state.diff.market;
    var reg = state.flags.regBoost && state.flags.regBoost.until > state.time.w ? state.flags.regBoost.m : 1;
    return c.tam[k] * SEG[k].buy / 52 * demand * M.marketMult(state) * reg;
  };

  // value delivered to a segment (0..~1.2): feature fit × quality
  M.fit = function (b, k, known) {
    var need = b.segs[k].need, f = 0;
    for (var key in need) {
      var n = need[key];
      var lvl = b.feats[key];
      f += n.w * Math.min(1.15, lvl / n.lvl);
    }
    return f;
  };
  M.quality = function (b) {
    var q = (1 - b.bugs / 160) * (b.uptime >= 0.999 ? 1 : b.uptime >= 0.995 ? 0.94 : 0.85);
    return U.clamp(q, 0.3, 1);
  };
  M.value = function (state, k) {
    var b = state.biz;
    if (!b.launched) return 0;
    var v = M.fit(b, k) * M.quality(b);
    v *= 1 + Math.min(0.08, b.segs[k].disc / 1000) + Math.min(0.1, RW.Team.capOf(state, 'product') * 0.04);
    // gates
    if (k === 'ent' && (b.feats.ent < 2 || b.feats.security < 2)) v *= 0.25;
    if (k === 'mid' && b.feats.core < 2) v *= 0.5;
    return v;
  };
  M.wtp = function (state, k) { return CONCEPTS[state.biz.concept].price[k] * (0.45 + 0.75 * M.value(state, k)); };
  M.priceFactor = function (state, k) {
    var p = state.biz.segs[k].price;
    return U.clamp(Math.pow(M.wtp(state, k) / Math.max(1, p), SEG[k].elast), 0.05, 1.8);
  };
  M.compAttract = function (state, k) {
    var cs = RW.World.aliveCompetitors(state);
    if (!cs.length) return 0.3;
    var tot = 0, wsum = 0;
    cs.forEach(function (c) {
      var w = c.focus === k ? 1.6 : 0.7;
      tot += w * (c.quality / 100) * 1.08 / Math.pow(c.price, 0.6) * (0.85 + c.mkt / 300);
      wsum += w;
    });
    return tot / wsum * Math.min(1.5, 0.8 + cs.length * 0.12);
  };
  M.compFactor = function (state, k) {
    var b = state.biz;
    var you = M.value(state, k) / Math.pow(b.segs[k].price / CONCEPTS[b.concept].price[k], 0.6) * (0.85 + b.brand / 300);
    var them = M.compAttract(state, k);
    return U.clamp(2 * you / (you + them), 0.35, 1.6);
  };
  M.buzzMult = function (b) {
    var m = 1;
    b.buzz.forEach(function (x) { m *= 1 + (x.m - 1) * (x.weeks / x.total); });
    return m;
  };
  M.fitTerm = function (v) { return 0.15 + 0.85 * Math.pow(Math.max(0, v), 1.6); };
  M.qAvg = function (by, state) {
    var t = 0, q = 0;
    var sk = state ? 0.45 + state.founder.skills.sales / 90 : 1;
    for (var ch in by) { t += by[ch]; q += by[ch] * (CH[ch].q || 1) * (ch === 'direct' ? sk : 1); }
    return t > 0 ? q / t : 1;
  };
  // innovators & early adopters buy immature products from founders they trust
  M.earlyAdopter = function (b, k) {
    var n = M.customers(b, k);
    return n >= 20 ? 1 : 1 + 1.5 * (1 - n / 20);
  };
  M.annualShare = function (b, k) {
    if (k === 'ent') return 1;
    return U.clamp(0.06 + b.annualDiscount * 2.2, 0.03, 0.65) * (k === 'micro' ? 0.6 : 1);
  };

  // ---------- Weekly ----------
  M.weekly = function (state, info) {
    var b = state.biz, w = state.time.w;
    b.buzz.forEach(function (x) { x.weeks--; });
    b.buzz = b.buzz.filter(function (x) { return x.weeks > 0; });
    SEGS.forEach(function (k) { b.segs[k].stat = { leads: 0, won: 0, churned: 0, churnMRR: 0, expMRR: 0, newMRR: 0 }; });
    M.engineering(state);
    M.discovery(state);
    if (b.launched) {
      var leads = M.marketing(state);
      M.sales(state, leads);
      M.churn(state);
    } else {
      // still spend marketing budget pre-launch (waitlist building)
      M.marketing(state, true);
    }
    M.revenue(state);
    M.supportOps(state);
    M.outages(state);
    // markets ramp
    for (var mk in b.markets) b.markets[mk].ramp = Math.min(1, b.markets[mk].ramp + 1 / 52);
    b.brand = U.clamp(b.brand * 0.997 + Math.log10(1 + M.totalCustomers(b)) * 0.02, 0, 100);
  };

  M.devPoints = function (state) {
    var b = state.biz;
    var dev = RW.Team.capOf(state, 'dev');
    var leadBoost = 1 + Math.min(0.15, RW.Team.capOf(state, 'lead_eng') * 0.12);
    var pm = 1 + Math.min(0.12, RW.Team.capOf(state, 'product') * 0.06);
    var debt = 1 - b.debt / 180;
    var mode = b.ship === 'fast' ? 1.2 : b.ship === 'careful' ? 0.82 : 1;
    return dev * leadBoost * pm * debt * mode * RW.Engine.tm(state, 'dev');
  };

  M.engineering = function (state) {
    var b = state.biz;
    var pts = M.devPoints(state);
    var a = b.alloc, tot = a.feat + a.quality + a.infra || 1;
    var featPts = pts * a.feat / tot, qPts = pts * a.quality / tot, iPts = pts * a.infra / tot;
    // implementation work for new enterprise/mid customers comes first
    if (b.impl > 0) {
      var use = Math.min(b.impl, featPts * 0.7 + qPts * 0.2);
      b.impl -= use;
      featPts -= Math.min(featPts, use * 0.78);
      qPts -= Math.max(0, use - use * 0.78);
      if (qPts < 0) qPts = 0;
    }
    // roadmap
    var devHC = RW.Team.active(state).filter(function (e) { return e.role === 'eng'; }).length + (state.founder.focus.build > 10 ? 1 : 0);
    var parallel = Math.max(1, Math.floor(devHC / 3) + 1);
    var design = RW.Team.capOf(state, 'design'), data = RW.Team.capOf(state, 'data');
    var bugRate = (b.ship === 'fast' ? 0.55 : b.ship === 'careful' ? 0.16 : 0.32) * (1 + b.debt / 90);
    var debtRate = b.ship === 'fast' ? 0.45 : b.ship === 'careful' ? 0.1 : 0.24;
    var perfectionists = RW.Team.active(state).filter(function (e) { return e.role === 'eng' && e.traits.indexOf('perfectionist') >= 0; }).length;
    if (perfectionists) bugRate *= 0.8;
    // nothing else can ship before there is a working core product
    var items = (b.launched ? b.roadmap : b.roadmap.filter(function (it) { return it.f === 'core'; })).slice(0, parallel);
    var leftover = featPts;
    items.forEach(function (it, idx) {
      if (leftover <= 0) return;
      var fd = FEAT[it.f];
      var lvl = b.feats[it.f];
      if (lvl >= fd.costs.length) return;
      var cost = fd.costs[lvl];
      var maxPerWeek = cost / (2 + lvl);
      var share = idx === items.length - 1 ? leftover : Math.min(leftover, featPts / items.length * 1.3);
      var p = Math.min(share, maxPerWeek);
      var mult = 1;
      if (fd.design) mult *= 1 - fd.design * 0.5 + fd.design * 0.5 * Math.min(1.4, design / Math.max(0.5, RW.Team.capOf(state, 'dev')) * 4);
      if (fd.data) mult *= 0.75 + Math.min(0.5, data * 0.4);
      it.prog += p * mult;
      leftover -= p;
      if (it.prog >= cost) {
        b.feats[it.f]++;
        b.bugs = Math.min(100, b.bugs + cost * bugRate * 0.55);
        b.debt = Math.min(100, b.debt + cost * debtRate * 0.45);
        it.done = true;
        M.onShip(state, it.f, b.feats[it.f]);
      }
    });
    b.roadmap = b.roadmap.filter(function (it) { return !it.done; });
    // leftover feature points help quality
    qPts += Math.max(0, leftover) * 0.5;
    // quality work: bugs first if severe
    var bugShare = b.bugs > b.debt ? 0.6 : 0.4;
    b.bugs = Math.max(0, b.bugs - qPts * bugShare * 3.2);
    b.debt = Math.max(0, b.debt - qPts * (1 - bugShare) * 1.6);
    // reliability
    var devops = iPts * 2.5 + RW.Team.capOf(state, 'ops') * 0.3;
    var load = Math.log10(1 + M.totalCustomers(b) / 200);
    b.reliability = U.clamp(b.reliability + devops - load * 0.4 - 0.3, 0, 100);
    // natural bug inflow grows with usage
    b.bugs = Math.min(100, b.bugs + Math.sqrt(M.totalCustomers(b)) / 45 + 0.1);
    b.security = U.clamp(b.security + iPts * 0.3 - 0.05 + (b.feats.security * 0.02), 0, 100);
  };

  M.onShip = function (state, f, lvl) {
    var b = state.biz;
    if (f === 'core' && lvl === 1 && !b.launched) {
      b.launched = true; b.launchW = state.time.w;
      b.brand += 4;
      RW.Engine.mail(state, 'product', 'MVP พร้อมขายแล้ว! 🚀'.replace(' 🚀', ''), b.product + ' เวอร์ชันแรกเปิดให้ใช้งาน — ตอนนี้เริ่มหาลูกค้าได้ ช่องทางการตลาดและทีมขายจะเริ่มสร้างลูกค้าจริง ระวัง: MVP ยังมีบั๊กและฟีเจอร์น้อย', 'good');
      return;
    }
    if (f === 'security' && lvl >= 2) L.spend(state.fin, 'prof', 450000);
    RW.Engine.mail(state, 'product', 'ปล่อยฟีเจอร์: ' + FEAT[f].n + ' ระดับ ' + lvl, FEAT[f].d + (f === 'security' && lvl >= 2 ? ' · ค่าตรวจรับรอง ISO 27001 ฿450,000' : ''), 'good');
    b.buzz.push({ m: 1.04 + lvl * 0.01, weeks: 3, total: 3 });
  };

  M.discovery = function (state) {
    var b = state.biz;
    var units = RW.Team.capOf(state, 'discovery') * 1.0 + RW.Team.capOf(state, 'product') * 0.35 + RW.Team.capOf(state, 'cs') * 0.15;
    var t = b.discTarget;
    SEGS.forEach(function (k) {
      var s = b.segs[k];
      var learn = (k === t ? units * 5.5 : units * 0.6) + Math.sqrt(M.customers(b, k)) * 0.15;
      s.disc = U.clamp(s.disc + learn * (1 - s.disc / 105), 0, 100);
    });
  };

  // returns leads per segment {k: {total, byCh: {ch: n}}}
  M.marketing = function (state, prelaunch) {
    var b = state.biz, w = state.time.w, fin = state.fin;
    var out = {};
    SEGS.forEach(function (k) { out[k] = { total: 0, by: {} }; });
    var mkt = RW.Team.capOf(state, 'mkt');
    var eff = 1 / (1 + Math.min(1.2, mkt * 0.35)) * (mkt < 0.3 ? 1.3 : 1) / RW.Engine.tm(state, 'mkt'); // skilled marketers lower CPL
    var compInfl = 1 + U.sum(RW.World.aliveCompetitors(state), function (c) { return c.mkt / 100 * 0.12; });
    var brandF = (0.7 + b.brand / 100 * 0.8) * M.buzzMult(b) * b.hype;
    var on = SEGS.filter(function (k) { return b.segs[k].on; });
    if (!on.length) on = ['micro'];
    function weights(reach) {
      var t = U.sum(on, function (k) { return reach[k] || 0; });
      var o = {};
      on.forEach(function (k) { o[k] = t > 0 ? (reach[k] || 0) / t : 0; });
      return o;
    }
    M.CHKEYS.forEach(function (key) {
      var c = CH[key], st = b.ch[key];
      st.leads = 0;
      if (c.kind === 'paid') {
        var spend = st.budget;
        if (spend <= 0) return;
        L.spend(fin, 'mkt', spend);
        st.m.spend += spend;
        if (prelaunch) { b.brand = Math.min(100, b.brand + spend / 400000); return; }
        var wts = weights(c.reach);
        on.forEach(function (k) {
          var cap = M.inMarket(state, k) * c.reach[k] * brandF;
          var cpl = c.cpl[k] * eff * compInfl;
          var s = spend * wts[k];
          if (cap <= 0 || s <= 0) return;
          var n = cap * (1 - Math.exp(-s / (cap * cpl)));
          out[k].by[key] = (out[k].by[key] || 0) + n;
          st.leads += n;
        });
        b.brand = Math.min(100, b.brand + spend / 2500000);
      } else if (c.kind === 'stock') {
        var sp = st.budget;
        if (sp > 0) { L.spend(fin, 'mkt', sp); st.m.spend += sp; }
        var prod = 0.5 + Math.min(1.5, RW.Team.capOf(state, 'content') * 0.45);
        st.stock = st.stock * 0.992 + sp / 1000 * prod;
        if (prelaunch) return;
        var wc = weights(c.reach);
        on.forEach(function (k) {
          var cap = M.inMarket(state, k) * c.reach[k] * brandF;
          var n = cap * (1 - Math.exp(-st.stock / 900));
          out[k].by[key] = (out[k].by[key] || 0) + n * wc[k];
          st.leads += n * wc[k];
        });
        b.brand = Math.min(100, b.brand + st.stock / 200000);
      } else if (c.kind === 'founder') {
        if (prelaunch) return;
        // meeting volume depends on time spent; sales skill shows up in the close rate (see qAvg)
        var fo = state.founder;
        var fu = (fo.focus.sell || 0) / 100 * Math.pow(fo.hours / 45, 0.85) * RW.Founder.effectiveness(state);
        if (fu <= 0) return;
        // a full-time founder-seller books ~12 qualified meetings a week
        var net = RW.BACKGROUNDS[state.founder.bg].net.customers;
        var per = { micro: 1.5, sme: 1.0, mid: 0.6, ent: 0.25 };
        var wsum = U.sum(on, function (k) { return per[k]; });
        on.forEach(function (k) {
          var n = fu * 12 * net * per[k] / wsum;
          n = Math.min(n, M.inMarket(state, k) * 3);
          out[k].by[key] = (out[k].by[key] || 0) + n;
          st.leads += n;
        });
      } else if (c.kind === 'organic') {
        if (prelaunch) return;
        on.forEach(function (k) {
          var n = M.inMarket(state, k) * 0.004 * brandF * (1 + Math.log10(1 + M.customers(b, k)) * 0.5);
          out[k].by[key] = (out[k].by[key] || 0) + n;
          st.leads += n;
        });
      } else if (c.kind === 'partner') {
        if (!st.on || prelaunch) return;
        var grow = (0.12 + RW.Team.capOf(state, 'ops') * 0.08 + RW.Team.capOf(state, 'sales') * 0.05) * (st.commission / 0.2);
        st.count = Math.min(250, st.count * 0.995 + grow * R.range(0.5, 1.5));
        ['micro', 'sme', 'mid'].forEach(function (k) {

          st.leads += n;

      } else if (c.kind === 'referral') {
        if (prelaunch) return;

        on.forEach(function (k) {
          var v = M.value(state, k);
          var nps = U.clamp((v - 0.55) * 2.2, 0, 1.4);
          var n = M.customers(b, k) * 0.0022 * nps * (1 + Math.min(1, inc / 3000)) * (k === 'ent' ? 0.5 : 1);
          out[k].by[key] = (out[k].by[key] || 0) + n;
          st.leads += n;
        });
      } else if (c.kind === 'team') {
        if (prelaunch) return;
        var sdr = RW.Team.capOf(state, 'leadgen');
        if (sdr <= 0) return;
        var tgt = on.filter(function (k) { return b.segs[k].motion !== 'self'; });
        if (!tgt.length) return;
        tgt.forEach(function (k) {
          var per = { sme: 14, mid: 6, ent: 1.6 }[k] || 0;
          var c2 = CONCEPTS[b.concept];
          var n = Math.min(sdr / tgt.length * per * (1 + Math.min(0.3, RW.Team.capOf(state, 'lead_sdr') * 0.3)), c2.tam[k] * M.marketMult(state) * 0.003);
          out[k].by[key] = (out[k].by[key] || 0) + n;
          st.leads += n;
        });
      }
    });
    if (prelaunch) return out;
    // total capture cannot exceed 80% of in-market buyers (outbound excluded)
    SEGS.forEach(function (k) {
      var o = out[k];
      var inbound = 0;
      for (var ch in o.by) if (ch !== 'outbound' && ch !== 'direct') inbound += o.by[ch];

        for (var ch2 in o.by) if (ch2 !== 'outbound' && ch2 !== 'direct') o.by[ch2] *= f;
      }
      o.total = U.sum(Object.keys(o.by), function (ch) { return o.by[ch]; });
      b.segs[k].stat.leads = o.total;
      b.segs[k].mstat.leads += o.total;

    return out;
  };

  M.sales = function (state, leads) {
    var b = state.biz, w = state.time.w;
    var salesCap = RW.Team.capOf(state, 'sales') * (1 + Math.min(0.2, RW.Team.capOf(state, 'lead_ae') * 0.2));
    var salesSkill = U.clamp(0.75 + (state.founder.focus.sell > 20 ? (state.founder.skills.sales - 50) / 200 : 0) + RW.Team.capOf(state, 'lead_ae') * 0.1, 0.6, 1.25);
    var sellers = SEGS.filter(function (k) { return b.segs[k].on && b.segs[k].motion !== 'self'; });
    // opportunity load
    var load = 0;
    SEGS.forEach(function (k) { b.segs[k].opps.forEach(function (o) { load += o.n * SEG[k].load; }); });
    var overload = load > 0 ? U.clamp(salesCap * 1.0 / load, 0.35, 1) : 1;
    var intakeTotalW = U.sum(sellers, function (k) { return SEG[k].intake ? 1 / SEG[k].intake : 0; });
    SEGS.forEach(function (k) {
      var s = b.segs[k], g = SEG[k], l = leads[k];
      if (!s.on && l.total < 0.01) return;
      var v = M.value(state, k), pf = M.priceFactor(state, k), cf = M.compFactor(state, k);
      var mixQ = l.total > 0 ? U.sum(Object.keys(l.by), function (ch) { return l.by[ch]; }) / l.total : 1;
      if (s.motion === 'self' || !g.intake) {
        // self-serve trial funnel (2 weeks)
        if (l.total > 0) s.trials.push({ w: w, n: l.total, by: l.by });
        var due = s.trials.filter(function (t) { return t.w <= w - 2; });
        s.trials = s.trials.filter(function (t) { return t.w > w - 2; });
        due.forEach(function (t) {
          var ux = 1 + b.feats.ux * 0.08;
          var p = g.conv * M.fitTerm(v) * Math.pow(pf, 0.8) * Math.pow(cf, 0.7) * ux * M.qAvg(t.by, state) * M.earlyAdopter(b, k);
          p = U.clamp(p, 0, 0.65);
          var won = R.binom(Math.round(t.n), p) + (R.f() < (t.n % 1) * p ? 1 : 0);
          if (won > 0) M.addCustomers(state, k, won, t.by, t.n);
        });
      } else {
        s.queue = s.queue * 0.75 + l.total;
        var share = sellers.length ? (1 / g.intake) / intakeTotalW : 0;
        var intake = salesCap * share * g.intake * 1.0;
        var worked = Math.min(s.queue, intake);
        s.queue -= worked;
        if (worked > 0.01) {
          var cyc = R.int(g.cycle[0], g.cycle[1]) * (k === 'ent' && b.feats.security >= 3 ? 0.8 : 1);
          s.opps.push({ w: w, close: w + Math.round(cyc), n: worked * g.qual, by: l.by, src: l.total });
        }
        var keep = [];
        s.opps.forEach(function (o) {
          if (o.close > w) { keep.push(o); return; }
          var refs = g.refs ? 0.65 + 0.35 * Math.min(1, M.customers(b, k) / g.refs) : 1;
          var disc = 1 + b.maxDiscount * 1.6;
          var motionF = s.motion === 'field' ? 1.15 : 1;
          var p = g.win * M.fitTerm(v) * Math.pow(pf, 0.7) * Math.pow(cf, 0.7) * salesSkill * refs * disc * overload * motionF * Math.min(1.6, M.qAvg(o.by, state)) * M.earlyAdopter(b, k);
          p = U.clamp(p, 0, 0.75);
          var n = R.binom(Math.round(o.n), p) + (R.f() < (o.n % 1) * p ? 1 : 0);
          if (n > 0) M.addCustomers(state, k, n, o.by, o.src);
        });
        s.opps = keep;
      }
    });
  };

  M.addCustomers = function (state, k, n, by, srcTotal) {
    var b = state.biz, s = b.segs[k], w = state.time.w;
    var info = RW.T.info(w);
    var g = SEG[k];
    var priceEff = s.price * (1 - (g.intake ? b.maxDiscount * 0.6 : 0));
    // attribute to channels
    var tot = 0; for (var ch in by) tot += by[ch];
    for (var ch2 in by) b.ch[ch2].m.cust += n * by[ch2] / Math.max(1e-9, tot);
    // channel-specific costs at acquisition
    if (by.partners && b.ch.partners.on) {
      var pn = n * by.partners / Math.max(1e-9, tot);
      L.spend(state.fin, 'commission', pn * priceEff * 12 * b.ch.partners.commission);
    }
    if (by.referral && b.ch.referral.incentive) L.spend(state.fin, 'commission', n * by.referral / Math.max(1e-9, tot) * b.ch.referral.incentive);
    // sales commission (10% of first-year contract value for sales-led)
    if (g.intake && s.motion !== 'self') L.spend(state.fin, 'commission', n * priceEff * 12 * (k === 'ent' ? 0.06 : 0.1) * (k === 'ent' ? 1 / 12 : 1));
    s.stat.won += n; s.mstat.won += n;
    b.lifetime.customers += n;
    if (k === 'ent') {
      for (var i = 0; i < n; i++) {
        var acv = Math.round(s.price * R.range(0.55, 1.9) * (1 - b.maxDiscount) / 10000) * 10000;
        var acc = { id: R.id('ac'), name: RW.Names.company(), acv: acv, w: w, renew: w + 52, health: 70, impl: R.range(6, 14) };
        b.accounts.push(acc);
        b.impl += acc.impl;
        L.billAdvance(state.fin, acv, true, state, w + 9, { wht: true, name: acc.name, seg: 'ent' });
        L.invoice(state, 'rev_svc', Math.round(acv * 0.2), w + 9, { wht: true, name: acc.name + ' (implementation)', seg: 'ent' });
        s.stat.newMRR += acv / 12;
        RW.Engine.mail(state, 'sales', 'ปิดดีลองค์กร: ' + acc.name, 'สัญญา 1 ปี มูลค่า ' + F.b(acv) + ' + ค่าติดตั้ง ' + F.b(acv * 0.2) + ' · เครดิตเทอม 60 วัน หัก ณ ที่จ่าย 3% · งาน implementation ~' + Math.round(acc.impl) + ' dev-weeks', 'good');
      }
      return;
    }
    var annual = R.binom(n, M.annualShare(b, k));
    var monthly = n - annual;
    var arpaM = priceEff * (k === 'mid' ? R.range(0.8, 1.4) : 1);
    if (k === 'mid') b.impl += n * R.range(0.8, 2);
    if (monthly > 0) M.cohortAdd(s, info.monthsElapsed, monthly, arpaM, false, null);
    if (annual > 0) {
      var arpaA = arpaM * (1 - b.annualDiscount);
      M.cohortAdd(s, info.monthsElapsed, annual, arpaA, true, w + 52);
      var amt = annual * arpaA * 12;
      if (g.invoiced) L.billAdvance(state.fin, amt, true, state, w + 4, { wht: true, seg: k });
      else { L.billAdvance(state.fin, amt, false); L.post(state.fin, { cogs_fees: amt * 0.028, cash: -amt * 0.028 }, 'op'); }
    }
    s.stat.newMRR += monthly * arpaM + annual * arpaM * (1 - b.annualDiscount);
    s.mstat.newMRR += monthly * arpaM + annual * arpaM * (1 - b.annualDiscount);
  };

  M.cohortAdd = function (s, m, n, arpa, annual, renewW) {
    var c = s.cohorts.find(function (x) { return x.m === m && x.annual === annual && Math.abs(x.arpa - arpa) < arpa * 0.05 && (!annual || Math.abs(x.renew - renewW) <= 2); });
    if (c) { c.arpa = (c.arpa * c.n + arpa * n) / (c.n + n); c.n += n; c.start += n; return; }
    s.cohorts.push({ m: m, n: n, start: n, arpa: arpa, exp: 1, annual: annual, renew: renewW, age: 0 });
  };

  M.churnMonthly = function (state, k) {
    var b = state.biz, g = SEG[k];
    var v = Math.max(0.15, M.value(state, k));
    var mult = U.clamp(Math.pow(1.05 / v, 1.25), 0.45, 4.5);
    var sup = b.support;
    var supF = 1 + U.clamp(sup.overload || 0, 0, 1) * 0.7;
    var up = b.uptime >= 0.999 ? 1 : b.uptime >= 0.995 ? 1.2 : 1.55;
    var priceF = U.clamp(Math.pow(b.segs[k].price / M.wtp(state, k), 0.5), 0.75, 1.8);
    var comp = U.clamp(Math.pow(M.compAttract(state, k) / Math.max(0.15, v), 0.4), 0.8, 1.5);
    var csCov = M.csCoverage(state);
    var cs = (k === 'mid' || k === 'ent') ? 1 - 0.35 * csCov : 1 - 0.1 * csCov;
    var impl = b.impl > 20 && (k === 'mid' || k === 'ent') ? 1.25 : 1;
    return g.churn * mult * supF * up * priceF * comp * cs * impl * state.world.macro.churn * state.diff.churn * (state.flags.pdpaHidden ? 1.05 : 1);
  };
  M.csCoverage = function (state) {
    var b = state.biz;
    var need = M.customers(b, 'mid') / 40 + b.accounts.length / 10;
    if (need <= 0) return 1;
    return U.clamp(RW.Team.capOf(state, 'cs') / need, 0, 1);
  };

  M.churn = function (state) {
    var b = state.biz, w = state.time.w;
    SEGS.forEach(function (k) {
      var s = b.segs[k];
      var cm = M.churnMonthly(state, k);
      s.churnRate = cm;
      s.cohorts.forEach(function (c) {
        if (c.n <= 0) return;
        if (!c.annual) {
          var early = c.age < 3 ? 1.5 : c.age < 6 ? 1.15 : 1;
          var hz = U.weeklyFromMonthly(cm * early);
          var lost = R.binom(c.n, hz);
          if (lost > 0) { c.n -= lost; s.stat.churned += lost; s.mstat.churned += lost; s.stat.churnMRR += lost * c.arpa * c.exp; s.mstat.churnMRR += lost * c.arpa * c.exp; b.lifetime.churned += lost; }
        } else if (c.renew <= w) {
          var renewP = Math.pow(1 - cm, 12) * 1.12;
          var keep = R.binom(c.n, U.clamp(renewP, 0.2, 0.98));
          var lost2 = c.n - keep;
          s.stat.churned += lost2; s.mstat.churned += lost2; s.stat.churnMRR += lost2 * c.arpa * c.exp; s.mstat.churnMRR += lost2 * c.arpa * c.exp; b.lifetime.churned += lost2;
          c.n = keep;
          if (keep > 0) {
            // renewal invoice at current value (+ price uplift if list went up)
            c.exp *= 1 + SEG[k].expand * 6 * Math.min(1.3, M.value(state, k));
            var amt = keep * c.arpa * c.exp * 12;
            if (SEG[k].invoiced) L.billAdvance(state.fin, amt, true, state, w + 4, { wht: true, seg: k });
            else { L.billAdvance(state.fin, amt, false); L.post(state.fin, { cogs_fees: amt * 0.028, cash: -amt * 0.028 }, 'op'); }
            c.renew = w + 52;
          }
        }
      });
      s.cohorts = s.cohorts.filter(function (c) { return c.n > 0; });
    });
    // enterprise accounts: health & renewals
    var keepAcc = [];
    var cm = M.churnMonthly(state, 'ent');
    b.accounts.forEach(function (a) {
      var target = 85 - cm * 1500 - (b.impl > 15 && w - a.w < 26 ? 15 : 0);
      a.health = U.clamp(U.approach(a.health, target, 0.08) + R.normal(0, 1.2), 0, 100);
      if (a.renew <= w) {
        var p = U.clamp(0.35 + a.health / 120, 0.2, 0.97);
        if (R.chance(p)) {
          var up = 1 + R.range(0, 0.12) * (a.health / 80);
          a.acv = Math.round(a.acv * up / 1000) * 1000;
          a.renew = w + 52;
          L.billAdvance(state.fin, a.acv, true, state, w + 9, { wht: true, name: a.name, seg: 'ent' });
          RW.Engine.mail(state, 'sales', a.name + ' ต่อสัญญาอีก 1 ปี', 'มูลค่าใหม่ ' + F.b(a.acv) + '/ปี', 'good');
          keepAcc.push(a);
        } else {
          b.segs.ent.stat.churned++; b.segs.ent.mstat.churned++; b.segs.ent.mstat.churnMRR += a.acv / 12; b.lifetime.churned++;
          RW.Engine.mail(state, 'sales', 'สูญเสียลูกค้าองค์กร: ' + a.name, 'ไม่ต่อสัญญา ' + F.b(a.acv) + '/ปี — ' + R.pick(['ย้ายไปใช้คู่แข่งที่ถูกกว่า', 'ผู้บริหารคนใหม่อยากใช้ระบบต่างชาติ', 'ไม่พอใจที่ implementation ล่าช้า', 'ตัดงบ IT']), 'bad');
        }
      } else keepAcc.push(a);
    });
    b.accounts = keepAcc;
  };

  M.revenue = function (state) {
    var b = state.biz, fin = state.fin, w = state.time.w;
    var weekRev = 0;
    SEGS.forEach(function (k) {
      var s = b.segs[k], g = SEG[k];
      var monthlyRev = 0, annualRev = 0;
      s.cohorts.forEach(function (c) {
        var r = c.n * c.arpa * c.exp * 12 / 52;
        if (c.annual) annualRev += r; else monthlyRev += r;
      });
      if (monthlyRev > 0) {
        if (g.invoiced) L.invoice(state, 'rev_sub', monthlyRev, w + 4, { wht: true, seg: k });
        else {
          L.earnCash(fin, 'rev_sub', monthlyRev);
          L.post(fin, { cogs_fees: monthlyRev * 0.028, cash: -monthlyRev * 0.028 }, 'op');
        }
      }
      // annual: recognize from deferred (guard against rounding drift)
      var rec = Math.min(annualRev, Math.max(0, -fin.bal.deferred));
      if (rec > 0) L.recognizeDeferred(fin, 'rev_sub', rec);
      weekRev += monthlyRev + annualRev;
    });
    var entRev = U.sum(b.accounts, function (a) { return a.acv / 52; });
    var rec2 = Math.min(entRev, Math.max(0, -fin.bal.deferred));
    if (rec2 > 0) L.recognizeDeferred(fin, 'rev_sub', rec2);
    b.weekRev = weekRev + entRev;
  };

  M.supportOps = function (state) {
    var b = state.biz, sup = b.support;
    var t = 0;
    SEGS.forEach(function (k) { t += M.customers(b, k) * SEG[k].tickets; });
    t += (b.ltd || 0) * 0.08; // lifetime-deal users
    t *= (1 + b.bugs / 60) * (1 - Math.min(0.3, b.feats.ux * 0.06));
    var cap = RW.Team.capOf(state, 'support') * 70 + RW.Team.capOf(state, 'cs') * 15 + (state.founder.focus.build > 0 ? 6 : 0) + RW.Team.capOf(state, 'f_sell') * 10 + 4;
    sup.tickets = t; sup.cap = cap;
    sup.backlog = Math.max(0, sup.backlog * 0.6 + t - cap);
    sup.overload = t > 0 ? U.clamp((t + sup.backlog * 0.5 - cap) / Math.max(1, t), 0, 1) : 0;
    sup.csat = U.clamp(U.approach(sup.csat, 0.92 - sup.overload * 0.6 - b.bugs / 300, 0.2), 0, 1);
  };

  M.outages = function (state) {
    var b = state.biz, w = state.time.w;
    var n = M.totalCustomers(b);
    if (!b.launched) return;
    var load = 1 + Math.log10(1 + n / 300);
    var p = 0.012 * load * (1 + b.debt / 35) / (1 + b.feats.scale * 0.5) * (1.4 - b.reliability / 100);
    var minutes = 0;
    if (R.chance(p)) {
      var major = R.chance(0.25 + b.debt / 300);
      minutes = major ? R.int(180, 900) : R.int(10, 90);
      b.outages.push({ w: w, min: minutes });
      if (major) {
        state.flags.crisis = w;
        b.brand = Math.max(0, b.brand - 2);
        var credit = U.sum(b.accounts, function (a) { return a.acv / 12 * 0.05; });
        if (credit > 0) L.post(state.fin, { contra_rev: credit, cash: -credit }, 'op');
        b.accounts.forEach(function (a) { a.health -= 6; });
        RW.Engine.mail(state, 'product', 'ระบบล่มครั้งใหญ่ ' + Math.round(minutes / 60) + ' ชั่วโมง', 'ลูกค้าใช้งานไม่ได้ ทีมต้องทำงานทั้งคืน' + (credit ? ' · ชดเชยตาม SLA ให้ลูกค้าองค์กร ' + F.b(credit) : '') + (b.debt > 50 ? ' · สาเหตุหลัก: หนี้ทางเทคนิคสะสม' : ''), 'bad');
      }
    }
    b.outages = b.outages.filter(function (o) { return o.w > w - 13; });
    var down = U.sum(b.outages, function (o) { return o.min; });
    b.uptime = 1 - down / (13 * 7 * 24 * 60);
  };

  // ---------- Monthly ----------
  M.monthly = function (state, info) {
    var b = state.biz, fin = state.fin;
    // hosting (USD-denominated cloud bills)
    var host = b.launched ? 4500 : 1500;
    SEGS.forEach(function (k) { host += M.customers(b, k) * SEG[k].host; });
    host *= (1 - Math.min(0.45, b.feats.scale * 0.11)) * state.world.fx / 35.5;
    if (state.flags.cloudCredits && state.flags.cloudCredits > state.time.w) host *= 0.2;
    if (b.launched || state.time.w > 4) L.spend(fin, 'cogs_host', host);
    b.lastHost = host;
    // expansion revenue & cohort aging
    SEGS.forEach(function (k) {
      var s = b.segs[k];
      var v = M.value(state, k);
      var csCov = M.csCoverage(state);
      var rate = SEG[k].expand * U.clamp(v, 0.3, 1.2) * (1 + csCov * 0.5) * state.world.macro.demand;
      s.cohorts.forEach(function (c) {
        c.age++;
        if (!c.annual) { var before = c.exp; c.exp *= 1 + rate; s.mstat.expMRR += c.n * c.arpa * (c.exp - before); }
      });
    });
    // markets: local teams
    for (var mk in b.markets) L.spend(fin, 'sal_sm', MARKETS[mk].monthly);
    // security certification upkeep
    if (b.feats.security >= 2) L.spend(fin, 'prof', 25000);
    // channel history snapshot
    var snap = {};
    M.CHKEYS.forEach(function (k) { snap[k] = U.deepCopy(b.ch[k].m); b.ch[k].m = { spend: 0, leads: 0, cust: 0 }; });
    b.chanMonthHist.push(snap);
    if (b.chanMonthHist.length > 24) b.chanMonthHist.shift();
    // segment month stats → history
    var segSnap = {};
    SEGS.forEach(function (k) {
      var s = b.segs[k];
      segSnap[k] = U.deepCopy(s.mstat);
      segSnap[k].endMRR = M.segMRR(b, k);
      segSnap[k].endN = M.customers(b, k);
      s.mstat = { leads: 0, won: 0, churned: 0, churnMRR: 0, expMRR: 0, newMRR: 0, startMRR: segSnap[k].endMRR, startN: segSnap[k].endN };
    });
    b.segHist = b.segHist || [];
    b.segHist.push(segSnap);
    if (b.segHist.length > 24) b.segHist.shift();
  };

  // ---------- KPIs ----------
  M.kpis = function (state) {
    var b = state.biz;
    var mrr = M.mrr(b);
    var cust = M.totalCustomers(b);
    var hist = b.segHist || [];
    var last = hist.length ? hist[hist.length - 1] : null;
    var startMRR = 0, churnMRR = 0, expMRR = 0, startN = 0, churnN = 0, newMRR = 0, won = 0;
    U.last(hist, 3).forEach(function (h) {
      SEGS.forEach(function (k) { startMRR += h[k].startMRR; churnMRR += h[k].churnMRR; expMRR += h[k].expMRR; startN += h[k].startN; churnN += h[k].churned; newMRR += h[k].newMRR; won += h[k].won; });
    });
    var months = Math.min(3, hist.length) || 1;
    var nrrM = startMRR > 0 ? (startMRR - churnMRR + expMRR) / startMRR : 1;
    var nrr = Math.pow(Math.max(0.5, nrrM), 12 / months);
    var logoChurn = startN > 0 ? churnN / startN / months : 0;
    // CAC: S&M spend last 3 months / new customers
    var smSpend = U.sum(U.last(state.hist.monthly, 3), function (m) { return (m.pl.mkt || 0) + (m.pl.commission || 0) + (m.pl.sal_sm || 0); });
    var cac = won > 0 ? smSpend / won : null;
    var arpa = cust > 0 ? mrr / cust : 0;
    var gm = state.kpi && state.kpi.gm > 0 ? state.kpi.gm : 0.75;
    var ltv = logoChurn > 0 ? arpa * gm / Math.max(0.005, logoChurn) : arpa * gm * 60;
    var adopters = U.sum(SEGS, function (k) { return CONCEPTS[b.concept].tam[k] * 0.3 * (k === 'micro' ? 0.4 : 1); }) * M.marketMult(state);
    var yoy = Math.pow(1 + (state.kpi.cmgr3 || 0), 12) - 1;
    return {
      mrr: mrr, arr: mrr * 12, customers: cust, nrr: nrr, logoChurn: logoChurn, cac: cac, ltv: ltv, ltvCac: cac ? ltv / cac : null,
      payback: cac && arpa > 0 ? cac / (arpa * gm) : null, arpa: arpa, marketShare: cust / Math.max(1, adopters), yoyGrowth: yoy,
      workload: { rnd: U.clamp(0.8 + b.impl / 40 + (b.roadmap.length > 3 ? 0.15 : 0), 0.8, 1.6), cogs: 1 + (b.support.overload || 0) * 0.8, sm: 1 },
      bugs: b.bugs, debt: b.debt, uptime: b.uptime
    };
  };

  M.monthKPIs = function (state) {
    var b = state.biz;
    return { mrr: M.mrr(b), customers: M.totalCustomers(b), seg: SEGS.map(function (k) { return M.customers(b, k); }) };
  };

  M.reportLine = function (state) {
    var k = state.kpi;
    return 'MRR ' + F.b(k.mrr) + ' · ลูกค้า ' + F.num(k.customers) + ' ราย · Logo churn ' + F.pct(k.logoChurn) + '/เดือน · NRR ' + F.pct(k.nrr, 0);
  };

  M.forecastCost = function (state) {
    var b = state.biz;
    var mk = U.sum(M.CHKEYS, function (k) { return (b.ch[k].budget || 0) * 4.33; });
    return mk + 12000;
  };
  M.forecastRevenue = function (state) { return M.mrr(state.biz); };

  // ---------- Investor view ----------
  M.traction = function (state) {
    var b = state.biz, k = state.kpi;
    var arr = M.mrr(b) * 12;
    var bestV = Math.max.apply(null, SEGS.map(function (s) { return M.value(state, s); }));
    var prod = b.launched ? 6 + bestV * 10 : b.feats.core * 2 + U.clamp((b.roadmap[0] && b.roadmap[0].f === 'core' ? b.roadmap[0].prog / FEAT.core.costs[0] : 0) * 4, 0, 4);
    var arrPts = 20 * Math.log10(1 + arr / 250000);
    var g = Math.pow(1 + (k.cmgr3 || 0), 12) - 1;
    var gw = Math.min(1, arr / 2e6);
    var growthPts = U.clamp(12 * Math.log2(1 + Math.max(-0.5, g)), -15, 26) * gw;
    var nrrPts = arr > 1e6 ? U.clamp(((k.nrr || 1) - 0.95) * 60, -10, 9) : 0;
    var execs = RW.Team.active(state).filter(function (e) { return e.level >= 4; }).length + (state.cofounders || []).filter(function (c) { return c.active; }).length;
    var team = Math.min(8, execs * 1.5 + state.founder.rep / 12);
    var eff = arr > 5e6 ? (k.burnMultiple < 1.5 ? 3 : k.burnMultiple > 4 ? -4 : 0) : 0;
    var hype = b.feats.auto * 1.5 * b.hype;
    var score = prod + arrPts + growthPts + nrrPts + team + eff + hype;
    return {
      score: score, arr: arr, growth: g,
      lines: [['ARR', F.m(arr)], ['การเติบโต (annualized)', arr > 0 ? F.spct(g, 0) : '–'], ['NRR', arr > 1e6 ? F.pct(k.nrr || 1, 0) : '–'], ['ลูกค้า', F.num(M.totalCustomers(b))], ['Fit สูงสุด', F.pct(bestV, 0)]]
    };
  };

  var VANCHOR = [[0, 6e6], [18, 25e6], [50, 100e6], [80, 500e6], [95, 2.2e9], [106, 7e9], [115, 20e9], [125, 45e9], [140, 120e9]];
  M.qualValue = function (score) {
    if (score <= 0) return VANCHOR[0][1];
    for (var i = 1; i < VANCHOR.length; i++) {
      if (score <= VANCHOR[i][0]) {
        var a = VANCHOR[i - 1], c = VANCHOR[i];
        var t = (score - a[0]) / (c[0] - a[0]);
        return Math.exp(Math.log(a[1]) + t * (Math.log(c[1]) - Math.log(a[1])));
      }
    }
    return VANCHOR[VANCHOR.length - 1][1];
  };
  M.valuation = function (state) {
    var tr = M.traction(state);
    var qual = M.qualValue(tr.score);

    var fund = arr * mult;
    var a = Math.sqrt(U.clamp(arr / 30e6, 0, 1));

    var cap = (RW.Team.capOf(state, 'rnd') * 1.0 + 0.35) * RW.Engine.tm(state, 'dev'); // OEM's own formulation team helps a bit
    var active = b.dev.filter(function (d) { return d.regLeft == null; });
    active.forEach(function (d) { d.prog += cap / Math.max(1, active.length); });
    b.dev.forEach(function (d) {
      if (d.regLeft == null && d.prog >= d.need) {
        if (c.reg[1] > 0) {
          if (!state.company.registered) return; // can't file without a company
          d.regLeft = R.int(c.reg[0], c.reg[1]) - (state.flags.fastPermit ? 2 : 0);
          L.spend(state.fin, 'prof', c.regFee);
          RW.Engine.mail(state, 'product', 'สูตร/ต้นแบบ "' + d.n + '" เสร็จแล้ว — ยื่นขอ อย.', 'ค่าธรรมเนียม ' + F.b(c.regFee) + ' · รอผลประมาณ ' + d.regLeft + ' สัปดาห์');
        } else d.regLeft = 0;
      }
      if (d.regLeft != null && d.regLeft > 0) d.regLeft--;
      if (d.regLeft === 0) { M.launchSku(state, d); d.done = true; }
    });
    b.dev = b.dev.filter(function (d) { return !d.done; });
  };

  M.launchSku = function (state, d) {
    var b = state.biz, c = CONCEPTS[b.concept];
    var t = M.typeOf(b, d.type), p = M.POS[d.pos];
    // true appeal is uncertain; customer insight narrows the spread
    var spread = U.lerp(0.35, 0.12, U.clamp(b.insight / 100, 0, 1));
    var appeal = Math.max(0.3, t[4] * R.normal(1 + b.insight / 500, spread));
    var sku = {
      id: d.id, type: d.type, n: d.n, pos: d.pos, price: Math.round(t[2] * p.price / 10) * 10 - 10, cost: Math.round(t[3] * p.cost),
      quality: U.clamp(p.q + R.normal(0, 8) + RW.Team.capOf(state, 'rnd') * 4, 20, 98), appeal: appeal, appealSeen: null,
      lots: [], born: state.time.w, active: true, sold: 0, week: 0, avg: 0, ret: c.ret, auto: false, cover: 8, shelf: t[6] || c.shelf, oos: 0
    };
    b.skus.push(sku);
    RW.Engine.mail(state, 'product', 'สินค้าใหม่พร้อมขาย: ' + sku.n, 'ราคาตั้งต้น ' + F.b(sku.price) + ' · ต้นทุนผลิตต่อชิ้น ~' + F.b(sku.cost) + ' — สั่งผลิตล็อตแรกที่หน้าสินค้า & สต็อก (ขั้นต่ำ ' + F.num(c.sup.local.moq) + ' ชิ้น)', 'good');
  };

  // ---------- Purchasing ----------
  M.unitCost = function (state, sku, sup, qty) {
    var c = CONCEPTS[state.biz.concept], s = c.sup[sup];
    var scale = 1 - 0.12 * Math.log10(Math.max(1, qty / s.moq));
    var buy = 1 - Math.min(0.1, RW.Team.capOf(state, 'buying') * 0.05);
    var fx = s.fx ? state.world.fx / 35.5 : 1;
    return Math.max(sku.cost * 0.4, sku.cost * s.mult * scale * buy * fx);
  };
  M.placePO = function (state, skuId, qty, sup, auto) {
    var b = state.biz, c = CONCEPTS[b.concept], s = c.sup[sup];
    var sku = b.skus.find(function (x) { return x.id === skuId; });
    if (!sku) return { ok: false, msg: 'ไม่พบสินค้า' };
    qty = Math.max(s.moq, Math.round(qty / 50) * 50);
    var unit = M.unitCost(state, sku, sup, qty);
    var total = Math.round(unit * qty);
    var deposit = Math.round(total * 0.5);
    if (state.fin.bal.cash < deposit) return { ok: false, msg: 'เงินสดไม่พอจ่ายมัดจำ 50% (' + F.b(deposit) + ')' };
    L.post(state.fin, { prepaid: deposit, cash: -deposit }, 'op');
    var lead = R.int(s.lead[0], s.lead[1]);
    b.pos.push({ id: R.id('po'), sku: skuId, qty: qty, unit: unit, total: total, deposit: deposit, arrive: state.time.w + lead, sup: sup, auto: !!auto });
    return { ok: true, msg: 'สั่งผลิต ' + sku.n + ' ' + F.num(qty) + ' ชิ้น @' + F.b(unit) + ' รวม ' + F.b(total) + ' — จ่ายมัดจำ ' + F.b(deposit) + ' ของจะมาถึงใน ~' + lead + ' สัปดาห์' };
  };
  M.receivePOs = function (state) {
    var b = state.biz, w = state.time.w, keep = [];
    b.pos.forEach(function (po) {
      if (po.arrive > w) { keep.push(po); return; }
      var sku = b.skus.find(function (x) { return x.id === po.sku; });
      var bal = po.total - po.deposit;
      L.post(state.fin, { inventory: po.total, prepaid: -po.deposit, cash: -bal }, 'op');
      var defect = R.chance(0.04 * (po.sup === 'imp' ? 1.5 : 1) / (1 + RW.Team.capOf(state, 'buying') * 0.5));
      if (sku) {
        sku.lots.push({ q: po.qty, c: po.unit, exp: sku.shelf ? w + sku.shelf : 0 });
        if (defect) RW.Events.queue(state, 'ecom_defect', { sku: sku.id, qty: Math.round(po.qty * R.range(0.1, 0.35)) });
      }
      if (!po.auto) RW.Engine.mail(state, 'product', 'สินค้าเข้าคลัง: ' + (sku ? sku.n : 'สินค้า') + ' ' + F.num(po.qty) + ' ชิ้น', 'จ่ายส่วนที่เหลือ ' + F.b(bal));
    });
    b.pos = keep;
  };
  M.stock = function (sku) { return U.sum(sku.lots, function (l) { return l.q; }); };
  M.incoming = function (b, id) { return U.sum(b.pos.filter(function (p) { return p.sku === id; }), function (p) { return p.qty; }); };
  M.stockValue = function (b) { return U.sum(b.skus, function (s) { return U.sum(s.lots, function (l) { return l.q * l.c; }); }); };

  // take units FIFO, returns cost
  M.takeUnits = function (sku, n) {
    var cost = 0, left = n;
    sku.lots.sort(function (a, c) { return (a.exp || 1e9) - (c.exp || 1e9); });
    for (var i = 0; i < sku.lots.length && left > 0; i++) {
      var l = sku.lots[i];
      var t = Math.min(l.q, left);
      l.q -= t; left -= t; cost += t * l.c;
    }
    sku.lots = sku.lots.filter(function (l) { return l.q > 0; });
    return { taken: n - left, cost: cost };
  };

  // ---------- Demand ----------
  M.isMega = function (w) {
    var i = RW.T.info(w);
    return M.MEGA.find(function (m) { return m[0] === i.month && m[1] === i.weekOfMonth; }) || null;
  };
  M.buzzMult = function (b) { var m = 1; b.buzz.forEach(function (x) { m *= 1 + (x.m - 1) * (x.weeks / x.total); }); return m; };

  M.weekly = function (state, info) {
    var b = state.biz, c = CONCEPTS[b.concept], fin = state.fin, w = state.time.w;
    b.buzz.forEach(function (x) { x.weeks--; });
    b.buzz = b.buzz.filter(function (x) { return x.weeks > 0; });
    M.devWeekly(state);
    M.receivePOs(state);
    // insight from talking to customers
    b.insight = U.clamp(b.insight + RW.Team.capOf(state, 'discovery') * 4 * (1 - b.insight / 110) + Math.log10(1 + b.customers) * 0.05, 0, 100);
    // creative freshness: decays, refreshed by content production
    var content = RW.Team.capOf(state, 'content') + RW.Team.capOf(state, 'f_market') * 0.4;
    // ads only wear out when they're actually being shown to people
    var adsLive = b.skus.some(function (k) { return k.active; }) && Object.keys(b.ch).some(function (k) { return b.ch[k].open && b.ch[k].ads > 0; });
    b.creative = U.clamp(b.creative * (adsLive ? 0.93 : 0.995) + content * 0.09 + (b.ch.social.open ? RW.Team.capOf(state, 'live') * 0.03 : 0), 0.15, 1);
    var sellable = b.skus.filter(function (s) { return s.active && M.stock(s) > 0; });
    var listed = b.skus.filter(function (s) { return s.active; });
    var st = { orders: 0, newCust: 0, gmv: 0, rev: 0, units: 0, adSpend: 0, byCh: {}, stockout: 0 };
    b.weekStats = st;
    if (!listed.length) { b.weekRev = 0; M.fixedWeekly(state); return; }
    var mega = M.isMega(w), preMega = M.isMega(w + 1);
    var vat = fin.vat.registered ? 1 / 1.07 : 1;
    // average attractiveness of the catalogue
    var attr = U.avg(listed, function (s) { return s.appeal * (0.6 + s.quality / 250); });
    var priceF = U.avg(listed, function (s) { var t = M.typeOf(b, s.type); var ref = t[2] * M.POS[s.pos].price; return Math.pow(ref / s.price, 1.4); });
    var compF = 1 / (1 + U.sum(RW.World.aliveCompetitors(state), function (x) { return x.mkt / 100 * 0.12; }) * c.comp);
    var brandF = (0.5 + b.brand / 60) * M.buzzMult(b) * state.world.macro.consumer * state.diff.market;
    var ratingF = b.rating >= 4.7 ? 1.15 : b.rating >= 4.4 ? 1 : b.rating >= 4.0 ? 0.8 : 0.55;
    var csF = 1 - Math.min(0.35, (b.chat.backlog || 0) / 600);
    var season = [1.0, 0.95, 1.0, 1.08, 0.95, 0.95, 0.95, 1.0, 1.0, 1.05, 1.2, 1.3][info.month];
    var mkt = RW.Team.capOf(state, 'mkt');
    var adEff = (1 + Math.min(1, mkt * 0.3)) * (0.45 + 0.55 * b.creative) * RW.Engine.tm(state, 'mkt');
    var orders = {};
    ['market', 'social', 'web'].forEach(function (k) {
      var ch = b.ch[k];
      if (!ch.open) return;
      var org = c.organic[k] * brandF * (k === 'web' ? 1 + ch.seo / 50 : (1 + Math.log10(1 + ch.velocity) * 0.9) * (ch.rank / 5));
      if (k === 'social') org *= 1 + RW.Team.capOf(state, 'live') * 0.8 + ch.affiliate * 3;
      var paid = 0;
      if (ch.ads > 0) {
        L.spend(fin, 'mkt', ch.ads);
        st.adSpend += ch.ads;
        var cpc = c.cpc * Math.pow(1 + ch.ads / 120000, 0.55) / compF * (k === 'market' ? 0.85 : 1);
        paid = ch.ads / cpc * adEff;
      }
      var traffic = org + paid;
      var cvr = c.cvr[k] * attr * Math.pow(priceF, 0.8) * ratingF * csF * (k === 'web' ? 1 + (b.cod ? 0.25 : 0) : 1);
      if (k === 'market' && mega) cvr *= 1 + b.campaign.disc * 10;
      if (k === 'market' && preMega) cvr *= 0.85;
      if (k === 'market' && info.weekOfMonth === info.weeksInMonth - 1) cvr *= 1.15; // payday sale
      var n = R.poisson(traffic * cvr * season);
      orders[k] = n;
      ch.traffic = traffic;
      st.byCh[k] = { o: 0, r: 0, t: traffic };
    });
    // repeat orders from active customer base
    var crm = b.crm ? 1.35 : 1;
    var repeat = R.poisson(b.active * c.repeat * crm * U.clamp(attr, 0.5, 1.4) * ratingF);
    var repeatSplit = b.ch.web.open ? { web: 0.45, market: 0.45, social: 0.1 } : { market: 0.85, social: 0.15 };
    Object.keys(repeatSplit).forEach(function (k) { if (b.ch[k].open) orders[k] = (orders[k] || 0) + Math.round(repeat * repeatSplit[k]); });
    // fulfillment capacity
    var totalOrders = U.sum(Object.keys(orders), function (k) { return orders[k]; });
    var capF = M.fulfilCap(state);
    b.fulfil.cap = capF;
    var lateRatio = totalOrders + b.fulfil.backlog > capF ? (totalOrders + b.fulfil.backlog - capF) / Math.max(1, totalOrders + b.fulfil.backlog) : 0;
    b.fulfil.backlog = Math.max(0, b.fulfil.backlog + totalOrders - capF) * 0.5; // half cancel/ship late
    var chatCap = (RW.Team.capOf(state, 'chat') * 450 + 60);
    b.chat.backlog = Math.max(0, b.chat.backlog * 0.5 + totalOrders * 0.6 - chatCap);
    // allocate orders to SKUs by appeal, constrained by stock
    var weekRev = 0, newCust = 0;
    Object.keys(orders).forEach(function (k) {
      var n = orders[k];
      if (n <= 0) return;
      var ch = CHN[k];
      var revK = 0, units = 0, cogs = 0, ordersFilled = 0;
      for (var i = 0; i < n; i++) {
        var pool = b.skus.filter(function (s) { return s.active; });
        var pick = R.weighted(pool, function (s) { return s.appeal; });
        var sku = M.stock(pick) > 0 ? pick : (R.chance(0.35) ? R.weighted(pool.filter(function (s) { return M.stock(s) > 0; }), function (s) { return s.appeal; }) : null);
        if (!sku) { st.stockout++; pick.oos++; continue; }
        var u = Math.max(1, R.poisson(c.upo - 1) + 1);
        var tk = M.takeUnits(sku, u);
        if (tk.taken <= 0) { st.stockout++; continue; }
        var price = sku.price * (k === 'market' && mega ? 1 - b.campaign.disc : 1);
        revK += price * tk.taken; units += tk.taken; cogs += tk.cost; ordersFilled++;
        sku.sold += tk.taken; sku.week += tk.taken;
      }
      if (ordersFilled <= 0) return;
      var netRev = revK * vat;
      // cash collection by channel
      var feeRate = ch.fee + (k === 'market' ? b.feeAdj || 0 : 0) + ch.pay + (k === 'market' && mega ? 0.03 : 0) + (k === 'social' ? b.ch.social.affiliate * 0.5 : 0);
      var shipCost = ordersFilled * (c.ship + 8) * (k === 'web' && revK / ordersFilled > b.freeShip ? 1 : 0.55);
      var codShare = b.cod || k !== 'web' ? ch.cod : 0;
      var rto = R.binom(Math.round(ordersFilled * codShare), 0.09);
      var rtoCost = rto * (c.ship * 2 + 10);
      var rtoRev = rto / ordersFilled * netRev;
      var payoutRev = netRev - rtoRev;
      if (ch.payout > 0) L.invoice(state, 'rev_goods', payoutRev, state.time.w + ch.payout, { name: ch.n, seg: k, sure: true });
      else L.earnCash(fin, 'rev_goods', payoutRev);
      L.post(fin, { cogs_platform: payoutRev * feeRate, cash: -payoutRev * feeRate }, 'op');
      // goods returned by RTO go back to stock (approx: add cost back as a fresh lot on a random sku)
      var unitsKept = units * (1 - rto / ordersFilled);
      L.post(fin, { cogs_goods: cogs * (1 - rto / ordersFilled), inventory: -cogs * (1 - rto / ordersFilled) });
      if (rto > 0) { /* returned units restocked */ var anySku = b.skus.find(function (s) { return s.active; }); if (anySku) anySku.lots.push({ q: Math.round(units * rto / ordersFilled), c: cogs / units, exp: anySku.shelf ? w + Math.round(anySku.shelf / 2) : 0 }); }
      L.spend(fin, 'cogs_fulfil', shipCost + rtoCost + (b.fulfil.mode === '3pl' ? ordersFilled * 25 : 0));
      st.byCh[k].o += ordersFilled; st.byCh[k].r += payoutRev;
      st.orders += ordersFilled; st.units += unitsKept; st.gmv += revK; st.rev += payoutRev; st.rto = (st.rto || 0) + rto;
      weekRev += payoutRev;
      b.ch[k].orders = ordersFilled;
      if (b.ch[k].velocity != null) b.ch[k].velocity = b.ch[k].velocity * 0.85 + ordersFilled;
    });
    // retail channel
    if (b.ch.retail.open && b.ch.retail.stores > 0) M.retailWeekly(state, st, vat);
    // returns & refunds
    var retUnits = st.units * c.ret;
    if (retUnits > 0 && st.units > 0) {
      var refund = st.rev * c.ret;
      L.post(fin, { contra_rev: refund, cash: -refund }, 'op');
      st.returns = retUnits; st.rev -= refund; weekRev -= refund;
    }
    // customers
    newCust = Math.max(0, st.orders - repeat) * 0.85;
    b.customers += newCust; b.active += newCust;
    b.active *= 1 - U.weeklyFromMonthly(0.11);
    st.newCust = newCust;
    b.lifetime.orders += st.orders;
    // rating & ranking
    var quality = U.avg(listed, function (s) { return s.quality; });
    var target = 3.6 + quality / 100 * 1.3 - lateRatio * 1.2 - (b.chat.backlog > 300 ? 0.3 : 0) - (st.stockout > st.orders * 0.3 ? 0.1 : 0);
    b.rating = U.clamp(U.approach(b.rating, target, 0.05 + Math.min(0.1, st.orders / 5000)), 1, 5);
    b.quality = quality;
    ['market', 'social'].forEach(function (k) {
      var ch = b.ch[k];
      if (!ch.open) return;
      ch.reviews += (st.byCh[k] ? st.byCh[k].o : 0) * 0.08;
      ch.rating = b.rating;
      var rt = 3 + Math.log10(1 + ch.velocity) * 1.8 + (b.rating - 4.4) * 3 + Math.log10(1 + ch.reviews) * 0.6;
      ch.rank = U.clamp(U.approach(ch.rank, rt, 0.12), 1, 20);
    });
    b.ch.web.seo = Math.min(100, b.ch.web.seo * 0.995 + (b.ch.web.open ? RW.Team.capOf(state, 'content') * 0.3 + Math.log10(1 + b.customers) * 0.05 : 0));
    // brand
    b.brand = U.clamp(b.brand * 0.996 + st.adSpend / 1500000 + Math.log10(1 + st.orders) * 0.05 + (b.creative - 0.5) * 0.05, 0, 100);
    M.fixedWeekly(state);
    M.autoReplenish(state);
    b.skus.forEach(function (s) { s.avg = s.avg * 0.8 + s.week * 0.2; s.week = 0; if (s.appealSeen == null && s.sold > 50) s.appealSeen = s.appeal; });
    // month accumulators
    var ms = b.mstats;
    ['orders', 'newCust', 'gmv', 'rev', 'units', 'adSpend', 'stockout', 'returns'].forEach(function (k2) { ms[k2] += st[k2] || 0; });
    ms.rto += st.rto || 0;
    Object.keys(st.byCh).forEach(function (k3) { ms.byCh[k3].o += st.byCh[k3].o; ms.byCh[k3].r += st.byCh[k3].r; ms.byCh[k3].t += st.byCh[k3].t; });
    b.weekRev = weekRev;
  };

  M.fulfilCap = function (state) {
    var b = state.biz;
    if (b.fulfil.mode === '3pl') return 1e6;
    return RW.Team.capOf(state, 'fulfil') * 320 + RW.Team.capOf(state, 'ops') * 60 + 25;
  };

  M.retailWeekly = function (state, st, vat) {
    var b = state.biz, c = CONCEPTS[b.concept];
    var listed = b.skus.filter(function (s) { return s.active && s.retail; });
    var rev = 0;
    listed.forEach(function (sku) {
      var vel = 0.35 * sku.appeal * (0.5 + b.brand / 80) * state.world.macro.consumer;
      var units = R.poisson(b.ch.retail.stores * vel);
      var tk = M.takeUnits(sku, units);
      if (tk.taken < units) st.stockout += units - tk.taken;
      if (tk.taken <= 0) return;
      var wholesale = sku.price * 0.62 * tk.taken * vat;
      L.invoice(state, 'rev_goods', wholesale, state.time.w + 11, { name: 'ร้านค้าปลีก', seg: 'retail', wht: true });
      L.post(state.fin, { cogs_goods: tk.cost, inventory: -tk.cost });
      L.spend(state.fin, 'mkt', wholesale * 0.05); // trade promotion support
      sku.sold += tk.taken; sku.week += tk.taken;
      rev += wholesale;
    });
    st.byCh.retail = { o: 0, r: rev, t: 0 };
    st.rev += rev; st.gmv += rev;
  };

  M.fixedWeekly = function (state) {
    var b = state.biz;
    // storage cost for inventory
    var units = U.sum(b.skus, function (s) { return M.stock(s); });
    var storage = units * (b.fulfil.mode === '3pl' ? 0.6 : 0.25);
    if (storage > 0) L.spend(state.fin, 'cogs_fulfil', storage);
  };

  M.forecastWeekly = function (sku) { return Math.max(sku.avg, 1); };

  M.autoReplenish = function (state) {
    var b = state.biz;
    b.skus.forEach(function (s) {
      if (!s.active || !s.auto) return;
      var lead = CONCEPTS[b.concept].sup[s.autoSup || 'local'].lead[1];
      var have = M.stock(s) + M.incoming(b, s.id);
      var need = M.forecastWeekly(s) * (lead + s.cover);
      if (have < need * 0.75) {
        var r = M.placePO(state, s.id, need - have, s.autoSup || 'local', true);
        if (!r.ok) { s.auto = false; RW.Engine.mail(state, 'product', 'สั่งผลิตอัตโนมัติไม่สำเร็จ: ' + s.n, r.msg + ' — ปิดการสั่งอัตโนมัติไว้ก่อน', 'warn'); }
      }
    });
  };

  // ---------- Monthly ----------
  M.monthly = function (state, info) {
    var b = state.biz, fin = state.fin, w = state.time.w, c = CONCEPTS[b.concept];
    if (b.crm) L.spend(fin, 'software', 9000 + b.active * 0.4);
    if (b.ch.web.open) L.spend(fin, 'software', 3500);
    if (b.fulfil.mode === 'self' && RW.Team.capOf(state, 'fulfil') > 0.5) L.spend(fin, 'rent', 18000 + RW.Team.capOf(state, 'fulfil') * 4000);
    // expiry & trend decay
    var waste = 0;
    b.skus.forEach(function (s) {
      s.lots.forEach(function (l) {
        if (l.exp && l.exp <= w + 4 && l.q > 0) { waste += l.q * l.c; b.mstats.expired += l.q; l.q = 0; }
      });
      s.lots = s.lots.filter(function (l) { return l.q > 0; });
      if (c.decay && w - s.born > 12) s.appeal = Math.max(0.15, s.appeal * (1 - c.decay * 4.33));
    });
    if (waste > 0) {
      L.post(fin, { cogs_waste: waste, inventory: -waste });
      RW.Engine.mail(state, 'product', 'ตัดสต็อกสินค้าหมดอายุ ' + F.b(waste), 'สินค้าใกล้หมดอายุขายไม่ได้ ต้องทำลายทิ้ง — สั่งผลิตให้พอดีกับยอดขาย', 'warn');
    }
    // retail chains: monthly listing upkeep / rebate
    if (b.ch.retail.open) L.spend(fin, 'mkt', b.ch.retail.stores * 120);
    b.stats.push(b.mstats);
    if (b.stats.length > 24) b.stats.shift();
    b.mstats = M.blankStats();
  };

  // ---------- KPIs ----------
  M.kpis = function (state) {
    var b = state.biz;
    var last3 = U.last(b.stats, 3);
    var orders = U.sum(last3, function (m) { return m.orders; }), newC = U.sum(last3, function (m) { return m.newCust; });
    var gmv = U.sum(last3, function (m) { return m.gmv; }), ad = U.sum(last3, function (m) { return m.adSpend; });
    var rev = U.sum(last3, function (m) { return m.rev; });
    var sm = U.sum(U.last(state.hist.monthly, 3), function (m) { return (m.pl.mkt || 0) + (m.pl.sal_sm || 0) + (m.pl.commission || 0); });
    var inv = state.fin.bal.inventory;
    var cogsM = U.avg(U.last(state.hist.monthly, 3), function (m) { return m.pl.cogs_goods || 0; });
    var aov = orders > 0 ? gmv / orders : 0;
    var repeatShare = orders > 0 ? 1 - newC / orders : 0;
    var mo = b.stats.length ? b.stats[b.stats.length - 1] : null;
    var stockout = mo && mo.orders + mo.stockout > 0 ? mo.stockout / (mo.orders + mo.stockout) : 0;
    var c = CONCEPTS[b.concept];
    var gm = state.kpi && state.kpi.gm ? state.kpi.gm : 0.5;
    var cac = newC > 0 ? sm / newC : null;
    var ltv = aov * gm * (1 + c.repeat * 4.33 * 12 * 1.2);
    return {
      customers: Math.round(b.customers), activeCustomers: Math.round(b.active), orders3: orders, aov: aov, roas: ad > 0 ? rev / ad : null,
      cac: cac, ltv: ltv, ltvCac: cac ? ltv / cac : null, repeatShare: repeatShare, invDays: cogsM > 0 ? inv / cogsM * 30 : null, inventory: inv,
      stockout: stockout, rating: b.rating, marketShare: Math.min(0.5, rev / 3 / 30e6),
      workload: { cogs: 1 + Math.min(0.8, (b.fulfil.backlog || 0) / Math.max(50, b.fulfil.cap) + (b.chat.backlog || 0) / 800), sm: 1, rnd: 1 },
      arr: 0, mrr: 0
    };
  };
  M.monthKPIs = function (state) {
    var b = state.biz, mo = b.stats.length ? b.stats[b.stats.length - 1] : null;
    return { orders: mo ? mo.orders : 0, gmv: mo ? mo.gmv : 0, customers: Math.round(b.customers), inventory: state.fin.bal.inventory };
  };
  M.reportLine = function (state) {
    var k = state.kpi, mo = state.biz.stats.length ? state.biz.stats[state.biz.stats.length - 1] : null;
    return 'ออเดอร์ ' + F.num(mo ? mo.orders : 0) + ' · AOV ' + F.b(k.aov) + ' · ROAS ' + (k.roas ? k.roas.toFixed(1) + 'x' : '–') + ' · สต็อก ' + F.m(k.inventory) + (k.invDays ? ' (' + Math.round(k.invDays) + ' วัน)' : '') + ' · เรตติ้ง ' + state.biz.rating.toFixed(2);
  };
  M.forecastCost = function (state) {
    var b = state.biz;
    return (b.ch.market.ads + b.ch.social.ads + b.ch.web.ads) * 4.33;
  };
  M.forecastRevenue = function (state) { return state.kpi.revenueMonthly || 0; };
  M.rbfEligible = function (state) { return state.hist.monthly.length >= 6 && (state.kpi.revenueMonthly || 0) > 300000; };

  M.traction = function (state) {
    var b = state.biz, k = state.kpi;
    var revRun = (k.revenueMonthly || 0) * 12;
    var eq = revRun * (0.3 + 0.45 * U.clamp(k.repeatShare || 0, 0, 0.8)) * U.clamp((k.gm || 0.4) / 0.55, 0.5, 1.3);
    var prod = b.skus.length ? 5 + Math.min(5, b.skus.length) + (b.rating - 4) * 4 : (b.dev.length ? 3 : 0);
    var arrPts = 20 * Math.log10(1 + eq / 250000);
    var g = Math.pow(1 + (k.cmgr3 || 0), 12) - 1;
    var growthPts = U.clamp(11 * Math.log2(1 + Math.max(-0.5, g)), -15, 24) * Math.min(1, revRun / 3e6);
    var execs = RW.Team.active(state).filter(function (e) { return e.level >= 4; }).length + (state.cofounders || []).filter(function (c) { return c.active; }).length;
    var team = Math.min(8, execs * 1.5 + state.founder.rep / 12);
    var eff = revRun > 10e6 ? (k.ebitdaMargin > 0 ? 5 : k.burnMultiple > 4 ? -4 : 0) : 0;
    var invPenalty = k.invDays > 150 ? -5 : 0;
    var score = prod + arrPts + growthPts + team + eff + invPenalty + Math.min(6, b.brand / 10);
    return { score: score, arr: eq, growth: g, lines: [['รายได้ (annualized)', F.m(revRun)], ['การเติบโต', revRun > 0 ? F.spct(g, 0) : '–'], ['ซื้อซ้ำ', F.pct(k.repeatShare || 0, 0)], ['เรตติ้ง', b.rating.toFixed(2)], ['ลูกค้าสะสม', F.num(Math.round(b.customers))]] };
  };
  M.valuation = function (state) {
    var tr = M.traction(state);
    var qual = RW.Models.saas.qualValue(tr.score) * 0.75; // consumer brands trade below software on the same story
    var revRun = (state.kpi.revenueMonthly || 0) * 12;
    if (revRun <= 0) return qual;
    var g = U.clamp(tr.growth, 0, 3);
    var mult = (0.8 + 1.6 * Math.pow(g, 0.6)) * (0.7 + (state.kpi.repeatShare || 0)) * Math.sqrt(Math.max(0.2, state.kpi.gm || 0.4) / 0.55);
    var fund = revRun * mult;
    if (state.kpi.ebitdaMargin > 0.08) fund = Math.max(fund, revRun * state.kpi.ebitdaMargin * 12);
    var a = Math.sqrt(U.clamp(revRun / 60e6, 0, 1));
    return Math.exp(a * Math.log(fund) + (1 - a) * Math.log(qual));
  };

  M.advice = function (state) {
    var b = state.biz, out = [], k = state.kpi, c = CONCEPTS[b.concept];
    function add(l, t) { out.push({ lvl: l, t: t }); }

    b.skus.forEach(function (s) {
      if (!s.active) return;
      var st = M.stock(s), inc = M.incoming(b, s.id), f = M.forecastWeekly(s);
      var lead = c.sup.local.lead[1];

      else if (st < f * lead && inc === 0 && s.avg > 2) add('warn', s.n + ' สต็อกพอขายอีก ~' + Math.round(st / f) + ' สัปดาห์ แต่สั่งผลิตต้องรอ ' + lead + ' สัปดาห์');
      if (st > f * 30 && s.avg > 1) add('warn', s.n + ' สต็อกล้น (~' + Math.round(st / f) + ' สัปดาห์) — เงินจมและเสี่ยงหมดอายุ');
    });
    var nextMega = null;
    for (var i = 1; i <= 8; i++) if (M.isMega(w + i)) { nextMega = [i, M.isMega(w + i)[2]]; break; }
    if (nextMega && nextMega[0] >= 3) add('info', 'แคมเปญ ' + nextMega[1] + ' อีก ' + nextMega[0] + ' สัปดาห์ — ยอดขายมาร์เก็ตเพลสจะพุ่งหลายเท่า เตรียมสต็อกให้พอ');
    if (b.creative < 0.35 && b.skus.length) add('warn', 'ครีเอทีฟโฆษณาเก่า คนเห็นซ้ำจนเบื่อ (creative fatigue) — ต้นทุนโฆษณาแพงขึ้น จ้าง Content creator หรือใช้เวลาทำการตลาด');
    if (b.fulfil.backlog > 30) add('warn', 'แพ็กของไม่ทัน ออเดอร์ค้าง ' + Math.round(b.fulfil.backlog) + ' — เรตติ้งร้านจะตก จ้างพนักงานคลังหรือใช้ 3PL');
    if (b.chat.backlog > 200) add('warn', 'แชทลูกค้าค้างจำนวนมาก — อัตราการซื้อลดลง จ้างแอดมิน');
    if (b.rating < 4.2 && b.skus.length) add('warn', 'เรตติ้งร้าน ' + b.rating.toFixed(2) + ' — อันดับในมาร์เก็ตเพลสกำลังร่วง');
    if (k.roas != null && k.roas < 1.5 && (b.ch.market.ads + b.ch.social.ads + b.ch.web.ads) > 0) add('warn', 'ROAS ' + k.roas.toFixed(1) + 'x — โฆษณาขาดทุนหลังหักต้นทุนสินค้าและค่าธรรมเนียม');
    if (state.fin.vat.registered && !state.flags.vatRepriced) add('info', 'จด VAT แล้ว ราคาที่ลูกค้าจ่ายรวม VAT — ถ้าไม่ปรับราคา รายได้สุทธิหายไป 6.5%');
    return out;
  };

  M.onEmployeeLeft = function () { };

  M.blank = function () { return { covers: 0, deliv: 0, rev: 0, dineRev: 0, delivRev: 0, food: 0, labor: 0, lost: 0, royalty: 0 }; };
  M.welcome = function (state) {

  // ---------- Sites ----------
  M.scout = function (state, type) {

      sites.push({ id: R.id('st'), type: type, area: R.pick(area), sqm: sqm, rent: rent, foot: trueFoot, quoted: Math.round(quoted / 50) * 50, seats: Math.round(sqm * c.seatsPerSqm), fit: Math.round(sqm * c.fitSqm * L0.fit / 10000) * 10000 + (type === 'cloud' ? 250000 : 0) });

  M.openBranch = function (state, siteId, finance) {

    var st = b.sites.list.find(function (x) { return x.id === siteId; });
    if (!st) return { ok: false, msg: 'ทำเลนี้ถูกคนอื่นเช่าไปแล้ว' };
    var L0 = LOCS[st.type];

    var pre = 120000 + c.staff * 15000; // hiring, training, opening marketing

    if (partner && !M.partnerReady(state)) return { ok: false, msg: 'ยังไม่มีสาขาต้นแบบที่ทำกำไรต่อเนื่อง — หุ้นส่วนอยากเห็นตัวเลขจริงก่อนลงเงิน' };

    if (!state.company.registered) return { ok: false, msg: 'ต้องจดทะเบียนบริษัทก่อนเซ็นสัญญาเช่าและขอใบอนุญาต' };
    if (leased) L.addLoan(state, { kind: 'lease', name: 'เช่าซื้ออุปกรณ์ครัว ' + st.area, amount: leased, rate: state.world.macro.rate + 0.07, months: 36 });

    }

    L.buyAsset(state, 'ตกแต่งและครัว สาขา' + st.area, st.fit, Math.min(60, L0.lease * 1.5));
    var fid = state.fin.assets[state.fin.assets.length - 1].id;
    L.spend(state.fin, 'other_exp', pre);
    var br = {
      id: 'b' + (b.nextB++), n: M.uniqueName(b, (st.type === 'cloud' ? 'ครัว ' : 'สาขา ') + st.area), type: st.type, sqm: st.sqm, rent: st.rent, foot: st.foot, seats: st.seats,
      deposit: deposit, fitId: fid, fit: st.fit, leaseEnd: state.time.w + Math.round(L0.lease * 4.33), state: 'building', ready: state.time.w + R.int(6, 10) + (state.flags.fastPermit ? -2 : 0), opened: null,
      mgr: null, staff: st.type === 'cloud' ? Math.ceil(c.staff * 0.5) : c.staff, staffSkill: 45, rating: 0, reviews: 0, ms: M.blank(), last: null, util: 0,

    };

    return { ok: true, msg: 'เซ็นสัญญาเช่า ' + br.n + ' — ตกแต่งและขอใบอนุญาต ~' + (br.ready - state.time.w) + ' สัปดาห์ (จ่ายแล้ว ' + F.b(need) + (leased ? ' · เช่าซื้ออุปกรณ์ ' + F.b(leased) + ' ผ่อน 36 เดือน' : '') + (pIn ? ' · หุ้นส่วนออก ' + F.b(pIn) + ' แลกส่วนแบ่งกำไรสาขา ' + F.pct(M.PARTNER.share, 0) : '') + ')' };
  };

  M.closeBranch = function (state, id) {

  };

  M.openBranches = function (b) { return b.branches.filter(function (x) { return x.state === 'open'; }); };

  // ---------- Weekly ----------
  M.buzzMult = function (b) { var m = 1; b.buzz.forEach(function (x) { m *= 1 + (x.m - 1) * (x.weeks / x.total); }); return m; };
  M.season = function (info, type) {
    var m = info.month;
    var dine = [1.0, 0.98, 1.0, 0.92, 0.98, 0.94, 0.92, 0.95, 0.92, 0.95, 1.02, 1.12][m];
    var del = [1.0, 1.0, 1.0, 1.0, 1.05, 1.1, 1.12, 1.12, 1.12, 1.08, 1.0, 1.05][m];

  M.mgrQuality = function (state, br) {
    var b = state.biz;
    if (br.mgr) { var e = RW.Team.find(state, br.mgr); if (e && !e.gone && e.startW <= state.time.w) return U.clamp(e.skill * (0.7 + e.morale / 330), 20, 98); br.mgr = null; }
    // founder can run one or two shops personally

  };

  M.weekly = function (state, info) {
    var b = state.biz, c = CONCEPTS[b.concept], fin = state.fin, w = state.time.w;
    b.buzz.forEach(function (x) { x.weeks--; });
    b.buzz = b.buzz.filter(function (x) { return x.weeks > 0; });
    b.insight = U.clamp(b.insight + RW.Team.capOf(state, 'discovery') * 4 * (1 - b.insight / 110), 0, 100);
    // menu R&D project
    if (b.menuProj) {
      b.menuProj.prog += (RW.Team.capOf(state, 'menu') + 0.15) * RW.Engine.tm(state, 'dev');
      if (b.menuProj.prog >= b.menuProj.need) {
        var gain = R.range(4, 10) * (1 + b.insight / 150);
        b.menuQ = U.clamp(b.menuQ + gain, 0, 98);
        b.buzz.push({ m: 1.15, weeks: 4, total: 4 });
        RW.Engine.mail(state, 'product', 'เปิดตัวเมนูใหม่', 'คุณภาพเมนู +' + gain.toFixed(1) + ' → ' + Math.round(b.menuQ) + ' · ลูกค้าเก่ากลับมาลอง', 'good');
