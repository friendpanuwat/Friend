<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Display";src:url(fonts/Anuphan-VF.ttf);font-weight:100 700}
@font-face{font-family:"Body";src:url(fonts/IBMPlexSansThai-Light.ttf);font-weight:300}
@font-face{font-family:"Body";src:url(fonts/IBMPlexSansThai-Regular.ttf);font-weight:400}
@font-face{font-family:"Body";src:url(fonts/IBMPlexSansThai-Medium.ttf);font-weight:500}
@font-face{font-family:"Body";src:url(fonts/IBMPlexSansThai-SemiBold.ttf);font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:__H__px;overflow:hidden;background:#000}
body{position:relative;font-family:"Body",sans-serif;-webkit-font-smoothing:antialiased}
.layer{position:absolute;inset:0}
/* every colour comes from the slide's tone (dark | light | accent) — set from the theme at load */
.card{position:absolute;inset:0;overflow:hidden;opacity:0;background:var(--bg);color:var(--fg)}
.stage{position:absolute;inset:0}
.tex{position:absolute;inset:0;pointer-events:none}

/* ---------- type ---------- */
.ttl{position:absolute;font-family:"Display";color:var(--fg);letter-spacing:-.025em}
.ttl .tl{display:block;white-space:nowrap;opacity:0}
.ttl.wrap .tl{white-space:normal}
.ttl .ac{color:var(--acc-text)}
.ttl .hb{color:var(--acc-ink);background-image:linear-gradient(var(--acc),var(--acc));background-repeat:no-repeat;background-size:0% 100%;padding:.08em .14em .04em;margin:0 .02em;border-radius:var(--r-s);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.ttl .ci,.ttl .ul,.ttl .st{position:relative;display:inline-block}
.ttl svg.deco{position:absolute;overflow:visible;pointer-events:none}
.bdy{position:absolute;font-family:"Body";font-weight:400;color:var(--muted);line-height:1.5}
.bdy p{opacity:0}.bdy p+p{margin-top:.55em}
.bdy b{font-weight:600;color:var(--fg)}.bdy .ac{color:var(--acc-text);font-weight:500}
.num{position:absolute;font-family:"Display";color:var(--fg);letter-spacing:-.045em;line-height:.92;white-space:nowrap;opacity:0;font-variant-numeric:tabular-nums}
.num .ac{color:var(--acc-text)}
.tag{position:absolute;display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 22px 2px;border-radius:999px;font-family:"Body";font-weight:500;font-size:24px;letter-spacing:.02em;white-space:nowrap;opacity:0;
  color:var(--fg);border:1.5px solid var(--line);background:var(--surface)}
.tag.solid{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.tag.soft{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc-text);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
.tag .dt{width:10px;height:10px;border-radius:50%;background:var(--acc)}
.cta{position:absolute;display:inline-flex;align-items:center;gap:16px;height:86px;padding:0 34px 2px 40px;border-radius:999px;font-family:"Display";font-weight:600;font-size:34px;white-space:nowrap;opacity:0;background:var(--acc);color:var(--acc-ink)}
.cta.outline{background:transparent;color:var(--fg);border:2px solid var(--fg)}
.cta .ib{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;background:var(--acc-ink);color:var(--acc)}
.cta.outline .ib{background:var(--acc);color:var(--acc-ink)}
.chrome{position:absolute;font-family:"Body";font-weight:500;font-size:24px;color:var(--muted);letter-spacing:.02em;white-space:nowrap;display:flex;align-items:center;gap:12px}
.chrome .lg{width:30px;height:30px;border-radius:9px;background:var(--acc);color:var(--acc-ink);display:flex;align-items:center;justify-content:center;font-family:"Display";font-weight:700;font-size:19px}

/* ---------- surfaces ---------- */
.box{position:absolute;overflow:hidden;opacity:0;border-radius:var(--r)}
.box.glass{background:linear-gradient(160deg,color-mix(in srgb,var(--fg) 11%,transparent),color-mix(in srgb,var(--fg) 3%,transparent));border:1.5px solid color-mix(in srgb,var(--fg) 14%,transparent);backdrop-filter:blur(20px);box-shadow:0 40px 80px rgba(0,0,0,.35),inset 0 1px 0 color-mix(in srgb,var(--fg) 18%,transparent)}
.box.solid{background:var(--bg2);box-shadow:0 30px 70px rgba(0,0,0,.22);border:1px solid var(--line)}
.box.outline{background:transparent;border:2px solid var(--line)}
.box.accent{background:var(--acc);color:var(--acc-ink);box-shadow:0 30px 70px color-mix(in srgb,var(--acc) 30%,transparent)}
.box.paper{background:#fff;color:#111;box-shadow:0 30px 70px rgba(0,0,0,.25)}
.ico{position:absolute;opacity:0}
.ico .in{display:flex;align-items:center;justify-content:center;border-radius:calc(var(--r) * .8 + 6px)}
.ico .glass{background:linear-gradient(160deg,color-mix(in srgb,var(--fg) 14%,transparent),color-mix(in srgb,var(--fg) 4%,transparent));border:1.5px solid color-mix(in srgb,var(--fg) 16%,transparent);box-shadow:0 24px 50px rgba(0,0,0,.35),inset 0 1px 0 color-mix(in srgb,var(--fg) 20%,transparent)}
.ico .accent{background:var(--acc);box-shadow:0 20px 50px color-mix(in srgb,var(--acc) 40%,transparent)}
.ico .solid{background:var(--bg2);border:1px solid var(--line);box-shadow:0 20px 44px rgba(0,0,0,.2)}
.ico .outline{border:2px solid var(--line)}
.chip{position:absolute;display:inline-flex;align-items:center;gap:10px;height:56px;padding:0 24px 2px 18px;border-radius:999px;font-family:"Body";font-weight:500;font-size:26px;white-space:nowrap;opacity:0;
  background:var(--surface);color:var(--fg);border:1.5px solid var(--line)}
.chip.accent{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.chip.ink{background:var(--fg);color:var(--bg);border-color:transparent}
.sk{position:relative;border-radius:99px;background:color-mix(in srgb,var(--fg) 12%,transparent);transform-origin:0 50%}
.tg{position:absolute;border-radius:99px;opacity:0}
.tg .k{position:absolute;top:6px;left:6px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.ntf{position:absolute;display:flex;align-items:center;gap:20px;padding:20px 30px 20px 20px;border-radius:calc(var(--r) * .7 + 8px);opacity:0;white-space:nowrap}
.ntf .ni{flex:none;width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:var(--acc);color:var(--acc-ink)}
.ntf .nt{font-family:"Body";font-weight:600;font-size:27px;color:var(--fg);line-height:1.25}
.ntf .ns{font-family:"Body";font-weight:400;font-size:22px;color:var(--muted);line-height:1.3}
.lst{position:absolute;display:flex;flex-direction:column}
.lst .it{display:flex;align-items:center;gap:22px;opacity:0}
.lst .bx{flex:none;display:flex;align-items:center;justify-content:center;border-radius:14px}
.lst .tx{font-family:"Body";font-weight:500;color:var(--fg);line-height:1.3}
.lst .nn{font-family:"Display";font-weight:600;color:var(--acc-text);letter-spacing:-.02em}
</style></head>
<body>
<div class="layer" id="g"></div>
<script>
/* ===================== CORE =====================
   A deck = slides laid end to end on one timeline. Every helper takes SLIDE-LOCAL seconds (slide() sets OFF, A()/sfx() add it).
   PNG = the slide's settled end state; MP4 = the slide played 0 → dur. Time-driven → seekable and deterministic. */
const W = 1080, H = __H__, THEME = __THEME__, BRAND = __BRAND__;
const G = document.getElementById('g');
const SFX = [], HOOKS = [], FITS = [], ANIMS = [], SLIDES = [], FINAL = [];
let OFF = 0, UID = 0;
const ms = s => s * 1000;
const sfx = (s, t, db = -14, pitch) => SFX.push(pitch ? {s, t: t + OFF, db, pitch} : {s, t: t + OFF, db});
const SPRING = 'cubic-bezier(.22,1.3,.36,1)', SMOOTH = 'cubic-bezier(.2,.8,.2,1)', INOUT = 'cubic-bezier(.65,0,.35,1)', BOUNCE = 'cubic-bezier(.34,1.56,.64,1)';
const A = (el, kf, t, d, o = {}) => { const a = el.animate(kf, {delay: ms(t + OFF), duration: ms(d), easing: o.e ?? SMOOTH, fill: o.f ?? 'both', iterations: o.it ?? 1, direction: o.dir ?? 'normal'}); a.idle = !!o.idle; ANIMS.push(a); return a; };
const div = (css, parent, html = '') => { const d = document.createElement('div'); d.style.cssText = 'position:absolute;' + css; d.innerHTML = html; parent.appendChild(d); return d; };
const visible = (el, t0, t1) => A(el, [{opacity: 1}, {opacity: 1}], t0, t1 - t0, {f: 'none', e: 'linear'});
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const ACC = THEME.accent, NEG = THEME.neg;
const css = n => `var(--${n})`;

/* tone variables: dark | light | accent */
(() => {
  const r = THEME.radius ?? 28, tone = (name, o) => `.t-${name}{--bg:${o.bg};--bg2:${o.bg2};--fg:${o.fg};--muted:${o.muted};--surface:${o.surface};--line:${o.line};--acc:${THEME.accent};--acc-ink:${THEME.accent_ink};--acc-text:${o.acc_text};--neg:${THEME.neg};--r:${r}px;--r-s:${Math.max(4, Math.round(r * .35))}px}`;
  const st = document.createElement('style');
  st.textContent = tone('dark', {...THEME.dark, acc_text: THEME.accent}) + tone('light', {...THEME.light, acc_text: THEME.accent_on_light}) +
    tone('accent', {bg: THEME.accent, bg2: `color-mix(in srgb,${THEME.accent_ink} 10%,${THEME.accent})`, fg: THEME.accent_ink, muted: `color-mix(in srgb,${THEME.accent_ink} 70%,transparent)`,
      surface: `color-mix(in srgb,${THEME.accent_ink} 8%,transparent)`, line: `color-mix(in srgb,${THEME.accent_ink} 22%,transparent)`, acc_text: THEME.accent_ink}) +
    `.t-accent{--acc:${THEME.accent_ink};--acc-ink:${THEME.accent}}`;
  document.head.appendChild(st);
})();

/* ===================== SLIDES ===================== */
/* slide({tone, dur, still, chrome, arrow, texture, glow, bg}, s => {...})
   tone: 'dark' | 'light' | 'accent' · texture: theme default ('grain'|'grid'|'paper'|'leak'|'dots'|'none') · glow: false to switch off the theme glow
   chrome: false hides handle + page number · arrow: swipe button bottom-right (default: every slide but the last) */
function slide(o, build) {
  if (typeof o === 'function') [o, build] = [{}, o];
  const {tone = 'dark', dur = 3.5, still, sound, db = -24, chrome = true, arrow, texture = THEME.texture, glow = THEME.glow, bg} = o;
  const n = SLIDES.length + 1, T0 = SLIDES.reduce((s, x) => s + x.dur, 0);
  OFF = T0;
  const root = div('inset:0', G); root.className = `card t-${tone}`; if (bg) root.style.background = bg;
  visible(root, 0, dur);
  backdrop(root, tone, texture, glow, n);
  const st = div('inset:0', root); st.className = 'stage';
  A(st, [{transform: 'scale(1.03)'}, {transform: 'scale(1)'}], 0, .45, {e: SMOOTH});
  if (sound !== null) sfx(sound ?? (tone === 'dark' ? 'whoosh' : 'swipe'), 0, db);
  Object.assign(st, {t0: 0, t1: dur, n, tone, root});
  if (chrome) FINAL.push(() => chromeOf(root, n, arrow ?? n < SLIDES.length));
  try { build(st); } finally { OFF = 0; }
  SLIDES.push({n, t0: T0, dur, still: Math.min(dur - .02, still ?? dur - .02)});
  return st;
}
/* theme texture + glow behind the stage (static: identical in PNG and MP4) */
function backdrop(root, tone, texture, glow, n) {
  const seed = (n * 37) % 100 / 100;
  if (glow === true && tone === 'dark') {
    div(`left:${-260 + seed * 300}px;top:${-320 + seed * 120}px;width:1000px;height:1000px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 19%,transparent),transparent 62%);filter:blur(30px)`, root).className = 'tex';
    div(`right:${-380 + seed * 200}px;bottom:${-420 + seed * 100}px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 10%,transparent),transparent 60%);filter:blur(40px)`, root).className = 'tex';
  }
  if (glow === 'blob' && tone !== 'accent') {   // corner blobs only — the middle stays clear for text
    const corner = [[W + 40, -80], [W + 60, H + 40], [-60, H + 60], [W + 40, H * .45]][n % 4];
    blob(root, corner[0], corner[1], {r: 560, o: tone === 'dark' ? .95 : .85});
  }
  if (texture === 'grid') div(`inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:72px 72px;-webkit-mask-image:radial-gradient(ellipse 75% 65% at 50% 45%,#000 20%,transparent 80%);opacity:.7`, root).className = 'tex';
  if (texture === 'paper' && tone === 'accent') div(`inset:0;background-image:linear-gradient(rgba(255,255,255,.14) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(255,255,255,.14) 1.5px,transparent 1.5px);background-size:44px 44px`, root).className = 'tex';
  if (texture === 'dots') div(`inset:0;background-image:radial-gradient(var(--line) 2px,transparent 2.4px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 45%,#000,transparent 85%)`, root).className = 'tex';
  if (texture === 'leak' && tone !== 'accent') div(`left:-300px;top:-500px;width:1500px;height:900px;transform:rotate(-24deg);background:linear-gradient(180deg,transparent,${tone === 'light' ? 'rgba(255,255,255,.95)' : 'rgba(255,255,255,.07)'} 50%,transparent);filter:blur(50px)`, root).className = 'tex';
  if (texture === 'grain' || glow === 'blob') FINAL.push(() => { const g = div(`inset:0;background-image:url("${GRAIN}");background-size:260px;mix-blend-mode:overlay;opacity:${tone === 'light' ? .35 : .5}`, root); g.className = 'tex'; root.insertBefore(g, root.querySelector('.stage')); });
}
const GRAIN = `data:image/svg+xml;utf8,${encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.4 -.2'/></filter><rect width='100%' height='100%' filter='url(#n)'/></svg>")}`;
/* grainy gradient blob (cobalt look) — also usable on any slide */
function blob(parent, x, y, {r = 560, o = .9, color = css('acc'), inner = 'transparent'} = {}) {
  const b = div(`left:${x - r}px;top:${y - r}px;width:${2 * r}px;height:${2 * r}px;border-radius:50%;background:radial-gradient(circle at 50% 50%,${inner} 0%,${color} 38%,color-mix(in srgb,${color} 40%,transparent) 58%,transparent 72%);filter:blur(24px);opacity:${o}`, parent);
  b.className = 'tex'; return b;
}
function chromeOf(root, n, arrow) {
  const name = BRAND.handle || BRAND.name;
  if (name) div('left:60px;top:48px', root, (BRAND.logo ? `<span class="lg">${esc(BRAND.logo)}</span>` : '') + esc(name)).className = 'chrome';
  div('right:60px;top:48px', root, `${String(n).padStart(2, '0')} / ${String(SLIDES.length).padStart(2, '0')}`).className = 'chrome';
  if (arrow) { const a = div(`right:56px;bottom:52px;width:76px;height:76px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--fg)`, root, ico('arrow-right', 36, 'currentColor', 2)); a.className = 'chrome-arrow'; }
}

/* ===================== TEXT ===================== */
/* title(s, 'line one\nline [accent] {highlight} ((circled)) __underlined__ ~struck~', t, 'left:80px;top:300px', {size, weight, W, align, lh, step, wrap})
   lines appear one by one (fade-up out of a blur); decorations draw right after their line */
function title(c, text, t, pos, {size = 92, weight = THEME.title_weight ?? 600, W: Wd = 920, align = 'left', lh = 1.14, step = .12, wrap = false, color} = {}) {
  const el = div(`${pos};width:${Wd}px;font-size:${size}px;font-weight:${weight};line-height:${lh};text-align:${align}${color ? ';color:' + color : ''}`, c);
  el.className = 'ttl' + (wrap ? ' wrap' : '');
  text.split('\n').forEach((line, k) => {
    const L = document.createElement('span'); L.className = 'tl'; el.appendChild(L);
    L.innerHTML = esc(line)
      .replace(/\[([^\]]+)\]/g, '<span class="ac">$1</span>')
      .replace(/\{([^}]+)\}/g, '<span class="hb">$1</span>')
      .replace(/\(\(([^)]+)\)\)/g, '<span class="ci">$1</span>')
      .replace(/__([^_]+)__/g, '<span class="ul">$1</span>')
      .replace(/~([^~]+)~/g, '<span class="st">$1</span>');
    const tl = t + k * step;
    A(L, [{opacity: 0, transform: 'translateY(26px)', filter: 'blur(8px)'}, {opacity: 1, transform: 'none', filter: 'blur(0)'}], tl, .42, {e: SMOOTH});
    L.querySelectorAll('.hb').forEach(h => A(h, [{backgroundSize: '0% 100%'}, {backgroundSize: '100% 100%'}], tl + .25, .35, {e: INOUT}));
    L.querySelectorAll('.ci').forEach(h => { const s = decoSvg(h, 'M8 24 C10 6 88 2 96 18 C102 32 40 42 14 34 C2 30 4 16 26 8', '-12%', '124%', '178%', '-36%'); draw(s.querySelector('path'), tl + .45, .5); sfx('swipe', tl + .45, -26); });
    L.querySelectorAll('.ul').forEach(h => { const s = decoSvg(h, 'M2 9 Q 40 2 98 6', '0', '100%', '22%', '86%'); draw(s.querySelector('path'), tl + .4, .4); });
    L.querySelectorAll('.st').forEach(h => { const s = decoSvg(h, 'M2 21 L98 19', '-3%', '106%', '30%', '38%', 'var(--neg)'); draw(s.querySelector('path'), tl + .5, .25); sfx('swipe', tl + .5, -24); });
  });
  return el;
}
/* decoration drawn around/under/through a word. Path authored in a 100×40 box, rescaled to the word's real size once fonts are in */
function decoSvg(host, d, left, w, h, top, stroke = 'var(--acc-text)') {
  host.insertAdjacentHTML('beforeend', `<svg class="deco" viewBox="0 0 100 40" style="left:${left};top:${top};width:${w};height:${h}"><path d="${d}" fill="none" stroke="${stroke}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>`);
  const s = host.lastElementChild, p = s.querySelector('path');
  FITS.push(() => { const bw = s.getBoundingClientRect().width, bh = s.getBoundingClientRect().height; if (!bw) return;
    let k = 0; p.setAttribute('d', d.replace(/-?\d+(\.\d+)?/g, v => (k++ % 2 ? v * bh / 40 : v * bw / 100).toFixed(1)));
    s.setAttribute('viewBox', `0 0 ${bw.toFixed(1)} ${bh.toFixed(1)}`); p.setAttribute('stroke-width', Math.max(4, Math.min(9, bh * .05))); });
  return s;
}
/* body copy (wraps). '\n\n' = new paragraph (fades in after the previous) · **bold** · [accent] */
function body(c, text, t, pos, {size = 34, W: Wd = 820, align = 'left', step = .14, color} = {}) {
  const el = div(`${pos};width:${Wd}px;font-size:${size}px;text-align:${align}${color ? ';color:' + color : ''}`, c); el.className = 'bdy';
  text.split(/\n\s*\n/).forEach((p, k) => {
    const e = document.createElement('p'); el.appendChild(e);
    e.innerHTML = esc(p.trim()).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\[([^\]]+)\]/g, '<span class="ac">$1</span>').replace(/\n/g, '<br>');
    A(e, [{opacity: 0, transform: 'translateY(16px)'}, {opacity: 1, transform: 'none'}], t + k * step, .4, {e: SMOOTH});
  });
  return el;
}
/* giant number / stat. text like '99.99%', '$18B+', '5M+', '01', '1,250 บาท'. [x] = accent part. count: digits roll up in the MP4 */
function num(c, text, t, pos, {size = 260, weight = THEME.num_weight ?? 300, count = true, d = 1.1, color} = {}) {
  const el = div(`${pos};font-size:${size}px;font-weight:${weight}${color ? ';color:' + color : ''}`, c); el.className = 'num';
  const html = v => esc(v).replace(/\[([^\]]+)\]/g, '<span class="ac">$1</span>');
  el.innerHTML = html(text);
  A(el, [{opacity: 0, transform: 'translateY(30px)', filter: 'blur(10px)'}, {opacity: 1, transform: 'none', filter: 'blur(0)'}], t, .5, {e: SMOOTH});
  const m = text.match(/\d[\d,]*(\.\d+)?/);
  if (count && m) {
    const target = parseFloat(m[0].replace(/,/g, '')), dec = (m[1] || '').length - (m[1] ? 1 : 0), comma = m[0].includes(','), T0 = t + OFF;
    const fmt = v => { let s = v.toFixed(Math.max(0, dec)); if (comma) s = s.replace(/\B(?=(\d{3})+(?!\d))/g, ','); return m[0].startsWith('0') && !m[0].includes('.') ? s.padStart(m[0].length, '0') : s; };
    let last = '';
    HOOKS.push(tt => { const p = Math.max(0, Math.min(1, (tt - T0) / d)), v = target * (1 - Math.pow(1 - p, 3)); const s = html(text.replace(m[0], fmt(v))); if (s !== last) { el.innerHTML = s; last = s; } });
  }
  return el;
}
function tag(c, text, t, pos, {style = 'outline', dot = false, icon} = {}) {
  const el = div(pos, c, (dot ? '<span class="dt"></span>' : '') + (icon ? ico(icon, 26, 'currentColor', 2) : '') + esc(text));
  el.className = 'tag' + (style === 'outline' ? '' : ' ' + style);
  A(el, [{opacity: 0, transform: 'translateY(-14px)'}, {opacity: 1, transform: 'none'}], t, .35, {e: SMOOTH});
  return el;
}
function cta(c, text, t, pos, {icon = 'arrow-up-right', style = 'solid'} = {}) {
  const el = div(pos, c, esc(text) + (icon ? `<span class="ib">${ico(icon, 30, 'currentColor', 2.4)}</span>` : ''));
  el.className = 'cta' + (style === 'outline' ? ' outline' : '');
  A(el, [{opacity: 0, transform: 'translateY(30px) scale(.94)'}, {opacity: 1, transform: 'none'}], t, .45, {e: SPRING});
  sfx('pop', t, -26);
  return el;
}
