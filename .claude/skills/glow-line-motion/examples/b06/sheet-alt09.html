<!doctype html>
<html><head><meta charset="utf-8"><title>B06 design 09 options</title>
<script src="../../assets/glowline.js"></script><script src="b06.js"></script></head>
<body><script>
/* three replacement options for B06 design 09 (rows A / B / C) × four kinds of data (columns) */
GL.run(() => {
  GL.stage();
  const B = GL.cats.B06, I = (icon, label) => ({ icon, label });
  const DATA = [{ t: 'มีแค่สิ่งที่สงสัย', d: { about: I('store', 'ร้านเงียบ') } }, { t: 'สองตัวเลือก', d: { options: [I('ship', 'ทะเล'), I('mountain', 'ภูเขา')] } },
    { t: 'ตัวเลือก + คำตอบ', d: { options: [I('bus', 'รถเมล์'), I('train-front', 'รถไฟ')], answer: I('train-front', 'รถไฟ') } }, { t: 'สิ่งที่สงสัย + คำตอบ', d: { about: I('car', 'รถเสีย'), answer: I('battery-low', 'แบตหมด') } }];
  GL.text('B06 · แบบ 09 ใหม่ · เลือก A / B / C', { y: 70, size: 44, ls: 2, color: GL.C.kicker, glow: false });
  const top = 170, cw = GL.W / 4, rh = (GL.H - top - 20) / 3, s = .27;
  DATA.forEach((col, j) => GL.text(col.t, { x: (j + .5) * cw, y: top, size: 22, weight: 700, color: GL.C.sub, glow: false, maxW: cw - 12 }));
  B.ALT09.forEach((v, r) => { const y0 = top + 30 + r * rh;
    DATA.forEach((col, j) => B.drawAlt(B.ALT09, r, col.d, { x: (j + .5) * cw, y: y0 + 700 * s / 2 + 20, s, at: .3 + j * .04 }));
    GL.text('ABC'[r] + ' · ' + v.th, { x: GL.W / 2, y: y0 + 700 * s + 85, size: 34, weight: 700, color: GL.C.ink, glow: false }); });
  GL.finish({ hold: 2.4, out: true, stagger: .02 });
});
</script></body></html>
