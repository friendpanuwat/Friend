<!doctype html>
<html><head><meta charset="utf-8"><title>B08S size 4</title>
<script src="../../assets/glowline.js"></script><script src="b08s.js"></script></head>
<body><script>
/* B08S size 4 — 5 designs (all 7 sizes at once, straight to video), PER designs a page. Each row = one design, each column = one line of data,
   labelled with what the data holds (lesson 31). Yellow = the size's box at 100 % (scaled s); FRAME = false for the video. */
GL.run(() => {
  GL.stage();
  const FRAME = true, PAGE = 1, PER = 3, K = 4, SET = 'A', s = .6, B = GL.cats.B08S, S = B.SIZES[K], list = B.S[K], I0 = (PAGE - 1) * PER;
  const COLS = { A: [0, 1, 2], B: [0, 1, 2], C: [3, 4, 5], D: [6, 7, 8] }[SET], data = SET === 'A' ? B.SAMPLES : B.STRESS;
  const HEAD = SET === 'A' ? ['มีคนไปถึง (who)', 'ไม่มี who (จุดแสงเดินทางแทน)', 'ไม่มีคำ · who เป็นกลุ่มคน'] : COLS.map(i => data[i].say);
  GL.text('B08 ขนาด ' + K + ' · ' + S.th + ' ' + S.w + '×' + S.h + ' · แบบ ' + String(I0 + 1).padStart(2, '0') + '–' + String(Math.min(list.length, I0 + PER)).padStart(2, '0'), { y: 66, size: 40, ls: 3, color: GL.C.kicker, glow: false });
  GL.text('แถว = แบบ · คอลัมน์ = ข้อมูลคนละแบบ', { y: 106, size: 26, weight: 500, color: GL.C.sub, glow: false });
  const w = S.w * s, h = S.h * s, rowH = h + 94, X = [180, 540, 900];
  HEAD.forEach((t, j) => GL.text(t, { x: X[j], y: 146, size: 24, weight: 700, color: GL.C.kicker, glow: false, maxW: 340 }));
  list.forEach((v, i) => { if (i < I0 || i >= I0 + PER) return; const y0 = 172 + (i - I0) * rowH, cy = y0 + h / 2;
    GL.text(String(i + 1).padStart(2, '0') + ' ' + v.th, { x: 540, y: y0 + h + 36, size: 28, weight: 700, color: GL.C.ink, glow: false });
    COLS.forEach((di, j) => { const x = X[j], d = data[di];
      if (FRAME) B.frame({ x, y: cy, s }, S.w, S.h); B.drawS(K, i, d, { x, y: cy, s, at: .3, hit: 1.6 });
      GL.text('“' + d.say + '”', { x, y: y0 + h + 68, size: 16, weight: 500, color: GL.C.mute, glow: false, maxW: w }); }); });
  GL.finish({ hold: 2.4, out: true, stagger: .02 });
});
</script></body></html>
