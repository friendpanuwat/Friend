<!doctype html>
<html><head><meta charset="utf-8"><title>B08 redesign options</title>
<script src="../../assets/glowline.js"></script><script src="b08.js"></script></head>
<body><script>
/* B08 redesign options (user: "10, 20 design ใหม่") — each design: a row with the sample data and a row with stress data, options A B C */
GL.run(() => {
  GL.stage();
  const B = GL.cats.B08;
  GL.text('B08 · แบบใหม่ 10 · 20', { y: 70, size: 46, ls: 3, color: GL.C.kicker, glow: false });
  GL.text('แต่ละแบบ 3 ทาง (A / B / C) · แถวบน = ข้อมูลตัวอย่าง · แถวล่าง = ข้อมูลโหด', { y: 118, size: 28, weight: 500, color: GL.C.sub, glow: false });
  const top = 160, rh = 420, s = .32; let r = 0;
  [10, 20].forEach(n => [B.SAMPLES[n - 1], B.STRESS[n - 1]].forEach(d => {
    B.ALT[n].forEach((o, k) => { const x = (k + .5) * GL.W / 3, y0 = top + r * rh, cy = y0 + 700 * s / 2 + 4;
      B.drawAlt(n, k, d, { x, y: cy, s, at: .3 + (r * 3 + k) * .03, hit: 1.9 });
      GL.text(String(n).padStart(2, '0') + ' ' + 'ABC'[k] + ' · ' + o.th, { x, y: y0 + 700 * s + 34, size: 22, weight: 700, color: GL.C.ink, glow: false });
      GL.text('“' + d.say + '”', { x, y: y0 + 700 * s + 60, size: 18, weight: 500, color: GL.C.mute, glow: false, maxW: GL.W / 3 - 20 }); });
    r++; }));
  GL.finish({ hold: 2.4, out: true, stagger: .02 });
});
</script></body></html>
