<!doctype html>
<html><head><meta charset="utf-8"><title>glow-line scene</title>
<script src="../assets/glowline.js"></script></head>
<body><script>
/* showcase — one product drawn large (flat front view), callout lines name its features one by one.
   Callout x, y use the same coordinates the product was drawn with. box = how big the drawing is. */
GL.run(() => {
  GL.stage();
  const { kit, C } = GL;
  const top = GL.title({ kicker: 'MEET THE', main: 'TUMBLER' });
  GL.showcase({
    box: [240, 580],
    draw: p => {
      p.tube('M -32 -244 Q -32 -290 0 -290 Q 32 -290 32 -244', 16, { dur: .35 });            // carry loop
      p.rect(-62, -250, 124, 70, { rx: 16, fill: C.fill, at: .15, dur: .4 });                // lid
      p.rect(-72, -184, 144, 20, { rx: 6, fill: C.fill, at: .3, dur: .3 });                  // ring
      p.path('M -70 -164 L 70 -164 Q 92 -164 92 -130 L 92 222 Q 92 256 58 256 L -58 256 Q -92 256 -92 222 L -92 -130 Q -92 -164 -70 -164 Z',
        { fill: C.fill, at: .35, dur: .6 });                                                  // body
      p.line(-76, -126, -76, 226, { sw: 1.6, stroke: C.soft, at: .8, dur: .35 });           // inner wall
      [40, 112].forEach((y, i) => p.line(-92, y, 92, y, { sw: 1.8, at: .85 + i * .06, dur: .25 }));
      for (let i = 0; i < 6; i++) p.line(-60 + i * 24, 52, -60 + i * 24, 100, { sw: 1.4, stroke: C.soft, at: 1 + i * .03, dur: .12 });
      kit.sparkle(p, { x: 60, y: -110, r: 16, at: 1.1 });
    },
    callouts: [
      { x: 28, y: -284, text: 'หูหิ้วในฝา', sub: 'คล้องนิ้วพกง่าย' },
      { x: -62, y: -222, text: 'ฝาเกลียวแน่น', sub: 'ใส่กระเป๋าได้' },
      { x: -80, y: 20, text: 'ผนัง 2 ชั้น', sub: 'ด้านนอกไม่เปียก' },
      { x: 92, y: 76, text: 'แถบกันลื่น', sub: 'จับถนัดมือ' },
      { x: 50, y: 250, text: 'ฐานกว้าง', sub: 'ตั้งบนโต๊ะได้มั่น' },
    ],
    caption: 'ขวดเดียว ใช้ได้ทั้งวัน',
  }, { top });
});
</script></body></html>
