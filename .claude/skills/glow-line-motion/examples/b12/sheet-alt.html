<!doctype html>
<html><head><meta charset="utf-8"><title>B12 redesign 16</title>
<script src="../../assets/glowline.js"></script><script src="b12.js"></script></head>
<body><script>
/* B12 — design 16 redesign: one row per option (A hand pump · B music box · C melting ice) × two columns of data (sample with 4 links · stress: long labels) */
GL.run(() => {
  GL.stage();
  const B = GL.cats.B12, cols = [B.SAMPLES[15], B.STRESS[1]];
  GL.text('B12 · ออกแบบ 16 ใหม่', { y: 70, size: 46, ls: 4, color: GL.C.kicker, glow: false });
  GL.text('เลือก A / B / C · คอลัมน์ขวาเป็นข้อมูลโหด (ป้ายยาว)', { y: 118, size: 30, weight: 500, color: GL.C.sub, glow: false });
  const s = .5, top = 180, rh = 570;
  B.ALT.forEach((v, k) => { const y0 = top + k * rh;
    GL.text('ABC'[k] + ' · ' + v.th, { x: GL.W / 2, y: y0 + 30, size: 34, weight: 700, color: GL.C.ink, glow: false });
    cols.forEach((d, j) => { const x = (j + .5) * GL.W / 2, y = y0 + 60 + 700 * s / 2; B.drawAlt(k, d, { x, y, s, at: .3 + k * .05 + j * .04, hit: 1.9 });
      GL.text('“' + d.say + '”', { x, y: y + 700 * s / 2 + 26, size: 22, weight: 500, color: GL.C.mute, glow: false, maxW: GL.W / 2 - 30 }); }); });
  GL.finish({ hold: 2.4, out: true, stagger: .02 });
});
</script></body></html>
