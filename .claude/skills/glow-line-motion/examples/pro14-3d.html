<html><head><meta charset="utf-8"><title>pro 3d</title>
<script src="../assets/glowline.js"></script><script src="file:///home/user/Friend/.claude/skills/glow-line-motion/examples/_pro14-old.js"></script></head>
<body><script>
/* light-3D proposal on the original -pro style: batch-14 icons as they were (left, `_pro14-old.js`) vs with a little depth (right, `pro14.js`).
   Depth rules: box-shaped things show a narrow real side face (house, bus); round/flat things show their thickness (compass case);
   pointed things get bevelled facets (star, needle); folded things get a light and a dark panel (map); fronts taper (train).
   Faces use LIT #262626 / DIM #0e0e0e — still the dark see-through fill. window.SHEET_B picks the second sheet. */
GL.run(() => {
  GL.stage();
  const B = window.SHEET_B === true;
  const rows = B ? ['map', 'train-front', 'star-off'] : ['house', 'bus', 'compass'];
  const top = GL.title({ kicker: 'LIGHT 3D · ' + (B ? 'B' : 'A'), main: 'BEFORE → AFTER', size: 92 });
  GL.text('BEFORE', { x: GL.W * .25, y: top + 10, size: 30, weight: 700, color: GL.C.sub, glow: false, at: .2 });
  GL.text('AFTER', { x: GL.W * .75, y: top + 10, size: 30, weight: 700, color: GL.C.ink, at: .2 });
  const ch = (GL.H - top - 60) / 3;
  rows.forEach((n, i) => {
    const y = top + 40 + i * ch + ch * .46, at = .4 + i * .2;
    GL.art(GL.icons[n + '-old'], { x: GL.W * .25, y, w: ch * .8, at });
    GL.art(GL.icons[n + '-pro'], { x: GL.W * .75, y, w: ch * .8, at });
    GL.text(n.toUpperCase(), { x: GL.W / 2, y: y + ch * .47, size: 28, weight: 600, color: GL.C.sub, glow: false, at: at + .4, rise: 6 });
  });
  GL.finish({ hold: 3.5 });
});
</script></body></html>
