<!doctype html>
<html><head><meta charset="utf-8"><title>glow-line scene</title>
<script src="../assets/glowline.js"></script></head>
<body><script>
/* free scene — no layout: place drawings, move them, connect them. Person floats idly, cursor glides in and clicks. */
GL.run(() => {
  GL.stage();
  const { W, H, parts } = GL;
  GL.text('เริ่มจากสิ่งเดียว', { y: 300, size: 92, at: .2 });
  const me = GL.art(GL.icons.wave, { x: W * .28, y: 900, w: 470, at: .6, float: { amp: 6, period: 3 } });
  const lap = GL.art(p => parts.laptop(p, 0, 90, 300, 0, .6), { x: W * .72, y: 900, w: 420, at: me.end - .2 });
  const t1 = GL.connect(W * .44, 760, W * .62, 760, { at: lap.end, dur: .6, dots: true, bend: -.25 });
  const cur = GL.art(p => parts.cursor(p, 0, 0, 1.6, 0, .35, { click: true }), { x: W * .9, y: 1250, s: 1, at: t1 });
  GL.tween(cur.wrap, t1 + .35, .9, { dx: 0, dy: 0 }, { dx: -150, dy: -330 });          // glide onto the screen
  GL.pulse(lap.g, t1 + 1.3);
  GL.text('ทำให้เสร็จ แล้วค่อยไปต่อ', { y: 1420, size: 50, weight: 600, color: GL.C.soft, glow: false, at: t1 + 1.3 });
});
</script></body></html>
