<!doctype html>
<html><head><meta charset="utf-8"><title>B01S round 1</title>
<script src="../../assets/glowline.js"></script><script src="b01s.js"></script></head>
<body><script>
/* B01S ชุด 7 ขนาด — round ROUND (one idea × 7 sizes), data DI of SET (A = SAMPLES, B = STRESS). Corner marks = the size's box at 100 % (scaled s). */
GL.run(() => {
  GL.stage();
  const ROUND = 1, SET = 'A', DI = 0, B = GL.cats.B01S, d = (SET === 'A' ? B.SAMPLES : B.STRESS)[DI], s = .58;
  GL.text('B01 ชุด 7 ขนาด · รอบ ' + ROUND + ' · ' + B.ROUNDS[ROUND].th, { y: 66, size: 44, ls: 3, color: GL.C.kicker, glow: false });
  GL.text('“' + d.say + '”', { y: 116, size: 30, weight: 500, color: GL.C.sub, glow: false, maxW: 1000 });
  const cols = [[1, 2, 5, 4], [6, 3, 7]], X = [275, 810];
  cols.forEach((list, ci) => { let y = 170;
    list.forEach(k => { const S = B.SIZES[k], h = S.h * s, cy = y + h / 2, x = X[ci];
      B.frame({ x, y: cy, s }, S.w, S.h);
      B.draw(ROUND, k, d, { x, y: cy, s, at: .3, hit: 1.5 });
      GL.text('ขนาด ' + k + ' · ' + S.th + ' ' + S.w + '×' + S.h, { x, y: y + h + 36, size: 24, weight: 700, color: GL.C.ink, glow: false });
      y += h + 66; }); });
  GL.finish({ hold: 2.4, out: true, stagger: .02 });
});
</script></body></html>
