<!doctype html>
<html><head><meta charset="utf-8"><title>B09T alt 10</title>
<script src="../../assets/glowline.js"></script><script src="b09t.js"></script></head>
<body><script>
/* B09T design 10 — two candidates (A, B) × four kinds of data (several moments · stops half way · result only · long words) */
GL.run(() => {
  GL.stage();
  const C9 = GL.cats.B09T, V = C9.variants, A = C9.SAMPLES, B = C9.STRESS, ids = ['approach', 'picker'], data = [A[2], A[10], A[9], B[1]];
  GL.text('B09 · แบบ 10 ใหม่ — เลือก A หรือ B', { y: 66, size: 46, ls: 2, color: GL.C.kicker, glow: false });
  const s = .44, cw = GL.W / 2, ch = 700 * s + 52;
  ids.forEach((id, r) => { const i = V.findIndex(v => v.id === id), y0 = 110 + r * (2 * ch + 60);
    GL.text((r ? 'B · ' : 'A · ') + V[i].th, { x: GL.W / 2, y: y0 + 26, size: 38, weight: 800, color: GL.C.ink, glow: false });
    data.forEach((d, k) => { const x = (k % 2 + .5) * cw, cy = y0 + 50 + Math.floor(k / 2) * ch + 700 * s / 2; C9.draw(i, d, { x, y: cy, s, at: .3 + k * .05, hit: 1.9 });
      GL.text('“' + d.say + '”', { x, y: cy + 700 * s / 2 + 26, size: 20, weight: 500, color: GL.C.mute, glow: false, maxW: cw - 20 }); }); });
  GL.finish({ hold: 2.4, out: true, stagger: .02 });
});
</script></body></html>
