<!doctype html>
<html><head><meta charset="utf-8"><title>B05 sheet speed</title>
<script src="../../assets/glowline.js"></script><script src="b05.js"></script></head>
<body><script>
/* B05 timing check — columns = speed 0.5 / 1 / 2 (keyword at 3.0 s, room for the slow one).
   Under every cell the two words light up at the moment they are spoken: "ไม่ใช่" (no) and the keyword (hit). */
GL.run(() => {
  GL.stage();
  const KIND = 'speed', B = GL.cats.B05, ROWS = ['stamp', 'pulley', 'key', 'bulb'];
  const COLS = KIND === 'speed'
    ? [{ t: 'speed 0.5 · ช้าลงครึ่ง', c: { hit: 3, speed: .5 } }, { t: 'speed 1 · ปกติ', c: { hit: 3 } }, { t: 'speed 2 · เร็วขึ้นเท่าตัว', c: { hit: 3, speed: 2 } }]
    : [{ t: 'พูดเร็ว · คำสำคัญที่ 1.2 วิ', c: { hit: 1.2 } }, { t: 'ปกติ · 1.9 วิ', c: { hit: 1.9 } }, { t: 'พูดช้า · ไม่ใช่ 0.6 / คำสำคัญ 3.5', c: { no: .6, hit: 3.5 } }];
  GL.text('B05 · ' + (KIND === 'speed' ? 'ปรับความเร็ว (speed)' : 'จังหวะตามเสียงพูด'), { y: 70, size: 46, ls: 2, color: GL.C.kicker, glow: false });
  GL.text(KIND === 'speed' ? 'คำสำคัญอยู่ที่ 3 วิเท่ากันทุกช่อง · ต่างแค่ความเร็วท่า' : 'จังหวะของท่ายึดเวลาที่พูดจริง · ท่าไม่ยืด ไม่ซ้อน',
    { y: 116, size: 28, weight: 500, color: GL.C.sub, glow: false });
  const top = 175, cw = GL.W / 3, rh = (GL.H - top - 20) / ROWS.length, s = .33, at0 = .3;
  COLS.forEach((col, j) => GL.text(col.t, { x: (j + .5) * cw, y: top - 8, size: 24, weight: 700, color: GL.C.ink, glow: false, maxW: cw - 16 }));
  ROWS.forEach((id, r) => { const i = B.variants.findIndex(v => v.id === id), d = B.SAMPLES[i];
    COLS.forEach((col, j) => { const x = (j + .5) * cw, cy = top + 20 + r * rh + 700 * s / 2;
      const c = Object.assign({ x, y: cy, s, at: at0 }, col.c), z = B.timing(c);
      B.draw(i, d, c);
      const ly = cy + 700 * s / 2 + 26;
      GL.text('ไม่ใช่', { x: x - 60, y: ly, size: 22, weight: 700, color: GL.C.ink, glow: true, at: at0 + z.N, dur: .1 });
      GL.text('คำสำคัญ', { x: x + 50, y: ly, size: 22, weight: 700, color: GL.C.ink, glow: true, at: at0 + z.H, dur: .1 });
      GL.text(String(r + 1) + ' ' + B.variants[i].th, { x, y: ly + 30, size: 18, weight: 500, color: GL.C.mute, glow: false }); }); });
  GL.finish({ hold: 1.6, out: true, stagger: .02 });
});
</script></body></html>
