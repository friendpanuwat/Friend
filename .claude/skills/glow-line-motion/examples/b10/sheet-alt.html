<!doctype html>
<html><head><meta charset="utf-8"><title>B10 redesign 14</title>
<script src="../../assets/glowline.js"></script><script src="b10.js"></script></head>
<body><script>
/* B10 — three options for design 14 (A cheval mirror · B vanity · C snow globe), three rows of data: sample · tags · stress */
GL.run(() => {
  GL.stage();
  const B = GL.cats.B10, rows = [B.SAMPLES[13], B.SAMPLES[17], B.STRESS[13]];
  GL.text('B10 · ออกแบบ 14 ใหม่', { y: 70, size: 46, ls: 4, color: GL.C.kicker, glow: false });
  GL.text('เลือก A / B / C · แถวล่างเป็นข้อมูลโหด', { y: 118, size: 30, weight: 500, color: GL.C.sub, glow: false });
  const s = .34, top = 190, rh = 540;
  B.ALT.forEach((v, k) => { const x = (k + .5) * GL.W / 3;
    GL.text('ABC'[k] + ' · ' + v.th, { x, y: top + 10, size: 30, weight: 700, color: GL.C.ink, glow: false });
    rows.forEach((d, r) => { const y = top + 70 + r * rh + 700 * s / 2; B.drawAlt(k, d, { x, y, s, at: .3 + k * .05 + r * .04, hit: 1.9 });
      if (k === 0) GL.text('“' + d.say + '”', { x: GL.W / 2, y: y + 700 * s / 2 + 34, size: 22, weight: 500, color: GL.C.mute, glow: false }); }); });
  GL.finish({ hold: 2.4, out: true, stagger: .02 });
});
</script></body></html>
