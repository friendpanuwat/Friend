<!doctype html>
<html><head><meta charset="utf-8"><title>B05S size 7</title>
<script src="../../assets/glowline.js"></script><script src="b05s.js"></script></head>
<body><script>
/* B05S — size K's own designs (user: "ออกแบบทีละขนาด … 10 อัน"). Data: SET A = SAMPLES, B = STRESS, design i takes data[(i + OFF) % n]. Yellow = the size's box at 100 % (scaled s). */
GL.run(() => {
  GL.stage();
  const FRAME = true, K = 7, SET = 'A', OFF = 0, B = GL.cats.B05S, data = SET === 'A' ? B.SAMPLES : B.STRESS, S = B.SIZES[K], list = B.S[K], s = .5;
  GL.text('B05 ขนาด ' + K + ' · ' + S.th + ' ' + S.w + '×' + S.h + ' · ' + list.length + ' แบบ', { y: 66, size: 42, ls: 3, color: GL.C.kicker, glow: false });
  GL.text(SET === 'A' ? 'ข้อมูลตัวอย่างจากหลายเรื่อง' : 'ข้อมูลโหด (ไม่มีป้าย / ป้ายยาว / อังกฤษ / ไม่มีไอคอน …)', { y: 112, size: 28, weight: 500, color: GL.C.sub, glow: false });
  const h = S.h * s, rowH = h + 90, X = [118, 329, 540, 751, 962];
  list.forEach((v, i) => { const x = X[i % 5], y0 = 160 + Math.floor(i / 5) * rowH, cy = y0 + h / 2, d = data[(i + OFF) % data.length];
    if (FRAME) B.frame({ x, y: cy, s }, S.w, S.h); B.drawS(K, i, d, { x, y: cy, s, at: .3, hit: 1.5 });
    GL.text(String(i + 1).padStart(2, '0') + ' ' + v.th, { x, y: y0 + h + 30, size: 20, weight: 700, color: GL.C.ink, glow: false });
    GL.text('“' + d.say + '”', { x, y: y0 + h + 52, size: 17, weight: 500, color: GL.C.mute, glow: false, maxW: 200 }); });
  GL.finish({ hold: 2.4, out: true, stagger: .02 });
});
</script></body></html>
