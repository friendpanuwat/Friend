<!doctype html>
<html><head><meta charset="utf-8"><title>B04 sheet timing</title>
<script src="../../assets/glowline.js"></script><script src="b04.js"></script></head>
<body><script>
/* B04 timing check (system of b05.js): columns = fast speech · default · long sentence at speed 0.5. The keyword (hit) never moves;
   under every cell "คำสำคัญ" lights at the moment it is spoken. */
GL.run(() => {
  GL.stage();
  const B = GL.cats.B04, H0 = 1.8, ROWS = [0,4,12,17];
  const COLS = [{ t: 'พูดเร็ว · คำสำคัญที่ ' + (H0 * .6).toFixed(1) + ' วิ', c: { hit: +(H0 * .6).toFixed(2) } }, { t: 'ปกติ · ' + H0 + ' วิ', c: { hit: H0 } },
    { t: 'ประโยคยาว ' + (H0 * 2.5).toFixed(1) + ' วิ · speed 0.5', c: { hit: +(H0 * 2.5).toFixed(2), speed: .5 } }];
  GL.text('B04 · ขั้นตอน · ระบบเวลาใหม่', { y: 70, size: 44, ls: 2, color: GL.C.kicker, glow: false });
  GL.text('คำสำคัญอยู่ตรงเวลาที่พูดเสมอ · ท่าเร็ว/ช้าตามที่เวลาให้', { y: 116, size: 28, weight: 500, color: GL.C.sub, glow: false });
  const top = 175, cw = GL.W / 3, rh = (GL.H - top - 20) / ROWS.length, s = .33, at0 = .3;
  COLS.forEach((col, j) => GL.text(col.t, { x: (j + .5) * cw, y: top - 8, size: 22, weight: 700, color: GL.C.ink, glow: false, maxW: cw - 16 }));
  ROWS.forEach((i, r) => { const d = B.SAMPLES[i];
    COLS.forEach((col, j) => { const x = (j + .5) * cw, cy = top + 20 + r * rh + 700 * s / 2, c = Object.assign({ x, y: cy, s, at: at0 }, col.c), z = B.timing(c);
      B.draw(i, d, c); const ly = cy + 700 * s / 2 + 26;
      GL.text('คำสำคัญ', { x, y: ly, size: 22, weight: 700, color: GL.C.ink, glow: true, at: at0 + z.H, dur: .1 });
      GL.text(String(i + 1).padStart(2, '0') + ' ' + B.variants[i].th, { x, y: ly + 30, size: 18, weight: 500, color: GL.C.mute, glow: false }); }); });
  GL.finish({ hold: 1.6, out: true, stagger: .02 });
});
</script></body></html>
