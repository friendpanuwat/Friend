<!doctype html>
<html><head><meta charset="utf-8"><title>B10S size 1</title>
<script src="../../assets/glowline.js"></script><script src="b10s.js"></script></head>
<body><script>
/* B10S size 1 — 5 designs (all 7 sizes at once, straight to video), PER designs a page. Each row = one design, each column = one line of data,
   labelled with what the data holds (lesson 31). Yellow = the size's box at 100 % (scaled s); FRAME = false for the video. */
GL.run(() => {
  GL.stage();
  const FRAME = true, K = 1, SET = 'A', s = .56, B = GL.cats.B10S, S = B.SIZES[K], list = B.S[K];
  const COLS = { A: [0, 1, 2], B: [0, 1, 2], C: [3, 4, 5], D: [6, 7, 8] }[SET], data = SET === 'A' ? B.SAMPLES : B.STRESS;
  const HEAD = SET === 'A' ? ['คน + ป้าย + ป้ายย่อย', 'ไอคอนสิ่งของ (กล่อง) + ป้าย', 'ป้ายอย่างเดียว (ไม่มีไอคอน)'] : COLS.map(i => data[i].say);
  GL.text('B10 ขนาด ' + K + ' · ' + S.th + ' ' + S.w + '×' + S.h + ' · แบบ 01–' + String(list.length).padStart(2, '0'), { y: 66, size: 40, ls: 3, color: GL.C.kicker, glow: false });
  GL.text('กรอบละแบบ · ในกรอบ: บน = ' + HEAD[0] + ' · กลาง = ' + HEAD[1] + ' · ล่าง = ' + HEAD[2], { y: 106, size: 22, weight: 500, color: GL.C.sub, glow: false, maxW: 1040 });
  const w = S.w * s, h = S.h * s, X = [272, 808], gapL = 30, blockH = 44 + 3 * (h + gapL);
  list.forEach((v, i) => { const x = list.length % 2 && i === list.length - 1 ? 540 : X[i % 2], y0 = 140 + Math.floor(i / 2) * (blockH + 14);
    GL.text(String(i + 1).padStart(2, '0') + ' ' + v.th, { x, y: y0 + 30, size: 28, weight: 700, color: GL.C.ink, glow: false });
    COLS.forEach((di, j) => { const d = data[di], ty = y0 + 44 + j * (h + gapL), cy = ty + gapL - 4 + h / 2;
      GL.text(HEAD[j] + ' · “' + d.say + '”', { x: x - w / 2, y: ty + gapL - 12, size: 17, weight: 600, color: GL.C.kicker, glow: false, anchor: 'start', maxW: w });
      if (FRAME) B.frame({ x, y: cy, s }, S.w, S.h); B.drawS(K, i, d, { x, y: cy, s, at: .3, hit: 1.6 }); }); });
  GL.finish({ hold: 2.4, out: true, stagger: .02 });
});
</script></body></html>
