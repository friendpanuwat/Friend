<!doctype html>
<html><head><meta charset="utf-8"><title>B01T redesign 37</title>
<script src="../../assets/glowline.js"></script><script src="b01t.js"></script></head>
<body><script>
/* Redesign 37 — three options (A B C), each with a sample line (left) and a stress line (right) */
GL.run(() => {
  GL.stage();
  const T = GL.cats.B01T, ids = ['hbars', 'callout', 'peak'], top = 160, rh = 560, s = .44, D = [T.SAMPLES[16], T.STRESS[0]];
  GL.text('B01 ชุดฐาน · ออกแบบใหม่แบบ 37', { y: 70, size: 46, ls: 4, color: GL.C.kicker, glow: false });
  GL.text('3 ทางเลือก · ซ้าย = ข้อมูลตัวอย่าง · ขวา = ข้อมูลโหด (9 หลัก ไม่มีไอคอน)', { y: 118, size: 28, weight: 500, color: GL.C.sub, glow: false });
  ids.forEach((id, r) => { const i = T.variants.findIndex(v => v.id === id), y0 = top + r * rh;
    D.forEach((d, k) => T.draw(i, d, { x: (k + .5) * GL.W / 2, y: y0 + 700 * s / 2, s, at: .3 + (r * 2 + k) * .04, hit: 1.5 }));
    GL.text('ABC'[r] + ' · ' + T.variants[i].th, { x: GL.W / 2, y: y0 + 700 * s + 50, size: 30, weight: 700, color: GL.C.ink, glow: false }); });
  GL.finish({ hold: 2.4, out: true, stagger: .02 });
});
</script></body></html>
