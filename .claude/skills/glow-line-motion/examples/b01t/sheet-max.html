<!doctype html>
<html><head><meta charset="utf-8"><title>B01T max slot</title>
<script src="../../assets/glowline.js"></script><script src="b01t.js"></script></head>
<body><script>
/* ช่องค่าเต็ม (max): designs that fill / point now show value ÷ max for plain numbers ("6 จาก 8") */
GL.run(() => {
  GL.stage();
  const T = GL.cats.B01T, ids = ['bar', 'ring', 'gauge', 'donut', 'dots', 'segments', 'vbar', 'slider', 'waffle', 'hbars'];
  GL.text('B01 ชุดฐาน · ช่องค่าเต็ม (max)', { y: 70, size: 46, ls: 4, color: GL.C.kicker, glow: false });
  GL.text('ตัวเลขธรรมดา + ค่าเต็ม → เติม / ชี้ตามสัดส่วนจริง (ค่า ÷ ค่าเต็ม)', { y: 118, size: 28, weight: 500, color: GL.C.sub, glow: false });
  const top = 150, rh = (GL.H - top - 10) / 5, s = .4;
  ids.forEach((id, k) => { const i = T.variants.findIndex(v => v.id === id), d = T.MAXS[k % T.MAXS.length], x = (k % 2 + .5) * GL.W / 2, y0 = top + Math.floor(k / 2) * rh;
    T.draw(i, d, { x, y: y0 + 700 * s / 2 + 4, s, at: .3 + k * .04, hit: 1.5 });
    GL.text(String(i + 1).padStart(2, '0') + ' ' + T.variants[i].th, { x, y: y0 + 700 * s + 34, size: 25, weight: 700, color: GL.C.ink, glow: false });
    GL.text('“' + d.say + '” → ' + Math.round(100 * parseFloat(d.value.replace(/,/g, '')) / parseFloat(d.max.replace(/,/g, ''))) + '%', { x, y: y0 + 700 * s + 62, size: 20, weight: 500, color: GL.C.mute, glow: false }); });
  GL.finish({ hold: 2.4, out: true, stagger: .02 });
});
</script></body></html>
