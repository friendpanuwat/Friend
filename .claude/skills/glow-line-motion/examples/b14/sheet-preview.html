<!doctype html>
<html><head><meta charset="utf-8"><title>B14 preview</title>
<script src="../../assets/glowline.js"></script><script src="b14.js"></script></head>
<body><script>
/* B14 ประโยคเด็ด — 2 designs (columns) × 3 data rows: icon + label · another · label only (the label is the hero) */
GL.run(() => {
  GL.stage(); const B = GL.cats.B14, rows = [B.SAMPLES[0], B.SAMPLES[1], B.SAMPLES[2]];
  GL.text('B14 · ประโยคเด็ด / ใจความสำคัญ', { y: 70, size: 46, ls: 4, color: GL.C.kicker, glow: false });
  GL.text('สไตล์เดียวกับ B01–B13 · 2 แบบ × 3 ข้อมูล', { y: 118, size: 30, weight: 500, color: GL.C.sub, glow: false });
  const top = 170, rh = (GL.H - top - 20) / 3, s = .5;
  rows.forEach((d, r) => B.variants.forEach((v, i) => { const x = (i + .5) * GL.W / 2, y0 = top + r * rh, cy = y0 + 700 * s / 2 + 10;
    B.draw(i, d, { x, y: cy, s, at: .3 + (r * 2 + i) * .04, hit: 1.9 });
    if (r === 0) GL.text(String(i + 1).padStart(2, '0') + ' ' + v.id.toUpperCase() + ' · ' + v.th, { x, y: y0 + 700 * s + 50, size: 26, weight: 700, color: GL.C.ink, glow: false });
    GL.text('“' + d.say + '”', { x, y: y0 + 700 * s + (r === 0 ? 84 : 50), size: 21, weight: 500, color: GL.C.mute, glow: false, maxW: GL.W / 2 - 30 }); }));
  GL.finish({ hold: 2.4, out: true, stagger: .02 });
});
</script></body></html>
