<!doctype html>
<html><head><meta charset="utf-8"><title>B14 redesign 15</title>
<script src="../../assets/glowline.js"></script><script src="b14.js"></script></head>
<body><script>
/* B14 — redesign 15: three options (rows) × icon + label / label only (the label is the hero) */
GL.run(() => {
  GL.stage(); const B = GL.cats.B14, D = [B.SAMPLES[14], B.STRESS[3]];
  GL.text('B14 · แบบ 15 ใหม่ (คำคมบนการ์ด) — เลือก A / B / C', { y: 70, size: 46, ls: 2, color: GL.C.kicker, glow: false });
  GL.text('ซ้าย: ไอคอน + ป้าย · ขวา: ป้ายอย่างเดียว', { y: 118, size: 30, weight: 500, color: GL.C.sub, glow: false });
  const top = 160, rh = (GL.H - top - 10) / 3, s = .48;
  B.ALT.forEach((v, k) => D.forEach((d, j) => { const x = (j + .5) * GL.W / 2, y0 = top + k * rh, cy = y0 + 700 * s / 2 + 10;
    B.drawAlt(k, d, { x, y: cy, s, at: .3 + (k * 2 + j) * .04, hit: 1.9 });
    if (j === 0) GL.text('ABC'[k] + ' · ' + v.th, { x: GL.W / 2, y: y0 + 700 * s + 52, size: 30, weight: 700, color: GL.C.ink, glow: false }); }));
  GL.finish({ hold: 2.4, out: true, stagger: .02 });
});
</script></body></html>
