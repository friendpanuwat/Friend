<body><script>
/* B20 01 — the bond without hands: A knot · B linked rings · C clinking cups */
GL.run(() => {
  GL.stage();
  GL.text('B20 · 01 แทนการจับมือ — 3 แบบไม่มีมือ', { y: 70, size: 46, ls: 2, color: GL.C.kicker, glow: false });
  GL.text('ไม่วาดอวัยวะ · เลือก A / B / C', { y: 118, size: 30, weight: 500, color: GL.C.sub, glow: false });
  const T = [['knot', 'A · เชือกจากสองฝั่งผูกเป็นเงื่อนเดียว'], ['rings', 'B · ห่วงของสองฝ่ายคล้องกัน'], ['cups', 'C · แก้วสองใบชนกัน']];
  T.forEach(([st, th], k) => { const y0 = 170 + k * 580, d = Object.assign({}, GL.cats.B20.SAMPLES[0], { bs: st });
    GL.cats.B20.draw(0, d, { x: GL.W / 2, y: y0 + 230, s: .62, at: .3 + k * .1, hit: 1.9 });
    GL.text(th, { x: GL.W / 2, y: y0 + 500, size: 30, weight: 700, color: GL.C.ink, glow: false }); });
  GL.finish({ hold: 2.4, out: true, stagger: .02 });
});
