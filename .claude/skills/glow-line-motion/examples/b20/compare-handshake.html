<!doctype html>
<html><head><meta charset="utf-8"><title>B20 handshake A B C</title>
<script src="../../assets/glowline.js"></script><script src="b20.js"></script></head>
<body><script>
/* B20 01 — the handshake redrawn three ways (A side view one mass · B from above, mittens · C sleeves with linked rings) */
GL.run(() => {
  GL.stage();
  GL.text('B20 · 01 จับมือ — วาดใหม่ 3 แบบ', { y: 70, size: 46, ls: 2, color: GL.C.kicker, glow: false });
  GL.text('ไม่ลอกรูปต้นแบบ · เลือก A / B / C', { y: 118, size: 30, weight: 500, color: GL.C.sub, glow: false });
  const T = [['A', 'มองด้านข้าง มือสองข้างเป็นก้อนเดียว มีแค่ร่องนิ้ว'], ['B', 'มองจากบน แนวทแยง มือแบบถุงมือ นิ้วโป้งพาดทับ'], ['C', 'ไม่มีมือ — ปลายแขนเสื้อเป็นห่วงคล้องกัน']];
  T.forEach(([st, th], k) => { const y0 = 170 + k * 580, d = Object.assign({}, GL.cats.B20.SAMPLES[0], { hs: st });
    GL.cats.B20.draw(0, d, { x: GL.W / 2, y: y0 + 230, s: .62, at: .3 + k * .1, hit: 1.9 });
    GL.text(st + ' · ' + th, { x: GL.W / 2, y: y0 + 500, size: 30, weight: 700, color: GL.C.ink, glow: false }); });
  GL.finish({ hold: 2.4, out: true, stagger: .02 });
});
</script></body></html>
