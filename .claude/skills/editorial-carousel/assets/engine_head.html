<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"KeySans";src:url(fonts/Mitr-Bold.ttf)}
@font-face{font-family:"KeySerif";src:url(fonts/Sriracha-Regular.ttf)}
@font-face{font-family:"Lead";src:url(fonts/Mitr-Regular.ttf)}
@font-face{font-family:"CardSans";src:url(fonts/Mitr-SemiBold.ttf)}
/* editorial palette — accent is the ONLY colour; everything else is white / navy / cream / black */
:root{--acc:#DDFF45;--navy:#14213D;--cream:#F2EDE2;--ink:#050505;--pill:#1B2A52}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:__H__px;overflow:hidden;background:#000}
body{position:relative;color:#fff;font-family:"Lead",sans-serif}
.layer{position:absolute;inset:0;pointer-events:none}

/* ---------- typography (same scale as talking-head-editorial) ---------- */
.ln{display:flex;align-items:baseline;justify-content:center;flex-wrap:nowrap;white-space:nowrap;column-gap:16px}
.ch{display:inline-block;white-space:nowrap;position:relative;opacity:0;will-change:transform,opacity,filter}
.g{display:inline-block}
.l {font-family:"Lead";font-size:54px;line-height:1.2;color:#fff}
.m {font-family:"CardSans";font-size:84px;line-height:1.12;color:#fff;letter-spacing:-1px}
.k ,.kw{font-family:"KeySans";font-size:146px;line-height:1.12;letter-spacing:-2px;color:var(--acc)}
.kw{color:#fff}
.i ,.iw{font-family:"KeySerif";font-size:150px;line-height:1.2;color:var(--acc)}
.iw{color:#fff}
.hl{font-family:"KeySans";font-size:116px;line-height:1.1;letter-spacing:-2px;color:#0A0A0A;background:var(--acc);padding:.1em .16em .04em;border-radius:12px}   /* top room for stacked Thai marks (ื้ ำ) */
/* light slides (white / cream / accent): every text style turns navy — accent on a light ground only via hl */
.light .l,.light .m,.light .k,.light .kw,.light .i,.light .iw,.light .para{color:var(--navy)}
.dark .ch{text-shadow:0 4px 26px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.35)}
.ch.hl,.dark .ch.hl{text-shadow:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
/* body copy — wraps (Thai line-breaking by the browser).  **bold** → KeySans · ==mark== → accent box */
.para{position:absolute;font-family:"Lead";font-size:44px;line-height:1.5;color:#fff;opacity:0}
.para p+p{margin-top:.6em}
.para b{font-family:"KeySans";font-weight:normal}
.dark .para b{color:var(--acc)}
.para mark{font-family:"KeySans";color:#0A0A0A;background:var(--acc);padding:0 .14em .02em;border-radius:8px;-webkit-box-decoration-break:clone;box-decoration-break:clone}

/* ---------- slide parts ---------- */
.card{position:absolute;inset:0;overflow:hidden;opacity:0}
.stage{position:absolute;inset:0}
.pill{position:absolute;white-space:nowrap;display:inline-flex;align-items:center;gap:18px;padding:12px 40px 18px;border-radius:999px;background:var(--pill);
  box-shadow:0 14px 36px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12);font-family:"KeySerif";font-size:58px;line-height:1.3;color:#fff;opacity:0}
.num{position:absolute;width:96px;height:96px;display:flex;align-items:center;justify-content:center;opacity:0}
.num::before{content:"";position:absolute;inset:8px;background:var(--acc);transform:rotate(45deg);border-radius:12px;box-shadow:0 10px 26px rgba(0,0,0,.25)}
.num span{position:relative;font-family:"KeySans";font-size:54px;color:#0A0A0A;line-height:1}
.strike{position:absolute;left:-4%;width:108%;top:48%;height:12px;border-radius:6px;background:var(--acc);transform-origin:0 50%}
.row{position:absolute;display:flex;align-items:center;gap:30px;opacity:0}
.row .bul{flex:none;position:relative;width:76px;height:76px;display:flex;align-items:center;justify-content:center}
.row .bul::before{content:"";position:absolute;inset:6px;background:var(--acc);transform:rotate(45deg);border-radius:10px}
.row .bul span{position:relative;font-family:"KeySans";font-size:42px;color:#0A0A0A;line-height:1}
.row .rt{font-family:"CardSans";font-size:50px;line-height:1.3;color:#fff}
.light .row .rt{color:var(--navy)}
.chrome{position:absolute;bottom:44px;font-family:"CardSans";font-size:30px;line-height:1;display:flex;align-items:center;gap:12px;color:rgba(255,255,255,.62)}
.light .chrome{color:rgba(20,33,61,.58)}
.chrome .sw{display:flex;align-items:center;gap:10px;padding:10px 16px 12px 26px;border-radius:999px;background:var(--acc);color:#0A0A0A}
</style></head>
<body>
<div class="layer" id="g"></div>
<script>
/* ===================== CORE =====================
   A deck is a row of slides laid end to end on one timeline. Every helper takes SLIDE-LOCAL seconds:
   slide() sets OFF to the slide's start, and A()/sfx() add it. PNG = the slide's settled end state (still);
   MP4 = the slide played from 0 to dur. Everything is time-driven → seekable, deterministic. */
const W = 1080, H = __H__, HANDLE = __HANDLE__;
const G = document.getElementById('g');
const SFX = [], HOOKS = [], FITS = [], ANIMS = [], SLIDES = [], FINAL = [];
let OFF = 0;
const ms = s => s * 1000;
const sfx = (s, t, db = -14, pitch) => SFX.push(pitch ? {s, t: t + OFF, db, pitch} : {s, t: t + OFF, db});
const SPRING = 'cubic-bezier(.22,1.3,.36,1)', SMOOTH = 'cubic-bezier(.2,.8,.2,1)', INOUT = 'cubic-bezier(.65,0,.35,1)';
/* every animation is registered: document.getAnimations() drops finished fill:'none' ones, which breaks backward seeks.
   idle = ambient motion (float, drift, glow) — reset to its start in stills so PNGs come out clean */
const A = (el, kf, t, d, o = {}) => { const a = el.animate(kf, {delay: ms(t + OFF), duration: ms(d), easing: o.e ?? SMOOTH, fill: o.f ?? 'both', iterations: o.it ?? 1, direction: o.dir ?? 'normal'}); a.idle = !!o.idle; ANIMS.push(a); return a; };
const div = (css, parent, html = '') => { const d = document.createElement('div'); d.style.cssText = 'position:absolute;' + css; d.innerHTML = html; parent.appendChild(d); return d; };
const seg = new Intl.Segmenter('th', {granularity: 'grapheme'});
const graphemes = s => [...seg.segment(s)].map(x => x.segment);
const ACC = '#DDFF45', NAVY = '#14213D', CREAM = '#F2EDE2', INK = '#050505';
const visible = (el, t0, t1) => A(el, [{opacity: 1}, {opacity: 1}], t0, t1 - t0, {f: 'none', e: 'linear'});   // shown only inside [t0,t1)

/* one chunk of words.  style: l | m | k | kw | i | iw | hl
   reveal: lead words fade-up out of a blur; key words pop (scale 1.16→1 + blur→sharp).
   o.type = typewriter, grapheme by grapheme · o.wipe = graphemes turn white→accent one by one (dark slides) */
function chunk(parent, txt, st, t, o = {}) {
  const c = document.createElement('span'); c.className = 'ch ' + st; parent.appendChild(c);
  if (o.color) c.style.color = o.color;
  if (o.size) c.style.fontSize = o.size + 'px';
  const big = /^(k|kw|i|iw|hl)$/.test(st);
  if (o.type || o.wipe) {
    c.style.opacity = 1;
    graphemes(txt).forEach((ch, n) => {
      const g = document.createElement('span'); g.className = 'g'; g.textContent = ch; c.appendChild(g);
      const tg = t + n * (o.step ?? .045);
      A(g, [{opacity: 0, filter: 'blur(6px)'}, {opacity: 1, filter: 'blur(0)'}], tg, .12, {e: 'ease-out'});
      if (o.wipe) A(g, [{color: '#FFFFFF'}, {color: o.wipe === true ? ACC : o.wipe}], tg + .10, .12, {e: 'linear'});
    });
  } else {
    c.textContent = txt;
    if (big) A(c, [{opacity: 0, transform: 'scale(1.16)', filter: 'blur(14px)'}, {opacity: 1, transform: 'scale(1)', filter: 'blur(0)'}], t, .26, {e: SMOOTH});
    else A(c, [{opacity: 0, transform: 'translateY(16px)', filter: 'blur(7px)'}, {opacity: 1, transform: 'none', filter: 'blur(0)'}], t, .2, {e: SMOOTH});
  }
  return c;
}
function lines(parent, rows) {      // rows: [[ [txt, style, t, opts], ... ], ...]
  for (const r of rows) { const L = document.createElement('div'); L.className = 'ln'; parent.appendChild(L); for (const [txt, st, t, o] of r) chunk(L, txt, st, t, o ?? {}); }
}
function fit(el, Wd, Hd) {
  for (const L of el.children) { const w = L.scrollWidth; if (w > Wd) L.style.transform = `scale(${Wd / w})`; }
  if (Hd && el.offsetHeight > Hd) { el.style.transformOrigin = '50% 0'; el.style.transform = `scale(${Hd / el.offsetHeight})`; }
}
const keyHit = (t, db = -22) => sfx('softswish', t - .04, db);

/* ===================== SLIDES ===================== */
const BG = {black: INK, white: '#FFFFFF', cream: CREAM, navy: '#0B1530', accent: ACC};
const isLight = hex => { const h = hex.replace('#', ''); if (h.length < 6) return false; const [r, g, b] = [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16) / 255); return .2126 * r + .7152 * g + .0722 * b > .55; };
/* slide({bg, dur, still, sound, chrome, swipe}, s => { ...build with slide-local times... })
   bg: black | white | cream | navy | accent | '#hex' · dur: seconds the MP4 version plays (and when the PNG is taken)
   still: PNG capture time (default: end of slide) · chrome: false hides handle + page number · swipe: cover label */
function slide(o, build) {
  if (typeof o === 'function') [o, build] = [{}, o];
  const {bg = 'white', dur = 3.5, still, sound, db = -24, chrome = true, swipe} = o;
  const n = SLIDES.length + 1, T0 = SLIDES.reduce((s, x) => s + x.dur, 0), col = BG[bg] ?? bg, light = isLight(col);
  OFF = T0;
  const root = div(`inset:0;background:${col}`, G); root.className = 'card ' + (light ? 'light' : 'dark');
  visible(root, 0, dur);
  const st = div('inset:0', root); st.className = 'stage';
  A(st, [{transform: 'scale(1.035)'}, {transform: 'scale(1)'}], 0, .45, {e: SMOOTH});
  if (sound !== null) sfx(sound ?? (light ? 'swipe' : 'whoosh'), 0, db);
  st.t0 = 0; st.t1 = dur; st.n = n; st.light = light; st.root = root;
  if (chrome) FINAL.push(() => chromeOf(root, n, swipe ?? (n === 1 ? 'เลื่อนดู' : null)));
  try { build(st); } finally { OFF = 0; }
  SLIDES.push({n, t0: T0, dur, still: Math.min(dur - .02, still ?? dur - .02)});
  return st;
}
/* handle bottom-left · page n/N bottom-right (cover: swipe chip instead). Static — sits outside the stage zoom. */
function chromeOf(root, n, swipe) {
  if (HANDLE) div('left:60px', root, HANDLE).className = 'chrome';
  const r = div('right:60px', root); r.className = 'chrome';
  r.innerHTML = swipe ? `<span class="sw">${swipe}${ico('chevron-right', 34, '#0A0A0A', 2.6)}</span>` : `${n} / ${SLIDES.length}`;
}
/* centred text line(s).  css positions the block (top:...). W = max width (lines scale down to fit) · gap = px between lines
   (raise it when Thai upper vowels / tone marks of a big line touch the line above) */
function txt(c, rows, css = 'top:380px', {W: Wd = 920, H: Hd, gap = 0} = {}) {
  const el = div(`left:${(W - Wd) / 2}px;width:${Wd}px;display:flex;flex-direction:column;align-items:center;row-gap:${gap}px;${css}`, c);
  lines(el, rows); FITS.push(() => fit(el, Wd, Hd)); return el;
}
/* wrapped body copy. '\n\n' = new paragraph (each fades in `step` s after the previous). **bold** · ==mark== */
function para(c, text, t, css, {size = 44, W: Wd = 900, align = 'left', step = .18, color} = {}) {
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/==(.+?)==/g, '<mark>$1</mark>').replace(/\n/g, '<br>');
  const el = div(`left:${(W - Wd) / 2}px;width:${Wd}px;font-size:${size}px;text-align:${align};${color ? 'color:' + color + ';' : ''}${css}`, c);
  el.className = 'para'; el.style.opacity = 1;
  text.split(/\n\s*\n/).forEach((p, k) => {
    const e = document.createElement('p'); e.innerHTML = esc(p.trim()); el.appendChild(e);
    A(e, [{opacity: 0, transform: 'translateY(18px)', filter: 'blur(6px)'}, {opacity: 1, transform: 'none', filter: 'blur(0)'}], t + k * step, .32, {e: SMOOTH});
  });
  return el;
}
/* list rows: diamond number (or icon) + text, popping in one by one. items: ['text', ...] or [['icon-name', 'text'], ...] */
function rows(c, items, t, css, {gap = 34, size = 50, step = .22, W: Wd = 860, start = 1, icon} = {}) {
  const box = div(`left:${(W - Wd) / 2}px;width:${Wd}px;${css}`, c);
  let y = 0; const made = [];
  items.forEach((it, k) => {
    const [ic, text] = Array.isArray(it) ? it : [icon, it];
    const r = div(`left:0;top:0;width:${Wd}px;position:relative;margin-bottom:${gap}px`, box); r.className = 'row'; r.style.position = 'relative';
    r.innerHTML = `<div class="bul"><span>${ic ? ico(ic, 40, '#0A0A0A', 2.6) : start + k}</span></div><div class="rt" style="font-size:${size}px">${text}</div>`;
    A(r, [{opacity: 0, transform: 'translateX(-40px)', filter: 'blur(8px)'}, {opacity: 1, transform: 'none', filter: 'blur(0)'}], t + k * step, .36, {e: SPRING});
    sfx('pop_lo', t + k * step, -28);
    made.push(r);
  });
  return made;
}
/* picture as given (object-fit contain). anim 'blur' | 'up' | 'right' | 'left' | 'none' (there from frame 0 — MP4 covers). drift = slow push-in (motion only) */
function pic(c, src, t, css, {anim = 'blur', drift = .04, d = .5, fit: f = 'contain', pos = '50% 50%'} = {}) {
  const w = div(css + ';overflow:hidden', c), im = document.createElement('img'); im.src = src; w.classList.add('mg'); im.style.cssText = `width:100%;height:100%;object-fit:${f};object-position:${pos};display:block`; w.appendChild(im);
  const from = {blur: 'scale(1.06)', up: 'translateY(120px)', right: 'translateX(420px)', left: 'translateX(-420px)'}[anim];
  if (anim !== 'none') A(w, [{opacity: 0, transform: from, filter: 'blur(18px)'}, {opacity: 1, transform: 'none', filter: 'blur(0)'}], t, d, {e: anim === 'blur' ? SMOOTH : SPRING});
  if (drift && c.t1) A(im, [{transform: 'scale(1)'}, {transform: `scale(${1 + drift})`}], c.t0, c.t1 - c.t0, {e: 'linear', idle: true});
  return w;
}
/* photo card: rounded crop with shadow (the user's photo / a frame from their talking-head clip). pos = focus point */
function photo(c, src, t, css, {radius = 40, pos = '50% 35%', anim = 'up', shadow = true, drift = .03, border} = {}) {
  const w = pic(c, src, t, css, {anim, drift, fit: 'cover', pos});
  w.style.borderRadius = radius + 'px';
  if (shadow) w.style.boxShadow = '0 40px 90px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.2)';
  if (border) w.style.border = border;
  return w;
}
/* legibility scrim over a full-bleed photo (black → transparent). Not a colour grade: only where text sits on the photo */
function shade(c, {side = 'bottom', size = .6, o = .78} = {}) {
  const dir = {bottom: 'to top', top: 'to bottom', left: 'to right', right: 'to left'}[side];
  const dim = side === 'bottom' || side === 'top' ? `left:0;right:0;${side}:0;height:${size * 100}%` : `top:0;bottom:0;${side}:0;width:${size * 100}%`;
  return div(`${dim};background:linear-gradient(${dir},rgba(0,0,0,${o}),rgba(0,0,0,${o * .55}) 45%,transparent)`, c);
}
function pill(c, text, t, css, {sound = true} = {}) {
  const p = div(css, c, text); p.className = 'pill';
  A(p, [{opacity: 0, transform: 'translateY(40px) scale(.92)', filter: 'blur(8px)'}, {opacity: 1, transform: 'none', filter: 'blur(0)'}], t, .32, {e: SPRING});
  if (sound) sfx('pop_lo', t, -27);
  return p;
}
function strike(chunkEl, t, color) {          // line drawn through a chunk (e.g. "ไม่ใช่ส่วนลด")
  const s = document.createElement('div'); s.className = 'strike'; if (color) s.style.background = color; chunkEl.appendChild(s);
  A(s, [{transform: 'scaleX(0)'}, {transform: 'scaleX(1)'}], t, .24, {e: INOUT});
  sfx('swipe', t, -24);
  return s;
}
function num(c, n, t, css) {
  const b = div(css, c, `<span>${n}</span>`); b.className = 'num';
  A(b, [{opacity: 0, transform: 'scale(.4) rotate(-30deg)'}, {opacity: 1, transform: 'none'}], t, .34, {e: SPRING});
  sfx('pop', t, -26); return b;
}
function curl(c, t, color = '#000') {        // thin black page-curl crescents in two corners (poster look)
  const tr = div('right:0;top:0', c, `<svg width="110" height="110" viewBox="0 0 170 170"><path d="M170 0H0Q140 22 170 170Z" fill="${color}"/></svg>`);
  const bl = div('left:0;bottom:0', c, `<svg width="130" height="130" viewBox="0 0 210 210"><path d="M0 0V210H210Q34 180 0 0Z" fill="${color}"/></svg>`);
  for (const [e, f] of [[tr, 'translate(90px,-90px)'], [bl, 'translate(-110px,110px)']]) A(e, [{transform: f}, {transform: 'none'}], t, .45, {e: SMOOTH});
}

/* ===================== MOTION GRAPHICS KIT (Jitter × Swishy) — same as talking-head-editorial =====================
   Used when the user gives no photos. Flat rounded UI shapes + Lucide line icons (Jitter) with springy overshoot,
