<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"KeyIt";src:url(fonts/Kanit-BlackItalic.ttf)}
@font-face{font-family:"LeadIt";src:url(fonts/Kanit-MediumItalic.ttf)}
@font-face{font-family:"UiIt";src:url(fonts/Kanit-SemiBoldItalic.ttf)}
@font-face{font-family:"UiBold";src:url(fonts/Kanit-ExtraBoldItalic.ttf)}
@font-face{font-family:"Ui";src:url(fonts/Kanit-Medium.ttf)}
/* glass-ui palette: one blue family (sky → accent → deep) + white / dark glass; green & red only for yes / no meaning */
:root{--acc:#2F8CFF;--sky:#8FDCFF;--deep:#1557E6;--good:#34C759;--bad:#FF3B30;--navy:#0E1B33}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{position:relative;color:#fff;font-family:"LeadIt",sans-serif}
.layer{position:absolute;inset:0;pointer-events:none}
#world{transform-origin:0 0}
#cam{transform-origin:50% 45%}
#v{position:absolute;left:0;top:0;width:1080px;height:1920px;display:block}   /* NO colour grade: footage stays as shot */
.emo{font-family:"Noto Color Emoji",sans-serif;font-style:normal;line-height:1;white-space:nowrap}

/* ---------- captions: small italic lead · big gradient italic key · small italic tail ---------- */
.cap{position:absolute;left:0;width:1080px;display:flex;justify-content:center;opacity:0}
.cbox{display:grid;justify-items:center;transform-origin:50% 0}
.row{display:flex;align-items:baseline;white-space:nowrap;column-gap:.2em}   /* row font-size = its words' size (set in cap) */
.row.lead{justify-self:start;padding-left:.5em;margin-bottom:-.2em}
.row.tail{justify-self:end;padding-right:.2em;margin-top:-.14em}
.row.key{column-gap:.4em}   /* .k's negative side margins eat .24em of this */
.w{display:inline-block;white-space:nowrap;opacity:0}
.l{font-family:"LeadIt";font-size:50px;line-height:1.2;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.45)}
.kw{display:inline-block;filter:drop-shadow(0 8px 18px rgba(21,87,230,.5)) drop-shadow(0 2px 2px rgba(0,12,48,.55))}
/* padding/margin pair: the gradient must also cover Thai upper vowels and the italic overhang */
.k{display:inline-block;font-family:"KeyIt";font-size:128px;line-height:1;letter-spacing:-1px;text-transform:uppercase;white-space:nowrap;opacity:0;
  padding:.26em .16em .16em .08em;margin:-.26em -.16em -.16em -.08em;
  background:linear-gradient(180deg,#F2FCFF 0,#F2FCFF .46em,var(--sky) .66em,var(--acc) .95em,var(--deep) 1.22em,var(--deep) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.9)}
.kt{display:inline-block;font-family:"UiBold";line-height:1;white-space:nowrap;padding:.22em .12em .14em .04em;margin:-.22em -.12em -.14em -.04em;
  background:linear-gradient(180deg,var(--sky) .3em,var(--acc) .72em,var(--deep) 1.1em);-webkit-background-clip:text;background-clip:text;color:transparent}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="mb" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB"><feGaussianBlur id="mbg" stdDeviation="0 0" edgeMode="duplicate"/></filter></svg>
<div class="layer" id="B"></div>
<div class="layer" id="world">
  <div class="layer" id="cam"><img id="v"></div>
  <div class="layer" id="S"></div>
  <div class="layer" id="g"></div>
</div>
<div class="layer" id="flash" style="background:#fff;opacity:0"></div>
<script>
/* ===================== CORE ===================== */
const G = document.getElementById('g'), S = document.getElementById('S'), B = document.getElementById('B');
const CAMEL = document.getElementById('cam'), WORLD = document.getElementById('world');
const SFX = [], ZOOM = [], HOOKS = [], FITS = [], ANIMS = [], CAM = [], CAPS = [], SCREENS = [], WIDGETS = [];
const ms = s => s * 1000;
const sfx = (s, t, db = -14, pitch) => SFX.push(pitch ? {s, t, db, pitch} : {s, t, db});
const zoom = (t, z, d = .35) => ZOOM.push({t, z, d});            // video only (captions / widgets stay put); eased, not a hard cut
const SPRING = 'cubic-bezier(.22,1.3,.36,1)', SMOOTH = 'cubic-bezier(.2,.8,.2,1)', INOUT = 'cubic-bezier(.65,0,.35,1)', BOUNCE = 'cubic-bezier(.34,1.56,.64,1)';
/* every animation is registered: document.getAnimations() drops finished fill:'none' ones, which breaks backward seeks */
const A = (el, kf, t, d, o = {}) => { const a = el.animate(kf, {delay: ms(t), duration: ms(d), easing: o.e ?? SMOOTH, fill: o.f ?? 'both', iterations: o.it ?? 1, direction: o.dir ?? 'normal'}); ANIMS.push(a); return a; };
const div = (css, parent, html = '') => { const d = document.createElement('div'); d.style.cssText = 'position:absolute;' + css; d.innerHTML = html; parent.appendChild(d); return d; };
const mk = (tag, cls, parent, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; parent.appendChild(e); return e; };
const seg = new Intl.Segmenter('th', {granularity: 'grapheme'});
const graphemes = s => [...seg.segment(s)].map(x => x.segment);
const ACC = '#2F8CFF', SKY = '#8FDCFF', DEEP = '#1557E6', GOOD = '#34C759', BAD = '#FF3B30', NAVY = '#0E1B33';
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };
const visible = (el, t0, t1) => A(el, [{opacity: 1}, {opacity: 1}], t0, t1 - t0, {f: 'none', e: 'linear'});   // shown only inside [t0,t1)
const rnd = k => { const x = Math.sin(k * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };       // seeded → every render identical
const clamp01 = x => Math.max(0, Math.min(1, x));
const ease = p => 1 - Math.pow(1 - p, 3);
const easeIO = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const isIcon = s => /^[a-z0-9-]+$/.test(s);   // Lucide name, otherwise treated as an emoji / text

/* ===================== CAPTIONS =====================
   cap({t0, t1, top, lead: [[text, t], ...], key: [[TEXT, t], ...], tail: [[text, t], ...]})
   lead / tail = small white italic words (fade up word by word); key = big gradient italic word(s) that wipe in left → right. */
function cap(b) {
  const el = div(`top:${b.top ?? 1000}px`, G); el.className = 'cap';
  const box = mk('div', 'cbox', el), z = b.size ?? {};
  const list = x => x == null ? [] : typeof x === 'string' ? [[x, b.t0]] : x;
  const L = list(b.lead), K = list(b.key), T = list(b.tail);
  el.keys = [];
  const row = (cls, size) => { const r = mk('div', 'row ' + cls, box); r.style.fontSize = size + 'px'; return r; };
  if (L.length) { const r = row('lead', z.l ?? 50); for (const [x, t, o] of L) lw(r, x, t, z.l ?? 50, o); }
  if (K.length) { const r = row('key', z.k ?? 128); for (const [x, t, o] of K) el.keys.push(kw(r, x, t, z.k ?? 128, o)); }
  if (T.length) { const r = row('tail', z.t ?? 44); for (const [x, t, o] of T) lw(r, x, t, z.t ?? 44, o); }
  if (!K.length) box.querySelectorAll('.row').forEach(r => { r.style.justifySelf = 'center'; r.style.padding = '0'; });
  const W = b.maxW ?? 980;
  FITS.push(() => { const w = box.offsetWidth; if (w > W) box.style.transform = `scale(${W / w})`; });
  visible(el, b.t0, b.t1);
  if ((b.out ?? 'blur') === 'blur') A(el, [{opacity: 1, filter: 'blur(0)'}, {opacity: 0, filter: 'blur(12px)'}], Math.max(b.t0, b.t1 - .15), .15, {f: 'forwards', e: 'ease-in'});
  CAPS.push({el, t0: b.t0});
  return el;
}
function lw(r, x, t, size, o = {}) {
  const w = mk('span', 'w l', r, x); w.style.fontSize = size + 'px'; if (o.color) w.style.color = o.color;
  A(w, [{opacity: 0, transform: 'translateY(12px)', filter: 'blur(6px)'}, {opacity: 1, transform: 'none', filter: 'none'}], t, .2);
  return w;
}
function kw(r, x, t, size, o = {}) {
  const wr = mk('span', 'kw', r), k = mk('span', 'k', wr, x); k.style.fontSize = size + 'px';
  A(k, [{opacity: 0, clipPath: 'inset(-40% 100% -40% -20%)', transform: 'translateX(-30px)', filter: 'blur(9px)'},
        {opacity: 1, offset: .3},
        {opacity: 1, clipPath: 'inset(-40% -20% -40% -20%)', transform: 'none', filter: 'none'}], t, o.d ?? .3, {e: SMOOTH});
  return k;
}
const keyHit = (t, db = -22) => sfx('softswish', t - .04, db);

/* ===================== CAMERA =====================
   zoom()    – video only, eased (captions and widgets stay put)
   push()    – the whole picture (video + captions + widgets) pushes in on a point, with motion blur on the way in / out
   blurIn()  – defocus → sharp snap (scene change on continuous footage)
   whip()    – directional motion-blur whip (bigger energy change)
   shake()   – short decaying shake on an impact word */
const blurIn = (t, {px = 24, d = .32, z = 1.05, sound = 'whoosh', db = -27} = {}) => { CAM.push({k: 'blur', t, px, d, z}); if (sound) sfx(sound, t - .12, db); };
const whip = (t, {dir = 'up', px = 48, dist = 110, d = .34, sound = 'whoosh', db = -24} = {}) => { CAM.push({k: 'whip', t, dir, px, dist, d}); if (sound) sfx(sound, t - d * .45, db); };
const push = (t0, t1, {z = 1.6, x = 540, y = 1150, d = .38, blur = 8, sound = 'softswish', db = -24} = {}) => { CAM.push({k: 'push', t0, t1, z, x, y, d, blur}); if (sound) sfx(sound, t0 - .03, db); };
const shake = (t, {d = .35, a = 14, sound = 'thud', db = -22} = {}) => { CAM.push({k: 'shake', t, d, a}); if (sound) sfx(sound, t, db); };
const flash = (t, o = .6) => A(document.getElementById('flash'), [{opacity: o}, {opacity: 0}], t, .16, {f: 'none', e: 'ease-out'});

/* ===================== GLASS WIDGETS =====================
   widget(): positioned box on the caption layer. One at a time (engine throws if two overlap in time).
   Glass = backdrop-filter. Never put opacity < 1 or a filter on an ANCESTOR of a glass element at rest
   (it becomes the backdrop root and the blur sees nothing) — the helpers below end every animation on opacity 1 / filter none. */
const GLASS = {
  dark: 'background:linear-gradient(180deg,rgba(72,86,116,.36),rgba(10,16,30,.46));border:2px solid rgba(255,255,255,.6);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),inset 0 -10px 24px rgba(140,200,255,.08),0 16px 40px rgba(0,0,0,.32);backdrop-filter:blur(18px) saturate(1.5)',
  blue: `background:linear-gradient(160deg,${rgba(SKY, .82)},${rgba(ACC, .76)} 55%,${rgba(DEEP, .78)});border:2px solid rgba(255,255,255,.55);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 20px 50px ${rgba(DEEP, .35)};backdrop-filter:blur(16px) saturate(1.4)`,
  light: 'background:linear-gradient(180deg,rgba(255,255,255,.86),rgba(236,246,255,.74));border:2px solid rgba(255,255,255,.95);box-shadow:0 18px 44px rgba(0,30,90,.25);backdrop-filter:blur(16px) saturate(1.3)',
};
function widget(css, t0, t1, {enter = 'rise', exit = 'blur', sound = 'softswish', db = -25} = {}) {
  const w = div(css + ';opacity:0', G);
  const from = {rise: 'translateY(56px) scale(.9)', pop: 'scale(.55)', left: 'translateX(-110px)', right: 'translateX(110px)', down: 'translateY(-56px) scale(.9)'}[enter];
  if (from) A(w, [{opacity: 0, transform: from, filter: 'blur(12px)'}, {opacity: 1, transform: 'none', filter: 'none'}], t0, .42, {e: enter === 'pop' ? BOUNCE : SPRING});
  else A(w, [{opacity: 0}, {opacity: 1}], t0, .001);   // 'none': the children animate themselves
  const out = {blur: [{opacity: 1, filter: 'none', transform: 'none'}, {opacity: 0, filter: 'blur(14px)', transform: 'scale(.95)'}],
               pop: [{opacity: 1, transform: 'none'}, {opacity: 0, transform: 'scale(.7)'}], cut: [{opacity: 0}, {opacity: 0}]}[exit];
  A(w, out, exit === 'cut' ? t1 : t1 - .18, exit === 'cut' ? .001 : .18, {f: 'forwards', e: 'ease-in'});
  if (sound) sfx(sound, t0 - .03, db);
  w.t0 = t0; w.t1 = t1; WIDGETS.push([t0, t1]);
  return w;
}
/* wrapper (position + idle float) → inner (entrance). Keeps transforms from fighting each other. */
function holder(c, css) { const o = div(css, c), i = div('position:relative', o); return [o, i]; }
const popIn = (el, t, {d = .5, from = 'scale(0) rotate(-14deg)', e = BOUNCE} = {}) => A(el, [{opacity: 0, transform: from}, {opacity: 1, transform: 'none'}], t, d, {e});
const float = (el, t0, t1, {a = 12, p = 1.7, delay = 0} = {}) => A(el, [{transform: 'translateY(0)'}, {transform: `translateY(${-a}px)`}], t0 + delay, p / 2, {it: Math.max(1, Math.ceil((t1 - t0) / (p / 2))), dir: 'alternate', e: 'ease-in-out', f: 'none'});
const punch = (el, t, s = 1.12) => A(el, [{transform: 'scale(1)'}, {transform: `scale(${s})`, offset: .35}, {transform: 'scale(1)'}], t, .42, {f: 'none', e: 'ease-out'});
const wobble = (el, t, {d = .55, a = 8} = {}) => A(el, [{transform: 'rotate(0)'}, {transform: `rotate(${-a}deg)`, offset: .2}, {transform: `rotate(${a}deg)`, offset: .45}, {transform: `rotate(${-a * .6}deg)`, offset: .7}, {transform: 'rotate(0)'}], t, d, {f: 'none', e: 'ease-in-out'});
