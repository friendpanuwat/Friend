<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"KeyFont";src:url(fonts/Mitr-Bold.ttf);font-weight:700}
@font-face{font-family:"MidFont";src:url(fonts/Mitr-SemiBold.ttf);font-weight:600}
@font-face{font-family:"BodyFont";src:url(fonts/Mitr-Medium.ttf);font-weight:500}
@font-face{font-family:"SmallFont";src:url(fonts/Sriracha-Regular.ttf);font-weight:400}
@font-face{font-family:"SerifFont";src:url(fonts/Taviraj-thai-300-normal.woff2);font-weight:300;unicode-range:U+02D7,U+0303,U+0331,U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:"SerifFont";src:url(fonts/Taviraj-latin-300-normal.woff2);font-weight:300;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"SerifItalic";src:url(fonts/Taviraj-thai-400-italic.woff2);font-style:italic;unicode-range:U+02D7,U+0303,U+0331,U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:"SerifItalic";src:url(fonts/Taviraj-latin-400-italic.woff2);font-style:italic;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* text palette — #FFFFFF + key words dark purple #5B2A86 */
:root{--blue:#5B2A86}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{position:relative;color:#fff;font-family:"MidFont",sans-serif}
#v,#fg,#fgo{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:47% 42%}   /* zoom origin = talking-head-motion */
.layer{position:absolute;inset:0;pointer-events:none}
#page{position:absolute;inset:0;background:#000;overflow:hidden}
#pv{position:absolute;left:-90px;top:-160px;width:1260px;height:2240px;object-fit:cover;filter:blur(38px) brightness(.5);opacity:0}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
#vw{position:absolute;inset:0;overflow:hidden}
#vshadow{position:absolute;inset:0;border-radius:56px;background:#000;box-shadow:0 50px 140px rgba(0,0,0,.65);opacity:0}
#fgo{opacity:0}

/* ---------- effect parts ---------- */
.card{position:absolute;border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 24px 60px rgba(0,0,0,.45),0 0 0 1.5px rgba(255,255,255,.4)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .txt{padding:22px 24px;font-family:"BodyFont";font-size:28px;line-height:1.35;color:#111}
.dglass{background:rgba(16,16,19,.84);border:1.5px solid rgba(255,255,255,.14);border-radius:30px;box-shadow:0 30px 80px rgba(0,0,0,.5);backdrop-filter:blur(18px)}
.paper{background:#F4F1EA;color:#111;box-shadow:0 14px 34px rgba(0,0,0,.4)}

/* ---------- typography (identical to talking-head-motion) ---------- */
.block{position:absolute;left:60px;width:960px;display:flex;flex-direction:column;align-items:center;transform-origin:50% 0}
.line{display:flex;align-items:baseline;justify-content:center;gap:18px;white-space:nowrap;perspective:900px}
.chunk{display:inline-block;white-space:nowrap}
.g{display:inline-block;opacity:0;transform-origin:50% 80%;will-change:transform,opacity,filter}
.s{font-family:"SmallFont";font-size:60px;line-height:1.25;color:#fff}
.m{font-family:"MidFont";font-size:90px;line-height:1.18;font-weight:600;color:#fff}
.k{font-family:"KeyFont";font-size:136px;line-height:1.14;font-weight:700;letter-spacing:-1px;color:var(--blue)}
.k .g{text-shadow:0 0 34px rgba(0,0,0,.55),0 6px 24px rgba(0,0,0,.55)}   /* black shadow (talking-head-motion glow shape, in black) */
.s .g,.m .g{text-shadow:0 4px 22px rgba(0,0,0,.65),0 1px 4px rgba(0,0,0,.5)}
</style></head>
<body>
<div id="page"><img id="pv"></div>            <!-- behind everything: blurred copy of the clip / solid page (seen when the stage shrinks) -->
<div class="layer" id="P"></div>               <!-- page graphics (behind the whole video) -->
<div id="stage">                               <!-- the video "camera" — effects scale/move it as one piece -->
  <div id="vshadow"></div>
  <div id="vw"><img id="v"></div>   <!-- layer 1 (bottom): the clip as-is -->
  <div class="layer" id="B"></div>             <!-- graphics BEHIND the person -->
  <img id="fgo">                               <!-- outline copy of layer 2 (doodle boil) -->
  <img id="fg">                                <!-- layer 2: the same clip, background removed (layers.py) -->
  <div class="layer" id="F"></div>             <!-- graphics IN FRONT of the person — never over the face -->
</div>
<div class="layer" id="W"></div>               <!-- UI chrome over the shrunk video (pull-back window, prompt box) -->
<div class="layer" id="g"></div>   <!-- layer 3 (top-most): captions — always above both video layers -->
<svg width="0" height="0" style="position:absolute"><defs>
  <filter id="ring" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">   <!-- doodle boil: wobbly line around the person -->
    <feMorphology in="SourceAlpha" operator="dilate" radius="13" result="d1"/>
    <feMorphology in="SourceAlpha" operator="dilate" radius="10" result="d2"/>
    <feComposite in="d1" in2="d2" operator="out" result="r"/>
    <feTurbulence id="ringNoise" type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="1" result="n"/>
    <feDisplacementMap in="r" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G" result="w"/>
    <feFlood flood-color="#fff"/><feComposite in2="w" operator="in"/>
  </filter>
</defs></svg>
<script>
/* ===================== CORE ===================== */
const $ = id => document.getElementById(id);
const G = $('g'), B = $('B'), F = $('F'), W = $('W'), PG = $('P');
const HOOKS = [], FITS = [], ZOOM = [];
const ms = s => s * 1000;
const zoom = (t, z, d = .14) => ZOOM.push({t, z, d});   // camera zoom (talking-head-motion) — moves both video layers together
const ease = p => 1 - Math.pow(1 - p, 3);
function zoomAt(t) { let z = 1; for (const k of [...ZOOM].sort((a, b) => a.t - b.t)) { if (t < k.t) break; z += (k.z - z) * ease(Math.min(1, (t - k.t) / k.d)); } return z; }
const camAt = t => zoomAt(t) * (1.014 + .014 * Math.sin(t * .3));   // + the slow breathing drift of talking-head-motion (kept ≥ 1 so no frame edge shows — there is no vignette here)
const SPRING = 'cubic-bezier(.22,1.35,.36,1)', SMOOTH = 'cubic-bezier(.2,.8,.2,1)', INOUT = 'cubic-bezier(.65,0,.35,1)';
// every animation is paused at birth and persisted: frames are driven only by seek(), and the browser must never
// auto-remove a finished animation (it does when real time runs past it under load → elements popping in early)
const A = (el, kf, t, d, o = {}) => { const a = el.animate(kf, {delay: ms(t), duration: ms(d), easing: o.e ?? SMOOTH, fill: o.f ?? 'both', iterations: o.it ?? 1, direction: o.dir ?? 'normal', composite: o.c ?? 'replace'}); a.pause(); a.persist(); return a; };
const div = (css, parent, html = '') => { const d = document.createElement('div'); d.style.cssText = 'position:absolute;' + css; d.innerHTML = html; parent.appendChild(d); return d; };
const seg = new Intl.Segmenter('th', {granularity: 'grapheme'});
const graphemes = s => [...seg.segment(s)].map(x => x.segment);
const BLUE = '#5B2A86';

/* kinetic text: every grapheme flips up in 3D with a spring, staggered */
function kinetic(parent, txt, cls, t, {stagger, color} = {}) {
  const c = document.createElement('span'); c.className = 'chunk ' + cls;
  if (color) c.style.color = color;
  parent.appendChild(c);
  const big = cls.includes('k'), st = stagger ?? (big ? .032 : .016);
  graphemes(txt).forEach((ch, i) => {
    const g = document.createElement('span'); g.className = 'g'; g.textContent = ch === ' ' ? ' ' : ch; c.appendChild(g);
    const ti = t + i * st;
    A(g, [{opacity: 0, transform: `translateY(${big ? 55 : 40}%) rotateX(${big ? -85 : -60}deg) scale(${big ? 1.15 : 1.05})`, filter: 'blur(10px)'},
          {opacity: 1, transform: 'none', filter: 'blur(0)'}], ti, big ? .48 : .36, {e: SPRING});
    if (big) A(g, [{color: '#FFFFFF'}, {color: BLUE}], ti + .16, .35, {e: 'ease-out'});   // white-hot ignite → dark purple
  });
  return c;
}

/* ===================== PLACEMENT — never cover the face ===================== */
/* face(top, bottom, t0?, t1?) declares the y-band of the speaker's head (hair → chin) for a time range,
   measured on the clip's own contact sheet. Every caption block is placed outside it. */
const FACE = [], FACE_ERRORS = [];
const face = (top, bottom, t0 = 0, t1 = 1e9) => FACE.push({top, bottom, t0, t1});
const ZONE = {top: 1225, bottom: 1665, gap: 40, ceil: 540};   // ceil = highest a caption may go (below a top UI box / platform header)   // default caption zone (talking-head-motion) · bottom 255 px kept for platform UI
const ZOY = 1920 * .42;   // zoom origin y — a face band at y grows to ZOY + (y - ZOY) * zoom
/* RULE: every zoom — slow, fast, any kind — scales layer 1 and layer 2 by the SAME amount at the SAME frame.
   Camera zoom sets one value on both <img>s; effects only scale #stage, which holds both. Never scale one layer alone.
   stage = the whole video "camera" (both layers + behind/front graphics). Effects push t => {s, ox, oy, tx, ty, blur} | null */
const STAGE = [];
function stageAt(t) {   // composed uniform-scale affine: p → a·p + (bx, by)
  let a = 1, bx = 0, by = 0, blur = 0;
  for (const f of STAGE) { const k = f(t); if (!k) continue;
    const s = k.s ?? 1, ox = k.ox ?? 540, oy = k.oy ?? 960;
    const cx = ox * (1 - s) + (k.tx ?? 0), cy = oy * (1 - s) + (k.ty ?? 0);
    a *= s; bx = s * bx + cx; by = s * by + cy; blur = Math.max(blur, k.blur ?? 0); }
  return {a, bx, by, blur};
}
const mapY = (y, t) => { const st = stageAt(t); return st.a * (ZOY + (y - ZOY) * camAt(t)) + st.by; };
const faceAt = (t0, t1) => FACE.filter(f => f.t0 < t1 && f.t1 > t0).map(f => {
  let top = 1e9, bottom = -1e9;
  for (let t = t0; t <= t1 + 1e-6; t += 1 / 30) { top = Math.min(top, mapY(f.top, t)); bottom = Math.max(bottom, mapY(f.bottom, t)); }
  return {...f, top: Math.round(top), bottom: Math.round(bottom)}; });
const overlaps = (a0, a1, b0, b1) => a0 < b1 && a1 > b0;

/* block of lines: [[ [text, style, t, size?], ... ], ...]  style s|m|k
   top omitted → default zone, pushed below the face if the face reaches into it.
   center: true → mid-screen (760) — only where no face band is declared at that time (e.g. over a scene). */
function block(b) {
  const el = div(`top:${b.top ?? (b.center ? 760 : ZONE.top)}px`, G); el.className = 'block';
  for (const ln of b.lines) {
    const L = document.createElement('div'); L.className = 'line'; el.appendChild(L);
    for (const [txt, st, t, size] of ln) { const k = kinetic(L, txt, st, t); if (size) k.style.fontSize = size + 'px'; }
  }
  // fit + place — measured on the first seek, after web fonts have loaded (measuring now would use fallback metrics)
  FITS.push(() => {
    for (const L of el.children) { const w = L.scrollWidth; if (w > 960) L.style.transform = `scale(${960 / w})`; }
    const faces = faceAt(b.t0, b.t1);
    let top = b.top ?? (b.center ? 760 : ZONE.top);
    if (b.top == null && !b.center) for (const f of faces) top = Math.max(top, f.bottom + ZONE.gap);   // "ตามความเหมาะสมของคลิป"
    let maxH = b.center ? 560 : 440;
    if (b.top == null && !b.center) maxH = Math.min(maxH, ZONE.bottom - top);
    // no room under the chin (an effect moved the person down) → go above the head instead, below the top UI zone
    if (b.top == null && !b.center && maxH < Math.min(el.offsetHeight, 440) * .75 && faces.length) {
      const ceil = Math.min(...faces.map(f => f.top)) - ZONE.gap, h = Math.min(el.offsetHeight, 440);
      if (ceil - ZONE.ceil >= h * .75) { maxH = Math.min(440, ceil - ZONE.ceil); top = ceil - Math.min(h, maxH); }
    }
    let s = 1;
    if (el.offsetHeight > maxH) s = Math.max(.01, maxH / el.offsetHeight);
    el.style.top = top + 'px';
    if (s < 1) el.style.transform = `scale(${s})`;
    const y0 = top, y1 = top + el.offsetHeight * s;
    for (const f of faces) if (overlaps(y0, y1, f.top, f.bottom))
      FACE_ERRORS.push(`block ${b.t0}-${b.t1} (y ${Math.round(y0)}-${Math.round(y1)}) covers face band ${f.top}-${f.bottom}`);
    if (s < .6) FACE_ERRORS.push(`block ${b.t0}-${b.t1} shrunk to ${Math.round(s * 100)}% to stay off the face — split it or shorten it`);
  });
  A(el, [{opacity: 1, filter: 'blur(0)', translate: '0 0'}, {opacity: 0, filter: 'blur(16px)', translate: '0 -50px'}], b.t1 - .16, .16, {e: 'cubic-bezier(.5,0,.9,.5)', f: 'forwards'});
  return el;
}
const text = (parent, txt, cls, t, css = '', o = {}) => { const w = div(`left:0;width:1080px;text-align:center;${css}`, parent); w.style.perspective = '900px'; const k = kinetic(w, txt, cls, t, o); if (o.size) k.style.fontSize = o.size + 'px'; return w; };

/* ===================== EFFECTS — 17 techniques (references/effects.md) ===================== */
/* Shared rules: every effect owns its own elements; shared parts (page, stage, clip of layer 1, layer-2 filter) are written per frame by HOOKS from a reset state, so effects never fight over them.
   Graphics in B sit behind the person; F / W must never cover the face; captions (#g) stay on top of everything. */
const SH = {};            // per-frame shared state, reset in seek()
const INIT = [];          // async work on the first seek (needs the project path: stills of the clip)
const LIVE = [];          // <img>/<image> elements that show the current frame of layer 1
const CLIP = {dur: null, base: ''};
const clip = d => (CLIP.dur = d);                       // optional: clip length (s) — default stills spread over it
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const smooth = p => p * p * (3 - 2 * p);
const outBack = p => { const c = 1.7; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
/* envelope: 0 before t0, ramps to 1 over din, holds, ramps to 0 over dout ending at t1 */
const env = (t, t0, t1, din = .4, dout = .35) => t < t0 || t > t1 ? 0 : Math.min(smooth(clamp((t - t0) / din)), smooth(clamp((t1 - t) / dout)));
const rng = seed => { let s = seed * 9301 + 49297; return () => ((s = (s * 16807) % 2147483647) / 2147483647); };
const BRAND_LIGHT = '#CDB8F0';   // light tint of the brand purple — for lines/glows that must read on dark footage
function faceBox(t = 0) { const f = FACE.find(f => f.t0 <= t && f.t1 > t) ?? FACE[0] ?? {top: 520, bottom: 1150}; return {top: f.top, bottom: f.bottom, cy: (f.top + f.bottom) / 2}; }
const still = t => CLIP.base + 'src_frames/s' + String(Math.max(1, Math.round(t * 30) + 1)).padStart(5, '0') + '.jpg';
function life(el, t0, t1, kIn, kOut, din = .4, dout = .28, e = SPRING) {   // entrance (fill both) + exit (fill forwards)
  A(el, kIn, t0, din, {e});
  A(el, kOut, t1 - dout, dout, {e: 'cubic-bezier(.5,0,.9,.5)', f: 'forwards'});
}
const popIn = (el, t0, t1, d = .4) => life(el, t0, t1, [{opacity: 0, transform: 'scale(.6)'}, {opacity: 1, transform: 'none'}], [{opacity: 1, transform: 'none'}, {opacity: 0, transform: 'scale(.9)'}], d);
function cardHTML(c) {   // {still: s} frame of this clip · {img: url} user image · {title, lines} text card · 'text'
  if (typeof c === 'string') c = {lines: [c]};
  if (c.still != null || c.img) return `<img data-still="${c.still ?? ''}" src="${c.img ?? ''}">`;
  return `<div class="txt">${c.title ? `<div style="font-family:KeyFont;font-size:32px;margin-bottom:8px;color:${BLUE}">${c.title}</div>` : ''}${(c.lines ?? []).join('<br>')}</div>`;
}
INIT.push(async () => { await Promise.all([...document.querySelectorAll('img[data-still]')].filter(i => i.dataset.still !== '').map(i => { i.src = still(+i.dataset.still); return i.decode().catch(() => {}); })); });

/* 01 orbit — cards circle the person; the back half passes BEHIND (B), the front half in front (F), below the chin */
function orbit(t0, t1, cards, {cx = 540, cy, rx = 440, ry = 130, turns = .5, w = 220, h = 300} = {}) {
  const fb = faceBox(t0); cy = cy ?? fb.bottom + 70;
  const items = cards.map((c, i) => { const mk = par => { const e = div(`left:0;top:0;width:${w}px;height:${h}px;opacity:0`, par, cardHTML(c)); e.className = 'card'; return e; };
    return {b: mk(B), f: mk(F), ph: i / cards.length + .25}; });
  HOOKS.push(t => items.forEach((it, i) => {
    const on = env(t, t0 + i * .07, t1, .45, .3);
    it.b.style.opacity = it.f.style.opacity = 0; if (!on) return;
    const th = 2 * Math.PI * (it.ph + turns * (t - t0) / (t1 - t0)), depth = Math.sin(th);
    const x = cx + rx * Math.cos(th), y = cy + ry * depth, sc = (.74 + .26 * depth) * lerp(.5, 1, outBack(clamp((t - t0 - i * .07) / .45)));
    const el = depth > 0 ? it.f : it.b;
    el.style.opacity = clamp(on * 1.3);
    el.style.transform = `translate(${x - w / 2}px,${y - h / 2}px) scale(${sc}) rotate(${-7 * Math.cos(th)}deg)`;
    el.style.filter = `brightness(${.7 + .3 * (depth + 1) / 2})`;
  }));
}

/* 02 couch wall — the background becomes a wall of tiles (stills of this clip / user images); person stays in front */
function couchWall(t0, t1, {tiles, cols = 3, gap = 18} = {}) {
  const dur = CLIP.dur ?? t1 + 20, n = cols * 5;
  tiles = tiles ?? Array.from({length: n}, (_, i) => ({still: dur * (i + .5) / n}));
  const root = div('inset:0;background:#0b0b0c;overflow:hidden', B);
  life(root, t0, t1, [{opacity: 0}, {opacity: 1}], [{opacity: 1}, {opacity: 0}], .2, .25, 'linear');
  const tw = (1080 - gap * (cols + 1)) / cols, th = tw * 16 / 9, r = rng(3);
  tiles.slice(0, n).forEach((c, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    const x = gap + col * (tw + gap), y = -th * .25 + row * (th + gap) + (col % 2 ? th * .3 : 0);
    const rot = (r() - .5) * 5, e = div(`left:${x}px;top:${y}px;width:${tw}px;height:${th}px`, root, cardHTML(c)); e.className = 'card';
    const d = Math.hypot(x + tw / 2 - 540, y + th / 2 - 960) / 1100;
    A(e, [{opacity: 0, transform: `rotate(${rot}deg) scale(.7)`}, {opacity: 1, transform: `rotate(${rot}deg) scale(1)`}], t0 + .05 + d * .35, .4, {e: SPRING});
  });
}

/* 03 ui world — the video drops into the lower half of a light app page; the head breaks out over the page;
   a prompt box types the sentence at the top */
function uiWorld(t0, t1, {prompt = '', page = '#F3F1EC', drop = 380, s = .9} = {}) {
  const fb = faceBox(t0), cut = fb.bottom - 30;
  STAGE.push(t => { const p = env(t, t0, t1, .45, .4); return p ? {s: lerp(1, s, p), ox: 540, oy: 1920, ty: drop * p} : null; });
  HOOKS.push(t => { const p = env(t, t0, t1, .45, .4); if (!p) return;
    SH.page = page; SH.clip = `inset(${cut * p}px 0 0 0 round ${40 * p}px)`; });
  const box = div('left:70px;top:250px;width:940px;padding:34px 36px 26px;border-radius:34px;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.14),0 0 0 1px rgba(0,0,0,.06);opacity:0', W,
    `<div class="ty" style="font-family:BodyFont;font-size:40px;color:#1a1a1a;min-height:56px;white-space:pre-wrap"></div>
     <div style="display:flex;align-items:center;justify-content:space-between;margin-top:18px">
       <div style="font-family:BodyFont;font-size:34px;color:#888">＋</div>
       <div style="width:64px;height:64px;border-radius:50%;background:#1a1a1a;display:flex;align-items:center;justify-content:center">
         <svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>`);
  life(box, t0 + .2, t1, [{opacity: 0, transform: 'translateY(-40px) scale(.96)'}, {opacity: 1, transform: 'none'}], [{opacity: 1}, {opacity: 0}], .45, .3);
  const ty = box.querySelector('.ty'), gs = graphemes(prompt), cps = 20;
  HOOKS.push(t => { if (t < t0 || t > t1) return; const k = clamp(Math.floor((t - t0 - .5) * cps), 0, gs.length);
    ty.textContent = gs.slice(0, k).join('') + ((Math.floor(t * 2.2) % 2 || k < gs.length) ? '|' : ' '); });
}

/* 04 frame break — the video shrinks into a card over its own blurred copy; the person breaks out of the card */
function frameBreak(t0, t1, {s = .8, inset} = {}) {
  const fb = faceBox(t0); const [it, ir, ib, il] = inset ?? [150, 120, Math.max(260, 1920 - (fb.bottom + 330)), 120];
  STAGE.push(t => { const p = env(t, t0, t1, .45, .35); return p ? {s: lerp(1, s, p), ox: 540, oy: 860} : null; });
  HOOKS.push(t => { const p = env(t, t0, t1, .45, .35); if (!p) return;
    SH.pv = p; SH.clip = `inset(${it * p}px ${ir * p}px ${ib * p}px ${il * p}px round ${56 * p}px)`;
    SH.shadow = {o: p, inset: `${it}px ${ir}px ${ib}px ${il}px`}; });

}

/* 15 vertigo — slow push-in on both layers together (exactly in sync, like one clip), then a quick return */
function vertigo(t0, t1, {z = 1.35, back = .25} = {}) {
  const oy = faceBox(t0).cy;
  STAGE.push(t => { if (t < t0 || t > t1) return null;
    const p = t < t1 - back ? INOUTf(clamp((t - t0) / (t1 - back - t0))) : 1 - smooth(clamp((t - (t1 - back)) / back));
    return {s: lerp(1, z, p), ox: 540, oy}; });
}
const INOUTf = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;

/* 16 cover story — magazine cover: a huge serif title behind the head, small print, italic tagline */
function coverStory(t0, t1, {title = '', left = [], right = [], kicker = '', tagline = '', taglineY = 1300, size = 250} = {}) {
  const fb = faceBox(t0), top = Math.max(150, fb.top - size * .3);   // the head overlaps the lower part of the title
  const shade = div('left:0;top:0;width:1080px;height:900px;background:linear-gradient(rgba(0,0,0,.38),rgba(0,0,0,0))', B);
  life(shade, t0, t1, [{opacity: 0}, {opacity: 1}], [{opacity: 1}, {opacity: 0}], .3, .25, 'linear');
  const tl = div(`left:0;width:1080px;top:${top}px;display:flex;justify-content:center;overflow:hidden;font-family:SerifFont;font-weight:300;font-size:${size}px;line-height:1.08;letter-spacing:4px;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.35)`, B);
  graphemes(title).forEach((ch, i) => { const s = document.createElement('span'); s.textContent = ch === ' ' ? ' ' : ch; s.style.display = 'inline-block'; tl.appendChild(s);
    life(s, t0 + .1 + i * .05, t1, [{transform: 'translateY(105%)'}, {transform: 'none'}], [{opacity: 1}, {opacity: 0}], .6, .25, SMOOTH); });
  FITS.push(() => { const w = [...tl.children].reduce((a, c) => a + c.offsetWidth, 0); if (w > 1000) tl.style.fontSize = size * 1000 / w + 'px'; });
  const small = (lines, css) => { const e = div(`top:${top + size * 1.12}px;${css};font-family:BodyFont;font-size:22px;line-height:1.5;letter-spacing:3px;color:#fff`, B, lines.join('<br>'));
    life(e, t0 + .5, t1, [{opacity: 0}, {opacity: 1}], [{opacity: 1}, {opacity: 0}], .4, .25, 'linear'); };
  if (left.length) small(left, 'left:70px'); if (right.length) small(right, 'right:70px;text-align:right');
  if (tagline || kicker) { const e = div(`left:70px;top:${taglineY}px;width:760px;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.45)`, F,
      `${kicker ? `<div style="font-family:BodyFont;font-size:22px;letter-spacing:4px;margin-bottom:10px">${kicker}</div>` : ''}<div style="font-family:SerifItalic;font-style:italic;font-size:76px;line-height:1.08">${tagline.replace(/\n/g, '<br>')}</div>`);
    life(e, t0 + .7, t1, [{opacity: 0, transform: 'translateY(30px)'}, {opacity: 1, transform: 'none'}], [{opacity: 1}, {opacity: 0}], .5, .25, SMOOTH); }
}

/* 17 glass type — huge frosted-glass letters behind the person: the blurred room shows through, edges catch light */
let GLASS_ID = 0;
function glassType(t0, t1, {text = '', y, size = 300} = {}) {
  const id = 'gl' + GLASS_ID++, fb = faceBox(t0), cy = y ?? Math.max(260, fb.top + size * .12);   // letters sit behind the top of the head
  const T = (extra) => `<text x="540" y="${cy}" text-anchor="middle" dominant-baseline="middle" font-family="KeyFont" font-weight="700" font-size="${size}" letter-spacing="6" ${extra}>${text}</text>`;
  const e = svg(1080, 1920, `<defs>
      <clipPath id="${id}c">${T('class="ft"')}</clipPath>
      <filter id="${id}b" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="10"/><feComponentTransfer><feFuncR type="linear" slope="1.5" intercept=".1"/><feFuncG type="linear" slope="1.5" intercept=".1"/><feFuncB type="linear" slope="1.5" intercept=".12"/></feComponentTransfer></filter>
      <filter id="${id}s" x="-5%" y="-10%" width="110%" height="120%"><feGaussianBlur in="SourceAlpha" stdDeviation="7" result="b"/>
        <feSpecularLighting in="b" surfaceScale="7" specularConstant="1.2" specularExponent="26" lighting-color="#fff" result="sp"><fePointLight class="lt" x="200" y="${cy - 200}" z="420"/></feSpecularLighting>
        <feComposite in="sp" in2="SourceAlpha" operator="in"/></filter>
      <linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity=".02"/></linearGradient></defs>
    <g style="filter:drop-shadow(0 24px 40px rgba(0,0,0,.35))"><g clip-path="url(#${id}c)"><image class="lv" width="1080" height="1920" preserveAspectRatio="none" filter="url(#${id}b)"/><rect width="1080" height="1920" fill="url(#${id}g)"/></g></g>
    ${T(`fill="#fff" filter="url(#${id}s)" opacity=".5" class="ft"`)}
    ${T(`fill="none" stroke="rgba(255,255,255,.75)" stroke-width="2.5" class="ft"`)}`, 'left:0;top:0;transform-origin:540px ' + cy + 'px', B);
  const img = e.querySelector('.lv'), lt = e.querySelector('.lt'); LIVE.push(img);
  FITS.push(() => { const w = e.querySelector('text.ft').getComputedTextLength(); if (w > 1000) e.querySelectorAll('text').forEach(x => x.setAttribute('font-size', size * 1000 / w)); });
  HOOKS.push(t => { if (t < t0 || t > t1) return; img.setAttribute('transform', `translate(507.6 806.4) scale(${camAt(t)}) translate(-507.6 -806.4)`);
    lt.setAttribute('x', lerp(-100, 1180, clamp((t - t0) / Math.max(1, t1 - t0)))); });
  life(e, t0, t1, [{opacity: 0, transform: 'scale(1.18)', filter: 'blur(18px)'}, {opacity: 1, transform: 'none', filter: 'blur(0)'}], [{opacity: 1}, {opacity: 0, filter: 'blur(10px)'}], .6, .3, SMOOTH);
}
