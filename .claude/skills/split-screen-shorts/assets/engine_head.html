<!doctype html>
<html><head><meta charset="utf-8">
<style>
/* one loopless family, five weights — hierarchy comes from size, weight and colour, never from glow */
/* ONE font for everything (user's rule): "Accent" and "Display" are the same IBM Plex Sans Thai — the accent words stand out by
   weight and colour, upright (the italic faces map to the upright file, so nothing is slanted) */
@font-face{font-family:"Accent";src:url(fonts/IBMPlexSansThai-600.ttf);font-weight:600;font-style:italic}
@font-face{font-family:"Accent";src:url(fonts/IBMPlexSansThai-700.ttf);font-weight:700 900;font-style:italic}
@font-face{font-family:"Display";src:url(fonts/IBMPlexSansThai-700.ttf);font-weight:700 900}
@font-face{font-family:"Sans";src:url(fonts/IBMPlexSansThai-300.ttf);font-weight:300}
@font-face{font-family:"Sans";src:url(fonts/IBMPlexSansThai-400.ttf);font-weight:400}
@font-face{font-family:"Sans";src:url(fonts/IBMPlexSansThai-500.ttf);font-weight:500}
@font-face{font-family:"Sans";src:url(fonts/IBMPlexSansThai-600.ttf);font-weight:600}
@font-face{font-family:"Sans";src:url(fonts/IBMPlexSansThai-700.ttf);font-weight:700 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{position:relative;color:#fff;font-family:"Sans",sans-serif;font-weight:500;-webkit-font-smoothing:antialiased}
#v,#ed,#pm{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:47% 42%}   /* zoom origin = talking-head-motion */
#pm{display:none;-webkit-mask-size:1080px 1920px;mask-size:1080px 1920px}
.layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <filter id="mbx" x="-30%" y="-10%" width="160%" height="120%"><feGaussianBlur stdDeviation="38 0"/></filter>
  <filter id="mby" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="0 30"/></filter></defs></svg>
<img id="ed">   <!-- edge fill: the same frame, slightly larger, behind the clip (the breathing drift dips below 1.0) -->
<img id="v">    <!-- the clip -->
<div class="layer" id="B"></div>   <!-- graphics BEHIND the speaker (need mattes: titles / particles the head passes in front of) -->
<img id="pm">   <!-- the speaker again, cut out by this frame's matte — sits on top of layer B -->
<div class="layer" id="Q"></div>   <!-- graphics on the clip, in front of the speaker (never over the face) -->
<div class="layer" id="S"></div>   <!-- full-screen scenes -->
<div class="layer" id="X"></div>   <!-- transitions: smoke / flash -->
<div class="layer" id="G"></div>   <!-- captions — top-most -->
<script>
/* ===================== CORE ===================== */
const G = document.getElementById('G'), Q = document.getElementById('Q'), S = document.getElementById('S'), X = document.getElementById('X'), B = document.getElementById('B');
const HOOKS = [], FITS = [], ZOOM = [], GUARDS = [], MATTES = [], SFX = [];
window.MATTES = MATTES; window.SFX = SFX;
const ms = s => s * 1000;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
/* camera zoom — identical to talking-head-motion */
const zoom = (t, z, d = .14, io = false) => ZOOM.push({t, z, d, io});
/* push(t0, t1, z): a slow camera push across a whole line (ease in and out) — the default camera move */
const push = (t0, t1, z = 1.06) => zoom(t0, z, t1 - t0, true);
const ease = p => 1 - Math.pow(1 - p, 3), easeIO = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
function zoomAt(t) { let z = 1; for (const k of ZOOM) { if (t < k.t) break; const p = Math.min(1, (t - k.t) / k.d); z += (k.z - z) * (k.io ? easeIO(p) : ease(p)); } return z; }
const driftAt = t => [7 * Math.sin(t * .23), 5 * Math.sin(t * .17 + 1)];   // a few px of slow lateral drift: a camera, not a tripod
const camAt = t => zoomAt(t) * (1 + .014 * Math.sin(t * .3));   // incl. the slow breathing drift
const SPRING = 'cubic-bezier(.22,1.35,.36,1)', SMOOTH = 'cubic-bezier(.2,.8,.2,1)', INOUT = 'cubic-bezier(.65,0,.35,1)', EXIT = 'cubic-bezier(.5,0,.9,.5)';
// every animation is paused at birth and persisted: frames are driven only by seek(), never by real time
const A = (el, kf, t, d, o = {}) => { const a = el.animate(kf, {delay: ms(t), duration: ms(d), easing: o.e ?? SMOOTH, fill: o.f ?? 'both', iterations: o.it ?? 1, direction: o.dir ?? 'normal', composite: o.c ?? 'replace'}); a.pause(); a.persist(); return a; };
const div = (css, parent, html = '') => { const d = document.createElement('div'); d.style.cssText = 'position:absolute;' + css; d.innerHTML = html; parent.appendChild(d); return d; };
const FADE_OUT = [{opacity: 1}, {opacity: 0}];
/* visible only inside [t0, t1] (entrance + exit animations are added by the caller) */
const window_ = (el, t0, t1) => HOOKS.push(t => { el.style.visibility = t >= t0 - .001 && t <= t1 ? 'visible' : 'hidden'; });
const gseg = new Intl.Segmenter('th', {granularity: 'grapheme'}), wseg = new Intl.Segmenter('th', {granularity: 'word'});
const graphemes = s => [...gseg.segment(s)].map(x => x.segment);
const glen = s => graphemes(s.replace(/\s/g, '')).length;
/* seeded random — the same clip renders the same particles in every worker */
const rnd = seed => { let s = seed % 2147483647 || 7; return () => (s = s * 16807 % 2147483647) / 2147483647; };
/* sound: few and quiet (references/core.md) — scripts/sfx.py mixes them under the untouched voice */
const sfx = (s, t, db = -24) => SFX.push({s, t, db});

/* ===================== SAFE AREA + FACE ===================== */
/* right 180 px = the platform's like · follow · share buttons, top 240 px = the platform's top tabs / header */
const SAFE = {l: 60, r: 900, w: 840, cx: 480, t: 240, b: 1700};   // b: the app's name and caption sit below this — no words or graphics there
/* face(top, bottom, t0, t1, x0, x1): the speaker's head (hair → chin, ear → ear) measured on face_sheet.jpg */
const FACE = [], FACE_ERRORS = [];
const face = (top, bottom, t0 = 0, t1 = 1e9, x0 = 0, x1 = 1080) => FACE.push({top, bottom, t0, t1, x0, x1});
const ZOX = 1080 * .47, ZOY = 1920 * .42;   // zoom origin — a point at y grows to ZOY + (y - ZOY) * zoom
function maxZoom(t0, t1) { let m = 1; for (let t = t0; t <= t1; t += 1 / 30) m = Math.max(m, camAt(t)); return m; }
/* head tracking (scripts/cutout.py track → TRACK [[t, x, y, r], ...]): the camera zooms around the head, and when no face()
   is declared the face box comes from the track */
function headAt(t) { if (typeof TRACK === 'undefined' || !TRACK.length) return null; let i = TRACK.findIndex(r => r[0] > t);
  if (i <= 0) return {x: TRACK[i < 0 ? TRACK.length - 1 : 0][1], y: TRACK[i < 0 ? TRACK.length - 1 : 0][2], r: TRACK[i < 0 ? TRACK.length - 1 : 0][3]};
  const a = TRACK[i - 1], b = TRACK[i], p = (t - a[0]) / (b[0] - a[0]); return {x: lerp(a[1], b[1], p), y: lerp(a[2], b[2], p), r: lerp(a[3], b[3], p)}; }
const trackBox = h => ({x0: h.x - 1.2 * h.r, x1: h.x + 1.2 * h.r, top: h.y - 1.25 * h.r, bottom: h.y + 1.7 * h.r});
function faceAtTracked(t0, t1) { const out = [];
  for (let t = t0; t <= t1 + 1e-6; t += .1) { const h = headAt(t), b = trackBox(h), z = camAt(t);
    out.push({top: h.y - (h.y - b.top) * z, bottom: h.y + (b.bottom - h.y) * z, x0: h.x - (h.x - b.x0) * z, x1: h.x + (b.x1 - h.x) * z}); }
  return [{top: Math.round(Math.min(...out.map(o => o.top))), bottom: Math.round(Math.max(...out.map(o => o.bottom))), x0: Math.round(Math.min(...out.map(o => o.x0))), x1: Math.round(Math.max(...out.map(o => o.x1)))}]; }
const faceAt = (t0, t1) => { if (headAt(t0) && !FACE.some(f => f.t0 < t1 && f.t1 > t0)) return faceAtTracked(t0, t1); const z = maxZoom(t0, t1);
  return FACE.filter(f => f.t0 < t1 && f.t1 > t0).map(f => ({top: Math.round(ZOY + (f.top - ZOY) * z), bottom: Math.round(ZOY + (f.bottom - ZOY) * z),
    x0: Math.round(ZOX + (f.x0 - ZOX) * z), x1: Math.round(ZOX + (f.x1 - ZOX) * z)})); };
function faceBox(t = 0) { const f = faceAt(t, t + .01)[0] ?? {top: 600, bottom: 1050, x0: 330, x1: 750}; return {...f, cy: (f.top + f.bottom) / 2, cx: (f.x0 + f.x1) / 2}; }
const overlaps = (a0, a1, b0, b1) => a0 < b1 && a1 > b0;
/* guard(el, t0, t1, name): render.js checks the element mid-way through its life — it must stay off the face and inside
   the safe area. Every graphic drawn on the clip (layers Q and G) is guarded. */
const guard = (el, t0, t1, name, {face: onFace = true, safe = true} = {}) => GUARDS.push({el, t0, t1, name, onFace, safe});
window.guardTimes = () => GUARDS.map(g => Math.min(g.t1 - .05, g.t0 + Math.min(.6, (g.t1 - g.t0) / 2)));
window.runGuards = t => {
  for (const g of GUARDS) {
    const tm = Math.min(g.t1 - .05, g.t0 + Math.min(.6, (g.t1 - g.t0) / 2));
    if (Math.abs(tm - t) > .001 || inScene(tm) || getComputedStyle(g.el).display === 'none') continue;
    const r = g.el.getBoundingClientRect(); if (!r.width) continue;
    if (g.onFace) for (const f of faceAt(g.t0, g.t1)) if (overlaps(r.top, r.bottom, f.top, f.bottom) && overlaps(r.left, r.right, f.x0, f.x1))
      FACE_ERRORS.push(`${g.name} ${g.t0}-${g.t1} (x ${Math.round(r.left)}-${Math.round(r.right)} y ${Math.round(r.top)}-${Math.round(r.bottom)}) covers the face (x ${f.x0}-${f.x1} y ${f.top}-${f.bottom})`);
    if (g.safe && (r.right > SAFE.r + 6 || r.top < SAFE.t - 6 || r.left < 20))
      FACE_ERRORS.push(`${g.name} ${g.t0}-${g.t1} (x ${Math.round(r.left)}-${Math.round(r.right)} y ${Math.round(r.top)}) leaves the safe area x ${SAFE.l}-${SAFE.r} · y ≥ ${SAFE.t}`);
  }
};

/* ===================== SCENES (full screen) ===================== */
/* a full-screen scene hides the clip; captions keep running at capY (the reference's one-word captions run over scenes) —
   capY: null hides them for the scene. Returns {root, c}: root = full-bleed background, c = content stage squeezed into
   the safe area (draw for x 60–1020 · y 0–1920 as if the screen were whole; it lands in x 60–900 · y ≥ 240) */
const SCENE_WIN = [];
const sceneAt = t => SCENE_WIN.find(w => t >= w.t0 - .01 && t < w.t1);
const inScene = t => !!sceneAt(t);
const safeStage = root => div('left:0;top:0;width:1080px;height:1920px;transform-origin:540px 1920px;transform:translateX(-60px) scale(.875)', root);
function scene(t0, t1, {bg = '#0B0A09', capY = 1520, capInk = false, enter = 'cut'} = {}) {   // capInk: dark captions on a light stage
  SCENE_WIN.push({t0, t1, capY, capInk});
  const root = div(`inset:0;background:${bg};overflow:hidden`, S);
  window_(root, t0, t1);
  if (enter === 'fade') A(root, [{opacity: 0}, {opacity: 1}], t0, .25);
  if (enter === 'whip') A(root, [{transform: 'translateX(100%)', filter: 'blur(30px)'}, {transform: 'none', filter: 'blur(0)'}], t0, .28);
  if (enter === 'rise') A(root, [{transform: 'translateY(100%)'}, {transform: 'none'}], t0, .32, {e: INOUT});
  return {root, c: safeStage(root)};
}

/* ===================== CAPTIONS ===================== */
/* text colours — stock tokens; scripts/recolor.py swaps each for its colour in theme.json (only theme colours, ever) */
const TXT = {video: '#F0F0F1', videoKey: '#FA5A14', page: '#101112', pageKey: '#C2410C'};
const CAP = {size: 66, minTop: 1100, gap: 170, color: TXT.video, key: TXT.videoKey};
/* the subtitle shadow — its colour is theme.json "subtitle_shadow" (black by default), written in by recolor.py after the theme pass */
const SUB_SHADOW = '0 3px 12px __SUBSH__B3,0 1px 3px __SUBSH__99';
const capShadow = SUB_SHADOW;
const keyShadow = c => SUB_SHADOW;   // no glow, ever
/* split a phrase into short word groups (Thai has no spaces: Intl word segmentation, tiny words merged forward) */
function wordGroups(txt, maxG = 9) {
  const ws = [...wseg.segment(txt)].map(s => s.segment).filter(s => s.trim());
  const out = []; let cur = '';
  for (const w of ws) {
    if (cur && (glen(cur) >= 3 && glen(cur + w) > maxG || /[a-zA-Z0-9]$/.test(cur) && /^[a-zA-Z0-9]/.test(w))) { out.push(cur); cur = ''; }
    cur += (cur && /[a-zA-Z0-9]$/.test(cur) && /^[a-zA-Z0-9]/.test(w) ? ' ' : '') + w;
  }
  if (cur) { if (out.length && glen(cur) < 3) out[out.length - 1] += cur; else out.push(cur); }
  return out;
}
/* capOff(t0, t1): no word captions in this window (a title or band on the clip already says the words) */
const CAP_OFF = [], capOff = (t0, t1) => CAP_OFF.push([t0, t1]);
/* where a caption sits at time t: under the chin on the clip · at the scene's capY in a scene */
function capTop(t0, t1) {
  const sc = sceneAt(t0); if (sc) return sc.capY;
  if (typeof splitAt === 'function' && splitAt(t0 + .05) > .5) return SPLIT.capY;
  if (typeof OVER !== 'undefined') return SAFE.b - OVER.sub + 20;   // the speaker full screen (both skills): down by the hands and forearms
  let top = CAP.minTop; for (const f of faceAt(t0, t1)) top = Math.max(top, f.bottom + CAP.gap); return Math.min(top, SAFE.b - 120);
}
/* say(t0, t1, 'phrase', {key, keyColor, whole}) — the spoken words, one short group at a time (the reference's one-word captions).
   key: a word in the phrase shown in the key colour · whole: true → the whole phrase at once (a punchline) */
function say(t0, t1, txt, {key, keyColor = CAP.key, whole = false, size = CAP.size} = {}) {
  const groups = whole ? [txt] : wordGroups(txt), total = groups.reduce((s, g) => s + glen(g), 0);
  let t = t0;
  groups.forEach((g, i) => {
    const d = (t1 - t0) * glen(g) / total, a = t, b = i === groups.length - 1 ? t1 : t + d; t += d;
    const isKey = key && (g.includes(key) || key.includes(g));
    const el = div(`left:${SAFE.l}px;width:${SAFE.w}px;text-align:center;white-space:nowrap;transform-origin:50% 60%`, G);
    const w = div(`position:relative;display:inline-block;font-family:Sans;font-weight:600;font-size:${size}px;line-height:1.3;letter-spacing:-.005em;color:${isKey ? keyColor : CAP.color};text-shadow:${isKey ? keyShadow(keyColor) : capShadow}`, el, g);
    w.style.position = 'relative';
    window_(el, a, b - .001);
    A(w, [{opacity: 0, transform: 'translateY(18px)'}, {opacity: 1, transform: 'none'}], a, .16, {e: 'cubic-bezier(.16,1,.3,1)'});
    FITS.push(() => { const sc = sceneAt(a); if (sc && sc.capY == null || CAP_OFF.some(([p, q]) => a >= p - .01 && a < q)) { el.style.display = 'none'; return; }
      if (sc?.capInk && !isKey) { w.style.color = '#0B0A09'; w.style.textShadow = 'none'; }
      if (typeof splitAt === 'function' && splitAt(a + .05) > .5) { w.style.color = isKey ? TXT.pageKey : TXT.page; w.style.textShadow = SUB_SHADOW; w.style.fontSize = '50px'; w.style.fontWeight = 700; }   // split screen: a small dark word above the speaker panel
      el.style.top = capTop(a, b) + 'px'; if (w.offsetWidth > SAFE.w - 10) w.style.fontSize = parseFloat(w.style.fontSize) * (SAFE.w - 10) / w.offsetWidth + 'px'; });
    guard(el.firstChild, a, b, 'caption');
  });
}
/* sayLine(t0, t1, [[text, t], ...], {key}) — a sentence that builds word by word on one or two lines ('\n') and stays
   (a two-line caption that builds as it is said) */
function sayLine(t0, t1, parts, {key, keyColor = CAP.key, size = 70, top} = {}) {
  const el = div(`left:${SAFE.l}px;width:${SAFE.w}px;text-align:center;white-space:nowrap;transform-origin:50% 0`, G);
  window_(el, t0, t1);
  for (const [i, [txt, t]] of parts.entries()) {
    if (txt === '\n') { el.appendChild(document.createElement('br')); continue; }
    const isKey = key && txt.includes(key);
    const s = div(`position:relative;display:inline-block;margin:0 .14em;font-family:Sans;font-weight:${isKey ? 700 : 500};font-size:${size}px;line-height:1.25;color:${isKey ? keyColor : '#fff'};text-shadow:${isKey ? keyShadow(keyColor) : capShadow}`, el, txt);
    A(s, [{opacity: 0, transform: 'translateY(24px)'}, {opacity: 1, transform: 'none'}], t, .45, {e: 'cubic-bezier(.16,1,.3,1)'});
  }
  A(el, [{opacity: 1}, {opacity: 0}], t1 - .15, .15, {e: EXIT, f: 'forwards'});
  FITS.push(() => { el.style.top = (top ?? capTop(t0, t1)) + 'px'; const s = Math.min(1, SAFE.w / el.scrollWidth); if (s < 1) el.style.transform = `scale(${s})`; });
  guard(el, t0, t1, 'sayLine');
}
</script>
<script>
