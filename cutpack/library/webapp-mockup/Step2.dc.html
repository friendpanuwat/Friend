<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>CutPack เลือกสไตล์</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&amp;family=Mitr:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0E14}
a{color:#DDFF45}a:hover{color:#EEFF8A}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0B0E14; color: #F2F4F8; font-family: Anuphan, sans-serif; display: flex; flex-direction: column">

  <div style="display: flex; align-items: center; gap: 8px; padding: 12px 16px 8px 8px">
    <a href="Step1.dc.html" aria-label="ย้อนกลับ" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F2F4F8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; gap: 2px; flex: 1">
      <div style="font-size: 18px; font-weight: 700">เลือกสไตล์</div>
      <div style="font-size: 12px; color: #A6AFC0">ขั้นที่ 2 จาก 7 · หน้าตาของคลิป</div>
    </div>
    <div style="font-size: 13px; font-weight: 600; color: #F2F4F8; background: #1C2330; border-radius: 999px; padding: 6px 12px">2/7</div>
  </div>
  <div style="height: 4px; background: #1C2330"><div style="width: 29%; height: 4px; background: #DDFF45"></div></div>

  <div style="flex: 1; overflow-y: auto; padding: 16px 16px 130px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{styles}}" as="st" hint-placeholder-count="2">
        <button onClick="{{st.pick}}" aria-pressed="{{st.on}}" style="{{st.cardStyle}}">
          <div style="position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 9 / 16; background: #000">
            <img src="{{st.img}}" alt="{{st.alt}}" style="width: 100%; height: 100%; object-fit: cover; display: block">
            <sc-if value="{{st.on}}" hint-placeholder-val="{{ false }}">
              <div style="position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; background: #DDFF45; display: flex; align-items: center; justify-content: center">
                <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0B0E14" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"></path></svg>
              </div>
            </sc-if>
          </div>
          <div style="font-size: 16px; font-weight: 700; padding: 10px 2px 2px">{{st.name}}</div>
          <div style="font-size: 12px; color: #A6AFC0; line-height: 1.5; padding: 0 2px 4px">{{st.short}}</div>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 18px; background: #151A23; border: 1px solid #2A3242">
      <div style="font-size: 15px; font-weight: 700">{{cur.name}} เหมาะกับ</div>
      <sc-for list="{{cur.points}}" as="p" hint-placeholder-count="3">
        <div style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.5; color: #D6DBE4">
          <span style="flex: none; width: 6px; height: 6px; border-radius: 50%; background: #DDFF45; margin-top: 8px"></span>
          <span>{{p}}</span>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 16px; background: #1A1730; border: 1px solid #3A2F7A">
      <div style="flex: none; width: 32px; height: 32px; border-radius: 10px; background: #7A5CFF; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"></path><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"></path></svg>
      </div>
      <div style="font-size: 13px; color: #D6D0FF; line-height: 1.6">ทุกสไตล์มีฉากกราฟิกให้เลือกกว่า 80 แบบ ถ้าเนื้อหาไม่ตรงแบบไหน AI จะออกแบบฉากใหม่ให้เฉพาะคลิปนั้น</div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 20px; background: #0F131B; border-top: 1px solid #1F2633; display: flex; flex-direction: column; gap: 6px">
    <a href="Step3.dc.html" style="min-height: 52px; border-radius: 14px; background: #DDFF45; color: #0B0E14; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">ถัดไป: เลือกสี</a>
    <div style="font-size: 12px; color: #7C869A; text-align: center">ราคาเท่ากันทั้ง 2 สไตล์</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const STYLES = [
  { id: 'editorial', name: 'Editorial', img: '/_blob/ee3461041b14c4b255be4424da3a71e8', alt: 'ตัวอย่างสไตล์ Editorial',
    short: 'สลับการ์ดเต็มจอทุก 2–4 วินาที',
    points: ['คลิปสอน อธิบายหลายขั้นตอน หรือมีตัวเลข', 'อยากให้คนดูเห็นภาพประกอบชัด ๆ เต็มจอ', 'ซับคำใหญ่ทีละคำ สีเน้นสีเดียว'] },
  { id: 'overlay', name: 'Overlay', img: '/_blob/88d677c13dee52f323029ccef93da9a2', alt: 'ตัวอย่างสไตล์ Overlay',
    short: 'เห็นหน้าตลอด กราฟิกเล็กเหนือหัว',
    points: ['คลิปเล่าเรื่อง ให้ความรู้สึกคุยกันตรง ๆ', 'อยากให้คนดูเห็นหน้าและสีหน้าตลอดคลิป', 'กราฟิกไม่บังหน้า ไม่ทับปุ่มด้านขวา'] },
];
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 0 }; }
  renderVals() {
    const s = this.state;
    const styles = STYLES.map((st, i) => Object.assign({}, st, {
      on: i === s.sel,
      cardStyle: 'display: flex; flex-direction: column; text-align: left; padding: 8px; border-radius: 18px; cursor: pointer; color: #F2F4F8; background: #151A23; border: 2px solid ' + (i === s.sel ? '#DDFF45' : '#2A3242'),
      pick: () => this.setState({ sel: i }),
    }));
    return { styles, cur: STYLES[s.sel] };
  }
}
</script>
</body>
</html>
