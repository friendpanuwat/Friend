<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>CutPack เลือกสี</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&amp;family=Mitr:wght@500;600&amp;family=Sriracha&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0E14}
a{color:#DDFF45}a:hover{color:#EEFF8A}
button{font-family:inherit}
input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0B0E14; color: #F2F4F8; font-family: Anuphan, sans-serif; display: flex; flex-direction: column">

  <div style="display: flex; align-items: center; gap: 8px; padding: 12px 16px 8px 8px">
    <a href="Step2.dc.html" aria-label="ย้อนกลับ" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F2F4F8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; gap: 2px; flex: 1">
      <div style="font-size: 18px; font-weight: 700">เลือกสีและฟอนต์</div>
      <div style="font-size: 12px; color: #A6AFC0">ขั้นที่ 3 จาก 7 · สีเน้นของคำสำคัญ</div>
    </div>
    <div style="font-size: 13px; font-weight: 600; color: #F2F4F8; background: #1C2330; border-radius: 999px; padding: 6px 12px">3/7</div>
  </div>
  <div style="height: 4px; background: #1C2330"><div style="width: 43%; height: 4px; background: #DDFF45"></div></div>

  <div style="flex: 1; overflow-y: auto; padding: 14px 16px 130px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; gap: 12px; justify-content: center">
      <div style="width: 158px; height: 281px; border-radius: 16px; overflow: hidden; position: relative; background: #000; flex: none">
        <img src="/_blob/d41ed54bb072032ccf832d1664b6d490" alt="ตัวอย่างซับบนคลิป" style="width: 100%; height: 100%; object-fit: cover; display: block">
        <div style="position: absolute; left: 0; right: 0; top: 188px; display: flex; flex-direction: column; align-items: center; gap: 2px">
          <div style="font-family: Mitr, sans-serif; font-weight: 500; font-size: 11px; color: #FFFFFF; text-shadow: 0 1px 3px rgba(0,0,0,.7)">ทำไมยอดวิว</div>
          <div style="{{bigStyle}}">ไม่ขึ้น</div>
        </div>
      </div>
      <div style="width: 158px; height: 281px; border-radius: 16px; overflow: hidden; background: #14213D; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 16px; box-sizing: border-box">
        <div style="font-family: Mitr, sans-serif; font-weight: 500; font-size: 12px; color: #FFFFFF">เหตุผลที่คนเลื่อนผ่าน</div>
        <div style="{{numStyle}}">3</div>
        <div style="font-family: Mitr, sans-serif; font-weight: 500; font-size: 12px; color: #FFFFFF">ข้อ</div>
        <div style="{{lineStyle}}"></div>
      </div>
    </div>
    <div style="font-size: 12px; color: #7C869A; text-align: center; margin-top: -4px">ซับบนคลิป · การ์ดเต็มจอ</div>

    <div style="font-size: 15px; font-weight: 700">สีเน้น</div>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{swatches}}" as="w" hint-placeholder-count="6">
        <button onClick="{{w.pick}}" aria-label="{{w.name}}" aria-pressed="{{w.on}}" style="{{w.style}}"></button>
      </sc-for>
    </div>
    <div style="font-size: 13px; color: #A6AFC0">{{curName}}</div>

    <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 16px; background: #151A23; border: 1px solid #2A3242">
      <label for="hex" style="font-size: 13px; font-weight: 600">สีของฉัน (รหัสสี)</label>
      <div style="display: flex; gap: 8px">
        <div style="{{customDot}}"></div>
        <input id="hex" value="{{hex}}" onChange="{{changeHex}}" placeholder="#FF5A36" style="flex: 1; min-width: 0; height: 44px; box-sizing: border-box; border: 1px solid #3A4458; border-radius: 12px; padding: 0 12px; font-size: 16px; color: #F2F4F8; background: #0F131B">
        <button onClick="{{useHex}}" style="flex: none; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #3A4458; background: #1C2330; color: #F2F4F8; font-size: 14px; font-weight: 600; cursor: pointer">ใช้สีนี้</button>
      </div>
      <sc-if value="{{tooDark}}" hint-placeholder-val="{{ false }}">
        <div style="font-size: 12px; color: #FFCB80; line-height: 1.5">สีนี้เข้มไป อ่านยากบนวิดีโอ ลองสีที่สว่างขึ้น</div>
      </sc-if>
      <sc-if value="{{badHex}}" hint-placeholder-val="{{ false }}">
        <div style="font-size: 12px; color: #FFCB80; line-height: 1.5">ใส่รหัสสีแบบ #RRGGBB เช่น #FF5A36</div>
      </sc-if>
    </div>

    <div style="font-size: 15px; font-weight: 700">ฟอนต์คำใหญ่</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{fonts}}" as="f" hint-placeholder-count="2">
        <button onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="{{f.style}}">
          <span style="{{f.sample}}">ไม่ขึ้น</span>
          <span style="font-size: 12px; color: #A6AFC0">{{f.name}}</span>
        </button>
      </sc-for>
    </div>

    <button onClick="{{toggleSave}}" aria-pressed="{{save}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; border: none; background: transparent; color: #F2F4F8; font-size: 14px; cursor: pointer; padding: 0">
      <span style="{{boxStyle}}">
        <sc-if value="{{save}}" hint-placeholder-val="{{ true }}">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0B0E14" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"></path></svg>
        </sc-if>
      </span>
      จำสีและฟอนต์นี้ไว้ใช้คลิปต่อไป
    </button>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 20px; background: #0F131B; border-top: 1px solid #1F2633; display: flex; flex-direction: column; gap: 6px">
    <a href="Step4.dc.html" style="min-height: 52px; border-radius: 14px; background: #DDFF45; color: #0B0E14; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">ถัดไป: ตรวจซับ</a>
    <div style="font-size: 12px; color: #7C869A; text-align: center">ระหว่างนี้ระบบถอดเสียงเสร็จแล้ว</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const PRESETS = [
  { c: '#DDFF45', name: 'เขียวมะนาว (ค่าเริ่มต้น)' },
  { c: '#FFD23F', name: 'เหลือง' },
  { c: '#FF8A3D', name: 'ส้ม' },
  { c: '#FF6B9A', name: 'ชมพู' },
  { c: '#5CE1FF', name: 'ฟ้า' },
  { c: '#B9A8FF', name: 'ม่วงอ่อน' },
];
const FONTS = [
  { id: 'mitr', name: 'Mitr ตัวหนา', css: "font-family: Mitr, sans-serif; font-weight: 600" },
  { id: 'sriracha', name: 'Sriracha ลายมือ', css: "font-family: Sriracha, cursive; font-weight: 400" },
];
const lum = (hex) => {
  const n = parseInt(hex.slice(1), 16);
  const ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
};
const okHex = (h) => /^#[0-9a-fA-F]{6}$/.test(h);

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { color: '#DDFF45', name: PRESETS[0].name, hex: '#FF5A36', badHex: false, font: 0, save: true }; }
  renderVals() {
    const s = this.state;
    const c = s.color;
    const font = FONTS[s.font];
    const swatches = PRESETS.map((p) => {
      const on = p.c === c;
      return { name: p.name, on, pick: () => this.setState({ color: p.c, name: p.name, badHex: false }),
        style: 'aspect-ratio: 1; min-height: 44px; border-radius: 50%; cursor: pointer; background: ' + p.c + '; border: 3px solid ' + (on ? '#F2F4F8' : '#0B0E14') + '; box-shadow: 0 0 0 1px ' + (on ? p.c : '#2A3242') };
    });
    const fonts = FONTS.map((f, i) => ({ name: f.name, on: i === s.font, pick: () => this.setState({ font: i }),
      sample: f.css + '; font-size: 26px; line-height: 1.2; color: ' + c,
      style: 'display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 8px; border-radius: 14px; cursor: pointer; background: #151A23; color: #F2F4F8; border: 2px solid ' + (i === s.font ? '#DDFF45' : '#2A3242') }));
    const hexOk = okHex(s.hex);
    return {
      swatches, fonts, curName: 'สีที่เลือก: ' + s.name + ' ' + c.toUpperCase(),
      bigStyle: font.css + '; font-size: 30px; line-height: 1.1; color: ' + c + '; text-shadow: 0 2px 6px rgba(0,0,0,.55)',
      numStyle: font.css + '; font-size: 84px; line-height: 1; color: ' + c,
      lineStyle: 'width: 40px; height: 4px; border-radius: 2px; margin-top: 6px; background: ' + c,
      hex: s.hex, badHex: s.badHex, tooDark: hexOk && lum(s.hex) < 0.18,
      customDot: 'flex: none; width: 44px; height: 44px; border-radius: 12px; border: 1px solid #3A4458; background: ' + (hexOk ? s.hex : '#1C2330'),
      changeHex: (e) => this.setState({ hex: e.target.value.trim(), badHex: false }),
      useHex: () => { if (!okHex(s.hex)) { this.setState({ badHex: true }); return; } this.setState({ color: s.hex, name: 'สีของฉัน', badHex: false }); },
      save: s.save, toggleSave: () => this.setState({ save: !s.save }),
      boxStyle: 'flex: none; width: 24px; height: 24px; border-radius: 7px; display: flex; align-items: center; justify-content: center; ' + (s.save ? 'background: #DDFF45; border: none' : 'background: transparent; border: 2px solid #3A4458'),
    };
  }
}
</script>
</body>
</html>
