<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>CutPack สไตล์ Editorial</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Anuphan:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0C0C0D}
a{color:#F2F2F0;text-decoration:none}
.scr{font-family:'Geist','Anuphan',system-ui,sans-serif;color:#F2F2F0;-webkit-font-smoothing:antialiased}
.body{scrollbar-width:none}.body::-webkit-scrollbar{display:none}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.back{width:40px;height:40px;border-radius:999px;border:1px solid rgba(255,255,255,0.14);display:inline-flex;align-items:center;justify-content:center;color:#F2F2F0}
</style>
</helmet>
<div class="scr" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; background: #0C0C0D; background-image: radial-gradient(120% 40% at 50% -12%, rgba(255,255,255,0.12), rgba(255,255,255,0) 62%); display: flex; flex-direction: column">

  <div style="flex-shrink: 0; padding: 14px 20px 6px; display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" class="back" aria-label="ย้อนกลับ">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <span style="font-size: 15px; font-weight: 600">{{name}}</span>
    <span style="width: 40px"></span>
  </div>

  <div class="body" style="flex: 1; min-height: 0; overflow-y: auto">
    <div style="padding: 10px 20px 20px; display: flex; flex-direction: column; gap: 18px">
      <div style="position: relative; width: 100%; aspect-ratio: 9 / 16; border-radius: 20px; overflow: hidden; background: #151516; border: 1px solid rgba(255,255,255,0.10)">
        <video key="{{cur.key}}" src="{{cur.src}}" poster="{{cur.poster}}" controls="{{yes}}" playsInline="{{yes}}" aria-label="{{cur.alt}}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; background: #000"></video>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.4px">{{name}}</h1>
        <p style="margin: 0; font-size: 14.5px; line-height: 1.6; color: rgba(255,255,255,0.72)">{{desc}}</p>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0; padding: 0 2px; font-size: 17px; font-weight: 600">ตัวอย่างอื่น</h2>
        <div style="display: flex; gap: 10px">
          <sc-for list="{{examples}}" as="e" hint-placeholder-count="2">
            <button onClick="{{e.pick}}" aria-pressed="{{e.on}}" aria-label="{{e.alt}}" style="all: unset; cursor: pointer; box-sizing: border-box; width: 96px; aspect-ratio: 9 / 16; border-radius: 14px; overflow: hidden; position: relative; border: {{e.ring}}; background: #151516">
              <img src="{{e.poster}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; opacity: {{e.dim}}">
              <span style="position: absolute; left: 6px; bottom: 6px; height: 20px; padding: 0 7px; border-radius: 999px; background: rgba(12,12,13,0.78); font-size: 11px; display: inline-flex; align-items: center">{{e.len}}</span>
            </button>
          </sc-for>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 20px; background: #151516; border: 1px solid rgba(255,255,255,0.10)">
        <span style="font-size: 15px; font-weight: 600">ในคลิปจะมี</span>
        <sc-for list="{{points}}" as="p" hint-placeholder-count="3">
          <div style="display: flex; align-items: flex-start; gap: 12px">
            <span style="width: 22px; height: 22px; border-radius: 999px; background: #FFFFFF; color: #0C0C0D; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 13px; height: 13px; stroke-width: 3"><path d="M20 6 9 17l-5-5"/></svg>
            </span>
            <span style="font-size: 14px; line-height: 1.55; color: rgba(255,255,255,0.72)">{{p}}</span>
          </div>
        </sc-for>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0; padding: 0 2px; font-size: 17px; font-weight: 600">เหมาะกับ</h2>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{fits}}" as="f" hint-placeholder-count="4">
            <span style="height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14); font-size: 13.5px; color: rgba(255,255,255,0.72); display: inline-flex; align-items: center">{{f}}</span>
          </sc-for>
        </div>
      </div>
    </div>
  </div>

  <div style="flex-shrink: 0; padding: 12px 20px 24px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid rgba(255,255,255,0.08); background: #0C0C0D">
    <a href="Login.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 54px; border-radius: 999px; background: #FFFFFF; color: #0C0C0D; font-size: 16px; font-weight: 600">
      ใช้สไตล์นี้ สร้างคลิป
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </a>
    <span style="text-align: center; font-size: 12.5px; color: rgba(255,255,255,0.5)">ขั้นต่อไป อัปโหลดคลิปพูดหน้ากล้องของคุณ</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 0 }; }
  renderVals() {
    const list = [
      { key: 'a', src: '/_blob/4412bc272efea653a9550cfe95667ddf', poster: '/_blob/9580e8f04b43d51b8499294d13e489f5', len: '0:20', alt: 'ตัวอย่างคลิปสไตล์ Editorial 1' },
      { key: 'b', src: '/_blob/d04a4e11832e762141773c46fa7c29a0', poster: '/_blob/9580e8f04b43d51b8499294d13e489f5', len: '0:09', alt: 'ตัวอย่างคลิปสไตล์ Editorial 2' }
    ];
    const sel = this.state.sel;
    return {
      yes: true,
      name: 'Editorial',
      desc: 'ตัดสลับระหว่างหน้าคนพูดกับการ์ดกราฟิกเต็มจอ ทุก 2–4 วินาที ดูเป็นงานตัดต่อมืออาชีพ',
      cur: list[sel],
      examples: list.map((e, i) => ({ ...e, on: i === sel,
        ring: i === sel ? '2px solid #FFFFFF' : '1px solid rgba(255,255,255,0.10)',
        dim: i === sel ? 1 : 0.6,
        pick: () => this.setState({ sel: i }) })),
      points: [
        'การ์ดกราฟิกเต็มจอ ออกแบบให้ตรงกับประโยคที่พูด',
        'คำสำคัญตัวใหญ่ สีเดียวทั้งคลิป',
        'ซับขึ้นทีละคำ ครบทุกคำ แก้เองได้ก่อนทำคลิป'
      ],
      fits: ['ความรู้ธุรกิจ', 'สอนการตลาด', 'รีวิวแนวสาระ', 'เล่าเรื่อง']
    };
  }
}
</script>
</body>
</html>
