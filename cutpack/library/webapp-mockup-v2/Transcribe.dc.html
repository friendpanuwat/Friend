<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>CutPack ถอดเสียง</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Anuphan:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0C0C0D}
a{color:#F2F2F0;text-decoration:none}
.scr{font-family:'Geist','Anuphan',system-ui,sans-serif;color:#F2F2F0;-webkit-font-smoothing:antialiased}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.back{width:40px;height:40px;border-radius:999px;border:1px solid rgba(255,255,255,0.14);display:inline-flex;align-items:center;justify-content:center;color:#F2F2F0}
.card{border-radius:18px;background:#151516;border:1px solid rgba(255,255,255,0.10)}
@keyframes cpPulse{0%,100%{opacity:.35}50%{opacity:1}}
.wave span{display:inline-block;width:4px;border-radius:999px;background:#FFFFFF;animation:cpPulse 1.1s ease-in-out infinite}
</style>
</helmet>
<div class="scr" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; background: #0C0C0D; background-image: radial-gradient(120% 40% at 50% -12%, rgba(255,255,255,0.12), rgba(255,255,255,0) 62%); display: flex; flex-direction: column">

  <div style="flex-shrink: 0; padding: 14px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Upload.dc.html" class="back" aria-label="ย้อนกลับ">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </a>
      <span style="font-size: 13px; color: rgba(255,255,255,0.5)">ขั้นที่ 2 จาก 4</span>
      <span style="width: 40px"></span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="height: 4px; border-radius: 999px; background: {{s.bar}}"></span>
          <span style="font-size: 11.5px; color: {{s.ink}}">{{s.name}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; padding: 26px 20px 0; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.4px">{{title}}</h1>
      <p style="margin: 0; font-size: 14.5px; line-height: 1.6; color: rgba(255,255,255,0.72)">{{sub}}</p>
    </div>

    <div class="card" style="padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 18px">
      <div style="position: relative; width: 132px; aspect-ratio: 9 / 16; border-radius: 16px; overflow: hidden; background: #222">
        <img src="/_blob/4f80beb0fb22df8da2ca5b9a4d150faa" alt="คลิปที่อัปโหลด" style="width: 100%; height: 100%; object-fit: cover; display: block">
        <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 50%; background: linear-gradient(to top, rgba(0,0,0,0.7), rgba(0,0,0,0))"></div>
        <sc-if value="{{busy}}" hint-placeholder-val="{{true}}">
          <div class="wave" style="position: absolute; left: 0; right: 0; bottom: 18px; height: 28px; display: flex; align-items: center; justify-content: center; gap: 4px">
            <span style="height: 10px; animation-delay: 0s"></span>
            <span style="height: 22px; animation-delay: .15s"></span>
            <span style="height: 14px; animation-delay: .3s"></span>
            <span style="height: 26px; animation-delay: .45s"></span>
            <span style="height: 12px; animation-delay: .6s"></span>
            <span style="height: 18px; animation-delay: .75s"></span>
          </div>
        </sc-if>
      </div>
      <div style="width: 100%; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between; font-size: 13px">
          <span style="color: rgba(255,255,255,0.72)">{{state}}</span>
          <span style="font-variant-numeric: tabular-nums">{{pct}}%</span>
        </div>
        <div style="height: 6px; border-radius: 999px; background: rgba(255,255,255,0.10); overflow: hidden">
          <div style="width: {{pct}}%; height: 100%; border-radius: 999px; background: #FFFFFF"></div>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px; padding: 0 4px">
      <sc-for list="{{jobs}}" as="j" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="width: 24px; height: 24px; border-radius: 999px; background: {{j.dotBg}}; color: #0C0C0D; border: 1px solid {{j.dotLine}}; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0">
            <sc-if value="{{j.done}}" hint-placeholder-val="{{true}}">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 13px; height: 13px; stroke-width: 2.6"><path d="M20 6 9 17l-5-5"/></svg>
            </sc-if>
          </span>
          <span style="font-size: 14.5px; color: {{j.ink}}">{{j.t}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="flex-shrink: 0; padding: 12px 20px 24px; display: flex; flex-direction: column; gap: 10px">
    <sc-if value="{{busy}}" hint-placeholder-val="{{true}}">
      <span style="text-align: center; font-size: 13px; line-height: 1.6; color: rgba(255,255,255,0.5)">ปิดหน้านี้ได้ ซับจะรออยู่ใน คลิปของฉัน</span>
      <button onClick="{{finish}}" style="all: unset; cursor: pointer; box-sizing: border-box; display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14); color: rgba(255,255,255,0.72); font-size: 15px; font-weight: 500">ดูตอนถอดเสร็จ (ตัวอย่าง)</button>
    </sc-if>
    <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
      <a href="Captions.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 54px; border-radius: 999px; background: #FFFFFF; color: #0C0C0D; font-size: 16px; font-weight: 600">
        ไปแก้ซับ
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </a>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { done: false }; }
  renderVals() {
    const done = this.state.done;
    const names = ['อัปโหลด', 'ถอดเสียง', 'แก้ซับ', 'ทำคลิป'];
    const job = (t, ok) => ({ t, done: ok, dotBg: ok ? '#FFFFFF' : 'transparent',
      dotLine: ok ? '#FFFFFF' : 'rgba(255,255,255,0.3)', ink: ok ? '#F2F2F0' : 'rgba(255,255,255,0.5)' });
    return {
      busy: !done, done,
      finish: () => this.setState({ done: true }),
      title: done ? 'ถอดเสียงเสร็จแล้ว' : 'กำลังถอดเสียง',
      sub: done ? 'ได้ซับ 24 บรรทัด ตรวจและแก้คำที่ผิดได้ในขั้นต่อไป' : 'ระบบฟังคลิปแล้วเขียนเป็นซับให้ ใช้เวลาราว 1 นาที',
      state: done ? 'เสร็จแล้ว' : 'เหลือราว 30 วินาที',
      pct: done ? 100 : 64,
      steps: names.map((name, i) => ({ name,
        bar: i <= 1 ? '#FFFFFF' : 'rgba(255,255,255,0.14)',
        ink: i <= 1 ? '#F2F2F0' : 'rgba(255,255,255,0.5)' })),
      jobs: [ job('อัปโหลดคลิปครบแล้ว', true), job('ฟังเสียงแล้วเขียนเป็นคำ', done), job('แบ่งซับเป็นบรรทัด', done) ]
    };
  }
}
</script>
</body>
</html>
