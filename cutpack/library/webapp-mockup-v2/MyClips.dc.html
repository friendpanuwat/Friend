<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>CutPack คลิปของฉัน</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Anuphan:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0C0C0D}
a{color:#F2F2F0;text-decoration:none}
.scr{font-family:'Geist','Anuphan',system-ui,sans-serif;color:#F2F2F0;-webkit-font-smoothing:antialiased}
.body{scrollbar-width:none}.body::-webkit-scrollbar{display:none}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.back{width:40px;height:40px;border-radius:999px;border:1px solid rgba(255,255,255,0.14);display:inline-flex;align-items:center;justify-content:center;color:#F2F2F0}
</style>
</helmet>
<div class="scr" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; background: #0C0C0D; background-image: radial-gradient(120% 40% at 50% -12%, rgba(255,255,255,0.12), rgba(255,255,255,0) 62%); display: flex; flex-direction: column">

  <div style="flex-shrink: 0; padding: 14px 20px 6px; display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" class="back" aria-label="ย้อนกลับ">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <span style="font-size: 15px; font-weight: 600">คลิปของฉัน</span>
    <span style="width: 40px; height: 40px; border-radius: 999px; background: #FFFFFF; color: #0C0C0D; font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center" aria-label="บัญชี">F</span>
  </div>

  <div class="body" style="flex: 1; min-height: 0; overflow-y: auto">
    <div style="padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 18px">
      <div style="padding: 18px; border-radius: 20px; background: #FFFFFF; color: #0C0C0D; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; align-items: flex-end; justify-content: space-between">
          <div style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 13px; color: rgba(12,12,13,0.6)">เครดิตคงเหลือ</span>
            <span style="font-size: 34px; font-weight: 700; letter-spacing: -0.8px; line-height: 1.1; font-variant-numeric: tabular-nums">4,900</span>
          </div>
          <span style="font-size: 13px; color: rgba(12,12,13,0.6); padding-bottom: 4px">ราว 49 คลิป</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
          <span style="font-size: 12.5px; line-height: 1.5; color: rgba(12,12,13,0.6)">คลิปไม่เกิน 60 วินาที 100 เครดิต<br>61–90 วินาที 140 เครดิต</span>
          <button style="all: unset; cursor: pointer; height: 40px; padding: 0 16px; border-radius: 999px; background: #0C0C0D; color: #FFFFFF; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; flex-shrink: 0">ซื้อเพิ่ม</button>
        </div>
      </div>

      <div style="display: flex; gap: 8px">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
          <button onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="all: unset; cursor: pointer; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13.5px; background: {{t.bg}}; color: {{t.ink}}; border: {{t.border}}; display: inline-flex; align-items: center">{{t.name}}</button>
        </sc-for>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{clips}}" as="c" hint-placeholder-count="4">
          <a href="{{c.href}}" style="display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 16px; background: #151516; border: 1px solid rgba(255,255,255,0.10)">
            <div style="width: 48px; aspect-ratio: 9 / 16; border-radius: 10px; overflow: hidden; flex-shrink: 0; background: #222">
              <img src="{{c.thumb}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block">
            </div>
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.name}}</span>
              <span style="font-size: 12.5px; color: rgba(255,255,255,0.5)">{{c.meta}}</span>
              <span style="align-self: flex-start; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; background: {{c.chipBg}}; color: {{c.chipInk}}">{{c.status}}</span>
            </div>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; color: rgba(255,255,255,0.5); flex-shrink: 0"><path d="m9 18 6-6-6-6"/></svg>
          </a>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="flex-shrink: 0; padding: 12px 20px 24px">
    <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 54px; border-radius: 999px; background: #FFFFFF; color: #0C0C0D; font-size: 16px; font-weight: 600">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.2"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      สร้างคลิปใหม่
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'all' }; }
  renderVals() {
    const ed = '/_blob/9580e8f04b43d51b8499294d13e489f5', ov = '/_blob/0d4b0a526b289d997e5b6035d1196aa8', raw = '/_blob/4f80beb0fb22df8da2ca5b9a4d150faa';
    const done = { chipBg: '#FFFFFF', chipInk: '#0C0C0D' };
    const wait = { chipBg: 'rgba(255,255,255,0.10)', chipInk: '#F2F2F0' };
    const all = [
      { id: 1, name: 'IMG_4821 · Editorial', meta: '0:58 · วันนี้ 14:20', status: 'กำลังทำ 46%', href: 'Making.dc.html', thumb: raw, ...wait, open: true },
      { id: 2, name: 'IMG_4815 · Overlay', meta: '1:12 · วันนี้ 10:05', status: 'รอแก้ซับ', href: 'Captions.dc.html', thumb: raw, ...wait, open: true },
      { id: 3, name: 'IMG_4790 · Editorial', meta: '0:45 · เมื่อวาน', status: 'เสร็จแล้ว', href: 'Result.dc.html', thumb: ed, ...done, open: false },
      { id: 4, name: 'IMG_4777 · Overlay', meta: '0:52 · 5 พ.ย.', status: 'เสร็จแล้ว', href: 'Result.dc.html', thumb: ov, ...done, open: false }
    ];
    const tabList = [ { id: 'all', name: 'ทั้งหมด' }, { id: 'open', name: 'ยังไม่เสร็จ' }, { id: 'done', name: 'เสร็จแล้ว' } ];
    const tab = this.state.tab;
    return {
      tabs: tabList.map((t) => ({ ...t, on: t.id === tab,
        bg: t.id === tab ? '#FFFFFF' : 'transparent', ink: t.id === tab ? '#0C0C0D' : 'rgba(255,255,255,0.72)',
        border: t.id === tab ? '1px solid #FFFFFF' : '1px solid rgba(255,255,255,0.14)',
        pick: () => this.setState({ tab: t.id }) })),
      clips: all.filter((c) => tab === 'all' || (tab === 'open') === c.open)
    };
  }
}
</script>
</body>
</html>
