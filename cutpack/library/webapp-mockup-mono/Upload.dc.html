<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>CutPack อัปโหลด</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Anuphan:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0C0C0D}
a{color:#F2F2F0;text-decoration:none}
.scr{font-family:'Geist','Anuphan',system-ui,sans-serif;color:#F2F2F0;-webkit-font-smoothing:antialiased}
.body{scrollbar-width:none}.body::-webkit-scrollbar{display:none}
.card{background:#151516;border:1px solid rgba(255,255,255,0.10);border-radius:20px}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.back{width:40px;height:40px;border-radius:999px;border:1px solid rgba(255,255,255,0.14);display:inline-flex;align-items:center;justify-content:center;color:#F2F2F0}
</style>
</helmet>
<div class="scr" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; background: #0C0C0D; background-image: radial-gradient(120% 40% at 50% -12%, rgba(255,255,255,0.12), rgba(255,255,255,0) 62%); display: flex; flex-direction: column">

  <div style="flex-shrink: 0; padding: 14px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Main.dc.html" class="back" aria-label="กลับหน้าหลัก">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </a>
      <span style="font-size: 13px; color: rgba(255,255,255,0.5)">ขั้นที่ 1 จาก 5</span>
      <span style="width: 40px"></span>
    </div>
    <div style="display: flex; gap: 6px">
      <span style="flex: 1; height: 4px; border-radius: 999px; background: #FFFFFF"></span>
      <span style="flex: 1; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.14)"></span>
      <span style="flex: 1; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.14)"></span>
      <span style="flex: 1; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.14)"></span>
      <span style="flex: 1; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.14)"></span>
    </div>
  </div>

  <div class="body" style="flex: 1; min-height: 0; overflow-y: auto">
    <div style="padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.4px">อัปโหลดคลิป</h1>
        <p style="margin: 0; font-size: 14.5px; line-height: 1.6; color: rgba(255,255,255,0.72)">คลิปแนวตั้ง พูดหน้ากล้อง ยาวไม่เกิน 3 นาที</p>
      </div>

      <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
        <button onClick="{{pick}}" aria-label="เลือกไฟล์คลิป" style="all: unset; cursor: pointer; box-sizing: border-box; height: 300px; border-radius: 20px; border: 1.5px dashed rgba(255,255,255,0.22); background: #121213; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center">
          <span style="width: 60px; height: 60px; border-radius: 999px; background: #FFFFFF; color: #0C0C0D; display: flex; align-items: center; justify-content: center">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 26px; height: 26px; stroke-width: 2"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M20 15v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-4"/></svg>
          </span>
          <span style="font-size: 17px; font-weight: 600">แตะเพื่อเลือกคลิป</span>
          <span style="font-size: 13.5px; color: rgba(255,255,255,0.5)">MP4 หรือ MOV · ไม่เกิน 500 MB</span>
        </button>
      </sc-if>

      <sc-if value="{{chosen}}" hint-placeholder-val="{{true}}">
        <div class="card" style="padding: 12px; display: flex; align-items: center; gap: 14px">
          <img src="/_blob/ff5d3ed305efb37e5bcc27b09e16b9ec" alt="" style="width: 54px; height: 72px; border-radius: 12px; object-fit: cover; background: #222; flex-shrink: 0">
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">IMG_4821.MOV</span>
            <span style="font-size: 13px; color: rgba(255,255,255,0.5)">1:20 · 1080×1920 · 186 MB</span>
            <div style="height: 4px; border-radius: 999px; background: rgba(255,255,255,0.10); overflow: hidden">
              <div style="width: 100%; height: 100%; background: #FFFFFF"></div>
            </div>
          </div>
          <button onClick="{{clear}}" aria-label="ลบคลิปนี้" style="all: unset; cursor: pointer; width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14); display: inline-flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.72); flex-shrink: 0">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; align-items: center; gap: 10px; padding: 0 2px">
            <h2 style="margin: 0; font-size: 18px; font-weight: 600">ตรวจคลิปแล้ว</h2>
            <span style="height: 22px; padding: 0 8px; border-radius: 999px; background: rgba(255,255,255,0.10); font-size: 12px; color: rgba(255,255,255,0.72); display: inline-flex; align-items: center">4 ข้อ</span>
          </div>
          <sc-for list="{{checks}}" as="c" hint-placeholder-count="4">
            <div class="card" style="padding: 12px 14px; display: flex; align-items: flex-start; gap: 12px; border-radius: 16px">
              <span style="width: 26px; height: 26px; border-radius: 999px; background: {{c.dotBg}}; color: {{c.dotFg}}; border: 1px solid {{c.dotLine}}; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px">
                <sc-if value="{{c.ok}}" hint-placeholder-val="{{true}}">
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px; stroke-width: 2.4"><path d="M20 6 9 17l-5-5"/></svg>
                </sc-if>
                <sc-if value="{{c.info}}" hint-placeholder-val="{{false}}">
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px; stroke-width: 2.4"><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                </sc-if>
              </span>
              <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 15px; font-weight: 600">{{c.title}}</span>
                <span style="font-size: 13.5px; line-height: 1.5; color: rgba(255,255,255,0.72)">{{c.text}}</span>
              </div>
            </div>
          </sc-for>
        </div>
      </sc-if>
    </div>
  </div>

  <div style="flex-shrink: 0; padding: 12px 20px 24px">
    <sc-if value="{{chosen}}" hint-placeholder-val="{{true}}">
      <a href="Style.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 54px; border-radius: 999px; background: #FFFFFF; color: #0C0C0D; font-size: 16px; font-weight: 600">
        ต่อไป เลือกสไตล์
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </a>
    </sc-if>
    <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
      <span style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 999px; background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.5); font-size: 16px; font-weight: 600">เลือกคลิปก่อน</span>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { has: true }; }
  renderVals() {
    const has = this.state.has;
    const ok = { ok: true, info: false, dotBg: '#FFFFFF', dotFg: '#0C0C0D', dotLine: '#FFFFFF' };
    const info = { ok: false, info: true, dotBg: 'transparent', dotFg: '#F2F2F0', dotLine: 'rgba(255,255,255,0.3)' };
    return {
      empty: !has, chosen: has,
      pick: () => this.setState({ has: true }),
      clear: () => this.setState({ has: false }),
      checks: [
        { ...ok, title: 'ภาพแนวตั้ง 9:16', text: 'ขนาดพอดีกับ TikTok และ Reels' },
        { ...ok, title: 'เสียงพูดชัด', text: 'ถอดเป็นซับได้ ไม่ต้องอัดใหม่' },
        { ...ok, title: 'ความยาว 1:20', text: 'ใช้ 1 คลิปจากแพ็กของคุณ' },
        { ...info, title: 'หน้าเต็มเฟรมบางช่วง', text: 'ช่วงที่ไม่มีที่ว่าง ระบบจะย่อภาพคนพูดลงชั่วคราวตอนกราฟิกขึ้น แล้วขยายกลับ' }
      ]
    };
  }
}
</script>
</body>
</html>
