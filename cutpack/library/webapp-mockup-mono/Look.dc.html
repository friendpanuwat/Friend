<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>CutPack สีและฟอนต์</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Anuphan:wght@400;500;600;700&amp;family=Mitr:wght@500;600&amp;family=Sriracha&amp;display=swap">
<style>
body{margin:0;background:#0C0C0D}
a{color:#F2F2F0;text-decoration:none}
.scr{font-family:'Geist','Anuphan',system-ui,sans-serif;color:#F2F2F0;-webkit-font-smoothing:antialiased}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.back{width:40px;height:40px;border-radius:999px;border:1px solid rgba(255,255,255,0.14);display:inline-flex;align-items:center;justify-content:center;color:#F2F2F0}
</style>
</helmet>
<div class="scr" style="width: 390px; height: 1160px; box-sizing: border-box; overflow: hidden; position: relative; background: #0C0C0D; background-image: radial-gradient(120% 45% at 50% -14%, rgba(255,255,255,0.12), rgba(255,255,255,0) 62%); padding: 20px 20px 32px; display: flex; flex-direction: column; gap: 20px">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Style.dc.html" class="back" aria-label="ย้อนกลับ">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <span style="font-size: 13px; color: rgba(255,255,255,0.5)">ขั้นที่ 3 จาก 5</span>
    <span style="width: 40px"></span>
  </div>

  <div style="display: flex; gap: 6px">
    <span style="flex: 1; height: 4px; border-radius: 999px; background: #FFFFFF"></span>
    <span style="flex: 1; height: 4px; border-radius: 999px; background: #FFFFFF"></span>
    <span style="flex: 1; height: 4px; border-radius: 999px; background: #FFFFFF"></span>
    <span style="flex: 1; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.14)"></span>
    <span style="flex: 1; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.14)"></span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.4px">สีและฟอนต์</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.6; color: rgba(255,255,255,0.72)">สีเดียวสำหรับคำเน้น ใช้ทั้งคลิป</p>
  </div>

  <div style="position: relative; height: 330px; border-radius: 20px; overflow: hidden; background: #222; border: 1px solid rgba(255,255,255,0.10)">
    <img src="/_blob/8d6f6b2e84ece8fd0c5ff1eea50e620b" alt="ตัวอย่างซับบนภาพคนพูด" style="width: 100%; height: 100%; object-fit: cover; display: block">
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 60%; background: linear-gradient(to top, rgba(0,0,0,0.6), rgba(0,0,0,0))"></div>
    <div style="position: absolute; left: 0; right: 0; bottom: 34px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center">
      <span style="font-family: 'Anuphan', sans-serif; font-size: 17px; font-weight: 600; color: #FFFFFF; text-shadow: 0 2px 8px rgba(0,0,0,0.5)">ลูกค้าไม่ได้ซื้อเพราะ</span>
      <span style="font-family: {{fontCss}}; font-weight: {{fontWeight}}; font-size: 44px; line-height: 1.15; color: {{accent}}; text-shadow: 0 3px 14px rgba(0,0,0,0.45)">ราคาถูก</span>
    </div>
    <span style="position: absolute; top: 12px; left: 12px; height: 26px; padding: 0 10px; border-radius: 999px; background: rgba(12,12,13,0.78); font-size: 12px; display: inline-flex; align-items: center">ตัวอย่าง</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 2px">
      <h2 style="margin: 0; font-size: 19px; font-weight: 600">สีคำเน้น</h2>
      <span style="font-size: 13px; color: rgba(255,255,255,0.5)">{{colorName}}</span>
    </div>
    <div style="display: flex; gap: 10px; justify-content: space-between">
      <sc-for list="{{colors}}" as="c" hint-placeholder-count="6">
        <button onClick="{{c.pick}}" aria-label="{{c.name}}" aria-pressed="{{c.on}}" style="all: unset; cursor: pointer; width: 48px; height: 48px; border-radius: 999px; box-sizing: border-box; border: {{c.ring}}; display: inline-flex; align-items: center; justify-content: center">
          <span style="width: 36px; height: 36px; border-radius: 999px; background: {{c.hex}}"></span>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <h2 style="margin: 0; padding: 0 2px; font-size: 19px; font-weight: 600">ฟอนต์คำเน้น</h2>
    <sc-for list="{{fonts}}" as="f" hint-placeholder-count="2">
      <button onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="all: unset; cursor: pointer; box-sizing: border-box; border-radius: 16px; background: #151516; border: {{f.border}}; padding: 14px 16px; display: flex; align-items: center; gap: 14px">
        <span style="width: 32px; height: 32px; border-radius: 999px; background: {{f.dotBg}}; color: {{f.dotFg}}; border: 1px solid {{f.dotLine}}; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0">{{f.k}}</span>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 600">{{f.name}}</span>
          <span style="font-size: 13px; color: rgba(255,255,255,0.72)">{{f.note}}</span>
        </div>
        <span style="font-family: {{f.css}}; font-size: 24px; color: #F2F2F0">กขค</span>
      </button>
    </sc-for>
  </div>

  <div style="flex: 1"></div>

  <a href="Captions.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 54px; border-radius: 999px; background: #FFFFFF; color: #0C0C0D; font-size: 16px; font-weight: 600">
    ต่อไป ตรวจซับ
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1160}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { color: 'lime', font: 'mitr' }; }
  renderVals() {
    const colorList = [
      { id: 'lime', name: 'เขียวมะนาว', hex: '#C6F432' },
      { id: 'yellow', name: 'เหลือง', hex: '#FFD43B' },
      { id: 'orange', name: 'ส้ม', hex: '#FF8A3D' },
      { id: 'pink', name: 'ชมพู', hex: '#FF6FAE' },
      { id: 'sky', name: 'ฟ้า', hex: '#5CC8FF' },
      { id: 'white', name: 'ขาว', hex: '#FFFFFF' }
    ];
    const fontList = [
      { id: 'mitr', k: 'A', name: 'ตัวหนา', note: 'Mitr อ่านง่าย ดูจริงจัง', css: "'Mitr', sans-serif" },
      { id: 'sri', k: 'B', name: 'ลายมือ', note: 'Sriracha ดูเป็นกันเอง', css: "'Sriracha', cursive" }
    ];
    const c = colorList.find((x) => x.id === this.state.color);
    const f = fontList.find((x) => x.id === this.state.font);
    return {
      accent: c.hex, colorName: c.name, fontCss: f.css, fontWeight: f.id === 'mitr' ? 600 : 400,
      colors: colorList.map((x) => ({ ...x, on: x.id === c.id,
        ring: x.id === c.id ? '2px solid #FFFFFF' : '2px solid transparent',
        pick: () => this.setState({ color: x.id }) })),
      fonts: fontList.map((x) => {
        const on = x.id === f.id;
        return { ...x, on,
          border: on ? '1.5px solid #FFFFFF' : '1px solid rgba(255,255,255,0.10)',
          dotBg: on ? '#FFFFFF' : 'transparent', dotFg: on ? '#0C0C0D' : 'rgba(255,255,255,0.72)',
          dotLine: on ? '#FFFFFF' : 'rgba(255,255,255,0.18)',
          pick: () => this.setState({ font: x.id }) };
      })
    };
  }
}
</script>
</body>
</html>
