<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>CutPack ยืนยัน</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Anuphan:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0C0C0D}
a{color:#F2F2F0;text-decoration:none}
.scr{font-family:'Geist','Anuphan',system-ui,sans-serif;color:#F2F2F0;-webkit-font-smoothing:antialiased}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.back{width:40px;height:40px;border-radius:999px;border:1px solid rgba(255,255,255,0.14);display:inline-flex;align-items:center;justify-content:center;color:#F2F2F0}
</style>
</helmet>
<div class="scr" style="width: 390px; height: 1160px; box-sizing: border-box; overflow: hidden; position: relative; background: #0C0C0D; background-image: radial-gradient(120% 45% at 50% -14%, rgba(255,255,255,0.12), rgba(255,255,255,0) 62%); padding: 20px 20px 32px; display: flex; flex-direction: column; gap: 20px">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Captions.dc.html" class="back" aria-label="ย้อนกลับ">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <span style="font-size: 13px; color: rgba(255,255,255,0.5)">ขั้นที่ 5 จาก 5</span>
    <span style="width: 40px"></span>
  </div>

  <div style="display: flex; gap: 6px">
    <span style="flex: 1; height: 4px; border-radius: 999px; background: #FFFFFF"></span>
    <span style="flex: 1; height: 4px; border-radius: 999px; background: #FFFFFF"></span>
    <span style="flex: 1; height: 4px; border-radius: 999px; background: #FFFFFF"></span>
    <span style="flex: 1; height: 4px; border-radius: 999px; background: #FFFFFF"></span>
    <span style="flex: 1; height: 4px; border-radius: 999px; background: #FFFFFF"></span>
  </div>

  <sc-if value="{{ready}}" hint-placeholder-val="{{true}}">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.4px">พร้อมสร้างคลิป</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.6; color: rgba(255,255,255,0.72)">ตรวจอีกครั้ง แตะแถวไหนก็กลับไปแก้ได้</p>
    </div>

    <div style="display: flex; flex-direction: column; border-radius: 20px; background: #151516; border: 1px solid rgba(255,255,255,0.10); overflow: hidden">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
        <a href="{{r.href}}" style="display: flex; align-items: center; gap: 14px; padding: 15px 16px; border-bottom: 1px solid rgba(255,255,255,0.08)">
          <span style="width: 36px; height: 36px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.14); display: inline-flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.72); flex-shrink: 0">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="{{r.icon}}"/></svg>
          </span>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <span style="font-size: 13px; color: rgba(255,255,255,0.5)">{{r.label}}</span>
            <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.value}}</span>
          </div>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; color: rgba(255,255,255,0.5); flex-shrink: 0"><path d="m9 18 6-6-6-6"/></svg>
        </a>
      </sc-for>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.14)">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 600">ใช้ 1 คลิปจากแพ็ก</span>
        <span style="font-size: 13px; color: rgba(255,255,255,0.5)">คลิปที่เหลือในแพ็กเดือนนี้</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 15px">
        <span style="color: rgba(255,255,255,0.5)">32</span>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; color: rgba(255,255,255,0.5)"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        <span style="font-weight: 600">31</span>
      </div>
    </div>

    <div style="flex: 1"></div>

    <button onClick="{{start}}" style="all: unset; cursor: pointer; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 10px; height: 54px; border-radius: 999px; background: #FFFFFF; color: #0C0C0D; font-size: 16px; font-weight: 600">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.2"><path d="M12 3 13.9 8.1 19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9Z"/></svg>
      สร้างคลิป
    </button>
  </sc-if>

  <sc-if value="{{making}}" hint-placeholder-val="{{false}}">
    <div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding-top: 24px">
      <div style="width: 120px; height: 120px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14); background: #151516; box-shadow: 0 0 70px rgba(255,255,255,0.10); display: flex; align-items: center; justify-content: center">
        <span style="font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums">62%</span>
      </div>
      <h1 style="margin: 12px 0 0; font-size: 26px; font-weight: 600; letter-spacing: -0.4px">กำลังสร้างคลิป</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.6; color: rgba(255,255,255,0.72); max-width: 300px">ราว 4 นาที ปิดหน้านี้ได้ เสร็จแล้วจะแจ้งเตือน</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; background: #151516; border: 1px solid {{s.line}}">
          <span style="width: 28px; height: 28px; border-radius: 999px; background: {{s.dotBg}}; color: {{s.dotFg}}; border: 1px solid {{s.dotLine}}; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 12px; font-weight: 600">
            <sc-if value="{{s.done}}" hint-placeholder-val="{{true}}">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px; stroke-width: 2.6"><path d="M20 6 9 17l-5-5"/></svg>
            </sc-if>
            <sc-if value="{{s.notDone}}" hint-placeholder-val="{{false}}">{{s.n}}</sc-if>
          </span>
          <span style="flex: 1; font-size: 15px; color: {{s.fg}}">{{s.text}}</span>
          <sc-if value="{{s.now}}" hint-placeholder-val="{{false}}">
            <span style="font-size: 12.5px; color: rgba(255,255,255,0.72)">กำลังทำ</span>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <div style="flex: 1"></div>

    <a href="Result.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 54px; border-radius: 999px; background: #FFFFFF; color: #0C0C0D; font-size: 16px; font-weight: 600">ดูผลงาน (ข้ามไปตอนเสร็จ)</a>
    <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 46px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14); font-size: 15px; font-weight: 500; color: rgba(255,255,255,0.72)">กลับหน้าหลัก</a>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1160}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { making: false }; }
  renderVals() {
    const making = this.state.making;
    const steps = ['อ่านคลิปและหาตำแหน่งหน้า', 'วางแผนกราฟิกตามคำพูด', 'จัดวางไม่ให้บังหน้า', 'ใส่ซับ เสียง และกราฟิก', 'ตรวจคลิปก่อนส่ง'];
    const now = 3;
    return {
      ready: !making, making,
      start: () => this.setState({ making: true }),
      rows: [
        { label: 'คลิป', value: 'IMG_4821.MOV · 1:20', href: 'Upload.dc.html', icon: 'M15 10l5-3v10l-5-3M3 7h12v10H3z' },
        { label: 'สไตล์', value: 'A Editorial', href: 'Style.dc.html', icon: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z' },
        { label: 'สีและฟอนต์', value: 'เขียวมะนาว · ตัวหนา', href: 'Look.dc.html', icon: 'M4 20h4L18.5 9.5a2.8 2.8 0 0 0-4-4L4 16zM13.5 6.5l4 4' },
        { label: 'ซับ', value: '31 บรรทัด · แก้แล้ว 2 คำ', href: 'Captions.dc.html', icon: 'M4 6h16M4 12h16M4 18h10' }
      ],
      steps: steps.map((text, i) => {
        const done = i < now, cur = i === now;
        return { text, n: i + 1, done, notDone: !done, now: cur,
          dotBg: done ? '#FFFFFF' : 'transparent', dotFg: done ? '#0C0C0D' : 'rgba(255,255,255,0.72)',
          dotLine: done ? '#FFFFFF' : 'rgba(255,255,255,0.22)',
          line: cur ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.10)',
          fg: done || cur ? '#F2F2F0' : 'rgba(255,255,255,0.5)' };
      })
    };
  }
}
</script>
</body>
</html>
