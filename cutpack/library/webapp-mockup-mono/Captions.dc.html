<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>CutPack ตรวจซับ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Anuphan:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0C0C0D}
a{color:#F2F2F0;text-decoration:none}
.scr{font-family:'Geist','Anuphan',system-ui,sans-serif;color:#F2F2F0;-webkit-font-smoothing:antialiased}
.body{scrollbar-width:none}.body::-webkit-scrollbar{display:none}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.back{width:40px;height:40px;border-radius:999px;border:1px solid rgba(255,255,255,0.14);display:inline-flex;align-items:center;justify-content:center;color:#F2F2F0}
.field{all:unset;box-sizing:border-box;flex:1;min-width:0;height:44px;padding:0 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.14);background:#0F0F10;font:400 14.5px 'Geist','Anuphan',sans-serif;color:#F2F2F0}
.unsure{border-bottom:1.5px dashed rgba(255,255,255,0.7);padding-bottom:1px}
</style>
</helmet>
<div class="scr" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; background: #0C0C0D; background-image: radial-gradient(120% 40% at 50% -12%, rgba(255,255,255,0.12), rgba(255,255,255,0) 62%); display: flex; flex-direction: column">

  <div style="flex-shrink: 0; padding: 14px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Look.dc.html" class="back" aria-label="ย้อนกลับ">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </a>
      <span style="font-size: 13px; color: rgba(255,255,255,0.5)">ขั้นที่ 4 จาก 5</span>
      <span style="width: 40px"></span>
    </div>
    <div style="display: flex; gap: 6px">
      <span style="flex: 1; height: 4px; border-radius: 999px; background: #FFFFFF"></span>
      <span style="flex: 1; height: 4px; border-radius: 999px; background: #FFFFFF"></span>
      <span style="flex: 1; height: 4px; border-radius: 999px; background: #FFFFFF"></span>
      <span style="flex: 1; height: 4px; border-radius: 999px; background: #FFFFFF"></span>
      <span style="flex: 1; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.14)"></span>
    </div>
  </div>

  <div class="body" style="flex: 1; min-height: 0; overflow-y: auto">
    <div style="padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.4px">ตรวจซับ</h1>
        <p style="margin: 0; font-size: 14.5px; line-height: 1.6; color: rgba(255,255,255,0.72)">แตะบรรทัดเพื่อแก้ คำที่มีเส้นประใต้ ระบบไม่แน่ใจ</p>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; background: #151516; border: 1px solid rgba(255,255,255,0.10)">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 15px; font-weight: 600">ตัดคำลงท้าย</span>
          <span style="font-size: 13px; color: rgba(255,255,255,0.72)">ซ่อน ครับ ค่ะ นะ ในซับ เสียงยังอยู่</span>
        </div>
        <button onClick="{{toggle}}" role="switch" aria-checked="{{trim}}" aria-label="ตัดคำลงท้าย" style="all: unset; cursor: pointer; width: 50px; height: 30px; border-radius: 999px; background: {{swBg}}; position: relative; flex-shrink: 0; transition: background .2s">
          <span style="position: absolute; top: 3px; left: {{knobX}}px; width: 24px; height: 24px; border-radius: 999px; background: {{knobBg}}; transition: left .2s"></span>
        </button>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: 16px; background: #151516; border: 1px solid rgba(255,255,255,0.10)">
        <div style="display: flex; align-items: baseline; justify-content: space-between">
          <span style="font-size: 15px; font-weight: 600">แทนที่ทั้งคลิป</span>
          <span style="font-size: 12.5px; color: rgba(255,255,255,0.5)">พบ 3 ที่</span>
        </div>
        <div style="display: flex; gap: 8px; align-items: center">
          <input class="field" aria-label="คำเดิม" value="แบรน">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; color: rgba(255,255,255,0.5); flex-shrink: 0"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          <input class="field" aria-label="คำใหม่" value="แบรนด์">
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 2px">
          <div style="display: flex; align-items: center; gap: 10px">
            <h2 style="margin: 0; font-size: 18px; font-weight: 600">ซับทั้งหมด</h2>
            <span style="height: 22px; padding: 0 8px; border-radius: 999px; background: rgba(255,255,255,0.10); font-size: 12px; color: rgba(255,255,255,0.72); display: inline-flex; align-items: center">ไม่แน่ใจ 2 คำ</span>
          </div>
          <span style="font-size: 13px; color: rgba(255,255,255,0.5)">31 บรรทัด</span>
        </div>
        <sc-for list="{{lines}}" as="l" hint-placeholder-count="6">
          <button onClick="{{l.pick}}" style="all: unset; cursor: pointer; box-sizing: border-box; display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border-radius: 14px; background: {{l.bg}}; border: {{l.border}}">
            <span style="font-size: 12.5px; color: rgba(255,255,255,0.5); width: 32px; flex-shrink: 0; padding-top: 2px; font-variant-numeric: tabular-nums">{{l.t}}</span>
            <span style="flex: 1; font-size: 15px; line-height: 1.55">
              <span>{{l.a}}</span><span class="unsure">{{l.u}}</span><span>{{l.b}}</span><span style="color: rgba(255,255,255,0.5)">{{l.tail}}</span>
            </span>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; color: rgba(255,255,255,0.5); flex-shrink: 0; margin-top: 3px"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </button>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="flex-shrink: 0; padding: 12px 20px 24px">
    <a href="Confirm.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 54px; border-radius: 999px; background: #FFFFFF; color: #0C0C0D; font-size: 16px; font-weight: 600">
      ซับถูกแล้ว ไปต่อ
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { trim: true, sel: 2 }; }
  renderVals() {
    const trim = this.state.trim;
    const raw = [
      { t: '0:00', a: 'ลูกค้าไม่ได้ซื้อเพราะราคาถูก', u: '', b: '', tail: 'นะ' },
      { t: '0:03', a: 'เขาซื้อเพราะ', u: 'เชื่อใจ', b: 'คนขาย', tail: '' },
      { t: '0:06', a: 'แบรนด์คือคำสัญญาที่คุณให้ไว้', u: '', b: '', tail: 'ครับ' },
      { t: '0:09', a: 'ถ้าทำได้ทุกครั้ง ลูกค้าจะกลับมา', u: '', b: '', tail: '' },
      { t: '0:13', a: 'ไม่ต้อง', u: 'ลดราคา', b: 'แข่งกับใคร', tail: '' },
      { t: '0:16', a: 'เริ่มจากสัญญาเล็ก ๆ ที่ทำได้จริง', u: '', b: '', tail: 'ครับ' },
      { t: '0:19', a: 'แล้วทำแบบนั้นซ้ำทุกวัน', u: '', b: '', tail: '' }
    ];
    return {
      trim,
      toggle: () => this.setState({ trim: !trim }),
      swBg: trim ? '#FFFFFF' : 'rgba(255,255,255,0.18)',
      knobBg: trim ? '#0C0C0D' : '#FFFFFF',
      knobX: trim ? 23 : 3,
      lines: raw.map((l, i) => {
        const on = i === this.state.sel;
        return { ...l, tail: trim ? '' : (l.tail ? ' ' + l.tail : ''),
          bg: on ? '#1C1C1E' : '#151516',
          border: on ? '1.5px solid #FFFFFF' : '1px solid rgba(255,255,255,0.10)',
          pick: () => this.setState({ sel: i }) };
      })
    };
  }
}
</script>
</body>
</html>
