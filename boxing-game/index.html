<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Boxing Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Kanit:wght@400;600&display=swap">
<style>
/* Layout: full-bleed 3D arena; HUD pinned to the edges like a TV fight broadcast (bars top, joystick left, punch pad right). */
:root{
  --night:#0b1020;        /* arena darkness */
  --canvas:#e9e4d8;       /* ring canvas / main text */
  --red:#d8312f;          /* red corner (player) */
  --blue:#2f6fd8;         /* blue corner (opponent) */
  --gold:#e8b84a;         /* belt gold accent */
  --ink:#151a2b;          /* panels */
  --muted:#8d93a8;
  --display:"Big Shoulders Display","Impact","Arial Narrow",sans-serif;
  --body:"Kanit","Noto Sans Thai","Tahoma",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--canvas);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
#hud[hidden]{display:none!important}
.top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 16px) 0 calc(env(safe-area-inset-left,0px) + 16px);
  display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:start}
.pbar{display:grid;gap:4px;min-width:0}
.pbar .nm{font-family:var(--display);font-weight:900;font-size:18px;letter-spacing:.06em;text-transform:uppercase;line-height:1;display:flex;gap:8px;align-items:baseline}
.pbar .nm small{font-family:var(--body);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.02em;text-transform:none}
.pbar.right .nm{justify-content:flex-end}
.hp{position:relative;height:14px;background:#00000080;border:1px solid #ffffff2a;transform:skewX(-14deg);overflow:hidden}
.hp i,.hp b{position:absolute;top:0;bottom:0;left:0;width:100%;transform-origin:left}
.hp b{background:#fff;opacity:.55}
.pbar.left .hp i{background:linear-gradient(90deg,#8e1b19,var(--red))}
.pbar.right .hp i{background:linear-gradient(90deg,#173e86,var(--blue))}
.pbar.right .hp i,.pbar.right .hp b{left:auto;right:0;transform-origin:right}
.pbar.right .hp{transform:skewX(14deg)}
.st{height:5px;background:#00000080;transform:skewX(-14deg);overflow:hidden;width:72%}
.pbar.right .st{justify-self:end;transform:skewX(14deg)}
.st i{display:block;height:100%;width:100%;background:var(--gold);transform-origin:left}
.pbar.right .st i{transform-origin:right}
.clock{text-align:center;font-family:var(--display);line-height:.9}
.clock .rd{font-size:12px;letter-spacing:.2em;color:var(--gold);font-weight:700}
.clock .tm{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums}
.tools{position:absolute;top:calc(env(safe-area-inset-top,0px) + 58px);right:calc(env(safe-area-inset-right,0px) + 16px);display:flex;gap:8px;pointer-events:auto}
.tools button,.tools2 button{background:#0b1020b0;border:1px solid #ffffff30;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
.tools2{position:absolute;top:calc(env(safe-area-inset-top,0px) + 58px);left:calc(env(safe-area-inset-left,0px) + 16px);display:flex;gap:8px;pointer-events:auto}

/* joystick */
#stickZone{position:absolute;left:0;bottom:0;width:42%;height:72%;pointer-events:auto;touch-action:none}
#stickBase{position:absolute;width:140px;height:140px;margin:-70px 0 0 -70px;border-radius:50%;
  background:radial-gradient(circle,#ffffff10 0 55%,#ffffff1c 56% 58%,#ffffff08 59%);border:2px solid #ffffff35;
  left:calc(env(safe-area-inset-left,0px) + 110px);bottom:auto;top:calc(100% - 110px);transition:opacity .2s}
#stickKnob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ffffff60,#ffffff22 60%);border:2px solid #ffffff70;box-shadow:0 4px 14px #0008}
#stickZone.idle #stickBase{opacity:.55}

/* punch pad */
#pad{position:absolute;right:calc(env(safe-area-inset-right,0px) + 8px);bottom:calc(env(safe-area-inset-bottom,0px) + 6px);width:316px;height:256px;pointer-events:none}
.pb{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;border:2px solid #ffffff55;cursor:pointer;
  display:grid;place-content:center;text-align:center;line-height:1;transform:translate(-50%,-50%);
  background:radial-gradient(circle at 40% 30%,#ffffff26,#00000055 70%);box-shadow:0 6px 18px #0009, inset 0 0 0 4px #00000030}
.pb b{font-family:var(--display);font-weight:900;font-size:17px;letter-spacing:.04em}
.pb small{font-size:10px;color:#ffffffb0;margin-top:2px}
.pb.on{transform:translate(-50%,-50%) scale(.9);filter:brightness(1.5)}
.pb.atk{border-color:#ff8a7a;background:radial-gradient(circle at 40% 30%,#ff6a5a66,#5a0d0c99 70%)}
.pb.def{border-color:#8fb3ff;background:radial-gradient(circle at 40% 30%,#6a9cff55,#0d1f5a99 70%)}
/* left-hand column (JAB/HOOK/UPPER ซ้าย) and right-hand column (ขวา); defence on the inside */
#bJab{left:178px;top:212px;width:78px;height:78px}  #bCross{left:272px;top:212px;width:78px;height:78px}
#bHookL{left:178px;top:130px;width:70px;height:70px} #bHookR{left:272px;top:130px;width:70px;height:70px}
#bUpL{left:178px;top:54px;width:64px;height:64px}    #bUpR{left:272px;top:54px;width:64px;height:64px}
#bBlock{left:72px;top:200px;width:76px;height:76px}
#bDuck{left:80px;top:110px;width:66px;height:66px}
@media (max-height:420px){ #pad{transform:scale(.82);transform-origin:right bottom} #stickBase{transform:scale(.85)} }
@media (max-height:340px){ #pad{transform:scale(.7)} }

#banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:var(--display);font-weight:900;
  font-size:min(16vh,96px);letter-spacing:.04em;text-transform:uppercase;line-height:.9;opacity:0;
  text-shadow:0 6px 0 #0007,0 0 40px #000}
#banner.show{animation:ban 1.6s ease-out forwards}
#banner small{display:block;font-size:.3em;font-family:var(--body);font-weight:600;letter-spacing:.02em;color:var(--gold);margin-top:8px}
@keyframes ban{0%{opacity:0;transform:scale(1.6)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.96)}}
#flash{position:absolute;inset:0;background:radial-gradient(circle,transparent 40%,#c0141480);opacity:0;transition:opacity .25s}
#combo{position:absolute;left:calc(env(safe-area-inset-left,0px) + 18px);top:calc(env(safe-area-inset-top,0px) + 96px);font-family:var(--display);font-weight:900;font-size:26px;color:var(--gold);opacity:0;transition:opacity .3s}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:linear-gradient(90deg,#0b1020f0 0 46%,#0b102080 70%,#0b102020)}
.ov[hidden]{display:none!important}
.card{width:min(560px,100%);max-height:100%;overflow:auto;display:grid;gap:14px;justify-self:start;padding-left:max(2vw,env(safe-area-inset-left,0px))}
.eyebrow{font-size:12px;letter-spacing:.24em;color:var(--gold);text-transform:uppercase;font-weight:600}
h1{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(44px,11vh,88px);line-height:.85;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
h1 em{font-style:normal;color:var(--red)}
.lede{margin:0;color:#c9c6bd;font-size:14px;line-height:1.5;max-width:46ch}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg button{background:transparent;border:1px solid #ffffff40;padding:8px 16px;border-radius:999px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--canvas);color:var(--ink);border-color:var(--canvas)}
.go{background:var(--red);border:0;padding:12px 30px;border-radius:4px;font-family:var(--display);font-weight:900;font-size:24px;letter-spacing:.08em;cursor:pointer;box-shadow:0 6px 0 #7a1514}
.go:active{transform:translateY(3px);box-shadow:0 3px 0 #7a1514}
.ghost{background:transparent;border:1px solid #ffffff40;padding:10px 18px;border-radius:4px;cursor:pointer;font-size:14px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12px;color:var(--muted)}
.keys kbd{font-family:var(--display);font-weight:700;font-size:13px;color:var(--canvas);letter-spacing:.06em}
.stats{display:grid;grid-template-columns:auto auto auto;gap:6px 20px;font-size:14px;font-variant-numeric:tabular-nums;justify-content:start}
.stats .h{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
#resTitle.win{color:var(--gold)}
#rotate{position:fixed;inset:0;display:none;place-content:center;text-align:center;gap:12px;background:var(--night);padding:24px;z-index:9}
#rotate .ph{width:56px;height:92px;border:3px solid var(--canvas);border-radius:10px;margin:0 auto;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:820px){ #rotate{display:grid} }
@media (prefers-reduced-motion:reduce){ #banner.show{animation-duration:.01s} #rotate .ph{animation:none} }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud" hidden>
  <div class="top">
    <div class="pbar left">
      <div class="nm"><span id="n1">YOU</span><small>มุมแดง</small></div>
      <div class="hp"><b id="hp1g"></b><i id="hp1"></i></div>
      <div class="st"><i id="st1"></i></div>
    </div>
    <div class="clock"><div class="rd" id="rd">ROUND 1</div><div class="tm" id="tm">1:30</div></div>
    <div class="pbar right">
      <div class="nm"><small>มุมน้ำเงิน</small><span id="n2">CPU</span></div>
      <div class="hp"><b id="hp2g"></b><i id="hp2"></i></div>
      <div class="st"><i id="st2"></i></div>
    </div>
  </div>
  <div class="tools2"><button id="camBtn" type="button">มุมกล้อง: ด้านข้าง</button></div>
  <div class="tools"><button id="pauseBtn" type="button">พัก ❚❚</button></div>
  <div id="combo"></div>

  <div id="stickZone" class="idle"><div id="stickBase"><div id="stickKnob"></div></div></div>

  <div id="pad">
    <button class="pb def" id="bDuck" data-hold="duck" type="button"><b>LEAN</b><small>ก้ม/เอียงหลบ</small></button>
    <button class="pb def" id="bBlock" data-hold="block" type="button"><b>BLOCK</b><small>การ์ด</small></button>
    <button class="pb atk" id="bUpL" data-act="upperL" type="button"><b>UPPER</b><small>ซ้าย</small></button>
    <button class="pb atk" id="bUpR" data-act="upperR" type="button"><b>UPPER</b><small>ขวา</small></button>
    <button class="pb atk" id="bHookL" data-act="hookL" type="button"><b>HOOK</b><small>ซ้าย</small></button>
    <button class="pb atk" id="bHookR" data-act="hookR" type="button"><b>HOOK</b><small>ขวา</small></button>
    <button class="pb atk" id="bJab" data-act="jab" type="button"><b>JAB</b><small>ซ้าย</small></button>
    <button class="pb atk" id="bCross" data-act="cross" type="button"><b>CROSS</b><small>ขวา</small></button>
  </div>
  <div id="banner"></div>
  <div id="flash"></div>
</div>

<div class="ov" id="menu">
  <div class="card">
    <h1>Boxing <em>Game</em></h1>
    <div class="row seg" id="diff" role="group" aria-label="ระดับความยาก">
      <button type="button" data-d="easy" aria-pressed="false">ง่าย</button>
      <button type="button" data-d="normal" aria-pressed="true">ปกติ</button>
      <button type="button" data-d="hard" aria-pressed="false">ยาก</button>
    </div>
    <div class="row"><button class="go" id="startBtn" type="button">ขึ้นชก</button></div>
    <p class="lede" id="loadErr" hidden></p>
  </div>
</div>

<div class="ov" id="result" hidden>
  <div class="card">
    <div class="eyebrow" id="resEyebrow">จบการชก</div>
    <h1 id="resTitle">K.O.</h1>
    <p class="lede" id="resText"></p>
    <div class="stats" id="resStats"></div>
    <div class="row"><button class="go" id="againBtn" type="button">ชกอีกครั้ง</button><button class="ghost" id="menuBtn" type="button">เมนู</button></div>
  </div>
</div>

<div class="ov" id="pauseOv" hidden>
  <div class="card">
    <div class="eyebrow">พักการชก</div>
    <h1>Paused</h1>
    <div class="row"><button class="go" id="resumeBtn" type="button">ชกต่อ</button><button class="ghost" id="quitBtn" type="button">ออกเมนู</button></div>
  </div>
</div>

<div id="rotate"><div class="ph"></div><div>หมุนโทรศัพท์เป็นแนวนอนเพื่อเล่น</div></div>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

/* ================================================================
   Utilities
   ================================================================ */
const $ = s => document.querySelector(s);
const V3 = (x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);
const rand=(a,b)=>a+Math.random()*(b-a);
const wrap=a=>Math.atan2(Math.sin(a),Math.cos(a));
const YAX=V3(0,1,0), ZAX=V3(0,0,1);
const _eu=new THREE.Euler(0,0,0,'YXZ');
// Character-local frame uses three.js conventions: +Z forward, +Y up, +X = the fighter's LEFT.
const quat=(yaw,pitch=0,roll=0,out=new THREE.Quaternion())=>{_eu.set(pitch,yaw,roll,'YXZ');return out.setFromEuler(_eu);};
const lv=(q,x,y,z,out=V3())=>out.set(x,y,z).applyQuaternion(q);

class Spring{ // damped harmonic spring, the backbone of all body motion
  constructor(x=0,k=150,d=18){this.x=x;this.v=0;this.t=x;this.k=k;this.d=d;}
  step(dt){this.v+=(this.k*(this.t-this.x)-this.d*this.v)*dt;this.x+=this.v*dt;return this.x;}
  snap(x){this.x=this.t=x;this.v=0;}
}
class VSpring{
  constructor(k=150,d=18){this.x=V3();this.v=V3();this.t=V3();this.k=k;this.d=d;this._a=V3();}
  step(dt){this._a.subVectors(this.t,this.x).multiplyScalar(this.k).addScaledVector(this.v,-this.d);
    this.v.addScaledVector(this._a,dt);this.x.addScaledVector(this.v,dt);return this.x;}
  snap(p){this.x.copy(p);this.t.copy(p);this.v.set(0,0,0);}
}

// Analytic two-bone IK (shoulder-elbow-hand, hip-knee-ankle)
const _i1=V3(),_i2=V3();
function ik2(a,t,l1,l2,pole,outMid,outEnd){
  const d=_i1.subVectors(t,a); let dist=d.length();
  if(dist<1e-5){d.set(0,-1,0);dist=1e-5;} else d.divideScalar(dist);
  dist=clamp(dist,Math.abs(l1-l2)+0.02,(l1+l2)*0.999);
  const ax=(l1*l1-l2*l2+dist*dist)/(2*dist), h=Math.sqrt(Math.max(0,l1*l1-ax*ax));
  const p=_i2.copy(pole).addScaledVector(d,-pole.dot(d));
  if(p.lengthSq()<1e-6)p.set(0,-1,0); p.normalize();
  outMid.copy(a).addScaledVector(d,ax).addScaledVector(p,h);
  outEnd.copy(a).addScaledVector(d,dist);
}
const _s1=V3(),_s2=V3(),_s3=V3();
function segClosest(p,a,b,out){const ab=_s1.subVectors(b,a);const t=clamp(_s2.subVectors(p,a).dot(ab)/Math.max(1e-6,ab.lengthSq()),0,1);return out.copy(a).addScaledVector(ab,t);}
function bez(a,c,b,t,out){const u=1-t;return out.set(u*u*a.x+2*u*t*c.x+t*t*b.x,u*u*a.y+2*u*t*c.y+t*t*b.y,u*u*a.z+2*u*t*c.z+t*t*b.z);}

/* ================================================================
   Audio (synthesised, no files)
   ================================================================ */
const SFX={ctx:null,noise:null,crowdGain:null,
  init(){ if(this.ctx) return; try{
    const C=new (window.AudioContext||window.webkitAudioContext)(); this.ctx=C;
    const len=C.sampleRate*2, buf=C.createBuffer(1,len,C.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1; this.noise=buf;
    this.master=C.createGain(); this.master.gain.value=0.8; this.master.connect(C.destination);
    // crowd bed
    const src=C.createBufferSource(); src.buffer=buf; src.loop=true;
    const f=C.createBiquadFilter(); f.type='bandpass'; f.frequency.value=700; f.Q.value=0.6;
    this.crowdGain=C.createGain(); this.crowdGain.gain.value=0.05;
    src.connect(f).connect(this.crowdGain).connect(this.master); src.start();
  }catch(e){this.ctx=null;} },
  _n(dur,freq,q,gain,type='lowpass'){ const C=this.ctx; if(!C) return;
    const s=C.createBufferSource(); s.buffer=this.noise; s.playbackRate.value=rand(.8,1.2);
    const f=C.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q;
    const g=C.createGain(); const t=C.currentTime; g.gain.setValueAtTime(gain,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    s.connect(f).connect(g).connect(this.master); s.start(t,rand(0,1)); s.stop(t+dur+.02); },
  _tone(f0,f1,dur,gain,type='sine'){ const C=this.ctx; if(!C) return; const t=C.currentTime;
    const o=C.createOscillator(); o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    const g=C.createGain(); g.gain.setValueAtTime(gain,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g).connect(this.master); o.start(t); o.stop(t+dur+.02); },
  whoosh(p){ this._n(.12,1800+p*900,.8,.06+p*.05,'bandpass'); },
  hit(p){ this._n(.16,900+p*400,.7,.5+p*.35); this._tone(150,48,.16,.5+p*.3); if(p>.7)this.cheer(.5); },
  body(p){ this._n(.2,420,.9,.55+p*.3); this._tone(95,40,.2,.6); },
  tick(){ this._tone(1200,1150,.09,.18,'square'); },
  block(){ this._n(.09,2400,1.2,.25,'bandpass'); this._tone(260,120,.07,.15,'triangle'); },
  bell(){ const C=this.ctx; if(!C) return; [1,2.76,5.4].forEach((m,i)=>{ const t=C.currentTime;
      for(let k=0;k<3;k++){ const o=C.createOscillator(); o.frequency.value=880*m*(1+k*.002); const g=C.createGain();
        g.gain.setValueAtTime(0,t+k*.32); g.gain.linearRampToValueAtTime(.18/(i+1),t+k*.32+.005); g.gain.exponentialRampToValueAtTime(.001,t+k*.32+1.4);
        o.connect(g).connect(this.master); o.start(t+k*.32); o.stop(t+k*.32+1.5);} }); },
  cheer(a){ if(!this.crowdGain) return; const g=this.crowdGain.gain,t=this.ctx.currentTime;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value,t); g.linearRampToValueAtTime(.05+a*.35,t+.15); g.linearRampToValueAtTime(.05,t+1.8+a*1.5); }
};

/* ================================================================
   Renderer / scene / arena
   ================================================================ */
const canvas=$('#gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
const MOBILE=matchMedia('(pointer:coarse)').matches;
const Q={max:Math.min(window.devicePixelRatio||1,MOBILE?1.35:1.75),pr:0,ms:16,t:0}; Q.pr=Q.max;
renderer.setPixelRatio(Q.pr);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.3;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x141a2a); scene.fog=new THREE.Fog(0x141a2a,12,30);
const camera=new THREE.PerspectiveCamera(52,1,0.05,80);

}
function updateFx(dt){
  for(const f of flashes){ if(f.t<1){f.t+=dt*7; const k=f.t; f.s.material.opacity=Math.max(0,1-k); const s=f.size*(.6+k); f.s.scale.set(s,s,s);} else f.s.material.opacity=0; }
  for(let i=0;i<PN;i++){ if(pLife[i]>0){pLife[i]-=dt; const v=pVel[i]; v.y-=9.8*dt; pPos[i*3]+=v.x*dt;pPos[i*3+1]+=v.y*dt;pPos[i*3+2]+=v.z*dt;

}

/* ---------- hit detection: gloves are physical spheres ---------- */
const _h1=V3(),_h2=V3(),_h3=V3();
function checkHits(att,def){
  if(def.ragdoll||def.mode==='getup'||def.mode==='kd') return; // no hitting a man on the way up
  for(const side of ['L','R']){
    const P=att.punch[side]; if(!P||P.hit) continue;
    if(P.phase!=='strike'&&P.phase!=='hold') continue;
    const g=att.J['ha'+side], gv=att.hands[side].v, speed=gv.length();
    if(speed<1.0) continue;
    const toDef=_h1.subVectors(def.J.chest,g); if(gv.dot(toDef)<0 && P.phase==='hold') continue;
    let type=null; const point=V3();
    const gR=def.block?GLOVE_R*2:GLOVE_R*.75;
    for(const gs of ['L','R']){ // guard first: gloves (and when blocking, forearms) sit in front of the face
      if(g.distanceTo(def.J['ha'+gs])<gR){type='guard';point.lerpVectors(g,def.J['ha'+gs],.5);break;}
      if(def.block){ segClosest(g,def.J['el'+gs],def.J['ha'+gs],_h2); if(g.distanceTo(_h2)<GLOVE_R+.045){type='guard';point.copy(_h2);break;} }
    }
    if(!type && g.distanceTo(def.J.head)<GLOVE_R+HEAD_R){ type='head'; point.lerpVectors(g,def.J.head,.5); }
    if(!type){ segClosest(g,_h3.copy(def.J.pelvis).add(V3(0,.06,0)),def.J.chest,_h2); if(g.distanceTo(_h2)<GLOVE_R+.15){type='body';point.copy(_h2);} }
    if(!type) continue;
    resolveHit(att,def,P,side,type,point,gv.clone(),speed);
  }
}
function resolveHit(att,def,P,side,type,point,gv,speed){

  if(att.counterT>0 && type!=='guard'){ counter=true; att.counterT=0; if(att===player) showTag('COUNTER!'); }
  if(counter) power*=1.3;
  const p01=clamp(power/14,0,1.2);
  if(type==='guard'){
    const dmg=power*(def.block?.08:.3); def.hp-=dmg; att.stats.dmg+=dmg;
    def.stamina=Math.max(0,def.stamina-power*(def.block?.9:.4));
    def.push.addScaledVector(flat,.3+p01*.5); def.snap(dir,.15*p01); def.s.leanF.v-=p01*.6;

    def.hurtT=.4;

  G.state='down'; G.stateT=0; G.timeScale=.35; G.downF=def; G.winner=att; G.count=0; G.mash=0;
  G.getUpAt=def.isAI?rand(4,7.5)+def.knockdowns*1.2:6.5+def.knockdowns*1.2;
  if(def.isAI && Math.random()<(G.diff==='easy'?.25:.1)*def.knockdowns) G.getUpAt=11; // stays down
  const ab=V3().subVectors(def.pos,att.pos); cam.koA=Math.atan2(-ab.z,ab.x);
  SFX.cheer(1); crowdExcite=1; cam.shake=.1;
  banner('Knockdown!',def===player?'กดปุ่มหมัดรัวๆ เพื่อลุก':'ไปมุมกลาง');
}
function knockout(def,att,dir,power){
  if(!def.ragdoll) def.ragdoll=new Ragdoll(def.J,def.Jp,dir.clone().multiplyScalar(2.2+power*.22).add(V3(0,.6,0)),G.lastH||SIM_DT);
  def.punch={L:null,R:null};
  G.state='ko'; G.stateT=0; G.timeScale=.28; G.winner=att; G.how='ko';
  const ab=V3().subVectors(def.pos,att.pos); cam.koA=Math.atan2(-ab.z,ab.x); // camera perpendicular to the fall line
  SFX.cheer(1.2); crowdExcite=1; cam.shake=.12;
  banner('K.O.!',def.knockdowns>=2?'ล้ม 3 ครั้ง · TKO':(att===player?'น็อกเอาต์!':'คุณถูกน็อก'));
}
function updateCount(){ // referee's ten count
  const ct=G.stateT-1.6, n=Math.floor(ct);
  if(n>G.count && n>=1 && n<=10){ G.count=n; banner(String(n),G.downF===player?'กดปุ่มหมัดรัวๆ เพื่อลุก':''); SFX.tick(); }
  const need=G.getUpAt-(G.downF===player?G.mash*.28:0);
  if(ct>=10 || (need<10 && ct>=Math.max(3,need))){
    const f=G.downF, o=f===player?enemy:player;
    if(need>=10||ct>=10){ if(!f.ragdoll) f.ragdoll=new Ragdoll(f.J,f.Jp,V3(0,-.5,-.6).applyQuaternion(f.qYaw),G.lastH||SIM_DT);
      G.state='ko'; G.stateT=1.4; G.timeScale=1; G.how='ko'; banner('K.O.!','นับครบ 10'); SFX.cheer(1.2); }
    else { f.hp=Math.max(15,55-f.knockdowns*18); if(f.ragdoll) f.standUp(o); else f.rise(); f.rocked=1.6; G.state='fight'; G.stateT=0; G.timeScale=1;
      banner('Fight!',f===player?'ลุกขึ้นมาได้!':'คู่ชกลุกขึ้นมาได้'); }
  }
}

/* ================================================================
   Input: floating joystick (left) + multi-touch punch pad (right) + keyboard
   ================================================================ */
const input={x:0,y:0,kx:0,ky:0,block:false,duck:false,kblock:false,kduck:false};
const zone=$('#stickZone'), base=$('#stickBase'), knob=$('#stickKnob');
let stickId=null, stickO={x:0,y:0};
zone.addEventListener('pointerdown',e=>{ if(stickId!==null) return;
  const br=base.getBoundingClientRect(); stickO={x:br.left+br.width/2,y:br.top+br.height/2}; // fixed joystick: always measured from its centre
  if(Math.hypot(e.clientX-stickO.x,e.clientY-stickO.y)>br.width*.9) return;          // ignore touches far from the stick
  stickId=e.pointerId; try{zone.setPointerCapture(e.pointerId);}catch(_){}
  zone.classList.remove('idle'); moveStick(e); e.preventDefault(); });
zone.addEventListener('pointermove',e=>{ if(e.pointerId===stickId) moveStick(e); });
const endStick=e=>{ if(e.pointerId!==stickId) return; stickId=null; input.x=input.y=0; knob.style.transform=''; zone.classList.add('idle'); };
zone.addEventListener('pointerup',endStick); zone.addEventListener('pointercancel',endStick);
function moveStick(e){ const R=55; let dx=e.clientX-stickO.x, dy=e.clientY-stickO.y; const l=Math.hypot(dx,dy);
  if(l>R){dx*=R/l;dy*=R/l;} knob.style.transform=`translate(${dx}px,${dy}px)`;
  let x=dx/R,y=-dy/R; const m=Math.hypot(x,y); if(m<.12){x=y=0;} input.x=x; input.y=y; }

document.querySelectorAll('.pb').forEach(b=>{
  b.addEventListener('pointerdown',e=>{ e.preventDefault(); try{b.setPointerCapture(e.pointerId);}catch(_){} b.classList.add('on');
    if(b.dataset.act) queuePunch(b.dataset.act); if(b.dataset.hold) input[b.dataset.hold]=true; });
  const up=e=>{ b.classList.remove('on'); if(b.dataset.hold) input[b.dataset.hold]=false; };
  b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up); b.addEventListener('lostpointercapture',up);
});
function queuePunch(type){ if(G.paused) return; SFX.init();
  if(G.state==='down'&&G.downF===player){ G.mash++; return; }   // mash to beat the count
  if(G.state!=='fight') return; player.buffer={type,body:player.duck&&player.lean.y>-.35,t:.28}; }
const keys={};
addEventListener('keydown',e=>{ if(e.repeat) return; keys[e.code]=true;
  const map={KeyJ:'jab',KeyK:'cross',KeyU:'hookL',KeyI:'hookR',KeyN:'upperL',KeyM:'upperR'}; if(map[e.code]) queuePunch(map[e.code]);
  if(e.code==='Escape'||e.code==='KeyP') togglePause(); if(e.code==='KeyC') cycleCam(); });
addEventListener('keyup',e=>{ keys[e.code]=false; });
addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; input.block=input.duck=false; });
addEventListener('contextmenu',e=>e.preventDefault());
function readKeys(){
  input.kx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
  input.ky=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0);
  input.kblock=!!(keys.KeyL||keys.Space); input.kduck=!!(keys.ShiftLeft||keys.ShiftRight);
}

/* ================================================================
   Camera
   ================================================================ */
const cam={mode:1,pos:V3(0,2.2,-4),look:V3(0,1.2,0),shake:0,orbit:0,koA:0};
const CAM_NAMES=['หลังไหล่','ด้านข้าง','ทีวี'];
function cycleCam(){ cam.mode=(cam.mode+1)%3; $('#camBtn').textContent='มุมกล้อง: '+CAM_NAMES[cam.mode]; }
$('#camBtn').addEventListener('click',cycleCam);
const _c1=V3(),_c2=V3(),_c3=V3(),_c4=V3();
function updateCamera(dt,t){
  const P=player.ragdoll?player.J.pelvis:player.pos, E=enemy.ragdoll?enemy.J.pelvis:enemy.pos;
  const d=_c1.subVectors(E,P); d.y=0; const dist=Math.max(.3,d.length()); d.normalize();
  const right=_c2.set(-d.z,0,d.x), mid=_c3.lerpVectors(P,E,.5);
  const want=_c4, look=V3();
  if(G.state==='menu'){ cam.orbit+=dt*.12; want.set(Math.sin(cam.orbit)*3.6,1.7,Math.cos(cam.orbit)*3.6); look.set(0,1.15,0); }
  else if(cam.mode===0){ want.copy(P).addScaledVector(d,-2.2).addScaledVector(right,1.0); want.y=1.8; look.copy(P).addScaledVector(d,dist*.62); look.y=1.32; }
  else if(cam.mode===1){ want.copy(mid).addScaledVector(right,3.1); want.y=1.45; look.copy(mid); look.y=1.15; }
  else { want.copy(mid).addScaledVector(right,4.2).addScaledVector(d,-2.2); want.y=2.9; look.copy(mid); look.y=1.0; }
  if(G.state==='down'||((G.state==='ko'||G.state==='result')&&G.how==='ko')){ // slow orbit around the fallen fighter, from the side
    const v=G.winner===player?enemy:player; const a=cam.koA+G.stateT*.25;
    look.copy(v.J.pelvis); look.y=.55; want.copy(v.J.pelvis).add(V3(Math.sin(a)*2.5,1.35,Math.cos(a)*2.5)); }
  const k=1-Math.exp(-(G.state==='menu'?2:5.5)*dt);
  cam.pos.lerp(want,k); cam.look.lerp(look,k*1.3);
  if(cam.override){ cam.pos.copy(cam.override.pos); cam.look.copy(cam.override.look); } // debugging / photo mode
  cam.pos.x=clamp(cam.pos.x,-7,7); cam.pos.z=clamp(cam.pos.z,-7,7);
  camera.position.copy(cam.pos); cam.shake*=Math.exp(-9*dt);
  camera.position.add(V3(rand(-1,1),rand(-1,1),rand(-1,1)).multiplyScalar(cam.shake));
  camera.lookAt(cam.look);
}

/* ================================================================
   Flow, HUD, loop
   ================================================================ */
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
function banner(txt,sub){ const b=$('#banner'); b.innerHTML=txt+(sub?`<small>${sub}</small>`:''); b.classList.remove('show'); void b.offsetWidth; b.classList.add('show'); }
let tagTimer=0; function showTag(t){ const c=$('#combo'); c.textContent=t; c.style.opacity=1; clearTimeout(tagTimer); tagTimer=setTimeout(()=>c.style.opacity=0,1000); }
function showCombo(n){ showTag(n+' HIT COMBO'); }
function startFight(){
  SFX.init(); G.round=1; resetFighters(true); startRound();
  $('#menu').hidden=true; $('#result').hidden=true; $('#hud').hidden=false;
  try{ const el=document.documentElement; if(el.requestFullscreen && matchMedia('(pointer:coarse)').matches) el.requestFullscreen().then(()=>screen.orientation?.lock?.('landscape')).catch(()=>{}); }catch(e){}
}
function startRound(){ G.state='intro'; G.stateT=0; G.clock=ROUND_TIME; G.timeScale=1; $('#rd').textContent='ROUND '+G.round; banner('Round '+G.round,G.round===ROUNDS?'ยกสุดท้าย':'เตรียมตัว'); }
function endRound(){
  if(G.round<ROUNDS){ G.state='break'; G.stateT=0; SFX.bell(); banner('จบยก '+G.round,'พักมุม'); }
  else { const a=player.stats.dmg+player.stats.landed*.5, b=enemy.stats.dmg+enemy.stats.landed*.5;
    G.winner=a>=b?player:enemy; G.how='points'; G.state='result'; G.stateT=0; SFX.bell(); showResult(); }
}
function showResult(){
  const win=G.winner===player;
  $('#resEyebrow').textContent=G.how==='ko'?'ชนะด้วยการน็อก · ยก '+G.round:'ตัดสินคะแนน · ครบ '+ROUNDS+' ยก';
  const t=$('#resTitle'); t.textContent=win?(G.how==='ko'?'K.O. Win':'You Win'):(G.how==='ko'?'K.O.':'You Lose'); t.className=win?'win':'';
  $('#resText').textContent=win?'แชมป์คนใหม่ของเวทีนี้':'ลุกขึ้นมาแก้มือกันอีกยก';
  const acc=s=>s.thrown?Math.round(s.landed/s.thrown*100)+'%':'–';
  const P=player.stats,E=enemy.stats;
  $('#resStats').innerHTML=`<span class="h"></span><span class="h">คุณ</span><span class="h">CPU</span>
    <span>หมัดที่ปล่อย</span><span>${P.thrown}</span><span>${E.thrown}</span>
    <span>เข้าเป้า</span><span>${P.landed} (${acc(P)})</span><span>${E.landed} (${acc(E)})</span>
    <span>หมัดลำตัว</span><span>${P.body}</span><span>${E.body}</span>
    <span>ดาเมจรวม</span><span>${Math.round(P.dmg)}</span><span>${Math.round(E.dmg)}</span>`;
  $('#hud').hidden=true; $('#result').hidden=false;
}
function togglePause(){ if(!['fight','intro','break','down'].includes(G.state)) return; G.paused=!G.paused; $('#pauseOv').hidden=!G.paused; }
$('#pauseBtn').addEventListener('click',togglePause);
$('#resumeBtn').addEventListener('click',togglePause);
$('#quitBtn').addEventListener('click',()=>{ G.paused=false; $('#pauseOv').hidden=true; toMenu(); });
function toMenu(){ G.state='menu'; G.timeScale=1; resetFighters(true); $('#hud').hidden=true; $('#result').hidden=true; $('#menu').hidden=false; }
$('#startBtn').addEventListener('click',startFight);
$('#againBtn').addEventListener('click',startFight);
$('#menuBtn').addEventListener('click',toMenu);
document.querySelectorAll('#diff button').forEach(b=>b.addEventListener('click',()=>{
  G.diff=b.dataset.d; document.querySelectorAll('#diff button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  try{localStorage.setItem('ironring.diff',G.diff);}catch(e){} }));
try{ const d=localStorage.getItem('ironring.diff'); if(d&&AI_CFG[d]) document.querySelector(`#diff button[data-d="${d}"]`).click(); }catch(e){}

const SIM_DT=1/120;
const _mv1=V3(),_mv2=V3();
function simStep(dt){
  G.lastH=dt;
  const fighting=G.state==='fight';
  // player controls (camera-relative so every camera mode feels natural)
  readKeys();
  const ix=clamp(input.x+input.kx,-1,1), iy=clamp(input.y+input.ky,-1,1);
  player.block=fighting&&(input.block||input.kblock); player.duck=fighting&&(input.duck||input.kduck);
  player.lean.x=ix; player.lean.y=iy; // while LEAN is held the stick moves the head, not the feet
  if(fighting){ camera.getWorldDirection(_mv1); _mv1.y=0; _mv1.normalize(); _mv2.set(-_mv1.z,0,_mv1.x);
    player.moveDir.copy(_mv2).multiplyScalar(ix).addScaledVector(_mv1,iy); if(player.moveDir.length()>1) player.moveDir.normalize(); }
  else player.moveDir.set(0,0,0);
  if(fighting) brain.update(dt); else { enemy.moveDir.set(0,0,0); enemy.block=enemy.duck=false; }
  if(G.state==='ko'||G.state==='result'||G.state==='down'){ const w=G.winner, l=w===player?enemy:player; if(w&&!w.ragdoll){ // winner walks to a neutral corner
      const away=_mv1.subVectors(w.pos,l.J.pelvis); away.y=0; w.moveDir.copy(away.normalize()).multiplyScalar(G.stateT>.6?.45:0); w.block=w.duck=false; } }
  player.update(dt,enemy); enemy.update(dt,player);
  // body-to-body collision (no walking through each other)
  if(!player.ragdoll&&!enemy.ragdoll){ const d=_mv1.subVectors(enemy.pos,player.pos); d.y=0; const l=d.length(), min=.56;
    if(l<min&&l>1e-4){ d.divideScalar(l); const push=(min-l)*.5; player.pos.addScaledVector(d,-push); enemy.pos.addScaledVector(d,push);
      const rv=_mv2.subVectors(enemy.push,player.push).dot(d); if(rv<0){ player.push.addScaledVector(d,rv*.5); enemy.push.addScaledVector(d,-rv*.5);} } }
  if(fighting){ checkHits(player,enemy); if(G.state==='fight') checkHits(enemy,player); }
}
const HUDC={}, HUDE={};
function hudSet(id,prop,v){ if(HUDC[id+prop]===v) return; HUDC[id+prop]=v; const e=HUDE[id]||(HUDE[id]=$('#'+id)); if(prop==='text') e.textContent=v; else e.style.transform=v; }
function updateHUD(dt){
  for(const [f,i] of [[player,1],[enemy,2]]){
    f.hpGhost=f.hpGhost>f.hp?Math.max(f.hp,f.hpGhost-dt*25):f.hp;
    hudSet('hp'+i,'tf',`scaleX(${(f.hp/100).toFixed(3)})`); hudSet('hp'+i+'g','tf',`scaleX(${(f.hpGhost/100).toFixed(3)})`);
    hudSet('st'+i,'tf',`scaleX(${(f.stamina/100).toFixed(2)})`);
  }
  hudSet('tm','text',fmt(G.clock));
}

let last=performance.now(), acc=0, elapsed=0;
function frame(now){
  const raw=(now-last)/1000, dt=Math.min(.05,raw); last=now; elapsed+=dt;
  // adaptive resolution: drop the render scale when frames run long, raise it back when there is headroom
  Q.ms+=(raw*1000-Q.ms)*.05; Q.t+=dt;
  if(Q.t>1.5){ Q.t=0; const want=Q.ms>21?Math.max(.75,Q.pr-.15):Q.ms<13?Math.min(Q.max,Q.pr+.1):Q.pr;
    if(Math.abs(want-Q.pr)>.01){ Q.pr=want; renderer.setPixelRatio(Q.pr); resize(); } }
  if(!G.paused){
    G.stateT+=dt;
    if(G.state==='intro' && G.stateT>1.7){ G.state='fight'; G.stateT=0; SFX.bell(); banner('Fight!'); }
    if(G.state==='fight'){ G.clock-=dt; if(G.clock<=0) endRound(); }
    if(G.state==='break' && G.stateT>3.2){ G.round++; for(const f of [player,enemy]) f.hp=Math.min(100,f.hp+12);
      resetFighters(false); startRound(); }
    if(G.state==='down'){ G.timeScale=lerp(.35,1,smooth((G.stateT-.6)/.6)); updateCount(); }
    if(G.state==='ko'){ G.timeScale=lerp(.28,1,smooth((G.stateT-1.2)/1)); if(G.stateT>3.6){ G.state='result'; G.stateT=0; showResult(); } }
    G.comboT-=dt; if(G.comboT<=0) G.combo=0;
    crowdExcite*=Math.exp(-.6*dt);
    if(G.hitstop>0) G.hitstop-=dt;
    else { // split this frame's time into equal substeps (≤1/90 s) so motion advances evenly at any refresh rate
      const T=dt*G.timeScale, n=clamp(Math.ceil(T/(1/90)),1,8); for(let i=0;i<n;i++) simStep(T/n); }
  }
  player.render(); enemy.render();
  updateFx(dt*(G.state==='ko'?G.timeScale:1)); updateCamera(dt,elapsed);
  if(!$('#hud').hidden) updateHUD(dt);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.fov=w/h<1.5?60:52; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();
requestAnimationFrame(frame);
$('#startBtn').disabled=true; $('#startBtn').textContent='กำลังโหลดนักชก…';
loadRig(p=>{ $('#startBtn').textContent='กำลังโหลดนักชก… '+Math.round(p*100)+'%'; })
  .then(()=>{ player.attachRig(); enemy.attachRig(); resetFighters(true); $('#startBtn').disabled=false; $('#startBtn').textContent='ขึ้นชก'; })
  .catch(e=>{ console.error('fighter assets',e); $('#startBtn').textContent='โหลดนักชกไม่สำเร็จ'; $('#loadErr').textContent='สาเหตุ: '+(e&&e.message||e); $('#loadErr').hidden=false; });
window.__game={G,player,enemy,PUNCH,checkHits,simStep,cam,RIG,updateCount};
</script>
