<title>เช็กก่อนตัดสินใจเรื่องใหญ่</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Sora:wght@500;600&display=swap">
<style>
/* Layout: one mobile column (max 560px) on a soft grey ground · white cards without borders · black inverse panels hold the money
   Screens: start → wizard (one question per screen, live receipt) → home (summary) → finding detail / lab (own screens) */
:root {
  --bg: #f2f2f3;
  --card: #ffffff;
  --surface: #f2f2f3;
  --surface-2: #e6e6e9;
  --line: #e3e3e7;
  --line-strong: #c6c6cc;
  --ink: #0b0b0c;
  --ink-2: #393940;
  --muted: #696970;
  --faint: #a9a9b0;
  --panel: #0b0b0c;
  --panel-ink: #ffffff;
  --panel-muted: rgba(255, 255, 255, 0.64);
  --panel-line: rgba(255, 255, 255, 0.16);
  --panel-dot: rgba(255, 255, 255, 0.09);
  --panel-btn: #ffffff;
  --panel-btn-ink: #0b0b0c;
  --ghost: #b8b8be;
  --shadow: 0 1px 2px rgba(11, 11, 12, 0.04), 0 8px 24px rgba(11, 11, 12, 0.06);
  --font-th: "IBM Plex Sans Thai", "Noto Sans Thai", "Thonburi", system-ui, sans-serif;
  --font-num: "Space Grotesk", "IBM Plex Sans Thai", system-ui, sans-serif;
  --font-latin: "Sora", "IBM Plex Sans Thai", system-ui, sans-serif;
  --r: 20px;
  --r-sm: 14px;
  --col: 560px;
  --foot-h: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09090a; --card: #151517; --surface: #1d1d20; --surface-2: #27272b; --line: #2a2a2e; --line-strong: #3d3d43;
    --ink: #f4f4f5; --ink-2: #d4d4d8; --muted: #a1a1a9; --faint: #64646b;
    --panel: #ededef; --panel-ink: #0b0b0c; --panel-muted: rgba(11, 11, 12, 0.62); --panel-line: rgba(11, 11, 12, 0.14); --panel-dot: rgba(11, 11, 12, 0.07);
    --panel-btn: #0b0b0c; --panel-btn-ink: #ffffff; --ghost: #57575e;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09090a; --card: #151517; --surface: #1d1d20; --surface-2: #27272b; --line: #2a2a2e; --line-strong: #3d3d43;
  --ink: #f4f4f5; --ink-2: #d4d4d8; --muted: #a1a1a9; --faint: #64646b;
  --panel: #ededef; --panel-ink: #0b0b0c; --panel-muted: rgba(11, 11, 12, 0.62); --panel-line: rgba(11, 11, 12, 0.14); --panel-dot: rgba(11, 11, 12, 0.07);
  --panel-btn: #0b0b0c; --panel-btn-ink: #ffffff; --ghost: #57575e;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4); color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-th); font-size: 16px; line-height: 1.55; margin: 0; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 8px; }
.num { font-family: var(--font-num); letter-spacing: -0.02em; }
.muted { color: var(--muted); }
svg { flex: none; }

.wrap { max-width: var(--col); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { padding-bottom: calc(var(--foot-h) + 40px + env(safe-area-inset-bottom, 0px)); }

/* ---------- top bar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); }
.bar .wrap { display: flex; align-items: center; gap: 6px; min-height: 60px; }
.bar .ttl { flex: 1; min-width: 0; text-align: center; font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .ttl small { display: block; font-family: var(--font-latin); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.ib { width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center; color: var(--ink); }
.ib:hover { background: var(--surface-2); }
.ib svg { width: 22px; height: 22px; }
.tb { min-height: 44px; padding: 0 12px; border-radius: 22px; border: 0; background: transparent; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 4px; }
.tb svg { width: 20px; height: 20px; }
.tb:hover { background: var(--surface-2); }
.spacer44 { width: 44px; flex: none; }

/* ---------- buttons ---------- */
.btn { min-height: 54px; border-radius: 16px; border: 0; background: var(--ink); color: var(--bg); font-weight: 700; font-size: 17px; padding: 0 20px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn svg { width: 20px; height: 20px; }
.btn.ghost { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.35; cursor: default; }
.btn.on-panel { background: var(--panel-btn); color: var(--panel-btn-ink); }
.lnk { background: none; border: 0; padding: 0 4px; min-height: 44px; font-weight: 600; font-size: 15px; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1.5px; color: var(--ink); }

/* ---------- inverse panel (the money lives here) ---------- */
.panel {
  background-color: var(--panel); color: var(--panel-ink); border-radius: 28px; padding: 22px 20px 20px; position: relative; overflow: hidden;
  background-image: radial-gradient(var(--panel-dot) 1.2px, transparent 1.3px); background-size: 14px 14px; background-position: 7px 7px;
}
.panel .eyebrow { font-size: 13px; color: var(--panel-muted); font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.panel .tag { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--panel-line); color: var(--panel-ink); }
.bignum { font-family: var(--font-num); font-weight: 700; font-size: 60px; line-height: 1; letter-spacing: -0.045em; margin: 10px 0 6px; overflow-wrap: anywhere; }
.bignum .u { font-family: var(--font-th); font-size: 20px; font-weight: 600; letter-spacing: 0; margin-left: 8px; }
.panel .sub { font-size: 14px; color: var(--panel-muted); }
.panel .delta { font-family: var(--font-num); font-weight: 700; font-size: 16px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin-top: 18px; border-top: 1px solid var(--panel-line); padding-top: 14px; }
.stat { min-width: 0; padding-right: 8px; }
.stat + .stat { border-left: 1px solid var(--panel-line); padding-left: 12px; }
.stat .k { font-size: 12px; color: var(--panel-muted); line-height: 1.35; }
.stat .v { font-family: var(--font-num); font-weight: 700; font-size: 22px; line-height: 1.2; margin-top: 4px; letter-spacing: -0.02em; white-space: nowrap; }
.stat .v small { font-family: var(--font-th); font-size: 12px; font-weight: 600; letter-spacing: 0; margin-left: 2px; }
.stat .d { font-family: var(--font-num); font-size: 12px; font-weight: 700; margin-top: 2px; }
.stat .n { font-size: 12px; color: var(--panel-muted); line-height: 1.35; }
.panel .cta { margin-top: 18px; }
.up::before { content: "▲ "; font-size: 0.78em; }
.down::before { content: "▼ "; font-size: 0.78em; }

/* ---------- start ---------- */
.start-hero { margin-top: 8px; }
.start-hero h1 { font-size: 27px; line-height: 1.32; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.start-hero p { margin: 10px 0 0; color: var(--panel-muted); font-size: 15px; }
.demo { margin-top: 18px; border-top: 1px solid var(--panel-line); padding-top: 14px; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: end; }
.demo .k { font-size: 13px; color: var(--panel-muted); }
.demo .v { font-family: var(--font-num); font-weight: 700; font-size: 34px; letter-spacing: -0.03em; line-height: 1; }
.demo .d { font-family: var(--font-num); font-weight: 700; font-size: 15px; text-align: right; }
.demo .note { grid-column: 1 / -1; font-size: 13px; color: var(--panel-muted); }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 28px 2px 12px; }
.sec-h h2 { font-size: 20px; margin: 0; line-height: 1.3; }
.sec-h .aside { font-size: 14px; color: var(--muted); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { text-align: left; border: 0; background: var(--card); border-radius: var(--r); padding: 16px 14px 14px; min-height: 124px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); }
.tile:hover { box-shadow: inset 0 0 0 1.5px var(--ink); }
.tile .ic { width: 40px; height: 40px; border-radius: 12px; background: var(--surface); display: flex; align-items: center; justify-content: center; }
.tile .ic svg { width: 22px; height: 22px; }
.tile .t { font-weight: 700; font-size: 15px; line-height: 1.35; }
.tile .ex { font-size: 13px; color: var(--muted); line-height: 1.4; margin-top: auto; }
.fine { font-size: 13px; color: var(--muted); margin: 24px 2px 0; }

/* ---------- wizard ---------- */
.prog { display: flex; gap: 4px; margin: 4px 0 0; }
.prog i { flex: 1; height: 4px; border-radius: 2px; background: var(--surface-2); }
.prog i.on { background: var(--ink); }
.receipt-strip { margin-top: 14px; padding: 14px 16px; }
.receipt-strip .rs-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.receipt-strip .rs-k { font-size: 13px; color: var(--panel-muted); font-weight: 600; }
.receipt-strip .rs-v { font-family: var(--font-num); font-weight: 700; font-size: 30px; letter-spacing: -0.03em; line-height: 1.1; }
.receipt-strip .rs-v small { font-family: var(--font-th); font-size: 14px; font-weight: 600; letter-spacing: 0; margin-left: 4px; }
.receipt-strip .rs-lines { margin-top: 8px; display: grid; gap: 2px; font-size: 13px; }
.rs-line { display: flex; gap: 6px; align-items: baseline; color: var(--panel-muted); }
.rs-line i { flex: 1; border-bottom: 1px dotted var(--panel-line); transform: translateY(-3px); }
.rs-line b { font-family: var(--font-num); color: var(--panel-ink); font-weight: 600; }
.rs-empty { font-size: 14px; color: var(--panel-muted); margin-top: 4px; }
.q-head { margin: 26px 2px 6px; }
.q-head .step { font-size: 13px; color: var(--muted); font-weight: 600; }
.q-head h1 { font-size: 26px; line-height: 1.3; margin: 4px 0 0; text-wrap: balance; }
.q-head p { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
.qfields { display: grid; gap: 18px; margin-top: 18px; }
.field { display: grid; gap: 8px; min-width: 0; }
.field > label, .field > .lab { font-weight: 600; font-size: 15px; }
.field .help { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0; }
.inbox { display: flex; align-items: center; background: var(--card); border-radius: 16px; min-height: 60px; box-shadow: inset 0 0 0 1.5px var(--line); overflow: hidden; }
.inbox:focus-within { box-shadow: inset 0 0 0 2px var(--ink); }
.inbox input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 0 16px; font-family: var(--font-num); font-size: 24px; font-weight: 600; outline: none; height: 58px; letter-spacing: -0.01em; }
.inbox input::placeholder { color: var(--faint); font-weight: 500; }
.inbox .suf { padding: 0 16px 0 4px; color: var(--muted); font-size: 15px; white-space: nowrap; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 14px; padding: 4px; gap: 4px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 10px; min-height: 44px; padding: 0 16px; font-size: 15px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.inbox .seg { margin: 6px; padding: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 48px; padding: 0 18px; border-radius: 24px; border: 0; background: var(--card); box-shadow: inset 0 0 0 1.5px var(--line); font-weight: 600; font-size: 16px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: none; }
.chips input { width: 140px; min-height: 48px; border: 0; border-radius: 24px; padding: 0 16px; background: var(--card); box-shadow: inset 0 0 0 1.5px var(--line); font-size: 15px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.two > * { min-width: 0; }
.two .inbox input { font-size: 20px; }
.fee-help { display: grid; gap: 10px; padding: 14px; border-radius: 16px; background: var(--surface-2); }
.fee-help .fh-res { font-size: 14px; color: var(--ink-2); }
.fee-help .fh-res b { font-family: var(--font-num); color: var(--ink); }
.fee-help label { font-size: 13px; font-weight: 600; }
.adv-block { background: var(--card); border-radius: var(--r); padding: 4px 16px; box-shadow: var(--shadow); }
.adv-block summary { list-style: none; cursor: pointer; min-height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 700; font-size: 16px; }
.adv-block summary::-webkit-details-marker { display: none; }
.adv-block summary small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
.adv-block summary svg { width: 20px; height: 20px; transition: transform 0.2s; color: var(--muted); }
.adv-block[open] summary svg { transform: rotate(180deg); }
.adv-block .qfields { margin: 4px 0 18px; }
.adv-list { display: grid; gap: 10px; margin-top: 18px; }
.months { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.month { min-height: 48px; border-radius: 12px; border: 0; background: var(--surface); font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; }
.month small { font-size: 10px; font-weight: 700; }
.month[data-s="high"] { background: var(--ink); color: var(--bg); }
.month[data-s="low"] { background: var(--surface-2); box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: linear-gradient(to top, var(--bg) 70%, transparent); padding-bottom: env(safe-area-inset-bottom, 0px); }
.foot .wrap { display: flex; gap: 10px; padding-top: 18px; padding-bottom: 14px; }
.foot .btn { flex: 1; }
.foot .btn.back { flex: 0 0 auto; width: 60px; padding: 0; }
.foot2 .btn { font-size: 16px; padding: 0 16px; }
.foot2 .btn.ghost { flex: 0 0 auto; }
.skip { display: flex; justify-content: center; margin-top: 10px; }

/* ---------- review (แก้ตัวเลข) ---------- */
.rv { display: grid; gap: 8px; margin-top: 12px; }
.rv-row { width: 100%; text-align: left; border: 0; background: var(--card); border-radius: var(--r-sm); padding: 14px 16px; display: grid; grid-template-columns: 1fr 20px; gap: 2px 10px; align-items: center; box-shadow: var(--shadow); min-height: 64px; }
.rv-row .t { font-weight: 700; font-size: 15px; }
.rv-row .v { font-size: 14px; color: var(--muted); grid-column: 1; line-height: 1.45; }
.rv-row svg { grid-row: 1 / span 2; grid-column: 2; width: 18px; height: 18px; color: var(--muted); }

/* ---------- home ---------- */
.banner { margin-top: 4px; margin-bottom: 12px; padding: 10px 14px; border-radius: var(--r-sm); background: var(--card); box-shadow: var(--shadow); font-size: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.flist { display: grid; gap: 8px; }
.frow { width: 100%; text-align: left; border: 0; background: var(--card); border-radius: var(--r); padding: 16px; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; box-shadow: var(--shadow); min-height: 76px; }
.frow .ft { font-weight: 700; font-size: 16px; line-height: 1.4; grid-column: 1; }
.frow .fm { font-family: var(--font-num); font-weight: 700; font-size: 20px; letter-spacing: -0.02em; white-space: nowrap; text-align: right; }
.frow .fm small { display: block; font-family: var(--font-th); font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.frow .pill { grid-column: 1; justify-self: start; }
.frow svg { width: 18px; height: 18px; color: var(--muted); }
.frow .fr-r { grid-row: 1 / span 2; grid-column: 2; display: flex; align-items: center; gap: 6px; }
.pill { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px var(--line-strong); white-space: nowrap; letter-spacing: 0.01em; display: inline-block; }
.pill.high { background: var(--ink); color: var(--bg); box-shadow: none; }
.pill.mid { box-shadow: inset 0 0 0 1.5px var(--ink); }
.pill.watch { box-shadow: none; background: var(--surface-2); }
.pill.note { color: var(--muted); }
.ok-box { background: var(--card); border-radius: var(--r); padding: 18px 16px; box-shadow: var(--shadow); }
.ok-box b { font-size: 16px; }
.ok-box p { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
.cards { display: grid; gap: 12px; }
.card { background: var(--card); border-radius: var(--r); padding: 18px 16px; box-shadow: var(--shadow); min-width: 0; }
.card h3 { font-size: 16px; margin: 0; line-height: 1.4; }
.card .lead { font-size: 15px; color: var(--ink-2); margin: 4px 0 0; }
.card .lead b { font-family: var(--font-num); color: var(--ink); }

/* gauge */
.gauge { margin-top: 26px; padding-bottom: 24px; position: relative; }
.gauge .track { position: relative; height: 14px; border-radius: 7px; background: var(--surface-2); }
.gauge .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 7px; background: var(--ink); transition: width 0.35s cubic-bezier(.2, .8, .2, 1); }
.gauge .gfill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 7px; background: var(--ghost); }
.gauge .mark { position: absolute; top: -7px; bottom: -7px; width: 3px; border-radius: 2px; background: var(--ink); box-shadow: 0 0 0 2px var(--card); transform: translateX(-1.5px); transition: left 0.35s cubic-bezier(.2, .8, .2, 1); }
.gauge .ml { position: absolute; top: -26px; transform: translateX(-50%); font-size: 12px; font-weight: 700; white-space: nowrap; transition: left 0.35s; }
.gauge .nl { position: absolute; bottom: 0; transform: translateX(-50%); font-size: 12px; color: var(--muted); white-space: nowrap; transition: left 0.35s; }
.gauge .el { transform: none; } .gauge .er { transform: translateX(-100%); }

/* chart */
.chart { margin-top: 10px; position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .ax { font-family: var(--font-num); font-size: 11px; fill: var(--muted); }
.chart .axth { font-family: var(--font-th); font-size: 11px; fill: var(--muted); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .zero { stroke: var(--ink-2); stroke-width: 1; }
.chart .line { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .line.ghost { stroke: var(--ghost); stroke-width: 2; }
.chart .area { fill: var(--ink); opacity: 0.06; }
.chart .dot { fill: var(--ink); stroke: var(--card); stroke-width: 2; }
.chart .endlab { font-family: var(--font-num); font-size: 12px; font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: var(--card); stroke-width: 4px; stroke-linejoin: round; }
.chart .hit { fill: transparent; }
.chart .cross { stroke: var(--ink-2); stroke-width: 1; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 7px 10px; font-size: 13px; line-height: 1.4; white-space: nowrap; transform: translate(-50%, -100%); z-index: 3; }
.tip b { font-family: var(--font-num); }
.legend { display: flex; gap: 16px; margin-top: 8px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 16px; height: 3px; border-radius: 2px; background: var(--ink); }
.legend i.g { background: var(--ghost); }

/* receipt */
.receipt { position: relative; background: var(--card); padding: 22px 18px 20px; margin: 10px 0; box-shadow: var(--shadow); border-radius: 4px; }
.receipt::before, .receipt::after {
  content: ""; position: absolute; left: 0; right: 0; height: 10px;
  background: radial-gradient(circle at 7px 0, transparent 6px, var(--card) 6.5px) repeat-x; background-size: 14px 10px;
}
.receipt::before { top: -9px; transform: rotate(180deg); }
.receipt::after { bottom: -9px; }
.rc-head { text-align: center; padding-bottom: 12px; border-bottom: 1.5px dashed var(--line-strong); }
.rc-head .rt { font-weight: 700; font-size: 16px; }
.rc-head .rs { font-size: 13px; color: var(--muted); font-family: var(--font-num); letter-spacing: 0.04em; }
.rc-bar { display: flex; gap: 2px; height: 12px; margin: 14px 0 6px; border-radius: 3px; overflow: hidden; }
.rc-bar i { display: block; background: var(--ghost); height: 100%; transition: flex-grow 0.35s; }
.rc-bar i.k { background: var(--ink); }

.wrapseg button { flex: 1 0 auto; min-width: 48px; }
.err { margin: 2px 2px 0; font-size: 13px; font-weight: 600; color: var(--ink); display: flex; gap: 6px; }
.err::before { content: "!"; display: inline-flex; width: 18px; height: 18px; border-radius: 9px; background: var(--ink); color: var(--bg); font-size: 12px; font-weight: 700; align-items: center; justify-content: center; flex: none; margin-top: 1px; }
.inbox.bad { box-shadow: inset 0 0 0 2px var(--ink); }

/* ขายที่ไหน + หมวดของเรื่อง */
.where3 { margin: 0 2px 14px; display: grid; gap: 8px; }
.where3 .wh-l { font-size: 14px; font-weight: 700; }
.where3 .seg { display: flex; }
.where3 .seg button { min-height: 44px; flex: 1; padding: 0 10px; }
.where3.big { gap: 4px; }
.wh-q { font-size: 22px; line-height: 1.35; margin: 0; }
.where3 .wh-n { margin: 0; font-size: 14px; color: var(--muted); }
.wh-cards { display: grid; gap: 10px; margin-top: 10px; }
.wh-c { width: 100%; text-align: left; border: 0; background: var(--card); border-radius: 20px; padding: 14px 12px 14px 14px; min-height: 76px; display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow); color: var(--ink); }
.wh-c:hover { box-shadow: inset 0 0 0 1.5px var(--ink); }
.wh-i { width: 46px; height: 46px; border-radius: 15px; background: var(--surface); display: flex; align-items: center; justify-content: center; flex: none; }
.wh-i svg { width: 24px; height: 24px; }
.wh-b { flex: 1; min-width: 0; display: grid; gap: 2px; }
.wh-b b { font-size: 18px; line-height: 1.3; }
.wh-b small { font-size: 13px; color: var(--muted); line-height: 1.4; }
.wh-c > svg { width: 20px; height: 20px; color: var(--muted); }

/* แถบขั้นตอน: เลือกเรื่อง → ตัวเลขร้าน → ตัวเลขเรื่องนี้ → ผล (ชุดเดียวตลอดทาง) */
.flow3 { margin: 4px 0 0; }
.flow3 ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.flow3 li { display: grid; gap: 6px; min-width: 0; }
.flow3 li i { display: block; height: 4px; border-radius: 2px; background: var(--surface-2); position: relative; overflow: hidden; }
.flow3 li i::after { content: ""; position: absolute; inset: 0; background: var(--ink); transform-origin: left; transform: scaleX(var(--f, 0)); transition: transform 0.45s cubic-bezier(.2, .8, .2, 1); }
.flow3 li span { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.flow3 li.done span { color: var(--ink-2); }
.flow3 li.done span::before { content: "✓ "; font-weight: 700; color: var(--ink); }
.flow3 li.now span { color: var(--ink); font-weight: 700; }
.cat3 + .cat3 { margin-top: 20px; }
.cat-h { margin: 0 2px 10px; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; color: var(--muted); }

/* เลือกแบบย่อยของเรื่อง */
.kinds { display: grid; gap: 8px; }
.kd { width: 100%; min-height: 60px; border: 0; border-radius: 16px; background: var(--card); box-shadow: inset 0 0 0 1.5px var(--line-strong); padding: 12px 14px;
  display: grid; grid-template-columns: 22px 1fr; gap: 12px; align-items: center; text-align: left; color: var(--ink); }
.kd-r { width: 22px; height: 22px; border-radius: 11px; box-shadow: inset 0 0 0 2px var(--line-strong); }
.kd-b { display: grid; gap: 2px; min-width: 0; }
.kd-b b { font-size: 16px; line-height: 1.35; }
.kd-b small { font-size: 13px; color: var(--muted); line-height: 1.4; }
.kd[aria-checked="true"] { box-shadow: inset 0 0 0 2px var(--ink); }
.kd[aria-checked="true"] .kd-r { box-shadow: inset 0 0 0 7px var(--ink); }

/* ---------- ผล: ประโยคใหญ่ ---------- */
.hero3 { margin: 6px 2px 0; animation: rise 0.5s cubic-bezier(.2, .8, .2, 1) both; }
.hero3 .h-k { min-height: 4px; }
.tag3 { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--ink-2); margin-bottom: 8px; }
.h-big { font-size: 26px; line-height: 1.35; margin: 4px 0 6px; letter-spacing: -0.01em; text-wrap: balance; }
.h-big .hb { font-family: var(--font-num); font-size: 46px; letter-spacing: -0.04em; line-height: 1.05; display: inline-block; }
.h-big .hb.up::before, .h-big .hb.down::before { font-size: 0.5em; vertical-align: 0.35em; margin-right: 2px; }
.h-big .hu { font-size: 18px; font-weight: 600; white-space: nowrap; }
.h-loss { margin: 0 0 6px; font-size: 15px; font-weight: 700; }
.h-loss b { font-family: var(--font-num); font-size: 17px; }
.h-sub { margin: 0; font-size: 15px; color: var(--ink-2); text-wrap: pretty; }
.h-risk { margin: 12px 0 0; padding: 12px 14px; border-radius: 14px; box-shadow: inset 0 0 0 1.5px var(--ink); display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.5; background: var(--card); }
.h-risk svg { width: 20px; height: 20px; flex: none; margin-top: 1px; }
.h-risk b { font-family: var(--font-num); font-size: 16px; }

/* ---------- สองเส้นทาง: ไม่ทำ | ทำ ---------- */
.lanes { margin-top: 16px; border-radius: 22px; overflow: hidden; background: var(--card); box-shadow: var(--shadow); }
.ln-head, .ln-row { display: grid; grid-template-columns: 1fr 1fr; }
.ln-head span { padding: 12px 14px 4px; font-size: 13px; font-weight: 700; }
.ln-head span:first-child { color: var(--muted); }
.ln-head span:last-child { background: var(--panel); color: var(--panel-ink); }
.ln-a, .ln-b { padding: 10px 14px; display: grid; gap: 2px; min-width: 0; }
.ln-a { border-top: 1px solid var(--line); }
.ln-b { background: var(--panel); color: var(--panel-ink); border-top: 1px solid var(--panel-line); animation: lane 0.5s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(120ms + var(--d, 0) * 70ms); }
.ln-row .ln-a small { font-size: 12px; color: var(--muted); line-height: 1.35; min-height: 1.35em; }
.ln-row .ln-b small { font-size: 12px; color: var(--panel-ink); font-weight: 700; line-height: 1.35; min-height: 1.35em; font-family: var(--font-num); }
.ln-a b, .ln-b b { font-family: var(--font-num); font-size: 19px; letter-spacing: -0.02em; line-height: 1.25; overflow-wrap: anywhere; }
.ln-b b small { font-family: var(--font-th); font-size: 12px; font-weight: 600; color: var(--panel-muted); }
.ln-row.big .ln-a b, .ln-row.big .ln-b b { font-size: 26px; }
.ln-row:last-child .ln-a, .ln-row:last-child .ln-b { padding-bottom: 14px; }

/* ---------- แถบลากหาจุดคุ้ม ---------- */
.piv { margin-top: 20px; background: var(--card); border-radius: 22px; padding: 18px 16px 16px; box-shadow: var(--shadow); }
.pv-q { margin: 0; font-size: 17px; line-height: 1.4; }
.pv-need { margin-top: 6px; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.pv-need span { font-size: 13px; font-weight: 700; color: var(--muted); }
.pv-need span.txt { font-size: 15px; color: var(--ink); }
.pv-need b { font-family: var(--font-num); font-size: 34px; letter-spacing: -0.03em; line-height: 1.1; }
.pv-need small { font-size: 14px; font-weight: 600; color: var(--ink-2); }
.pv-need.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: stretch; }
.pn { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 5px; align-content: start; padding: 10px 12px; border-radius: 14px; background: var(--surface); min-width: 0; }
.pv-need .pn { color: var(--ink); }
.pv-need .pn > span { flex-basis: 100%; font-size: 12.5px; line-height: 1.4; color: var(--muted); }
.pv-need .pn b { font-size: 30px; }
.pv-need .pn small { font-size: 13px; }
.pv-need .pn b.pn-x { font-family: var(--font-th); font-size: 20px; }
.pn.pay { box-shadow: inset 0 0 0 1.5px var(--ink); background: var(--card); }
.pv-track { position: relative; height: 70px; margin-top: 14px; }
.pv-zone { position: absolute; left: 14px; right: 14px; top: 26px; height: 14px; border-radius: 7px; overflow: hidden; display: flex; box-shadow: inset 0 0 0 1px var(--line-strong); }
.pv-zone .z1 { width: var(--n); flex: none; }
.pv-zone .z2 { flex: 1; }
.pv-zone .z3 { display: none; }
.pv-track.fwd3 .z2 { flex: none; width: calc(var(--p) - var(--n)); }
.pv-track.fwd3 .z3 { display: block; flex: 1; background: var(--ink); }
.pv-track.fwd .z1, .pv-track.fwd3 .z1, .pv-track.rev .z2, .pv-track.all-no .z1, .pv-track.all-no .z2 { background: var(--hatch); }
.pv-track.fwd .z2, .pv-track.rev .z1, .pv-track.all-ok .z1, .pv-track.all-ok .z2 { background: var(--ink); }
.pv-track.fwd3 .z2 { background: var(--ghost); }
.pv-mk { position: absolute; transform: translateX(-50%); pointer-events: none; }
.pv-mk.need { top: 14px; width: 3px; height: 38px; border-radius: 2px; background: var(--ink); box-shadow: 0 0 0 2px var(--card); }
.pv-mk.pay { top: 14px; width: 3px; height: 38px; border-radius: 2px; background: repeating-linear-gradient(180deg, var(--ink) 0 4px, transparent 4px 7px); box-shadow: 0 0 0 2px var(--card); }
/* ตัวเลขเหนือขีด: จุดคุ้มชิดซ้ายของขีด คืนทุนทันเป้าชิดขวา จึงไม่ทับกัน และยังเห็นเมื่อปุ่มลากทับขีด */
.pv-tk { position: absolute; top: -2px; font-family: var(--font-num); font-size: 11.5px; font-weight: 700; line-height: 14px; white-space: nowrap; color: var(--ink-2); pointer-events: none; }
.pv-tk.l { transform: translateX(calc(-100% - 5px)); }
.pv-tk.r { transform: translateX(5px); }
.pv-mk.have { top: 48px; width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 8px solid var(--ink); }
.pv-mk.have em { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); font-style: normal; font-size: 11px; font-weight: 700; white-space: nowrap; color: var(--ink-2); }
.pv-track input[type="range"] { position: absolute; left: 0; right: 0; top: 11px; width: 100%; height: 44px; margin: 0; background: transparent; }
.pv-track input[type="range"]::-webkit-slider-runnable-track { background: transparent; }
.pv-track input[type="range"]::-moz-range-track { background: transparent; }
.pv-scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); padding: 0 4px; margin-top: 2px; font-family: var(--font-num); }
.pv-leg { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); line-height: 1.4; }
.pv-leg span { display: inline-flex; align-items: center; gap: 6px; }
.pv-leg i { width: 16px; height: 10px; border-radius: 3px; flex: none; }
.pv-leg .lz1 { background: var(--hatch); box-shadow: inset 0 0 0 1px var(--line-strong); }
.pv-leg .lz2 { background: var(--ghost); }
.pv-leg .lz3 { background: var(--ink); }
.pv-read { margin-top: 12px; display: grid; gap: 6px; }
.pr-v { font-size: 15px; font-weight: 600; }
.pr-r { justify-self: start; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; padding: 6px 12px 6px 8px; border-radius: 999px; }
.pr-r svg { width: 18px; height: 18px; flex: none; }
.pr-r > span { line-height: 1.4; }
.pr-r.ok { background: var(--ink); color: var(--bg); }
.pr-r.ok .up, .pr-r.ok .down { color: var(--bg); }
.pr-r.no { box-shadow: inset 0 0 0 1.5px var(--ink); background-image: var(--hatch); }
.pv-chips { margin-top: 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.pv-chips .sc { min-height: 56px; border: 0; border-radius: 14px; background: var(--surface); padding: 6px 4px; display: grid; gap: 1px; align-content: center; justify-items: center; text-align: center; color: var(--ink); }
.pv-chips .sc span { font-size: 12px; font-weight: 600; color: var(--ink-2); line-height: 1.3; }
.pv-chips .sc b { font-family: var(--font-num); font-size: 14px; }
.pv-chips .sc[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.pv-chips .sc[aria-pressed="true"] span, .pv-chips .sc[aria-pressed="true"] b, .pv-chips .sc[aria-pressed="true"] .up, .pv-chips .sc[aria-pressed="true"] .down { color: var(--bg); }

/* ---------- สิ่งที่ต้องเป็นจริง ---------- */
.sec3 { font-size: 20px; margin: 28px 2px 12px; line-height: 1.3; }
.cklist { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.ck { width: 100%; text-align: left; border: 0; background: var(--card); border-radius: 16px; padding: 14px 14px 14px 12px; box-shadow: var(--shadow);
  display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: start; color: var(--ink); }
.ck-i { width: 30px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; animation: pop 0.45s cubic-bezier(.2, .8, .2, 1) both; animation-delay: 0.25s; }
.ck-i svg { width: 18px; height: 18px; }
.ck.ok .ck-i { background: var(--ink); color: var(--bg); }
.ck.short .ck-i { box-shadow: inset 0 0 0 2px var(--ink); background-image: var(--hatch); }
.ck.info .ck-i { background: var(--surface-2); }
.ck-b { display: grid; gap: 3px; min-width: 0; }
.ck-t { font-size: 15px; font-weight: 600; line-height: 1.45; }
.ck-t b { font-family: var(--font-num); font-size: 17px; white-space: nowrap; }
.ck-txt { display: block; font-size: 16px; font-weight: 700; margin-top: 2px; }
.ck-b small { font-size: 13px; color: var(--muted); line-height: 1.45; }
.ck-b small.ck-h { color: var(--ink-2); }
.ck .go { align-self: center; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; }
.ck .go svg { width: 16px; height: 16px; }
.warns { margin-top: 16px; display: grid; gap: 8px; }
.warns p { margin: 0; background: var(--card); border-radius: var(--r-sm); padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.5; box-shadow: inset 0 0 0 1px var(--line-strong); }
.warns svg { width: 20px; height: 20px; margin-top: 1px; flex: none; }

/* ---------- ดูละเอียด (แท็บ) ---------- */
.tabs3 { display: flex; width: 100%; }
.tabs3 button { flex: 1; padding: 0 8px; font-size: 14px; line-height: 1.3; }
.tabs3 button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.det3 .card.cashp, .det3 .card.wf { margin-top: 10px; }

/* ---------- ขั้นต่อไป ---------- */
.next3 { margin-top: 28px; background: var(--card); border-radius: 22px; padding: 16px; box-shadow: inset 0 0 0 2px var(--ink); display: grid; gap: 12px; }
.next3 .nx-h { margin: 0; font-size: 20px; line-height: 1.3; }
.next3 .nx-lead { margin: 0; font-size: 14px; color: var(--ink-2); line-height: 1.55; }
.next3 .tools { margin: 0; }
.other3 { margin-top: 12px; }
.end3 { margin-top: 16px; display: grid; gap: 10px; }

/* ---------- ปุ่มค้างด้านล่างของหน้าผล ---------- */
.rfoot .btn { font-size: 16px; padding: 0 16px; }
.rfoot .btn.fb-edit { flex: 0 0 auto; }
.plan3 { margin-top: 12px; width: 100%; min-height: 64px; border: 1.5px dashed var(--line-strong); border-radius: 18px; background: transparent; padding: 12px 12px 12px 16px; display: flex; align-items: center; gap: 10px; text-align: left; color: var(--ink); }
.plan3 .p3-l { flex: 1; min-width: 0; display: grid; gap: 2px; }
.plan3 .p3-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.plan3 .p3-h b { font-size: 16px; }
.plan3 .p3-tag { font-size: 12px; font-weight: 700; padding: 1px 9px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--ink-2); }
.plan3 .p3-p { font-size: 13px; color: var(--muted); line-height: 1.5; }
.plan3 > svg { width: 20px; height: 20px; color: var(--muted); }

/* ---------- เงินในมือ 12 เดือน ---------- */
.card.cashp, .card.wf { margin-top: 16px; }
.c-h { font-size: 17px; margin: 0 0 4px; line-height: 1.35; }
.chart .line.base3 { stroke: var(--muted); stroke-width: 2; stroke-dasharray: 5 4; fill: none; }
.chart .mk { font-size: 11px; font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: var(--card); stroke-width: 4px; stroke-linejoin: round; }
.chart .endlab { paint-order: stroke; stroke: var(--card); stroke-width: 4px; stroke-linejoin: round; }
.chart .payl { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 2 3; }
.legend i.g { background: repeating-linear-gradient(90deg, var(--muted) 0 5px, transparent 5px 9px); }
.legend i.pf { width: 2px; height: 12px; background: var(--ink); }

/* ---------- กำไรเปลี่ยนเพราะอะไร (น้ำตก) ---------- */
.wf-r { padding: 8px 0; border-top: 1px solid var(--line); }
.wf .lead + .wf-r { border-top: 0; }
.wf-t { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 14px; }
.wf-t span { color: var(--ink-2); line-height: 1.4; }
.wf-t b { font-family: var(--font-num); font-size: 16px; white-space: nowrap; }
.wf-r.start .wf-t b, .wf-r.end .wf-t b { font-size: 18px; }
.wf-r.end .wf-t span { color: var(--ink); font-weight: 700; }
.wf-track { position: relative; height: 12px; margin-top: 6px; border-radius: 3px; background: var(--surface); }
.wf-track i { position: absolute; top: 0; bottom: 0; border-radius: 3px; animation: grow 0.6s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(0.2s + var(--d, 0) * 90ms); }
.wf-track i.pos { background: var(--ink); transform-origin: left; }
.wf-track i.neg { background-image: var(--hatch); box-shadow: inset 0 0 0 1.5px var(--ink); transform-origin: right; }
.wf-r.start .wf-track i { background: var(--ghost); box-shadow: none; }
.wf-zero { position: absolute; top: -3px; bottom: -3px; width: 1.5px; background: var(--ink-2); }

/* ---------- หน้าปรับตัวเลข: สองเส้นทางแบบย่อ ---------- */
.lab3 { display: grid; gap: 6px; }
.lab3 .dstrip { margin-top: 0; }
.lab3 .dstrip > div { min-height: 0; }
.l3s { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.l3s > div { background: var(--card); border-radius: 12px; padding: 7px 10px; display: grid; box-shadow: inset 0 0 0 1px var(--line); min-width: 0; }
.l3s small { font-size: 11.5px; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.l3s b { font-family: var(--font-num); font-size: 16px; line-height: 1.3; overflow-wrap: anywhere; }
.l3s b small { font-family: var(--font-th); font-size: 11px; color: var(--ink-2); white-space: normal; }
.lab-note { margin: -6px 2px 0; font-size: 13px; color: var(--muted); }
.banner.lab-bn { margin-top: 14px; margin-bottom: 0; }
.lr-val input { min-height: 44px; min-width: 44px; }
.fine { display: flex; align-items: center; flex-wrap: wrap; column-gap: 2px; }
.fine .lnk { font-size: 13px; min-height: 44px; padding: 0 6px; }

/* ---------- เช็กความพร้อม: คำถาม + รายการทุกข้อ ---------- */
.ak-h { margin-top: 30px; font-size: 15px; color: var(--muted); }
.ak-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ak { width: 100%; min-height: 52px; border: 0; border-radius: 14px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); padding: 8px 12px 8px 10px;
  display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; text-align: left; color: var(--ink); }
.ak-i { width: 28px; height: 28px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-family: var(--font-num); font-size: 12px; font-weight: 700; }
.ak-i svg { width: 16px; height: 16px; }
.ak-t { font-size: 14px; font-weight: 600; line-height: 1.4; min-width: 0; }
.ak-a { font-size: 12px; color: var(--muted); font-weight: 600; text-align: right; }
.ak.todo { color: var(--muted); }
.ak.todo .ak-i { box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.ak.now { box-shadow: inset 0 0 0 2px var(--ink); }
.ak.now .ak-i { background: var(--ink); color: var(--bg); }

function num(v) {
  if (v === null || v === undefined || v === '') return null;
  var n = typeof v === 'number' ? v : parseFloat(String(v).replace(/[,\s]/g, ''));

/* ตัวเลขที่ขยับ 10% แล้วกำไรเปลี่ยนมากที่สุด (ใช้ค่าจาก v4 เมื่อเป็นธุรกิจขายเป็นหน่วย) */

function priceVerb(m) { return { subscription: 'ค่าสมาชิกเป็น', project: 'ราคาต่องานเป็น', rental: 'ราคาเป็น', commission: 'ค่าคอมเป็น' }[m] || 'ราคาขายเป็น'; }

/* ---------- เรื่องที่ตัวเลขบอก ----------
   เกณฑ์ใช้ตัวเลขของร้านเอง ไม่เทียบร้านอื่น · เกณฑ์ที่ PL2 มีอยู่แล้วใช้ตัวเดียวกัน (ฉากแย่ −20% · ใช้กำลัง > 90% · ลูกค้า 1 คนกำไร < ค่าหา) */
var LV_ORDER = { high: 0, mid: 1, watch: 2, note: 3 };
function detect(S, inp, m) {
  var F = [];
  if (!S.ok) return F;
  var u = U(inp, m);
  var P = S.profit;

  /* เงินสดจะติดลบ */
  if (S.hasCash && S.lowest !== null && S.lowest < 0) {
    var short = -S.lowest;
    var timing = P >= 0;
    F.push({ id: 'cashout', lv: 'high', urgent: true,
      title: timing ? 'มีกำไร แต่เงินจะขาดมือ' : 'เงินสดจะหมด',
      money: short, unit: 'once', moneyText: fmtN(short) + ' บาท', moneyCap: 'เงินที่จะขาดในเดือน ' + monthLabel(S.lowestT, true) + ' (ช่วงที่เงินในมือต่ำที่สุด)',
      ev: [timing ? 'ทั้งปีร้านยังมีกำไร แต่เงินเข้าช้ากว่าเงินออก เงินในมือจะเริ่มติดลบเดือน ' + monthLabel(S.firstNegT, true)
                  : 'เงินที่มีตอนนี้ ' + fmtN(S.cashStart) + ' บาท จะหมดราวเดือน ' + monthLabel(S.firstNegT, true) + ' ถ้าตัวเลขยังเป็นแบบนี้'],
      q: P < 0 ? QSETS.gap[m].slice(0, 2).concat(QSETS.cash.all) : QSETS.cash.all, lever: 'cash' });
  }

  /* ขาดทุน */
  if (P < 0) {
    var neg = S.be && S.be.impossible;
    var ev = [];
    if (neg) ev.push('ราคาที่ได้ต่อ' + u + ' ยังไม่พอจ่ายต้นทุนที่เพิ่มตามยอดขาย ยิ่งขายมากยิ่งขาดทุนมาก');
    else if (S.be) ev.push('ต้อง' + volVerb(m) + 'อย่างน้อย ' + fmtN(S.be.vol, 1) + ' ' + volUnitText(inp, m) + ' ตอนนี้ ' + fmtN(S.vol) + ' ' + volUnitText(inp, m));
    if (S.owner > 0 && P + S.owner > 0) ev.push('ถ้าไม่นับเงินเดือนคุณ ร้านยังเหลือเงินเดือนละ ' + fmtN(P + S.owner) + ' บาท แปลว่าร้านจ่ายเงินเดือนคุณได้ ' + fmtN(P + S.owner) + ' จาก ' + fmtN(S.owner) + ' บาท');
    F.push({ id: 'loss', lv: 'high', title: neg ? 'ยิ่งขายมาก ยิ่งขาดทุน' : 'ร้านขาดทุนทุกเดือน',
      money: -P, unit: 'month', moneyText: fmtN(-P) + ' บาท/เดือน', moneyCap: 'ถ้าถึงจุดคุ้มทุน กำไรจะเพิ่มเท่านี้ (' + fmtN(-P * 12) + ' บาท/ปี)',
      ev: ev, ways: neg ? waysNeg(S, inp, m) : waysTo(-P, S, inp, m),
      waysTitle: neg ? 'ตัวเลขที่ทำให้ขายแล้วเริ่มมีเงินเหลือ (ขยับอย่างใดอย่างหนึ่ง)' : 'ตัวเลขที่ทำให้ไม่ขาดทุน (ขยับอย่างใดอย่างหนึ่ง)',
      q: neg ? QSETS.neg[m] : QSETS.gap[m] });
  }

  /* ยอดตก 20% ก็ขาดทุน (ฉาก "แย่" ของ PL2) */
  if (P >= 0 && S.be && !S.be.impossible) {
    var S20 = compute(scaleVol(inp, m, 0.8), m);
    if (S20.ok && S20.profit < 0) {
      F.push({ id: 'fragile', lv: 'mid', title: 'ยอดตกนิดเดียวก็ขาดทุน',
        money: -S20.profit, unit: 'month', moneyText: fmtN(-S20.profit) + ' บาท/เดือน',
        moneyCap: 'ขาดทุนต่อเดือน ถ้า' + (m === 'rental' ? 'คนเช่า' : 'ยอดขาย') + 'ลดลง 20% (เช่น เดือนที่ขายไม่ดี)',
        ev: ['ตอนนี้กำไรเดือนละ ' + fmtN(P) + ' บาท ' + (S.be.safety !== null ? ({ rental: 'คนเช่า', subscription: 'สมาชิก' }[m] || 'ยอดขาย') + 'ลดได้อีกแค่ ' + fmtPct(S.be.safety * 100) + ' ก่อนเริ่มขาดทุน' : '')],
        ways: waysTo(-S20.profit, S20, scaleVol(inp, m, 0.8), m, 0.8), waysTitle: 'ตัวเลขที่ทำให้ยอดตก 20% แล้วยังไม่ขาดทุน',
        q: QSETS.gap[m] });
    }
  }

  /* ยอดลดลงเรื่อยๆ / สมาชิกลดลง */
  if (S.cash.length === 12) {
    var rev1 = S.revenue, rev12 = S.cash[11].rev;
    var drop = S.profit - S.profit12;
    var declining = rev12 < rev1 * 0.95 && drop > 0 && !(hasSeason(inp) && n0(inp.growth) >= 0 && m !== 'subscription');
    if (m === 'subscription') declining = n0(inp.leaving) > n0(inp.newMembers) && drop > 0;
    if (declining) {
      var ev2 = m === 'subscription'
        ? ['สมาชิกเลิกเดือนละ ' + fmtN(n0(inp.leaving)) + ' คน แต่สมัครใหม่ ' + fmtN(n0(inp.newMembers)) + ' คน อีก 12 เดือนกำไรจะเหลือเดือนละ ' + fmtN(S.profit12) + ' บาท']
        : ['ยอดขายลดลงเดือนละ ' + fmtPct(-n0(inp.growth)) + ' อีก 12 เดือนกำไรจะเหลือเดือนละ ' + fmtN(S.profit12) + ' บาท'];
      if (m === 'subscription' && n0(inp.leaving) > 0) {
        var churn = n0(inp.leaving) / Math.max(1, n0(inp.members));
        ev2.push('ถ้าตัวเลขยังเป็นแบบนี้ สมาชิกจะลดลงไปนิ่งที่ราว ' + fmtN(n0(inp.newMembers) / churn) + ' คน');
      }
      F.push({ id: 'decline', lv: S.profit12 < 0 ? 'high' : 'mid', title: m === 'subscription' ? 'สมาชิกลดลงทุกเดือน' : 'ยอดขายลดลงเรื่อยๆ',
        money: drop, unit: 'month', moneyText: fmtN(drop) + ' บาท/เดือน', moneyCap: 'กำไรต่อเดือนที่จะหายไปภายใน 12 เดือน',
        ev: ev2, q: QSETS.decline[m] });
    }
  }

  /* ใกล้เต็มกำลัง */
  if (S.util && S.util.pct >= 90) {
    /* ปริมาณตอนนี้ในหน่วยเดียวกับเพดาน → กำไรที่ยังเพิ่มได้ = ที่ว่างที่เหลือ × กำไรต่อหน่วยของเพดาน */
    var curU = S.util.rental ? n0(inp.occupancy) : (S.util.conc || S.vol);
    var room = Math.max(0, S.util.max - curU);
    var headroom = curU > 0 && S.contribution > 0 ? room * S.contribution / curU : 0;
    var roomUnit = m === 'project' ? 'งานพร้อมกัน' : volUnitText(inp, m);
    F.push({ id: 'capacity', lv: 'watch', title: S.util.rental ? 'เกือบเต็มทุก' + periodWord(inp) + 'แล้ว' : 'ร้านใกล้เต็มกำลังรองรับแล้ว',
      money: headroom, unit: 'month', moneyText: fmtN(headroom) + ' บาท/เดือน', moneyCap: 'กำไรที่เพิ่มได้อีกไม่เกินนี้ ถ้ายังรับได้เท่าเดิม',
      ev: [S.util.rental ? 'มีคนเช่า ' + fmtPct(S.util.pct) + ' เหลือที่ว่างอีก ' + fmtPct(100 - S.util.pct)
        : 'ใช้กำลังไปแล้ว ' + fmtPct(S.util.pct) + ' รับเพิ่มได้อีก ' + fmtN(room, 1) + ' ' + roomUnit],
      q: QSETS.capacity.all });
  } else if (S.util && S.util.reachT) {
    var lost = 0;
    if (isVolModel(m) && S.r.projectionIfCapacityUnchanged) {
      S.r.projection.forEach(function (p, i) { lost += p.netCashFlow - S.r.projectionIfCapacityUnchanged[i].netCashFlow; });
    } else if (m === 'subscription') {
      var S4 = compute(withK(inp, 'maxMembers', null), m);
      if (S4.ok) S4.cash.forEach(function (c, i) { lost += c.net - S.cash[i].net; });
    }
    if (lost > 0) F.push({ id: 'capacity', lv: 'mid', title: 'ร้านจะเต็มกำลังรองรับภายใน 12 เดือน',
      money: lost / 12, unit: 'year', moneyText: fmtN(lost) + ' บาท', moneyCap: 'กำไรที่อาจพลาดไปใน 12 เดือน',
      ev: ['ถ้ายอดโตตามตัวเลขนี้ จะเต็มกำลังในเดือน ' + monthLabel(S.util.reachT, true)], q: QSETS.capacity.all });
  }

  /* ค่าหาลูกค้าใหม่แพงกว่ากำไรจากลูกค้าคนนั้น */
  if (S.cust && S.cust.ratio !== null && S.cust.ratio < 1 && S.cust.cac > 0 && S.cust.newPerMonth > 0) {
    var lossPer = S.cust.cac - S.cust.ltvProfit;
    F.push({ id: 'cac', lv: 'mid', title: 'ค่าหาลูกค้าใหม่แพงกว่ากำไรที่ได้จากลูกค้าคนนั้น',
      money: lossPer * S.cust.newPerMonth, unit: 'month', moneyText: fmtN(lossPer * S.cust.newPerMonth) + ' บาท/เดือน',
      moneyCap: 'เงินที่จ่ายเกินกำไรที่ลูกค้าใหม่สร้างให้ ทุกเดือน',
      ev: ['ได้ลูกค้าใหม่ 1 คน ใช้เงินการตลาด ' + fmtN(S.cust.cac) + ' บาท แต่ลูกค้าคนนั้นสร้างกำไรให้ ' + fmtN(S.cust.ltvProfit) + ' บาท ตลอดที่ซื้อกับคุณ'],
      q: QSETS.cac.all });
  }

  /* เงินสำรองบาง: เงินในมือช่วงต่ำสุด < ค่าใช้จ่ายคงที่ 1 เดือน */
  if (S.hasCash && S.lowest !== null && S.lowest >= 0 && S.lowest < S.fixed) {
    F.push({ id: 'thincash', lv: 'watch', title: 'เงินสำรองไม่พอจ่าย 1 เดือน',
      money: S.fixed - S.lowest, unit: 'once', moneyText: fmtN(S.fixed - S.lowest) + ' บาท',
      moneyCap: 'เงินที่ยังขาด ถึงจะมีเงินสำรองเท่าค่าใช้จ่ายคงที่ 1 เดือน (' + fmtN(S.fixed) + ' บาท)',
      ev: ['เงินในมือช่วงต่ำสุดเหลือ ' + fmtN(S.lowest) + ' บาท (' + monthLabel(S.lowestT, true) + ') ถ้าเดือนไหนขายไม่ได้ จะไม่พอจ่ายค่าใช้จ่ายคงที่'],
      q: QSETS.cash.all });
  }

  /* ยังไม่ได้ใส่เงินสด ทั้งที่เงินไหลออก */
  if (!S.hasCash && S.cash.some(function (c) { return c.net < 0; })) {
    F.push({ id: 'nocash', lv: 'note', title: 'ยังไม่รู้ว่าเงินพอใช้ถึงเดือนไหน', money: 0, unit: 'none',
      ev: ['มีเดือนที่เงินออกมากกว่าเงินเข้า ใส่เงินสดที่มีตอนนี้ เพื่อดูว่าเงินพอใช้ถึงเดือนไหน'], q: [] , editField: 'cash' });
  }

  /* ยังไม่นับเงินเดือนตัวเอง */
  if (S.owner === 0) {
    F.push({ id: 'nosalary', lv: 'note', title: 'กำไรนี้ยังไม่ได้หักเงินเดือนคุณ', money: 0, unit: 'none',
      ev: ['กำไร ' + fmtN(P) + ' บาทที่เห็น รวมค่าแรงของคุณไว้ด้วย ลองใส่เงินเดือนที่คุณควรได้ในส่วนทดลอง เพื่อดูกำไรจริงของร้าน'],
      q: [], tryLever: 'ownerSalary' });
  }

  F.forEach(function (f) {
    f.qs = (f.q || []).filter(function (id) { var b = QBANK[id]; return b && (!b.when || b.when(inp, m)); })
      .filter(function (id, i, a) { return a.indexOf(id) === i; }).slice(0, 5);
  });
  /* เรียง: เงินจะหมดก่อน → ระดับ → เงินต่อเดือน (เงินก้อนเดียวเทียบเป็นต่อเดือนไม่ได้ จึงเรียงตามระดับก่อน) */
  F.sort(function (a, b) {
    if (!!b.urgent !== !!a.urgent) return a.urgent ? -1 : 1;
    if (LV_ORDER[a.lv] !== LV_ORDER[b.lv]) return LV_ORDER[a.lv] - LV_ORDER[b.lv];
    return (b.unit === 'none' ? 0 : b.money) - (a.unit === 'none' ? 0 : a.money);
  });
  return F;
}

function waysNeg(S, inp, m) {
  var R = ROLE[m];
  var ways = [];
  /* หาค่าที่ทำให้เงินที่เหลือหลังต้นทุนผันแปรเริ่มเป็นบวก (เป็นเส้นตรง จึงใช้ 2 จุด) แล้วยืนยันด้วยการคำนวณจริง */
  function solve(k, dir) {
    var st = leverStep(k, inp, m), cur = n0(inp[k]);
    var S1 = compute(withK(inp, k, cur + st), m);
    if (!S1.ok) return null;
    var slope = (S1.contribution - S.contribution) / st;
    if ((dir > 0 && slope <= 0) || (dir < 0 && slope >= 0)) return null;
    var x = Math.round((cur - S.contribution / slope) * 1e6) / 1e6;
    x = dir > 0 ? Math.floor(x / st + 1) * st : Math.ceil(x / st - 1) * st;
    if (x < 0) return null;
    var S2 = compute(withK(inp, k, x), m);
    return S2.ok && S2.contribution > 0 ? x : null;
  }
  if (R.price) {
    var p = solve(R.price, 1);
    if (p !== null) ways.push({ text: priceVerb(m).replace('เป็น', '') + 'ต้องไม่ต่ำกว่า <b>' + fmtN(p) + '</b>' + (leverUnit(R.price, inp, m) === '%' ? '%' : ' บาท') + ' (ตอนนี้ ' + fmtN(n0(inp[R.price])) + ')', lever: R.price, value: p,
      label: priceVerb(m).replace('เป็น', '') + 'ต้องไม่ต่ำกว่า', big: fmtN(p) + (leverUnit(R.price, inp, m) === '%' ? '%' : ' บาท'), note: 'ตอนนี้ ' + fmtN(n0(inp[R.price])) });
  }
  if (R.cost) {
    var c = solve(R.cost, -1);
    var cname = { unit: 'ต้นทุนต่อ' + U(inp, m), service: 'ต้นทุนต่อ' + U(inp, m), resell: 'ราคาที่ซื้อมาต่อ' + U(inp, m), subscription: 'ต้นทุนต่อสมาชิก',
      project: 'ต้นทุนของแต่ละงาน', rental: 'ค่าใช้จ่ายต่อ' + periodWord(inp), commission: 'ส่วนแบ่งให้ทีม', other: 'ต้นทุน' }[m];
    var cunit = { project: '% ของมูลค่างาน', commission: '% ของค่าคอม', other: '% ของรายได้' }[m] || 'บาท';
    if (c !== null) ways.push({ text: cname + 'ต้องไม่เกิน <b>' + fmtN(c) + '</b>' + (cunit === 'บาท' ? ' บาท' : cunit) + ' (ตอนนี้ ' + fmtN(n0(inp[R.cost])) + ')', lever: R.cost, value: c,
      label: cname + 'ต้องไม่เกิน', big: fmtN(c) + (cunit === 'บาท' ? ' บาท' : cunit), note: 'ตอนนี้ ' + fmtN(n0(inp[R.cost])) });
  }
  if (n0(inp.feePct) > 0) {
    var f = solve('feePct', -1);
    if (f !== null) ways.push({ text: 'ค่าธรรมเนียมไม่เกิน <b>' + fmtN(f) + '%</b> ของยอดขาย (ตอนนี้ ' + fmtN(n0(inp.feePct)) + '%)', lever: 'feePct', value: f,
      label: 'ค่าธรรมเนียมต้องไม่เกิน', big: fmtN(f) + '% ของยอดขาย', note: 'ตอนนี้ ' + fmtN(n0(inp.feePct)) + '%' });
  }
  return ways;
}

/* ---------- ป้ายราคาของจุดที่ควรตรวจสอบ ---------- */
function pointTag(bankLever, S, inp, m) {
  if (!bankLever || !S.ok) return '';
  var k = roleKey(m, bankLever);
  if (!k) return '';
  var u = U(inp, m);
  var d, st;
  if (k === 'creditDays' || k === 'stockDays') {
    var cur = n0(inp[k]);
    if (cur <= 0) return '';
    var alt = withK(inp, k, Math.max(0, cur - 15));
    var S2 = compute(alt, m);
    if (!S2.ok) return '';
    d = S2.lowest - S.lowest;
    if (d < 1) return '';
    return (k === 'creditDays' ? 'ลูกค้าจ่ายเร็วขึ้น 15 วัน' : 'ของค้างสต็อกสั้นลง 15 วัน') + ' = เงินในมือช่วงต่ำสุดเพิ่มขึ้น <b>' + fmtN(d) + '</b> บาท';
  }
  if (k === 'rent' || k === 'otherFixed') {
    var v = n0(inp[k]);
    if (v <= 0 || S.revenue <= 0) return '';
    return (k === 'rent' ? 'ค่าเช่า' : 'ค่าใช้จ่ายอื่น') + ' ' + fmtN(v) + ' บาท/เดือน = <b>' + fmtN(v / S.revenue * 100, 1) + '</b> บาทจากทุก 100 บาทที่ลูกค้าจ่าย';
  }
  if (k === 'marketing') {
    var mk = n0(inp.marketing);
    if (mk <= 0 || S.contribution <= 0 || !S.vol) return '';
    var perVol = S.contribution / S.vol;
    return 'งบการตลาด ' + fmtN(mk) + ' บาท/เดือน ต้องพา' + volVerb(m).replace('ให้ได้', '') + 'เพิ่มอย่างน้อย <b>' + fmtN(mk / perVol, 1) + '</b> ' + volUnitText(inp, m) + ' ถึงจะคุ้มเงินที่จ่าย';
  }
  if (k === 'staffCount') {
    var sal = n0(inp.staffSalary);
    if (sal <= 0 || S.contribution <= 0 || !S.vol) return '';
    return 'พนักงาน 1 คน = ค่าใช้จ่าย ' + fmtN(sal) + ' บาท/เดือน = ต้อง' + volVerb(m) + 'เพิ่ม <b>' + fmtN(sal / (S.contribution / S.vol), 1) + '</b> ' + volUnitText(inp, m) + ' ถึงจะคุ้มค่าจ้าง';
  }
  if (k === 'leaving' || k === 'newMembers') {
    var S5 = compute(withK(inp, k, Math.max(0, n0(inp[k]) + (k === 'leaving' ? -1 : 1))), m);
    if (!S5.ok) return '';
    d = S5.profit12 - S.profit12;
    return (k === 'leaving' ? 'คนเลิกน้อยลงเดือนละ 1 คน' : 'สมาชิกใหม่เพิ่มเดือนละ 1 คน') + ' = อีก 12 เดือน กำไรเพิ่มเดือนละ <b>' + fmtN(d) + '</b> บาท';
  }
  var dir = (k === ROLE[m].cost || k === 'feePct') ? -1 : 1;
  st = leverStep(k, inp, m);
  if (k === 'occupancy') st = 5;
  if (dir < 0 && n0(inp[k]) < st) return '';
  d = leverEffect(k, inp, m, dir * st);
  if (d === null || Math.abs(d) < 0.5) return '';
  var stepTxt;
  var pctUnit = leverUnit(k, inp, m) === '%';

  else if (k === ROLE[m].price) stepTxt = 'ขึ้นราคาอีก ' + fmtN(st) + (pctUnit ? '%' : ' บาท') + ' โดยลูกค้าเท่าเดิม';
  else if (k === ROLE[m].cost) stepTxt = 'ต้นทุนลดลง ' + fmtN(st) + (pctUnit ? '%' : ' บาทต่อ' + u);
  else if (k === 'feePct') stepTxt = 'ค่าธรรมเนียมลดลง 1% ของยอดขาย';

  return stepTxt + ' = กำไรเพิ่ม <b>' + fmtN(d) + '</b> บาท/เดือน';
}

/* ---------- คำอธิบายใต้ตัวเลขที่กำลังปรับ (เครื่องคิดเลขเล็กอยู่ตรงนี้) ---------- */
function leverInsight(k, base, trialInp, m, Sb, St) {
  if (!Sb.ok || !St.ok) return '';
  var u = U(base, m);
  var R = ROLE[m];
  var bv = n0(base[k]), tv = n0(trialInp[k]);
  if (k === R.price && R.price) {
    var F = St.fixed + St.dep;
    if (tv !== bv && St.contribution > 0) {
      var need = (Sb.profit + F) / St.contribution; /* ตัวคูณปริมาณที่ทำให้กำไรเท่าเดิม */
      var pct = (need - 1) * 100;
      var who = m === 'rental' ? 'คนเช่า' : m === 'subscription' ? 'สมาชิก' : 'ลูกค้า';
      if (tv > bv) {
        if (pct <= -100) return 'ขึ้นราคาเป็น ' + fmtN(tv) + ' แล้ว ' + who + 'หายไปเกือบหมดกำไรก็ยังเท่าเดิม';
        return 'ขึ้นราคาเป็น ' + fmtN(tv) + ' (' + fmtSignedPct((tv / bv - 1) * 100) + ') ' + who + 'ลดลงได้ถึง <b>' + fmtPct(-pct) + '</b> กำไรยังเท่าเดิม';
      }
      return 'ลดราคาเป็น ' + fmtN(tv) + ' (' + fmtSignedPct((tv / bv - 1) * 100) + ') ต้องขายเพิ่ม <b>' + fmtPct(pct) + '</b> ถึงจะได้กำไรเท่าเดิม';
    }
    if (tv < bv && St.contribution <= 0) return 'ราคานี้ขายเท่าไหร่ก็ขาดทุน เพราะต่ำกว่าต้นทุนที่เพิ่มตามยอดขาย';
    var e = leverEffect(k, trialInp, m, leverStep(k, base, m));
    return e !== null ? 'ขึ้นราคาทีละ ' + fmtN(leverStep(k, base, m)) + (R.price === 'commissionPct' ? '%' : ' บาท') + ' โดย' + (m === 'rental' ? 'คนเช่า' : 'ลูกค้า') + 'เท่าเดิม = กำไรเพิ่ม <b>' + fmtN(e) + '</b> บาท/เดือน' : '';
  }
  if (k === 'marketing') {
    var perVol = St.contribution > 0 && St.vol ? St.contribution / St.vol : null;
    if (!perVol) return '';
    if (tv !== bv) {
      var dv = (tv - bv) / perVol;
      if (tv > bv) return 'เพิ่มงบ ' + fmtN(tv - bv) + ' บาท ต้องพา' + (m === 'service' ? 'ลูกค้า' : 'ยอดขาย') + 'เพิ่มอย่างน้อย <b>' + fmtN(dv, 1) + '</b> ' + volUnitText(base, m) + ' ถึงจะคุ้ม';
      return 'ลดงบ ' + fmtN(bv - tv) + ' บาท ถ้ายอดหายไปไม่เกิน <b>' + fmtN(-dv, 1) + '</b> ' + volUnitText(base, m) + ' ยังได้กำไรมากกว่าเดิม';
    }
    return tv > 0 ? 'งบ ' + fmtN(tv) + ' บาท ต้องพายอดขายได้อย่างน้อย <b>' + fmtN(tv / perVol, 1) + '</b> ' + volUnitText(base, m) + ' ถึงจะคุ้มเงินที่จ่าย' : '';
  }
  if (k === 'ownerSalary') {
    return 'ถ้าไม่นับเงินเดือนคุณ ร้านเหลือเงินเดือนละ <b>' + fmtN(St.profit + n0(trialInp.ownerSalary)) + '</b> บาท';
  }
  if (k === 'staffCount' || k === 'staffSalary') {
    var sal = n0(trialInp.staffSalary);
    if (sal > 0 && St.contribution > 0 && St.vol) return 'พนักงาน 1 คน ต้อง' + volVerb(m) + 'เพิ่ม <b>' + fmtN(sal / (St.contribution / St.vol), 1) + '</b> ' + volUnitText(base, m) + ' ถึงจะคุ้มค่าจ้าง';
    return '';
  }
  if (k === 'rent' || k === 'otherFixed') {
    return St.revenue > 0 ? (k === 'rent' ? 'ค่าเช่า' : 'ค่าใช้จ่ายนี้') + ' = <b>' + fmtN(tv / St.revenue * 100, 1) + '</b> บาทจากทุก 100 บาทที่ลูกค้าจ่าย' : '';
  }
  if (k === 'leaving' || k === 'newMembers') {
    var churn = n0(trialInp.leaving) / Math.max(1, n0(trialInp.members));
    if (churn > 0) return 'ถ้าตัวเลขเป็นแบบนี้ สมาชิกจะไปนิ่งที่ราว <b>' + fmtN(n0(trialInp.newMembers) / churn) + '</b> คน (ตอนนี้ ' + fmtN(n0(trialInp.members)) + ')';
    return 'ไม่มีคนเลิก สมาชิกจะเพิ่มขึ้นเดือนละ ' + fmtN(n0(trialInp.newMembers)) + ' คน';
  }
  var st = leverStep(k, base, m);
  var dir = (k === R.cost || k === 'feePct') ? -1 : 1;
  if (k === 'volume' || k === R.vol) {
    var e2 = leverEffect(k, trialInp, m, st);
    var txt = e2 !== null ? volVerb(m).replace('ให้ได้', '') + 'เพิ่ม ' + fmtN(st) + ' ' + volUnitText(base, m) + ' = กำไรเพิ่ม <b>' + fmtN(e2) + '</b> บาท/เดือน' : '';
    if (St.util && St.util.max && !St.util.rental && k === 'volume') txt += ' · ทำได้สูงสุด ' + fmtN(St.util.max) + ' ' + volUnitText(base, m);
    return txt;
  }
  if (dir < 0 && tv < st) return '';
  var e3 = leverEffect(k, trialInp, m, dir * st);
  if (e3 === null) return '';
  return (dir < 0 ? 'ลดลง ' : 'เพิ่มขึ้น ') + fmtN(st) + ' ' + leverUnit(k, base, m) + ' = กำไรเปลี่ยน <b>' + fmtSigned(e3) + '</b> บาท/เดือน';
}

/* ---------- format ---------- */
function fmtN(n, dec) {
  if (n === null || n === undefined || !isFinite(n)) return '–';
  var a = Math.abs(n);
  var d = dec === undefined ? (a < 10 && Math.round(a) !== a ? 1 : 0) : (Math.round(a) === a ? 0 : dec);
  var s = a.toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: d });
  return (n < 0 && s !== '0' ? '−' : '') + s;
}
function fmtSigned(n) { return (n > 0.5 ? '+' : '') + fmtN(n); }
function fmtPct(p) { return fmtN(p, Math.abs(p) < 10 ? 1 : 0) + '%'; }
function fmtSignedPct(p) { return (p > 0 ? '+' : '') + fmtPct(p); }
function compactTH(n) {
  var a = Math.abs(n), s = n < 0 ? '−' : '';
  function t(x) { return (Math.round(x * 10) / 10).toLocaleString('th-TH'); }
  if (a >= 1e6) return s + t(a / 1e6) + ' ล้าน';
  if (a >= 1e5) return s + t(a / 1e5) + ' แสน';
  if (a >= 1e4) return s + t(a / 1e4) + ' หมื่น';
  if (a >= 1e3) return s + t(a / 1e3) + ' พัน';
  return s + Math.round(a).toLocaleString('th-TH');
}

  if (!x) return o;
  if (m === 'subscription') {

    if (mem > 0) return scaleVol(inp, m, Math.max(0, (mem + x) / mem));

function dBuild(inp, m, T, d, o) {
  var x = Object.assign({}, inp), streams = [], fx = [], assets = [], one = 0, note = {};
  var lv = o.lv === undefined ? 1 : o.lv, f = o.f === undefined ? 1 : o.f, g = lv * f;
  if (T === 'hire') {
    var c = Math.max(0, Math.round(n0(d.count)));
    if (isKind(d, 'part')) fx.push(['newstaff', 'ค่าจ้างพาร์ตไทม์ ' + c + ' คน', c * n0(d.partRate) * n0(d.partHours) * n0(d.partDays)]);
    else if (isKind(d, 'piece')) { c = 1; if (isVolModel(m)) x.unitCost = n0(inp.unitCost) + n0(d.pieceRate) * Math.min(100, n0(d.pieceShare)) / 100; }
    else fx.push(['newstaff', 'เงินเดือนพนักงานใหม่ ' + c + ' คน', c * n0(d.salary)]);
    x = addVol(x, m, n0(d.gain) * g);
    if (isVolModel(m) && pos(inp.capacity) && pos(d.capAdd)) x.capacity = pos(inp.capacity) + c * n0(d.capAdd);
  } else if (T === 'place') {
    var t = o.t || 0;
    var pf = Math.max(0, 1 + n0(d.salesPct) / 100) * f;
    if (t > 0) {
      pf *= 1 - Math.min(90, n0(d.dipPct)) / 100 * (1 - placeProgress(d, t));
      var dOpen = isVolModel(m) ? daysOf(inp) : 30;
      if (t === 1 && n0(d.closedDays) > 0) pf *= Math.max(0, 1 - Math.min(dOpen, n0(d.closedDays)) / dOpen);
    }
    x = scaleVol(x, m, pf);
    x.rent = n0(d.newRent);
    one = n0(d.moveCost);
  } else if (T === 'channel') {
    var q = n0(d.chQty) * g;
    var mv = Math.min(100, n0(d.movePct)) / 100;
    if (m === 'rental') {
      /* คนเช่ารวม (ร้าน − ที่ย้ายมา + ช่องทาง) ในเดือนขายดีที่สุดต้องไม่เกิน 100% */
      var cap = mv >= 1 ? Infinity : (100 / peakSeason(inp) - n0(inp.occupancy)) / (1 - mv);
      if (q > Math.max(0, cap) + 1e-9) { note.clamped = true; q = Math.max(0, cap); }
    }
    x = addVol(x, m, -q * mv);
    if (q > 0) streams.push(channelStream(inp, m, d, q));
    note.chQ = q;
    fx.push(['chfee', tj('ค่าใช้จ่ายรายเดือนของ', d.chName || 'ช่องทาง'), n0(d.chFee)]);
  } else if (T === 'equip') {
    x = addVol(x, m, n0(d.eqGain) * g);
    var ck = ROLE[m].cost;
    if (n0(d.costDown) > 0) x[ck] = Math.max(0, n0(inp[ck]) - n0(d.costDown) * f);
    if (isVolModel(m) && pos(inp.capacity) && pos(d.eqCap)) x.capacity = pos(inp.capacity) + n0(d.eqCap);
    var fc = n0(d.fixedChg);
    if (fc < 0) fc *= f; /* เงินที่ประหยัดได้เป็นผลที่คาด ค่าใช้จ่ายที่เพิ่มไม่ลดตามฉาก */
    fc = Math.max(fc, -fixedTotal(x));
    fx.push(['eqfix', fc < 0 ? 'ค่าใช้จ่ายรายเดือนที่ลดลง' : 'ค่าใช้จ่ายรายเดือนที่เพิ่มขึ้น', fc]);
    if (pos(d.price) && pos(d.life)) assets.push({ name: 'อุปกรณ์ใหม่', purchasePrice: pos(d.price), usefulLifeYears: pos(d.life) });
    one = n0(d.price);
  } else if (T === 'price') {
    var pk = ROLE[m].price, sh = isKind(d, 'some') ? Math.min(100, n0(d.raiseShare)) / 100 : 1;
    x[pk] = n0(inp[pk]) + n0(d.raiseBy) * sh;
    x = scaleVol(x, m, Math.max(0, 1 - Math.min(95, n0(d.lostPct)) / 100));
  } else if (T === 'promo') {
    if ((o.t || 0) > promoDur(d)) x = scaleVol(x, m, 1 + n0(d.afterPct) / 100);
    else {
      var use = isKind(d, 'code') ? Math.min(100, n0(d.usePct)) / 100 : 1;
      if (isKind(d, 'gift')) x.unitCost = n0(inp.unitCost) + n0(d.giftCost);
      else x.price = n0(inp.price) * (1 - Math.min(90, n0(d.discPct)) / 100 * use);
      x = scaleVol(x, m, Math.max(0, 1 + n0(d.lift) / 100 * f));
    }
    one = n0(d.promoCost);
  } else if (T === 'newprod') {
    var q2 = (isKind(d, 'addon') ? n0(inp.volume) * Math.min(100, n0(d.npAttach)) / 100 : n0(d.npQty)) * g;
    var cn = isKind(d, 'addon') ? 0 : Math.min(100, n0(d.npCanni)) / 100;
    x = addVol(x, m, -q2 * cn);
    if (q2 > 0) streams.push(npStream(inp, m, d, q2));
    note.npQ = q2;
    fx.push(['npfix', 'ค่าใช้จ่ายรายเดือนของของใหม่', n0(d.npFixed)]);
    one = n0(d.npSetup);
  } else if (T === 'freeship') {
    var shr = (isKind(d, 'min') ? Math.min(100, n0(d.shipShare)) / 100 : 1) * (num(d.shipOrders) === null ? 1 : Math.min(100, n0(d.shipOrders)) / 100), po = Math.max(1, n0(d.perOrder) || 1);
    x.unitCost = n0(inp.unitCost) + n0(d.shipCost) * shr / po;
    x = scaleVol(x, m, 1 + n0(d.shipLift) / 100 * g);
  } else if (T === 'ads') {
    fx.push(['adbudget', 'ค่าโฆษณา', n0(d.adBudget)], ['admgmt', 'ค่าจ้างคนดูแลโฆษณา', n0(d.adMgmt)]);
    x = addVol(x, m, n0(d.adGain) * g);
    one = n0(d.adSetup);
  } else if (T === 'supplier') {
    x.unitCost = n0(d.newCost);
    if (num(d.supStock) !== null) x.stockDays = n0(d.supStock);
    if (num(d.supCredit) !== null) x.supplierCreditDays = n0(d.supCredit);
    x = scaleVol(x, m, Math.max(0, 1 + n0(d.supSales) / 100) * f);
    one = n0(d.switchCost);
  } else if (T === 'freelance') {
    fx.push(['flfee', { admin: 'ค่าจ้างแอดมิน', live: 'ค่าจ้างคนไลฟ์' }[d.kind] || 'ค่าจ้างฟรีแลนซ์', n0(d.flFee)]);
    var gq = n0(d.flGain) * g;
    x = addVol(x, m, gq);
    if (isKind(d, 'live') && isVolModel(m) && n0(d.flPct) > 0) fx.push(['flcom', 'ค่าคอมคนไลฟ์', n0(d.flPct) / 100 * n0(inp.price) * (inp.volumePer === 'month' ? gq : gq * daysOf(inp))]);
  } else if (T === 'branch') {
    var bp = n0(d.bPct) / 100 * g;
    if (bp > 0) streams.push(branchStream(inp, m, bp));
    note.bp = bp;
    fx.push(['brent', 'ค่าเช่าสาขา', n0(d.bRent)], ['bstaff', 'เงินเดือนพนักงานสาขา', n0(d.bStaff) * n0(d.bSalary)], ['bother', 'ค่าใช้จ่ายอื่นของสาขา', n0(d.bOther)]);
    one = n0(d.setup);
  }
  /* ขายเป็นหน่วยแล้วยอดเหลือ 0 (เช่น ปิดร้านทั้งเดือน) ตัวคำนวณถือว่า "ไม่ทราบยอด" จึงใส่ยอดที่ใกล้ 0 มากแทน ให้ได้รายได้ 0 จริง */
  if (isVolModel(m) && !(n0(x.volume) > 0)) x.volume = 1e-9;
  var v4 = v4Input(x, m);
  v4.streams = v4.streams.concat(streams);
  v4.fixedCostsMonthly = Math.max(0, v4.fixedCostsMonthly + fx.reduce(function (s, a) { return s + a[2]; }, 0));
  if (assets.length) v4.assets = (v4.assets || []).concat(assets);
  /* ค่าส่ง ค่าจ้างรายชิ้น ของแถม ไม่ได้อยู่ในสต็อก: เงินจมในสต็อกคิดจากต้นทุนของเท่านั้น */
  if (isVolModel(m) && (T === 'freeship' || (T === 'hire' && isKind(d, 'piece')) || (T === 'promo' && isKind(d, 'gift')))) v4.streams[0].stockCostPerUnit = n0(inp.unitCost);
  return { v4: v4, x: x, fx: fx, one: one, note: note };
}

function steady(inp, m, T, d, f) {
  var b = dBuild(inp, m, T, d, { lv: 1, f: f === undefined ? 1 : f });
  var r = runCalc(b.v4);
  return { b: b, r: r, profit: r.netProfitMonthly };
}

/* ---------- เงินที่จมในการขาย (ลูกค้ายังไม่จ่าย + ของในสต็อก − เงินที่ลูกค้าจ่ายล่วงหน้า) ของเดือนปกติ ----------
   ตัวคำนวณคิดแต่ละเดือนแบบ "ร้านเป็นแบบนี้มานานแล้ว" เมื่อยอดเปลี่ยนวันนี้ เงินส่วนนี้ต้องจมเพิ่มก่อนจึงจะได้คืน
   ใช้กติกาจังหวะเงินเดียวกับตัวคำนวณ (เครดิตลูกค้า · วันเก็บสต็อก · เครดิตจากคนขาย · มัดจำและงวดสุดท้ายของงาน · ค่าสมาชิกจ่ายล่วงหน้า) */
function streamWC(s) {
  var cr = n0(s.creditDays);
  if (s.type === 'unit' || s.type === 'service' || s.type === 'resell') {
    var u = n0(s.unitsPerMonth), rev = n0(s.price) * u, cogs = n0(s.stockCostPerUnit !== undefined ? s.stockCostPerUnit : s.costPerUnit) * u;
    return rev * cr / 30 + cogs * (n0(s.inventoryDays) - n0(s.supplierCreditDays)) / 30;
  }
  if (s.type === 'subscription') {
    var cyc = Math.max(1, Math.round(n0(s.cycleMonths) || 1)), revS = n0(s.activeMembers) * n0(s.feePerCycle) / cyc;
    return revS * cr / 30 - revS * (cyc - 1) / 2;
  }
  if (s.type === 'rental') {
    var per = n0(s.periodsPerMonth) || 30;
    return n0(s.rentableUnits) * per * Math.min(1, n0(s.occupancyPercent) / 100) * n0(s.pricePerPeriod) * cr / 30;
  }
  if (s.type === 'commission') {
    var rc = n0(s.dealsPerMonth) * n0(s.avgDealValue) * n0(s.commissionPercent) / 100;
    return rc * (1 - (n0(s.splitPercent) + n0(s.variableCostPercent)) / 100) * cr / 30;
  }
  if (s.type === 'project') {
    var k = n0(s.projectsPerYear) / 12, V = n0(s.avgProjectValue), dd = Math.max(1, Math.round(n0(s.durationMonths))), p = n0(s.depositPercent) / 100;
    var L = Math.ceil(cr / 30 - 1e-9), w = 0;
    for (var a = 0; a <= dd - 2 + L; a++) w += V * Math.min(a + 1, dd) / dd - p * V;
    return k * w;
  }
  return n0(s.amountPerMonth) * cr / 30;
}
function wcOf(v4) { return v4.streams.reduce(function (a, s) { return a + streamWC(s); }, 0); }

/* ---------- ผลเต็มของการตัดสินใจ ---------- */
function dEval(inp, m, T, d, opt) {
  opt = opt || {};
  var f = opt.f === undefined ? 1 : opt.f;
  var B = compute(inp, m);
  if (!B.ok) return { ok: false };
  var st = steady(inp, m, T, d, f);
  if (st.r.netProfitMonthly === null || st.r.projection.length !== 12) return { ok: false };
  var k = rampOf(T, d);
  var R = { ok: true, T: T, m: m, B: B, st: st, one: st.b.one, k: k, f: f };
  R.profit = st.profit;
  R.delta = R.profit - B.profit;

  /* 12 เดือน: เดือนที่ t ใช้ตัวเลขของเดือนนั้นจากตัวคำนวณ (รวมฤดูกาล การเติบโต และจังหวะเงินเข้าออกของร้าน)
     แล้วหักเงินที่ต้องจมเพิ่มในลูกหนี้และสต็อก ในเดือนที่ยอดเปลี่ยน */
  var wc0 = wcOf(v4Input(inp, m)), prevWC = 0, rows = [];
  for (var t = 1; t <= 12; t++) {
    var o = byMonth(T) ? { t: t, f: f } : { lv: levelAt(k, t), f: f };
    var bt = byMonth(T) || o.lv !== 1 ? dBuild(inp, m, T, d, o) : st.b;
    var r = bt === st.b ? st.r : runCalc(bt.v4);
    var p = r.projection[t - 1];
    if (!p) return { ok: false };
    var dWC = wcOf(bt.v4) - wc0, wcStep = dWC - prevWC;
    prevWC = dWC;
    rows.push({ t: t, profit: p.netProfitAccounting, net: p.netCashFlow - wcStep, wcStep: wcStep, rev: p.revenue,
      bProfit: B.cash[t - 1].profit, bNet: B.cash[t - 1].net, bBal: B.cash[t - 1].bal });
  }
  R.wc = prevWC;
  R.cashStart = B.cashStart;
  R.aStart = B.cashStart - R.one;
  var bal = R.aStart, cum = 0, low = R.aStart, lowT = 0, negT = null, sumDiff = 0, payback = null;
  rows.forEach(function (w) {
    bal += w.net; w.bal = bal;
    if (bal < low) { low = bal; lowT = w.t; }
    if (negT === null && bal < 0) negT = w.t;
    sumDiff += w.profit - w.bProfit;
    var e = w.net - w.bNet, prev = cum;
    cum += e; w.cumExtra = cum;
    if (payback === null && R.one > 0 && cum >= R.one && e > 0) payback = w.t - 1 + (R.one - prev) / e;
  });
  if (R.aStart < 0 && negT === null) negT = 0;
  R.rows = rows;
  R.low = low; R.lowT = lowT; R.negT = negT;
  R.need = Math.max(0, -low);              /* เงินที่ต้องหาเพิ่ม ถึงจะไม่ขาดมือ */
  R.sumDiff = sumDiff;
  /* เงินสดที่ได้เพิ่มต่อเดือนเมื่อเข้าที่ (เดือนปกติ) = กำไรที่เปลี่ยน + เงินที่กันไว้ซื้อเครื่องใหม่ (ไม่ใช่เงินที่จ่ายออกจริง) */
  R.extraSteady = R.delta + (st.r.depreciation.monthlyTotal - B.r.depreciation.monthlyTotal);
  /* คืนทุนหลังเดือนที่ 12: ใช้เงินที่ได้เพิ่มของปีที่ 2 และ 3 จากตัวคำนวณ (รวมการเติบโตและฤดูกาลของร้าน) */
  if (R.one > 0 && payback === null) {
    var a3 = st.r.projection3YearsRough || [], b3 = B.r.projection3YearsRough || [], rem = R.one - cum;
    var y2 = a3[1] && b3[1] ? a3[1].netCashFlow - b3[1].netCashFlow : R.extraSteady * 12;
    var y3 = a3[2] && b3[2] ? a3[2].netCashFlow - b3[2].netCashFlow : y2;
    if (y2 > 0.5 && rem <= y2) payback = 12 + rem / (y2 / 12);
    else {
      var rem2 = rem - y2;
      if (y3 > 0.5 && rem2 <= y3) payback = 24 + rem2 / (y3 / 12);
      else if (y3 > 0.5) payback = 36 + (rem2 - y3) / (y3 / 12);
    }
  }
  if (R.extraSteady <= 0.5 || T === 'promo') payback = null;
  /* จัดโปร: กำไรรวม 12 เดือนเทียบกับไม่ทำ หักค่าจัดโปรแล้ว (ช่วงโปร + หลังจบโปร) */
  R.total12 = sumDiff - R.one;
  R.payback = R.one > 0 ? payback : null;
  R.ledger = dLedger(R, inp, m, T, d);
  R.warn = dWarn(R, inp, m, T, d);
  return R;
}

/* ---------- กำไรต่อเดือนเปลี่ยนเพราะอะไรบ้าง (รวมกันได้เท่ากำไรที่เปลี่ยนพอดี) ---------- */
function dLedger(R, inp, m, T, d) {
  var r0 = R.B.r, r1 = R.st.r, b = R.st.b, L = [];
  var c0 = r0.revenueMonthly - r0.variableCostMonthly, c1 = r1.revenueMonthly - r1.variableCostMonthly;
  var extra = r1.streams.slice(1).map(function (s) { return s.contributionMonthly || 0; });
  var extraSum = extra.reduce(function (a, x) { return a + x; }, 0);
  var mainChg = c1 - c0 - extraSum;
  var sw = salesWord(m);
  var mainLabel = {
    hire: isKind(d, 'piece') ? sw + 'ที่เพิ่ม หักค่าจ้างรายชิ้น' : 'เงินที่เหลือจาก' + sw + 'ที่เพิ่ม', place: 'เงินที่เหลือจาก' + sw + 'ที่ใหม่ เทียบกับตอนนี้',
    channel: tj('ลูกค้าเดิมที่ย้ายไปซื้อผ่าน', d.chName || 'ช่องทางใหม่'), equip: sw + 'ที่เพิ่ม และต้นทุนที่ลดลง', branch: '',
    price: 'ราคาใหม่ และ' + sw + 'ที่ลดลง', promo: (isKind(d, 'gift') ? 'ของแถม' : 'ส่วนลด') + ' และ' + sw + 'ที่เพิ่มช่วงจัดโปร',
    newprod: 'ลูกค้าที่เปลี่ยนจากของเดิมมาซื้อของใหม่', freeship: 'ค่าส่งที่ร้านจ่าย และ' + sw + 'ที่เพิ่ม', ads: 'เงินที่เหลือจาก' + sw + 'ที่เพิ่ม',
    supplier: 'ต้นทุนใหม่ และ' + sw + 'หลังเปลี่ยน', freelance: 'เงินที่เหลือจาก' + sw + 'ที่เพิ่ม'
  }[T];
  if (Math.abs(mainChg) >= 0.5) L.push({ label: mainLabel, amount: mainChg });
  r1.streams.slice(1).forEach(function (s, i) {
    L.push({ label: s.id === 'ch' ? tj('เงินที่เหลือจากขายผ่าน', d.chName || 'ช่องทางใหม่') : s.id === 'np' ? 'เงินที่เหลือจากขายของใหม่' : 'เงินที่เหลือจาก' + salesWord(m) + 'ของสาขา', amount: extra[i] });
  });
  var p0 = fixedParts(inp), p1 = fixedParts(b.x);
  if (Math.abs(p1.rent - p0.rent) >= 0.5) L.push({ label: 'ค่าเช่าที่ใหม่ เทียบกับที่เดิม', amount: -(p1.rent - p0.rent) });
  b.fx.forEach(function (a) { if (Math.abs(a[2]) >= 0.5) L.push({ label: a[1], amount: -a[2] }); });
  var dd = r1.depreciation.monthlyTotal - r0.depreciation.monthlyTotal;
  if (Math.abs(dd) >= 0.5) L.push({ label: 'กันไว้ซื้อเครื่องใหม่เมื่อหมดอายุ', amount: -dd });
  /* เศษจากการปัดของตัวคำนวณ ใส่ไว้ในบรรทัดแรก เพื่อให้รวมกันได้เท่ากำไรที่เปลี่ยนพอดี */
  var sum = L.reduce(function (a, x) { return a + x.amount; }, 0);
  if (L.length && Math.abs(R.delta - sum) > 0.001) L[0].amount += R.delta - sum;
  return L;
}

function dWarn(R, inp, m, T, d) {
  var W = [], x = R.st.b.x;
  if (isVolModel(m) && pos(x.capacity) && ['hire', 'equip', 'ads', 'freelance', 'promo', 'freeship', 'supplier'].indexOf(T) >= 0) {
    var mainV = n0(x.volume), chV = T === 'channel' ? n0(R.st.b.note.chQ) : 0;
    if (mainV + chV > pos(x.capacity) + 1e-9) W.push('ยอดที่คาดรวม ' + fmtN(mainV + chV, 1) + ' ' + volUnitText(inp, m) + ' เกินกำลังที่ร้านทำได้ (สูงสุด ' + fmtN(pos(x.capacity)) + ')');
  }
  if (m === 'subscription' && pos(inp.maxMembers) && T !== 'branch') {
    var tot = n0(x.members) + (T === 'channel' ? n0(R.st.b.note.chQ) : 0);
    if (tot > pos(inp.maxMembers)) W.push('สมาชิกที่คาดรวม ' + fmtN(tot) + ' คน เกินที่รับได้ (สูงสุด ' + fmtN(pos(inp.maxMembers)) + ' คน)');
  }
  if (T === 'channel' && R.st.b.note.clamped) W.push('คนเช่ารวมทุกช่องทางเต็ม 100% ในเดือนขายดีแล้ว ส่วนที่เกินไม่ได้นับ');

  /* ปุ่มตอบเร็วของตัวเลขร้าน (ชุดเดียวกับตัวที่ 1): "ไม่มี" (หรือ "เท่าเดิม") = 0 · "ยังไม่รู้" = ไม่จำกัด (เช่น กำลังสูงสุด) */

  /* ข้อสุดท้ายของตัวเลขร้าน: ตอบ มี / ไม่มี · ถ้ามี เลือกกลุ่มที่รู้ แล้วตอบทุกช่องในกลุ่มนั้น */

    function p(v) { return (v - lo) / (hi - lo) * 100; }
    function rowH(label, from, to, kind, i) {
      var a = p(Math.min(from, to)), w = Math.max(0.6, Math.abs(p(to) - p(from)));

        '<div class="wf-track"><i class="' + (to >= from ? 'pos' : 'neg') + '" style="left:' + a.toFixed(2) + '%;width:' + w.toFixed(2) + '%"></i>' + (lo < 0 ? '<span class="wf-zero" style="left:' + p(0).toFixed(2) + '%"></span>' : '') + '</div></div>';
    }
    var rows = rowH('กำไรต่อเดือนตอนนี้', 0, R.B.profit, 'start', 0), cur = R.B.profit;
    R.ledger.forEach(function (l, i) { rows += rowH(l.label, cur, cur + l.amount, l.amount >= 0 ? 'plus' : 'minus', i + 1); cur += l.amount; });

  /* ขั้นต่อไป: เครื่องมือ PL1 ที่ช่วยคิดเรื่องนี้ + เช็กความพร้อม (ไม่บังคับ) */
  function ans() { if (!state.answers[state.topic]) state.answers[state.topic] = {}; return state.answers[state.topic]; }
  function askList() {
    var d = dec();

  }
  function askDone() { var L = askList(), A = ans(); return L.length > 0 && L.every(function (q) { return A[q]; }); }
  function askedCount() { var A = ans(); return askList().filter(function (q) { return A[q]; }).length; }
  function pointsList() { var A = ans(); return askList().filter(function (q) { return ansFlag(QB3[q], A[q]); }); }
  function toolsHtml(codes, title, seen) {

  /* ปุ่มหลักของหน้าผล (ค้างด้านล่าง): เช็กความพร้อม → จุดที่ควรตรวจสอบ */

  function nextCard() {

  var RTABS = [['cash', 'เงินในมือ 12 เดือน'], ['wf', 'กำไรเปลี่ยนเพราะอะไร?']];

  /* ส่วนที่เปลี่ยนตามแถบลากมี id ของตัวเอง (resultLive อัปเดตเฉพาะส่วนนั้น แท็บ โฟกัส และหัวข้อที่เปิดไว้จึงไม่หาย) */
