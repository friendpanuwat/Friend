<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}</style><script>var LAB_HUB = "index.html";</script></head><body>
<title>กำไรรายสินค้าและรายช่องทาง</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Sora:wght@500;600&display=swap">
<style>
/* Layout: one mobile column (max 560px) on a white ground · soft grey cards without borders or shadows · pill buttons · black inverse panels hold the money
   Minimal: one big number per card, rings and bars instead of sentences · secondary text sits behind a "?" button (.qm) or a tap
   --card = grey card on the page · --surface = fill inside a card (white in light mode)
   Screens: start → wizard (one question per screen, live receipt) → home (summary) → finding detail / lab (own screens) */
:root {
  --bg: #ffffff;
  --card: #f4f4f6;
  --surface: #ffffff;
  --surface-2: #e6e6ea;
  --line: #e3e3e7;
  --line-strong: #c6c6cc;
  --ink: #0b0b0c;
  --ink-2: #393940;
  --muted: #66666d;
  --faint: #a9a9b0;
  --panel: #0b0b0c;
  --panel-ink: #ffffff;
  --panel-muted: rgba(255, 255, 255, 0.64);
  --panel-line: rgba(255, 255, 255, 0.16);
  --panel-dot: transparent;
  --panel-btn: #ffffff;
  --panel-btn-ink: #0b0b0c;
  --ghost: #b8b8be;
  --shadow: 0 0 0 0 transparent;
  --lift: 0 8px 24px rgba(11, 11, 12, 0.14);
  --font-th: "IBM Plex Sans Thai", "Noto Sans Thai", "Thonburi", system-ui, sans-serif;
  --font-num: "Space Grotesk", "IBM Plex Sans Thai", system-ui, sans-serif;
  --font-latin: "Sora", "IBM Plex Sans Thai", system-ui, sans-serif;
  --r: 22px;
  --r-sm: 18px;
  --col: 560px;
  --foot-h: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09090a; --card: #18181b; --surface: #26262a; --surface-2: #303035; --line: #2c2c31; --line-strong: #44444b;
    --ink: #f4f4f5; --ink-2: #d4d4d8; --muted: #a1a1a9; --faint: #64646b;
    --panel: #ededef; --panel-ink: #0b0b0c; --panel-muted: rgba(11, 11, 12, 0.62); --panel-line: rgba(11, 11, 12, 0.14); --panel-dot: transparent;
    --panel-btn: #0b0b0c; --panel-btn-ink: #ffffff; --ghost: #57575e;
    --shadow: 0 0 0 0 transparent; --lift: 0 8px 24px rgba(0, 0, 0, 0.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09090a; --card: #18181b; --surface: #26262a; --surface-2: #303035; --line: #2c2c31; --line-strong: #44444b;
  --ink: #f4f4f5; --ink-2: #d4d4d8; --muted: #a1a1a9; --faint: #64646b;
  --panel: #ededef; --panel-ink: #0b0b0c; --panel-muted: rgba(11, 11, 12, 0.62); --panel-line: rgba(11, 11, 12, 0.14); --panel-dot: transparent;
  --panel-btn: #0b0b0c; --panel-btn-ink: #ffffff; --ghost: #57575e;
  --shadow: 0 0 0 0 transparent; --lift: 0 8px 24px rgba(0, 0, 0, 0.5); color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-th); font-size: 16px; line-height: 1.55; margin: 0; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 8px; }
.num { font-family: var(--font-num); letter-spacing: -0.02em; }
.muted { color: var(--muted); }
svg { flex: none; }

.wrap { max-width: var(--col); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { padding-bottom: calc(var(--foot-h) + 40px + env(safe-area-inset-bottom, 0px)); }

/* ---------- top bar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); }
.bar .wrap { display: flex; align-items: center; gap: 6px; min-height: 60px; }
.bar .ttl { flex: 1; min-width: 0; text-align: center; font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .ttl small { display: block; font-family: var(--font-latin); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.ib { width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center; color: var(--ink); }
.ib:hover { background: var(--surface-2); }
.ib svg { width: 22px; height: 22px; }
.tb { min-height: 44px; padding: 0 12px; border-radius: 22px; border: 0; background: transparent; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 4px; }
.tb svg { width: 20px; height: 20px; }
.tb:hover { background: var(--surface-2); }
.spacer44 { width: 44px; flex: none; }

/* ---------- buttons ---------- */
.btn { min-height: 54px; border-radius: 999px; border: 0; background: var(--ink); color: var(--bg); font-weight: 700; font-size: 17px; padding: 0 20px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn svg { width: 20px; height: 20px; }
.btn.ghost { background: var(--card); color: var(--ink); }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.35; cursor: default; }
.btn.on-panel { background: var(--panel-btn); color: var(--panel-btn-ink); }
.lnk { background: none; border: 0; padding: 0 4px; min-height: 44px; font-weight: 600; font-size: 15px; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1.5px; color: var(--ink); }

/* ---------- inverse panel (the money lives here) ---------- */
.panel {
  background-color: var(--panel); color: var(--panel-ink); border-radius: 28px; padding: 22px 20px 20px; position: relative; overflow: hidden;
  background-image: radial-gradient(var(--panel-dot) 1.2px, transparent 1.3px); background-size: 14px 14px; background-position: 7px 7px;
}
.panel .eyebrow { font-size: 13px; color: var(--panel-muted); font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.panel .tag { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--panel-line); color: var(--panel-ink); }
.bignum { font-family: var(--font-num); font-weight: 700; font-size: 60px; line-height: 1; letter-spacing: -0.045em; margin: 10px 0 6px; overflow-wrap: anywhere; }
.bignum .u { font-family: var(--font-th); font-size: 20px; font-weight: 600; letter-spacing: 0; margin-left: 8px; }
.panel .sub { font-size: 14px; color: var(--panel-muted); }
.panel .delta { font-family: var(--font-num); font-weight: 700; font-size: 16px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin-top: 18px; border-top: 1px solid var(--panel-line); padding-top: 14px; }
.stat { min-width: 0; padding-right: 8px; }
.stat + .stat { border-left: 1px solid var(--panel-line); padding-left: 12px; }
.stat .k { font-size: 12px; color: var(--panel-muted); line-height: 1.35; }
.stat .v { font-family: var(--font-num); font-weight: 700; font-size: 22px; line-height: 1.2; margin-top: 4px; letter-spacing: -0.02em; white-space: nowrap; }
.stat .v small { font-family: var(--font-th); font-size: 12px; font-weight: 600; letter-spacing: 0; margin-left: 2px; }
.stat .d { font-family: var(--font-num); font-size: 12px; font-weight: 700; margin-top: 2px; }
.stat .n { font-size: 12px; color: var(--panel-muted); line-height: 1.35; }
.panel .cta { margin-top: 18px; }
.up::before { content: "▲ "; font-size: 0.78em; }
.down::before { content: "▼ "; font-size: 0.78em; }

/* ---------- start ---------- */
.start-hero { margin-top: 8px; }
.start-hero h1 { font-size: 27px; line-height: 1.32; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.start-hero p { margin: 10px 0 0; color: var(--panel-muted); font-size: 15px; }
.demo { margin-top: 18px; border-top: 1px solid var(--panel-line); padding-top: 14px; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: end; }
.demo .k { font-size: 13px; color: var(--panel-muted); }
.demo .v { font-family: var(--font-num); font-weight: 700; font-size: 34px; letter-spacing: -0.03em; line-height: 1; }
.demo .d { font-family: var(--font-num); font-weight: 700; font-size: 15px; text-align: right; }
.demo .note { grid-column: 1 / -1; font-size: 13px; color: var(--panel-muted); }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 28px 2px 12px; }
.sec-h h2 { font-size: 20px; margin: 0; line-height: 1.3; }
.sec-h .aside { font-size: 14px; color: var(--muted); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { text-align: left; border: 0; background: var(--card); border-radius: var(--r); padding: 16px 14px 14px; min-height: 124px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); }
.tile:hover { box-shadow: inset 0 0 0 1.5px var(--ink); }
.tile .ic { width: 40px; height: 40px; border-radius: 12px; background: var(--ink); color: var(--bg); display: flex; align-items: center; justify-content: center; }
.tile .ic svg { width: 22px; height: 22px; }
.tile .t { font-weight: 700; font-size: 15px; line-height: 1.35; }
.tile .ex { font-size: 13px; color: var(--muted); line-height: 1.4; margin-top: auto; }
.fine { font-size: 13px; color: var(--muted); margin: 24px 2px 0; }

/* ---------- wizard ---------- */
.prog { display: flex; gap: 4px; margin: 4px 0 0; }
.prog i { flex: 1; height: 4px; border-radius: 2px; background: var(--surface-2); }
.prog i.on { background: var(--ink); }
.receipt-strip { margin-top: 14px; padding: 14px 16px; }
.receipt-strip .rs-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.receipt-strip .rs-k { font-size: 13px; color: var(--panel-muted); font-weight: 600; }
.receipt-strip .rs-v { font-family: var(--font-num); font-weight: 700; font-size: 30px; letter-spacing: -0.03em; line-height: 1.1; }
.receipt-strip .rs-v small { font-family: var(--font-th); font-size: 14px; font-weight: 600; letter-spacing: 0; margin-left: 4px; }
.receipt-strip .rs-lines { margin-top: 8px; display: grid; gap: 2px; font-size: 13px; }
.rs-line { display: flex; gap: 6px; align-items: baseline; color: var(--panel-muted); }
.rs-line i { flex: 1; border-bottom: 1px dotted var(--panel-line); transform: translateY(-3px); }
.rs-line b { font-family: var(--font-num); color: var(--panel-ink); font-weight: 600; }
.rs-empty { font-size: 14px; color: var(--panel-muted); margin-top: 4px; }
.q-head { margin: 26px 2px 6px; }
.q-head .step { font-size: 13px; color: var(--muted); font-weight: 600; }
.q-head h1 { font-size: 26px; line-height: 1.3; margin: 4px 0 0; text-wrap: balance; }
.q-head p { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
.qfields { display: grid; gap: 18px; margin-top: 18px; }
.field { display: grid; gap: 8px; min-width: 0; }
.field > label, .field > .lab { font-weight: 600; font-size: 15px; }
.field .help { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0; }
.inbox { display: flex; align-items: center; background: var(--card); border-radius: 18px; min-height: 60px; overflow: hidden; }
.inbox:focus-within { box-shadow: inset 0 0 0 2px var(--ink); }
.inbox input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 0 16px; font-family: var(--font-num); font-size: 24px; font-weight: 600; outline: none; height: 58px; letter-spacing: -0.01em; }
.inbox input::placeholder { color: var(--faint); font-weight: 500; }
.inbox .suf { padding: 0 16px 0 4px; color: var(--muted); font-size: 15px; white-space: nowrap; }
.seg { display: inline-flex; background: var(--card); border-radius: 999px; padding: 4px; gap: 4px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 999px; min-height: 44px; padding: 0 16px; font-size: 15px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.inbox .seg { margin: 6px; padding: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 48px; padding: 0 18px; border-radius: 24px; border: 0; background: var(--card); font-weight: 600; font-size: 16px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: none; }
.chips input { width: 140px; min-height: 48px; border: 0; border-radius: 24px; padding: 0 16px; background: var(--card); font-size: 15px; }
.chips input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--ink); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.two > * { min-width: 0; }
.two .inbox input { font-size: 20px; }
.fee-help { display: grid; gap: 10px; padding: 14px; border-radius: var(--r); background: var(--card); }
.fee-help .inbox, .adv-block .inbox, .adv-block .chip, .adv-block .chips input, .adv-block .seg, .adv-block .month { background: var(--surface); }
.fee-help .fh-res { font-size: 14px; color: var(--ink-2); }
.fee-help .fh-res b { font-family: var(--font-num); color: var(--ink); }
.fee-help label { font-size: 13px; font-weight: 600; }
.adv-block { background: var(--card); border-radius: var(--r); padding: 4px 16px; box-shadow: var(--shadow); }
.adv-block summary { list-style: none; cursor: pointer; min-height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 700; font-size: 16px; }
.adv-block summary::-webkit-details-marker { display: none; }
.adv-block summary small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
.adv-block summary svg { width: 20px; height: 20px; transition: transform 0.2s; color: var(--muted); }
.adv-block[open] summary svg { transform: rotate(180deg); }
.adv-block .qfields { margin: 4px 0 18px; }
.adv-list { display: grid; gap: 10px; margin-top: 18px; }
.months { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.month { min-height: 48px; border-radius: 12px; border: 0; background: var(--card); font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; }
.month small { font-size: 10px; font-weight: 700; }
.month[data-s="high"] { background: var(--ink); color: var(--bg); }
.month[data-s="low"] { background: var(--surface-2); box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: linear-gradient(to top, var(--bg) 70%, transparent); padding-bottom: env(safe-area-inset-bottom, 0px); }
.foot .wrap { display: flex; gap: 10px; padding-top: 18px; padding-bottom: 14px; }
.foot .btn { flex: 1; }
.foot .btn.back { flex: 0 0 auto; width: 60px; padding: 0; }
.foot2 .btn { font-size: 16px; padding: 0 16px; }
.foot2 .btn.ghost { flex: 0 0 auto; }
.skip { display: flex; justify-content: center; margin-top: 10px; }

/* ---------- review (แก้ตัวเลข) ---------- */
.rv { display: grid; gap: 8px; margin-top: 12px; }
.rv-row { width: 100%; text-align: left; border: 0; background: var(--card); border-radius: var(--r-sm); padding: 14px 16px; display: grid; grid-template-columns: 1fr 20px; gap: 2px 10px; align-items: center; box-shadow: var(--shadow); min-height: 64px; }
.rv-row .t { font-weight: 700; font-size: 15px; }
.rv-row .v { font-size: 14px; color: var(--muted); grid-column: 1; line-height: 1.45; }
.rv-row svg { grid-row: 1 / span 2; grid-column: 2; width: 18px; height: 18px; color: var(--muted); }

/* ---------- home ---------- */
.banner { margin-top: 4px; margin-bottom: 12px; padding: 0 6px 0 16px; min-height: 48px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow); font-size: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
/* ป้ายตัวเลขจากเช็กก่อนเปิดร้าน: ข้อความยาวขึ้น 2 บรรทัดได้ จึงใช้มุมมนแบบการ์ด */
.banner.pre-open { border-radius: var(--r-sm); padding: 8px 6px 8px 16px; }
.banner.pre-open > span { flex: 1 1 180px; min-width: 0; line-height: 1.45; }
.flist { display: grid; gap: 8px; }
.frow { width: 100%; text-align: left; border: 0; background: var(--card); border-radius: var(--r); padding: 16px; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; box-shadow: var(--shadow); min-height: 76px; }
.frow .ft { font-weight: 700; font-size: 16px; line-height: 1.4; grid-column: 1; }
.frow .fm { font-family: var(--font-num); font-weight: 700; font-size: 20px; letter-spacing: -0.02em; white-space: nowrap; text-align: right; }
.frow .fm small { display: block; font-family: var(--font-th); font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.frow .pill { grid-column: 1; justify-self: start; }
.frow svg { width: 18px; height: 18px; color: var(--muted); }
.frow .fr-r { grid-row: 1 / span 2; grid-column: 2; display: flex; align-items: center; gap: 6px; }
.pill { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--surface); white-space: nowrap; letter-spacing: 0.01em; display: inline-block; }
.pill.high { background: var(--ink); color: var(--bg); box-shadow: none; }
.pill.mid { box-shadow: inset 0 0 0 1.5px var(--ink); }
.pill.watch { background: var(--surface-2); }
.pill.note { color: var(--muted); }
.ok-box { background: var(--card); border-radius: var(--r); padding: 18px 16px; box-shadow: var(--shadow); }
.ok-box b { font-size: 16px; }
.ok-box p { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
.cards { display: grid; gap: 12px; }
.card { background: var(--card); border-radius: var(--r); padding: 18px 16px; box-shadow: var(--shadow); min-width: 0; }
.card h3 { font-size: 16px; margin: 0; line-height: 1.4; }
.card .lead { font-size: 15px; color: var(--ink-2); margin: 4px 0 0; }
.card .lead b { font-family: var(--font-num); color: var(--ink); }


/* chart */
.chart { margin-top: 10px; position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .ax { font-family: var(--font-num); font-size: 11px; fill: var(--muted); }
.chart .axth { font-family: var(--font-th); font-size: 11px; fill: var(--muted); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .zero { stroke: var(--ink-2); stroke-width: 1; }
.chart .line { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .line.ghost { stroke: var(--ghost); stroke-width: 2; }
.chart .area { fill: var(--ink); opacity: 0.06; }
.chart .dot { fill: var(--ink); stroke: var(--card); stroke-width: 2; }
.chart .endlab { font-family: var(--font-num); font-size: 12px; font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: var(--card); stroke-width: 4px; stroke-linejoin: round; }
.chart .hit { fill: transparent; }
.chart .cross { stroke: var(--ink-2); stroke-width: 1; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 7px 10px; font-size: 13px; line-height: 1.4; white-space: nowrap; transform: translate(-50%, -100%); z-index: 3; }
.tip b { font-family: var(--font-num); }
.legend { display: flex; gap: 16px; margin-top: 8px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 16px; height: 3px; border-radius: 2px; background: var(--ink); }
.legend i.g { background: var(--ghost); }

/* เงิน 100 บาทที่ลูกค้าจ่าย ไปไหนบ้าง: การ์ดเทา แถบเดียว + กำไรที่เหลือ · แตะเพื่อดูทีละรายการ */
.receipt { background: var(--card); border-radius: var(--r); padding: 16px 16px 4px; margin: 10px 0; }
.rc-head .rt { font-weight: 600; font-size: 15px; line-height: 1.4; }
.rc-bar { display: flex; gap: 2px; height: 12px; margin: 14px 0 0; border-radius: 6px; overflow: hidden; }
.rc-bar i { display: block; background: var(--ghost); height: 100%; transition: flex-grow 0.35s; }
.rc-bar i:nth-child(2n) { opacity: 0.7; }
.rc-bar i.k { background: var(--ink); opacity: 1; }
.rc-lines { display: grid; gap: 6px; margin-top: 14px; font-size: 14px; }
.rc-line { display: flex; gap: 6px; align-items: baseline; }
.rc-line span { color: var(--ink-2); flex: 1; }
.rc-line i { display: none; }
.rc-line b { font-family: var(--font-num); font-weight: 600; font-variant-numeric: tabular-nums; }
.rc-line .was { flex: none; font-family: var(--font-num); color: var(--muted); font-size: 12px; text-decoration: line-through; margin-right: 4px; }
.rc-total { width: 100%; min-height: 52px; margin-top: 6px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; color: var(--ink); text-align: left; }
.rc-total span { flex: 1; }
.rc-total b { font-family: var(--font-num); font-size: 22px; letter-spacing: -0.02em; }
.rc-total svg { width: 18px; height: 18px; color: var(--muted); transition: transform 0.2s; }
.rc-total[aria-expanded="true"] svg { transform: rotate(180deg); }

/* ranking */
.rank { display: grid; gap: 2px; margin-top: 10px; }
.rank button { width: 100%; text-align: left; border: 0; background: transparent; border-radius: 12px; padding: 10px 8px; margin: 0 -8px; display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; min-height: 56px; width: calc(100% + 16px); }
.rank button:hover { background: var(--surface); }
.rank .rl { font-size: 15px; font-weight: 600; }
.rank .rl small { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 4px; }
.rank .rv { font-family: var(--font-num); font-weight: 700; white-space: nowrap; }
.rank .rb { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--surface); overflow: hidden; }
.rank .rb i { display: block; height: 100%; background: var(--ink); border-radius: 4px; }
.plan { margin-top: 12px; }
.plan h3 { margin: 6px 0 6px; font-size: 19px; line-height: 1.4; }
.plan p { margin: 0 0 14px; font-size: 14px; color: var(--panel-muted); }
details.about { margin-top: 12px; background: var(--card); border-radius: var(--r); padding: 0 16px; box-shadow: var(--shadow); }
details.about summary { list-style: none; min-height: 56px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-weight: 600; font-size: 15px; }
details.about summary::-webkit-details-marker { display: none; }
details.about summary svg { width: 18px; height: 18px; color: var(--muted); transition: transform 0.2s; }
details.about[open] summary svg { transform: rotate(180deg); }
details.about ul { margin: 0 0 16px; padding-left: 18px; font-size: 14px; color: var(--ink-2); display: grid; gap: 6px; }

/* ---------- finding detail ---------- */
.fd-panel .ft { font-size: 22px; font-weight: 700; line-height: 1.35; margin-top: 10px; }
.fd-panel .bignum { font-size: 46px; margin: 12px 0 4px; }
.block { margin-top: 22px; }
.block h2 { font-size: 17px; margin: 0 2px 10px; }
.block .say { background: var(--card); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); font-size: 15px; color: var(--ink-2); display: grid; gap: 6px; }
.ways { display: grid; gap: 8px; }
.way { width: 100%; text-align: left; border: 0; background: var(--card); border-radius: var(--r-sm); padding: 14px 16px; box-shadow: var(--shadow); display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; min-height: 64px; }
.way .wt { font-size: 15px; line-height: 1.45; }
.way .wt b { font-family: var(--font-num); font-size: 17px; }
.way .wn { font-size: 13px; color: var(--muted); grid-column: 1; }
.way .wl { font-size: 13px; color: var(--muted); font-weight: 600; grid-column: 1; }
.way .wb { font-family: var(--font-num); font-size: 22px; font-weight: 700; letter-spacing: -0.02em; grid-column: 1; line-height: 1.2; }
.way .go { grid-row: 1 / span 3; grid-column: 2; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; }
.way .go svg { width: 16px; height: 16px; }
.way.static { cursor: default; }
.qcard { background: var(--card); border-radius: var(--r); padding: 18px 16px 16px; box-shadow: var(--shadow); }
.qcard .qp { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--muted); font-weight: 600; }
.qdots { display: flex; gap: 4px; }
.qdots i { width: 18px; height: 4px; border-radius: 2px; background: var(--surface-2); }
.qdots i.on { background: var(--ink); }
.qcard .qt { font-size: 19px; font-weight: 600; line-height: 1.45; margin: 12px 0 16px; min-height: 2.9em; }
.ans { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.ans button { min-height: 52px; border-radius: 14px; border: 0; background: var(--surface); font-size: 16px; font-weight: 700; }
.ans button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.qnav { display: flex; justify-content: space-between; margin-top: 6px; }
.points { display: grid; gap: 10px; }
.point { background: var(--card); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); display: grid; gap: 10px; }
.point .pt { font-weight: 700; font-size: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.point .pd { font-size: 14px; color: var(--muted); line-height: 1.5; margin-top: -6px; }
.point .ptag { font-size: 14px; line-height: 1.5; background: var(--surface); border-radius: 12px; padding: 10px 12px; }
.point .ptag b { font-family: var(--font-num); font-size: 16px; }
.unsure { font-size: 11px; font-weight: 700; border-radius: 8px; padding: 1px 7px; background: var(--surface-2); color: var(--ink-2); }
.tools { display: grid; gap: 6px; }
.tools .tl { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: 0.02em; }
.tool { width: 100%; text-align: left; border: 0; border-radius: 14px; background: var(--surface); padding: 12px 14px; display: grid; grid-template-columns: 1fr 18px; gap: 2px 10px; align-items: center; min-height: 56px; }
.tool .tn { font-weight: 700; font-size: 14px; }
.tool .ts { font-size: 13px; color: var(--muted); grid-column: 1; line-height: 1.4; }
.tool svg { grid-row: 1 / span 2; grid-column: 2; width: 18px; height: 18px; }
.sbtn { min-height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: var(--ink); color: var(--bg); font-weight: 700; font-size: 14px; justify-self: start; display: inline-flex; align-items: center; gap: 6px; }
.sbtn svg { width: 16px; height: 16px; }
.sbtn.light { background: var(--surface-2); color: var(--ink); }

/* ---------- lab ---------- */
.lab-top { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 60px); z-index: 15; padding-bottom: 8px; background: var(--bg); }
.lab-panel { padding: 14px 16px 12px; border-radius: 24px; }
.lab-panel .row1 { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.lab-panel .k { font-size: 13px; color: var(--panel-muted); font-weight: 600; }
.lab-panel .bignum { font-size: 40px; margin: 2px 0 0; }
.lab-panel .bignum .u { font-size: 16px; }
.lab-panel .was { font-size: 13px; color: var(--panel-muted); }
.lab-panel .stats { margin-top: 10px; padding-top: 8px; }
.lab-panel .stat .k { line-height: 1.25; }
.lab-panel .stat .v { font-size: 18px; }
.chg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chg span { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--panel-line); }
.chg span b { font-weight: 700; }
.lgroup { margin-top: 18px; }
.lgroup h2 { font-size: 13px; letter-spacing: 0.04em; color: var(--muted); margin: 0 4px 8px; font-weight: 700; }
.lrows { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.lrow { padding: 14px 16px 12px; border-top: 1px solid var(--line); }
.lrow:first-child { border-top: 0; }
.lrow.changed { background: linear-gradient(to right, var(--ink) 0 3px, transparent 3px); }
.lr-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.lr-name { font-size: 15px; font-weight: 600; min-width: 0; }
.lr-val { display: flex; align-items: baseline; gap: 4px; }
.lr-val input { border: 0; background: transparent; font-family: var(--font-num); font-size: 22px; font-weight: 700; text-align: right; width: auto; padding: 0; outline: none; min-height: 44px; border-bottom: 1.5px dashed transparent; }
.lr-val input:focus { border-bottom-color: var(--ink); }
.lr-val .u { font-size: 13px; color: var(--muted); white-space: nowrap; }
.lr-was { font-size: 12px; color: var(--muted); text-align: right; min-height: 18px; }
.lr-ctl { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; gap: 8px; align-items: center; margin-top: 2px; }
.stp { width: 44px; height: 44px; border-radius: 22px; border: 0; background: var(--surface); font-family: var(--font-num); font-size: 22px; font-weight: 500; line-height: 1; display: flex; align-items: center; justify-content: center; }
.sl { position: relative; height: 44px; display: flex; align-items: center; }
.sl .orig { position: absolute; top: 12px; bottom: 12px; width: 2px; background: var(--ghost); transform: translateX(-1px); pointer-events: none; border-radius: 1px; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; background: transparent; margin: 0; position: relative; z-index: 1; }
input[type="range"]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--surface-2); }
input[type="range"]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--surface-2); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 14px; background: var(--ink); border: 4px solid var(--card); box-shadow: 0 0 0 1px var(--ink), 0 2px 6px rgba(0, 0, 0, .2); margin-top: -11px; }
input[type="range"]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 11px; background: var(--ink); border: 4px solid var(--card); box-shadow: 0 0 0 1px var(--ink); }
.lr-ins { margin-top: 6px; font-size: 14px; line-height: 1.45; color: var(--ink-2); background: var(--surface); border-radius: 12px; padding: 9px 12px; }
.lr-ins b { font-family: var(--font-num); color: var(--ink); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--foot-h) + 18px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--ink); color: var(--bg);
  padding: 12px 18px; border-radius: 18px; font-size: 14px; max-width: calc(100% - 32px); text-align: center; box-shadow: var(--lift); }

.screen { animation: enter 0.28s cubic-bezier(.2, .8, .2, 1); }
@keyframes enter { from { opacity: 0.4; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (min-width: 720px) { .bignum { font-size: 72px; } .start-hero h1 { font-size: 36px; } }
@media (max-width: 360px) { .bignum { font-size: 50px; } .stat .v { font-size: 19px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- ขั้นต่อไป: หาจุดที่ควรเช็ก ---------- */
.next { background: var(--card); border-radius: var(--r); padding: 18px 16px 16px; display: grid; gap: 6px; }
.next .nx-k { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: var(--muted); }
.next h3 { margin: 0; font-size: 19px; line-height: 1.4; }
.next p { margin: 0 0 8px; font-size: 14px; color: var(--muted); }
.next .nx-sub { display: flex; justify-content: center; }
.ask-why { margin-top: 22px; background: var(--card); border-radius: var(--r); padding: 12px 16px; display: grid; gap: 2px; }
.ask-why span { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: 0.02em; }
.ask-why b { font-size: 15px; }
.ask-q { font-size: 26px; line-height: 1.4; margin: 26px 2px 22px; text-wrap: balance; min-height: 2.8em; }
.ask-ans { display: grid; gap: 10px; }
.ask-ans button { min-height: 64px; border-radius: 999px; border: 0; background: var(--card); font-size: 19px; font-weight: 700; }
.ask-ans button[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: none; }
.pt-from { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: 0.02em; }
.pp-t { font-size: 26px; font-weight: 700; line-height: 1.3; margin: 6px 0 6px; }
.block > .tools .tool { background: var(--card); box-shadow: var(--shadow); }
.pbtn { min-height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid var(--panel-line); background: transparent; color: var(--panel-ink); font-weight: 700; font-size: 14px; }

/* ปุ่มกลับหน้ารวม Business Lab (ท้ายภาพรวม เมื่อเปิดผ่านหน้ารวม) */
.hub-back { margin-top: 20px; text-decoration: none; }

/* ---------- ช่องที่ยังขาด (กดถัดไปตอนยังไม่ครบ) ---------- */
@keyframes need { 0%, 100% { box-shadow: 0 0 0 2px var(--ink); } 40% { box-shadow: 0 0 0 4px var(--ink); } }
.field.need { border-radius: 16px; padding: 8px 10px 10px; margin: -8px -10px -10px; box-shadow: 0 0 0 2px var(--ink); animation: need 0.9s ease-out 1; }
.need-msg { margin: 0 2px; font-size: 14px; font-weight: 700; color: var(--ink); display: flex; gap: 6px; align-items: center; }
.need-msg::before { content: "!"; display: inline-flex; width: 18px; height: 18px; border-radius: 9px; background: var(--ink); color: var(--bg); font-size: 12px; align-items: center; justify-content: center; flex: none; }
@media (prefers-reduced-motion: reduce) { .field.need { animation: none; } }
.chips.quick { margin-bottom: 2px; }
.chips.quick .chip { min-height: 44px; font-size: 15px; padding: 0 16px; }
.unk-hint { margin: 0 2px; font-size: 13px; color: var(--muted); }

/* ---------- รายละเอียดเพิ่ม: ตอบ มี / ไม่มี แล้วเลือกกลุ่ม ---------- */
.adv-mode .seg { display: grid; grid-template-columns: 1fr; width: 100%; border-radius: var(--r); }
.adv-mode .seg button { min-height: 52px; text-align: left; padding: 0 18px; border-radius: 18px; }
.adv-hint { margin: 14px 2px 0; }
.adv-tg { width: 100%; min-height: 60px; border: 0; background: transparent; display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left; font-weight: 700; font-size: 16px; color: var(--ink); padding: 0; }
.adv-tg small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
.adv-tg .tg { flex: none; width: 24px; height: 24px; border-radius: 7px; box-shadow: inset 0 0 0 2px var(--line); position: relative; }
.adv-tg[aria-pressed="true"] .tg { background: var(--ink); box-shadow: none; }
.adv-tg[aria-pressed="true"] .tg::after { content: ""; position: absolute; left: 8px; top: 4px; width: 6px; height: 11px; border: solid var(--bg); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); }
.adv-block.on { box-shadow: var(--shadow), inset 0 0 0 1.5px var(--ink); }

/* ---------- มินิมอล: ปุ่ม "?" เปิดคำอธิบายที่ซ่อนไว้ (data-act="qm" สลับ hidden ของ [data-qmt]) ---------- */
.qm { flex: none; width: 44px; height: 44px; margin: -10px -10px -10px 0; border: 0; background: transparent; padding: 0; display: inline-flex; align-items: center; justify-content: center; color: var(--ink); }
.qm i { width: 28px; height: 28px; border-radius: 14px; background: var(--card); display: flex; align-items: center; justify-content: center; }
.qm svg { width: 16px; height: 16px; stroke-width: 2.4; }
.qm[aria-expanded="true"] i { background: var(--ink); color: var(--bg); }
.qm-tx { margin: 8px 0 0; padding: 12px 14px; border-radius: 16px; background: var(--card); font-size: 14px; line-height: 1.6; color: var(--ink-2); }
.qm-tx b { font-family: var(--font-num); color: var(--ink); }
:is(.card, .receipt, .next, .point, .piv, .ovt, .tcard, .lrows, .rv-row, .plan-row, .ok-box, .ask-why) :is(.qm i, .qm-tx) { background: var(--surface); }
:is(.card, .receipt, .next, .point, .piv, .ovt, .tcard, .plan-row, .ok-box) .qm[aria-expanded="true"] i { background: var(--ink); }
.panel .qm { color: var(--panel-ink); }
.panel .qm i { background: var(--panel-line); }
.panel .qm[aria-expanded="true"] i { background: var(--panel-ink); color: var(--panel); }
.panel .qm-tx { background: transparent; padding: 0; margin-top: 6px; color: var(--panel-muted); }
.panel .qm-tx b { color: var(--panel-ink); }
.hq { display: flex; align-items: center; gap: 8px; }
.hq > :first-child { flex: 1; min-width: 0; }
.field > .hq > label, .field > .hq > .lab { font-weight: 600; font-size: 15px; }
.field .qm-tx { margin-top: 0; font-size: 13px; }

/* ---------- ภาพรวมร้าน: การ์ด 2 ช่อง ตัวเลขใหญ่ 1 ตัว + วงแหวนหรือแถบ ---------- */
.ovg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.ovt { min-width: 0; text-align: left; border: 0; background: var(--card); border-radius: var(--r); padding: 16px; min-height: 164px; display: flex; flex-direction: column; gap: 8px; color: var(--ink); }
button.ovt[aria-expanded="true"] { box-shadow: inset 0 0 0 2px var(--ink); }
.ovt .k { font-size: 13px; color: var(--muted); line-height: 1.4; display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
.ovt .k svg { width: 16px; height: 16px; flex: none; margin-top: 1px; transition: transform 0.2s; }
button.ovt[aria-expanded="true"] .k svg { transform: rotate(180deg); }
.ovt .v { font-family: var(--font-num); font-weight: 600; font-size: 30px; letter-spacing: -0.02em; line-height: 1.1; overflow-wrap: anywhere; }
.ovt .v small { font-family: var(--font-th); font-size: 13px; font-weight: 600; letter-spacing: 0; margin-left: 4px; }
.ovt .n { font-size: 12.5px; color: var(--ink-2); line-height: 1.45; margin-top: auto; }
.ovt .n.mu { color: var(--muted); }
.mg { position: relative; height: 8px; border-radius: 4px; background: var(--surface-2); margin-top: auto; }
.mg .f { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--ink); }
.mg .m { position: absolute; top: -4px; width: 3px; height: 16px; border-radius: 2px; background: var(--card); box-shadow: 0 0 0 1.5px var(--ink); transform: translateX(-1.5px); }
.ring { position: relative; width: 72px; height: 72px; flex: none; }
.ring svg { width: 72px; height: 72px; transform: rotate(-90deg); display: block; }
.ring circle { fill: none; stroke-width: 7; }
.ring .rt { stroke: var(--surface-2); }
.ring .rv { stroke: var(--ink); stroke-linecap: round; }
.ring b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-num); font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
.spark { display: block; width: 100%; height: 44px; margin-top: auto; overflow: visible; }
.spark path { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.spark .z { stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 3 3; }
.ovd { margin-top: 10px; }
.ovd .lead { margin: 0; }
.card .hq h3 { flex: 1; }

/* ---------- แผนธุรกิจ (แถวเดียว) ---------- */
.plan-row { margin-top: 12px; background: var(--card); border-radius: var(--r); padding: 6px 6px 6px 16px; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; }
.plan-row > b { font-size: 15px; }
.plan-row .pill { background: var(--surface); }
.plan-row .sp { flex: 1; }
.plan-row .go { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 0; background: var(--surface); font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; color: var(--ink); }
.plan-row .go svg { width: 16px; height: 16px; }
.plan-row .qm { margin: 0; }
.plan-row .qm-tx { flex-basis: 100%; margin: 2px 10px 10px 0; background: var(--surface); }

/* ---------- เครื่องมือ: ชื่ออย่างเดียว · แตะ "?" ของกลุ่มเพื่อดูว่าแต่ละตัวช่วยอะไร ---------- */
.tools .tl-r { display: flex; align-items: center; gap: 6px; }
.tools .tl-r .tl { flex: 1; }
.tools .tl-r .qm { margin: -10px -6px -10px 0; }
.mg + .n { margin-top: 0; }
.nw { white-space: nowrap; }
.start-hero .hq { align-items: flex-start; }
.start-hero .hq .qm { margin-top: -6px; }

.rank .rl .rh { display: block; font-size: 12.5px; font-weight: 400; color: var(--muted); }
.rc-foot { margin-top: 4px; font-size: 12px; color: var(--muted); }
.ovg .ovd { grid-column: 1 / -1; margin-top: 0; }
.ovt.wide { grid-column: 1 / -1; min-height: 0; flex-direction: row; align-items: center; gap: 16px; }
.ovt.wide .n { margin-top: 0; }
.panel :focus-visible, .ln-b :focus-visible { outline-color: var(--panel-ink); }

}

   ENGINE — ทุกตัวเลขคำนวณผ่าน JaruaCalc.calculateV4 (ตัวคำนวณของ PL2) ไม่มีสูตรกำไรของตัวเอง
   ส่วนที่คิดเพิ่มใน Lab: แปลงผลเป็นภาษาของร้าน · หาเรื่องที่ตัวเลขบอก · ขนาดเป็นเงิน

var TH_MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
var NOW = new Date();
var START_MONTH = NOW.getMonth() + 1;
var START_YEAR = NOW.getFullYear();

function num(v) {
  if (v === null || v === undefined || v === '') return null;
  var n = typeof v === 'number' ? v : parseFloat(String(v).replace(/[,\s]/g, ''));
  return isFinite(n) ? n : null;
}
function n0(v) { var n = num(v); return n === null ? 0 : n; }
function pos(v) { var n = num(v); return n !== null && n > 0 ? n : null; }
function hasSeason(i) { return !!(i.season && ((i.season.high && i.season.high.length) || (i.season.low && i.season.low.length))); }

/* เดือนที่ t ของแผน (1 = เดือนนี้) → ป้ายเดือนไทย */
function calOf(t) { return ((START_MONTH - 1 + t - 1) % 12 + 12) % 12 + 1; }
function yearOf(t) { return START_YEAR + Math.floor((START_MONTH - 1 + t - 1) / 12); }
function monthLabel(t, withYear) {
  var c = calOf(t);
  return TH_MONTHS[c - 1] + (withYear ? ' ' + String((yearOf(t) + 543) % 100).padStart(2, '0') : '');
}

function daysOf(inp) { return inp.volumePer === 'month' ? 30 : (pos(inp.daysOpen) || 30); }
function volMonthly(inp) {
  var v = num(inp.volume);
  if (v === null) return null;
  return inp.volumePer === 'month' ? v : v * daysOf(inp);
}
function fixedParts(inp) {
  return {
    staff: n0(inp.staffCount) * n0(inp.staffSalary),
    owner: n0(inp.ownerSalary),
    rent: n0(inp.rent),
    marketing: n0(inp.marketing),
    other: n0(inp.otherFixed)
  };
}
function fixedTotal(inp) { var p = fixedParts(inp); return p.staff + p.owner + p.rent + p.marketing + p.other; }

function missingFields(inp, model) {
  var miss = [];
  FIELDS.forEach(function (f) {
    if (!f.req) return;
    if (f.models && f.models.indexOf(model) < 0) return;
    if (f.show && !f.show(inp, model)) return;
    var v = f.k === 'volume' ? num(inp.volume) : num(inp[f.k]);
    if (v === null) miss.push(f.label(inp, model));
  });
  return miss;
}

function buildStream(inp, m) {
  var base = { id: 'main', name: 'รายได้หลัก', type: m, unitLabel: U(inp, m),
    growthRatePercentMonthly: num(inp.growth), creditDays: n0(inp.creditDays) };
  if (isVolModel(m)) {
    var days = daysOf(inp);
    var cap = pos(inp.capacity);
    var capPerDay = cap === null ? null : (inp.volumePer === 'month' ? cap / days : cap);
    var capMonth = cap === null ? null : (inp.volumePer === 'month' ? cap : cap * days);
    return Object.assign(base, {
      price: pos(inp.price), costPerUnit: num(inp.unitCost), unitsPerMonth: volMonthly(inp),
      variableCostPercent: n0(inp.feePct),
      productionType: m === 'resell' ? 'buys_to_resell' : 'makes_own',
      capacity: m === 'resell' ? { sourcedPerMonth: capMonth } : { producedPerDay: capPerDay },
      inventoryDays: n0(inp.stockDays), supplierCreditDays: n0(inp.supplierCreditDays),
      purchasesPerCustomerPerMonth: num(inp.repeatPerMonth), customerLifespanMonths: num(inp.lifespanMonths)
    });
  }
  if (m === 'subscription') return Object.assign(base, {
    unitLabel: 'คน', activeMembers: n0(inp.members), feePerCycle: n0(inp.fee), cycleMonths: pos(inp.cycle) || 1,
    newMembersPerMonth: n0(inp.newMembers), leavingMembersPerMonth: n0(inp.leaving), costPerMemberPerMonth: n0(inp.costPerMember),
    maxMembers: pos(inp.maxMembers), joinFee: n0(inp.joinFee), variableCostPercent: n0(inp.feePct), growthRatePercentMonthly: 0
  });
  if (m === 'project') return Object.assign(base, {
    unitLabel: 'งาน', avgProjectValue: n0(inp.projectValue), projectsPerYear: n0(inp.projectsPerYear),
    durationMonths: Math.max(1, n0(inp.durationMonths)), directCostPercent: n0(inp.directCostPct), depositPercent: n0(inp.depositPct),
    maxConcurrentProjects: pos(inp.maxConcurrent)
  });
  if (m === 'rental') return Object.assign(base, {
    rentableUnits: n0(inp.rentableUnits), pricePerPeriod: n0(inp.pricePerPeriod), periodsPerMonth: inp.periodKind === 'month' ? 1 : 30,
    occupancyPercent: n0(inp.occupancy), costPerOccupiedPeriod: n0(inp.costPerOccupied), avgPeriodsPerStay: pos(inp.avgStay),
    costPerStay: n0(inp.costPerStay), variableCostPercent: n0(inp.feePct)
  });
  if (m === 'commission') return Object.assign(base, {
    unitLabel: 'ดีล', dealsPerMonth: n0(inp.dealsPerMonth), avgDealValue: n0(inp.avgDealValue), commissionPercent: n0(inp.commissionPct),
    splitPercent: n0(inp.splitPct), maxDealsPerMonth: pos(inp.maxDeals)
  });
  return Object.assign(base, { unitLabel: 'บาท', amountPerMonth: n0(inp.amount), variableCostPercent: n0(inp.costPct) });
}

function seasonOf(inp) {
  if (!hasSeason(inp)) return null;
  return { highMonths: inp.season.high || [], lowMonths: inp.season.low || [],
    highPercent: n0(inp.season.highPct), lowPercent: n0(inp.season.lowPct) };
}

function v4Input(inp, m) {
  var assets = pos(inp.equipValue) && pos(inp.equipYears)
    ? [{ name: 'อุปกรณ์', purchasePrice: pos(inp.equipValue), usefulLifeYears: pos(inp.equipYears) }] : null;
  return {
    streams: [buildStream(inp, m)],
    fixedCostsMonthly: fixedTotal(inp),
    cashOnHand: num(inp.cash),
    daysOpenPerMonth: isVolModel(m) ? daysOf(inp) : null,
    planStartMonth: START_MONTH,
    seasonality: seasonOf(inp),
    marketingSpendMonthly: n0(inp.marketing),
    newCustomersPerMonth: m === 'subscription' ? num(inp.newMembers) : num(inp.newCustomers),
    assets: assets
  };
}

/* ---------- ปริมาณในภาษาของแต่ละรูปแบบ ---------- */
function volValue(inp, m) {
  if (isVolModel(m)) return num(inp.volume);
  return num(inp[ROLE[m].vol]);
}
function volUnitText(inp, m) {
  if (isVolModel(m)) return U(inp, m) + '/' + perWord(inp);
  return { subscription: 'คน', project: 'งาน/ปี', rental: '%', commission: 'ดีล/เดือน', other: 'บาท/เดือน' }[m];
}
function scaleVol(inp, m, f) {
  var o = Object.assign({}, inp);
  if (isVolModel(m)) o.volume = n0(inp.volume) * f;
  else if (m === 'subscription') { o.members = n0(inp.members) * f; o.newMembers = n0(inp.newMembers) * f; o.leaving = n0(inp.leaving) * f; }
  else o[ROLE[m].vol] = n0(inp[ROLE[m].vol]) * f;
  return o;
}

/* ---------- compute: เรียก v4 แล้วสรุปเป็นภาพของร้าน ---------- */
function compute(inp, m) {
  var miss = missingFields(inp, m);
  if (miss.length) return { ok: false, missing: miss };
  var r;
  try { r = JaruaCalc.calculateV4(v4Input(inp, m)); } catch (e) { return { ok: false, missing: [], error: String(e) }; }
  if (r.netProfitMonthly === null || r.revenueMonthly === null) return { ok: false, missing: [], r: r };

  var S = { ok: true, r: r, m: m };
  S.revenue = r.revenueMonthly;
  S.varCost = r.variableCostMonthly;
  S.contribution = S.revenue - S.varCost;
  S.fixed = r.fixedCostsMonthly;
  S.dep = r.depreciation.monthlyTotal;
  S.profit = r.netProfitMonthly;
  S.owner = n0(inp.ownerSalary);
  S.parts = fixedParts(inp);
  S.vol = volValue(inp, m);
  S.volMonth = isVolModel(m) ? volMonthly(inp) : null;
  S.days = isVolModel(m) ? daysOf(inp) : 30;

  /* จุดคุ้มทุน */
  S.be = null;
  if (r.breakeven.contributionNotPositive || S.contribution <= 0) {

        money: -S20.profit, unit: 'month', moneyText: fmtN(-S20.profit) + ' บาท/เดือน',
        moneyCap: 'ขาดทุนต่อเดือน ถ้า' + (m === 'rental' ? 'คนเช่า' : 'ยอดขาย') + 'ลดลง 20% (เช่น เดือนที่ขายไม่ดี)',
        ev: ['ตอนนี้กำไรเดือนละ ' + fmtN(P) + ' บาท ' + (S.be.safety !== null ? ({ rental: 'คนเช่า', subscription: 'สมาชิก' }[m] || 'ยอดขาย') + 'ลดได้อีกแค่ ' + fmtPct(S.be.safety * 100) + ' ก่อนเริ่มขาดทุน' : '')],
        ways: waysTo(-S20.profit, S20, scaleVol(inp, m, 0.8), m, 0.8), waysTitle: 'ตัวเลขที่ทำให้ยอดตก 20% แล้วยังไม่ขาดทุน',
        q: QSETS.gap[m] });
    }
  }

  /* ยอดลดลงเรื่อยๆ / สมาชิกลดลง */
  if (S.cash.length === 12) {
    var rev1 = S.revenue, rev12 = S.cash[11].rev;
    var drop = S.profit - S.profit12;
    var declining = rev12 < rev1 * 0.95 && drop > 0 && !(hasSeason(inp) && n0(inp.growth) >= 0 && m !== 'subscription');
    if (m === 'subscription') declining = n0(inp.leaving) > n0(inp.newMembers) && drop > 0;
    if (declining) {
      var ev2 = m === 'subscription'
        ? ['สมาชิกเลิกเดือนละ ' + fmtN(n0(inp.leaving)) + ' คน แต่สมัครใหม่ ' + fmtN(n0(inp.newMembers)) + ' คน อีก 12 เดือนกำไรจะเหลือเดือนละ ' + fmtN(S.profit12) + ' บาท']
        : ['ยอดขายลดลงเดือนละ ' + fmtPct(-n0(inp.growth)) + ' อีก 12 เดือนกำไรจะเหลือเดือนละ ' + fmtN(S.profit12) + ' บาท'];
      if (m === 'subscription' && n0(inp.leaving) > 0) {
        var churn = n0(inp.leaving) / Math.max(1, n0(inp.members));
        ev2.push('ถ้าตัวเลขยังเป็นแบบนี้ สมาชิกจะลดลงไปนิ่งที่ราว ' + fmtN(n0(inp.newMembers) / churn) + ' คน');
      }
      F.push({ id: 'decline', lv: S.profit12 < 0 ? 'high' : 'mid', title: m === 'subscription' ? 'สมาชิกลดลงทุกเดือน' : 'ยอดขายลดลงเรื่อยๆ',
        money: drop, unit: 'month', moneyText: fmtN(drop) + ' บาท/เดือน', moneyCap: 'กำไรต่อเดือนที่จะหายไปภายใน 12 เดือน',
        ev: ev2, q: QSETS.decline[m] });
    }
  }

  /* ใกล้เต็มกำลัง */
  if (S.util && S.util.pct >= 90) {
    /* ปริมาณตอนนี้ในหน่วยเดียวกับเพดาน → กำไรที่ยังเพิ่มได้ = ที่ว่างที่เหลือ × กำไรต่อหน่วยของเพดาน */
    var curU = S.util.rental ? n0(inp.occupancy) : (S.util.conc || S.vol);
    var room = Math.max(0, S.util.max - curU);
    var headroom = curU > 0 && S.contribution > 0 ? room * S.contribution / curU : 0;
    var roomUnit = m === 'project' ? 'งานพร้อมกัน' : volUnitText(inp, m);
    F.push({ id: 'capacity', lv: 'watch', title: S.util.rental ? 'เกือบเต็มทุก' + periodWord(inp) + 'แล้ว' : 'ร้านใกล้เต็มกำลังรองรับแล้ว',
      money: headroom, unit: 'month', moneyText: fmtN(headroom) + ' บาท/เดือน', moneyCap: 'กำไรที่เพิ่มได้อีกไม่เกินนี้ ถ้ายังรับได้เท่าเดิม',
      ev: [S.util.rental ? 'มีคนเช่า ' + fmtPct(S.util.pct) + ' เหลือที่ว่างอีก ' + fmtPct(100 - S.util.pct)
        : 'ใช้กำลังไปแล้ว ' + fmtPct(S.util.pct) + ' รับเพิ่มได้อีก ' + fmtN(room, 1) + ' ' + roomUnit],
      q: QSETS.capacity.all });
  } else if (S.util && S.util.reachT) {
    var lost = 0;
    if (isVolModel(m) && S.r.projectionIfCapacityUnchanged) {
      S.r.projection.forEach(function (p, i) { lost += p.netCashFlow - S.r.projectionIfCapacityUnchanged[i].netCashFlow; });
    } else if (m === 'subscription') {
      var S4 = compute(withK(inp, 'maxMembers', null), m);
      if (S4.ok) S4.cash.forEach(function (c, i) { lost += c.net - S.cash[i].net; });
    }
    if (lost > 0) F.push({ id: 'capacity', lv: 'mid', title: 'ร้านจะเต็มกำลังรองรับภายใน 12 เดือน',
      money: lost / 12, unit: 'year', moneyText: fmtN(lost) + ' บาท', moneyCap: 'กำไรที่อาจพลาดไปใน 12 เดือน',
      ev: ['ถ้ายอดโตตามตัวเลขนี้ จะเต็มกำลังในเดือน ' + monthLabel(S.util.reachT, true)], q: QSETS.capacity.all });
  }

  /* ค่าหาลูกค้าใหม่แพงกว่ากำไรจากลูกค้าคนนั้น */
  if (S.cust && S.cust.ratio !== null && S.cust.ratio < 1 && S.cust.cac > 0 && S.cust.newPerMonth > 0) {
    var lossPer = S.cust.cac - S.cust.ltvProfit;
    F.push({ id: 'cac', lv: 'mid', title: 'ค่าหาลูกค้าใหม่แพงกว่ากำไรที่ได้จากลูกค้าคนนั้น',
      money: lossPer * S.cust.newPerMonth, unit: 'month', moneyText: fmtN(lossPer * S.cust.newPerMonth) + ' บาท/เดือน',
      moneyCap: 'เงินที่จ่ายเกินกำไรที่ลูกค้าใหม่สร้างให้ ทุกเดือน',
      ev: ['ได้ลูกค้าใหม่ 1 คน ใช้เงินการตลาด ' + fmtN(S.cust.cac) + ' บาท แต่ลูกค้าคนนั้นสร้างกำไรให้ ' + fmtN(S.cust.ltvProfit) + ' บาท ตลอดที่ซื้อกับคุณ'],
      q: QSETS.cac.all });
  }

  /* เงินสำรองบาง: เงินในมือช่วงต่ำสุด < ค่าใช้จ่ายคงที่ 1 เดือน */
  if (S.hasCash && S.lowest !== null && S.lowest >= 0 && S.lowest < S.fixed) {
    F.push({ id: 'thincash', lv: 'watch', title: 'เงินสำรองไม่พอจ่าย 1 เดือน',
      money: S.fixed - S.lowest, unit: 'once', moneyText: fmtN(S.fixed - S.lowest) + ' บาท',
      moneyCap: 'เงินที่ยังขาด ถึงจะมีเงินสำรองเท่าค่าใช้จ่ายคงที่ 1 เดือน (' + fmtN(S.fixed) + ' บาท)',
      ev: ['เงินในมือช่วงต่ำสุดเหลือ ' + fmtN(S.lowest) + ' บาท (' + monthLabel(S.lowestT, true) + ') ถ้าเดือนไหนขายไม่ได้ จะไม่พอจ่ายค่าใช้จ่ายคงที่'],
      q: QSETS.cash.all });
  }

  /* ยังไม่ได้ใส่เงินสด ทั้งที่เงินไหลออก */
  if (!S.hasCash && S.cash.some(function (c) { return c.net < 0; })) {
    F.push({ id: 'nocash', lv: 'note', title: 'ยังไม่รู้ว่าเงินพอใช้ถึงเดือนไหน', money: 0, unit: 'none',
      ev: ['มีเดือนที่เงินออกมากกว่าเงินเข้า ใส่เงินสดที่มีตอนนี้ เพื่อดูว่าเงินพอใช้ถึงเดือนไหน'], q: [] , editField: 'cash' });
  }

  /* ยังไม่นับเงินเดือนตัวเอง */
  if (S.owner === 0) {
    F.push({ id: 'nosalary', lv: 'note', title: 'กำไรนี้ยังไม่ได้หักเงินเดือนคุณ', money: 0, unit: 'none',
      ev: ['กำไร ' + fmtN(P) + ' บาทที่เห็น รวมค่าแรงของคุณไว้ด้วย ลองใส่เงินเดือนที่คุณควรได้ในส่วนทดลอง เพื่อดูกำไรจริงของร้าน'],
      q: [], tryLever: 'ownerSalary' });
  }

  F.forEach(function (f) {
    f.qs = (f.q || []).filter(function (id) { var b = QBANK[id]; return b && (!b.when || b.when(inp, m)); })
      .filter(function (id, i, a) { return a.indexOf(id) === i; }).slice(0, 5);
  });
  /* เรียง: เงินจะหมดก่อน → ระดับ → เงินต่อเดือน (เงินก้อนเดียวเทียบเป็นต่อเดือนไม่ได้ จึงเรียงตามระดับก่อน) */
  F.sort(function (a, b) {
    if (!!b.urgent !== !!a.urgent) return a.urgent ? -1 : 1;
    if (LV_ORDER[a.lv] !== LV_ORDER[b.lv]) return LV_ORDER[a.lv] - LV_ORDER[b.lv];
    return (b.unit === 'none' ? 0 : b.money) - (a.unit === 'none' ? 0 : a.money);
  });
  return F;
}

function waysNeg(S, inp, m) {
  var R = ROLE[m];
  var ways = [];
  /* หาค่าที่ทำให้เงินที่เหลือหลังต้นทุนผันแปรเริ่มเป็นบวก (เป็นเส้นตรง จึงใช้ 2 จุด) แล้วยืนยันด้วยการคำนวณจริง */
  function solve(k, dir) {
    var st = leverStep(k, inp, m), cur = n0(inp[k]);
    var S1 = compute(withK(inp, k, cur + st), m);
    if (!S1.ok) return null;
    var slope = (S1.contribution - S.contribution) / st;
    if ((dir > 0 && slope <= 0) || (dir < 0 && slope >= 0)) return null;
    var x = Math.round((cur - S.contribution / slope) * 1e6) / 1e6;
    x = dir > 0 ? Math.floor(x / st + 1) * st : Math.ceil(x / st - 1) * st;
    if (x < 0) return null;
    var S2 = compute(withK(inp, k, x), m);
    return S2.ok && S2.contribution > 0 ? x : null;
  }
  if (R.price) {
    var p = solve(R.price, 1);
    if (p !== null) ways.push({ text: priceVerb(m).replace('เป็น', '') + 'ต้องไม่ต่ำกว่า <b>' + fmtN(p) + '</b>' + (leverUnit(R.price, inp, m) === '%' ? '%' : ' บาท') + ' (ตอนนี้ ' + fmtN(n0(inp[R.price])) + ')', lever: R.price, value: p,
      label: priceVerb(m).replace('เป็น', '') + 'ต้องไม่ต่ำกว่า', big: fmtN(p) + (leverUnit(R.price, inp, m) === '%' ? '%' : ' บาท'), note: 'ตอนนี้ ' + fmtN(n0(inp[R.price])) });
  }
  if (R.cost) {
    var c = solve(R.cost, -1);
    var cname = { unit: 'ต้นทุนต่อ' + U(inp, m), service: 'ต้นทุนต่อ' + U(inp, m), resell: 'ราคาที่ซื้อมาต่อ' + U(inp, m), subscription: 'ต้นทุนต่อสมาชิก',
      project: 'ต้นทุนของแต่ละงาน', rental: 'ค่าใช้จ่ายต่อ' + periodWord(inp), commission: 'ส่วนแบ่งให้ทีม', other: 'ต้นทุน' }[m];
    var cunit = { project: '% ของมูลค่างาน', commission: '% ของค่าคอม', other: '% ของรายได้' }[m] || 'บาท';
    if (c !== null) ways.push({ text: cname + 'ต้องไม่เกิน <b>' + fmtN(c) + '</b>' + (cunit === 'บาท' ? ' บาท' : cunit) + ' (ตอนนี้ ' + fmtN(n0(inp[R.cost])) + ')', lever: R.cost, value: c,
      label: cname + 'ต้องไม่เกิน', big: fmtN(c) + (cunit === 'บาท' ? ' บาท' : cunit), note: 'ตอนนี้ ' + fmtN(n0(inp[R.cost])) });
  }
  if (n0(inp.feePct) > 0) {
    var f = solve('feePct', -1);
    if (f !== null) ways.push({ text: 'ค่าธรรมเนียมไม่เกิน <b>' + fmtN(f) + '%</b> ของยอดขาย (ตอนนี้ ' + fmtN(n0(inp.feePct)) + '%)', lever: 'feePct', value: f,
      label: 'ค่าธรรมเนียมต้องไม่เกิน', big: fmtN(f) + '% ของยอดขาย', note: 'ตอนนี้ ' + fmtN(n0(inp.feePct)) + '%' });
  }
  return ways;
}

/* ---------- ป้ายราคาของจุดที่ควรตรวจสอบ ---------- */
function pointTag(bankLever, S, inp, m) {
  if (!bankLever || !S.ok) return '';
  var k = roleKey(m, bankLever);
  if (!k) return '';
  var u = U(inp, m);
  var d, st;
  if (k === 'creditDays' || k === 'stockDays') {
    var cur = n0(inp[k]);
    if (cur <= 0) return '';
    var alt = withK(inp, k, Math.max(0, cur - 15));
    var S2 = compute(alt, m);
    if (!S2.ok) return '';
    d = S2.lowest - S.lowest;
    if (d < 1) return '';
    return (k === 'creditDays' ? 'ลูกค้าจ่ายเร็วขึ้น 15 วัน' : 'ของค้างสต็อกสั้นลง 15 วัน') + ' = เงินในมือช่วงต่ำสุดเพิ่มขึ้น <b>' + fmtN(d) + '</b> บาท';
  }
  if (k === 'rent' || k === 'otherFixed') {
    var v = n0(inp[k]);
    if (v <= 0 || S.revenue <= 0) return '';
    return (k === 'rent' ? 'ค่าเช่า' : 'ค่าใช้จ่ายอื่น') + ' ' + fmtN(v) + ' บาท/เดือน = <b>' + fmtN(v / S.revenue * 100, 1) + '</b> บาทจากทุก 100 บาทที่ลูกค้าจ่าย';
  }
  if (k === 'marketing') {
    var mk = n0(inp.marketing);
    if (mk <= 0 || S.contribution <= 0 || !S.vol) return '';
    var perVol = S.contribution / S.vol;
    return 'งบการตลาด ' + fmtN(mk) + ' บาท/เดือน ต้องพา' + volVerb(m).replace('ให้ได้', '') + 'เพิ่มอย่างน้อย <b>' + fmtN(mk / perVol, 1) + '</b> ' + volUnitText(inp, m) + ' ถึงจะคุ้มเงินที่จ่าย';
  }
  if (k === 'staffCount') {
    var sal = n0(inp.staffSalary);
    if (sal <= 0 || S.contribution <= 0 || !S.vol) return '';
    return 'พนักงาน 1 คน = ค่าใช้จ่าย ' + fmtN(sal) + ' บาท/เดือน = ต้อง' + volVerb(m) + 'เพิ่ม <b>' + fmtN(sal / (S.contribution / S.vol), 1) + '</b> ' + volUnitText(inp, m) + ' ถึงจะคุ้มค่าจ้าง';
  }
  if (k === 'leaving' || k === 'newMembers') {
    var S5 = compute(withK(inp, k, Math.max(0, n0(inp[k]) + (k === 'leaving' ? -1 : 1))), m);
    if (!S5.ok) return '';
    d = S5.profit12 - S.profit12;
    return (k === 'leaving' ? 'คนเลิกน้อยลงเดือนละ 1 คน' : 'สมาชิกใหม่เพิ่มเดือนละ 1 คน') + ' = อีก 12 เดือน กำไรเพิ่มเดือนละ <b>' + fmtN(d) + '</b> บาท';
  }
  var dir = (k === ROLE[m].cost || k === 'feePct') ? -1 : 1;
  st = leverStep(k, inp, m);
  if (k === 'occupancy') st = 5;
  if (dir < 0 && n0(inp[k]) < st) return '';
  d = leverEffect(k, inp, m, dir * st);
  if (d === null || Math.abs(d) < 0.5) return '';
  var stepTxt;
  var pctUnit = leverUnit(k, inp, m) === '%';
  if (k === 'volume') stepTxt = (m === 'service' ? 'ลูกค้าเพิ่ม' : 'ขายเพิ่ม') + (inp.volumePer === 'month' ? 'เดือนละ ' : 'วันละ ') + fmtN(st) + ' ' + u;
  else if (k === ROLE[m].price) stepTxt = 'ขึ้นราคาอีก ' + fmtN(st) + (pctUnit ? '%' : ' บาท') + ' โดยลูกค้าเท่าเดิม';
  else if (k === ROLE[m].cost) stepTxt = 'ต้นทุนลดลง ' + fmtN(st) + (pctUnit ? '%' : ' บาทต่อ' + u);
  else if (k === 'feePct') stepTxt = 'ค่าธรรมเนียมลดลง 1% ของยอดขาย';
  else if (k === 'occupancy') stepTxt = 'มีคนเช่าเพิ่ม 5%';
  else stepTxt = leverLabel(k, inp, m)[1] + ' +' + fmtN(st);
  return stepTxt + (d < -0.5 ? ' = กำไรลดลง <b>' + fmtN(-d) : ' = กำไรเพิ่ม <b>' + fmtN(d)) + '</b> บาท/เดือน';
}

/* ---------- คำอธิบายใต้ตัวเลขที่กำลังปรับ (เครื่องคิดเลขเล็กอยู่ตรงนี้) ---------- */
function leverInsight(k, base, trialInp, m, Sb, St) {
  if (!Sb.ok || !St.ok) return '';
  var u = U(base, m);
  var R = ROLE[m];
  var bv = n0(base[k]), tv = n0(trialInp[k]);
  if (k === R.price && R.price) {
    var F = St.fixed + St.dep;
    if (tv !== bv && St.contribution > 0) {
      var need = (Sb.profit + F) / St.contribution; /* ตัวคูณปริมาณที่ทำให้กำไรเท่าเดิม */
      var pct = (need - 1) * 100;
      var who = m === 'rental' ? 'คนเช่า' : m === 'subscription' ? 'สมาชิก' : 'ลูกค้า';
      if (tv > bv) {
        if (pct <= -100) return 'ขึ้นราคาเป็น ' + fmtN(tv) + ' แล้ว ' + who + 'หายไปเกือบหมดกำไรก็ยังเท่าเดิม';
        return 'ขึ้นราคาเป็น ' + fmtN(tv) + ' (' + fmtSignedPct((tv / bv - 1) * 100) + ') ' + who + 'ลดลงได้ถึง <b>' + fmtPct(-pct) + '</b> กำไรยังเท่าเดิม';
      }
      return 'ลดราคาเป็น ' + fmtN(tv) + ' (' + fmtSignedPct((tv / bv - 1) * 100) + ') ต้องขายเพิ่ม <b>' + fmtPct(pct) + '</b> ถึงจะได้กำไรเท่าเดิม';
    }
    if (tv < bv && St.contribution <= 0) return 'ราคานี้ขายเท่าไหร่ก็ขาดทุน เพราะต่ำกว่าต้นทุนที่เพิ่มตามยอดขาย';
    var e = leverEffect(k, trialInp, m, leverStep(k, base, m));
    return e !== null ? 'ขึ้นราคาทีละ ' + fmtN(leverStep(k, base, m)) + (R.price === 'commissionPct' ? '%' : ' บาท') + ' โดย' + (m === 'rental' ? 'คนเช่า' : 'ลูกค้า') + 'เท่าเดิม = กำไรเพิ่ม <b>' + fmtN(e) + '</b> บาท/เดือน' : '';
  }
  if (k === 'marketing') {
    var perVol = St.contribution > 0 && St.vol ? St.contribution / St.vol : null;
    if (!perVol) return '';
    if (tv !== bv) {
      var dv = (tv - bv) / perVol;
      if (tv > bv) return 'เพิ่มงบ ' + fmtN(tv - bv) + ' บาท ต้องพา' + (m === 'service' ? 'ลูกค้า' : 'ยอดขาย') + 'เพิ่มอย่างน้อย <b>' + fmtN(dv, 1) + '</b> ' + volUnitText(base, m) + ' ถึงจะคุ้ม';
      return 'ลดงบ ' + fmtN(bv - tv) + ' บาท ถ้ายอดหายไปไม่เกิน <b>' + fmtN(-dv, 1) + '</b> ' + volUnitText(base, m) + ' ยังได้กำไรมากกว่าเดิม';
    }
    return tv > 0 ? 'งบ ' + fmtN(tv) + ' บาท ต้องพายอดขายได้อย่างน้อย <b>' + fmtN(tv / perVol, 1) + '</b> ' + volUnitText(base, m) + ' ถึงจะคุ้มเงินที่จ่าย' : '';
  }

    if (v === 'ch' && !chList(state.pc)[state.k]) { if (chList(state.pc).length) state.k = chList(state.pc).length - 1; else { v = state.view = 'chpick'; state.k = 0; } }

    fixRestOn();
    app.innerHTML = v === 'start' ? viewStart() : v === 'items' ? viewItems() : v === 'chpick' ? viewChpick() : v === 'share' ? viewShare() : v === 'ch' ? viewCh()
      : v === 'fixed' ? viewFixed() : v === 'prod' ? viewProd() : v === 'chan' ? viewChan() : v === 'review' ? viewReview() : v === 'ask' ? viewAsk() : v === 'points' ? viewPoints() : viewResult();

    document.documentElement.style.setProperty('--foot-h', (foot ? foot.offsetHeight : 0) + 'px');
    save();

  /* อันดับขยับ: แถวที่เปลี่ยนที่เลื่อนจากตำแหน่งเดิม (ปิดเมื่อเครื่องตั้งลดการเคลื่อนไหว) */
  var lastPos = {};
  function flip() {
    var els = $$('[data-rk]'), now = {};
    els.forEach(function (el) { now[el.getAttribute('data-act') + el.getAttribute('data-rk')] = el.getBoundingClientRect().top + window.scrollY; });
    if (!reduced) els.forEach(function (el) {
      var key = el.getAttribute('data-act') + el.getAttribute('data-rk'), was = lastPos[key];
      if (was === undefined || Math.abs(was - now[key]) < 2) return;
      el.style.transform = 'translateY(' + (was - now[key]) + 'px)'; el.style.transition = 'none';
      el.getBoundingClientRect();
      el.style.transition = 'transform 420ms cubic-bezier(.2,.8,.2,1)'; el.style.transform = '';
    });
    lastPos = now;
  }
  function go(view, top, noPush) {

    if (same) $$('.screen').forEach(function (el) { el.style.animation = 'none'; });
    if (top !== false) { window.scrollTo(0, 0); focusMain(); }
  }
  function goStep(st, top, noPush) { state.view = st.v; state.k = st.k; go(st.v, top, noPush); }
  /* ย้อนกลับในแอปกับของมือถือไปที่เดียวกัน:
     ระหว่างกรอก → ข้อก่อนหน้า (ข้อแรก → หน้าแรก) · แก้ทีละส่วน → หน้าแก้ตัวเลข (ยังไม่ครบ = ยกเลิกการแก้นั้น)
     ผล → หน้าแรก · แก้ตัวเลข / รายละเอียด / หาจุดที่ควรตรวจสอบ → ผล · หน้าแรก → ออกไปหน้า Business Lab */
  function goBack(noPush) {

  /* ประวัติของมือถือ: 1 ขั้นต่อการกดย้อนกลับ 1 ครั้งกว่าจะถึงหน้าแรก (เพิ่มเฉพาะตอนแตะ ไม่เพิ่มตอนกดย้อนกลับ) */

    var v = state.view;

    if (v === 'result') return 1;
    if (v === 'review' || v === 'prod' || v === 'chan' || v === 'ask' || v === 'points') return 2;

  function hpush() { try { history.pushState({ lab4: 1, d: hdepth + 1 }, ''); hdepth++; } catch (e) { /* ignore */ } }
  function leaveAll() { if (hdepth > 0) { var k = hdepth; hdepth = 0; leaving = true; try { history.go(-k); } catch (e) { leaving = false; } } }
  function readDepth(st) { return st && st.lab4 && typeof st.d === 'number' ? st.d : 0; }
  function topUp() { var k = 0; while (hdepth < needDepth() && k++ < 24) hpush(); }
  function goBackBtn() { if (hdepth > 0) { try { history.back(); return; } catch (e) { /* ignore */ } } goBack(); }

  function showNeed(path, msg) {

      case 'tool': toast('ตัวอย่างนี้ยังไม่เชื่อมกับเครื่องมือจริง ในเว็บจริงจะเปิด "' + TOOLS[t.getAttribute('data-t')][0] + '" พร้อมตัวเลขร้านคุณ'); break;
      case 'plan': toast('แผนธุรกิจของ Jarua ยังไม่เปิดให้ใช้ เร็ว ๆ นี้จะใช้ตัวเลขชุดนี้ต่อได้'); break;
    }
  }
  function setTrial(t, i, k, v) {
    var T = state.trial = state.trial || { p: {}, c: {} };
    T[t][i] = T[t][i] || {};
    T[t][i][k] = v;
  }
  /* ลองปรับ: เปลี่ยนเฉพาะตัวเลขบนหน้า (ช่องที่พิมพ์อยู่ไม่หลุด) */
  function liveDetail() {
    var y = window.scrollY, ae = document.activeElement, aid = ae && ae.id;
    var html = state.view === 'prod' ? viewProd() : viewChan(), tmp = document.createElement('div');
    tmp.innerHTML = html;
    /* ชุดช่องลองปรับเปลี่ยน (เช่น ชิ้นต่อออร์เดอร์ขึ้นเมื่อมีค่าแพ็ก): วาดใหม่ทั้งหน้า แล้วคืนช่องที่พิมพ์อยู่ */
    var keys = function (r) { return $$('[data-tv]', r).map(function (x) { return x.id; }).join(','); };
    if (keys(tmp) !== keys(app)) {
      var pos0 = ae && ae.selectionStart;
      render(); window.scrollTo(0, y);
      var bk = aid && document.getElementById(aid); if (bk) { bk.focus({ preventScroll: true }); try { bk.setSelectionRange(pos0, pos0); } catch (er) { /* ignore */ } }
      return;
    }
    ['#dpanel', '.wf4', '.cn4', '.crl4', '.stack', '.lg4', '#dl4', '.tbtns', '.chsel', '.tcur'].forEach(function (sel) {
      var a2 = $$(sel, app), b2 = $$(sel, tmp);
      a2.forEach(function (el, n) { if (b2[n]) el.outerHTML = b2[n].outerHTML; });
    });
    if (!$('.tbtns', app) && $('.tbtns', tmp)) { var dl = $('#dl4', app); if (dl) dl.insertAdjacentHTML('afterend', $('.tbtns', tmp).outerHTML); }
    $$('[data-tv]', tmp).forEach(function (inp) { var cur = $('#' + inp.id, app); if (cur && cur.id !== aid) cur.value = inp.value; });
    runAnim(app); window.scrollTo(0, y);
    var R = RT(), Rb = R0(); announce(Math.abs(R.profit - Rb.profit) < 0.5 ? 'กำไรของร้านเท่าเดิม' : 'กำไรของร้าน' + (R.profit > Rb.profit ? 'เพิ่มขึ้น ' : 'ลดลง ') + fmtN(Math.abs(R.profit - Rb.profit)) + ' บาทต่อเดือน');
    save();
  }

  function parseNum(el) {
    var raw = el.value.replace(/[,\s]/g, '').replace(/[−–]/g, '-').replace(/[^\d.\-]/g, '');
    if (!el.getAttribute('data-neg')) raw = raw.replace(/-/g, ''); else raw = raw.replace(/(?!^)-/g, '');
    if (raw === '' || raw === '-' || raw === '.') return null;
    var v = parseFloat(raw);
    return isFinite(v) ? v : null;
  }
  var liveT = 0;
  function onInput(e) {
    var el = e.target;
    if (el.hasAttribute('data-path')) {
      var path = el.getAttribute('data-path'), t = el.getAttribute('data-t');
      setP(path, t === 'text' ? el.value : parseNum(el));
      var node = el.closest('.field.need'); if (node) { node.classList.remove('need'); var mm = $('.need-msg', node); if (mm) mm.remove(); }
      clearTimeout(liveT); liveT = setTimeout(refreshLive, 60);
      save();
    } else if (el.hasAttribute('data-tv')) {
      var v = parseNum(el);
      if (v === null) return;
      v = Math.max(+el.getAttribute('data-min'), Math.min(+el.getAttribute('data-max'), v));
      setTrial(el.getAttribute('data-t'), +el.getAttribute('data-i'), el.getAttribute('data-tv'), v);
      clearTimeout(liveT); liveT = setTimeout(liveDetail, 120);
    }
  }
  /* ระหว่างกรอก: แถบสรุป ยอดรวม % และช่องที่ขึ้นตามคำตอบ (เช่น จำนวนชิ้นต่อออร์เดอร์) โดยไม่วาดช่องที่พิมพ์อยู่ใหม่ */
  function refreshLive() {
    var s = $('#strip'); if (s) { var tmp = document.createElement('div'); tmp.innerHTML = liveStrip(); if (tmp.firstChild) { s.outerHTML = tmp.firstChild.outerHTML; runAnim($('#strip')); } }
    if (state.view === 'share') { var tt = $('#tot4w'), tmp2 = document.createElement('div'); tmp2.innerHTML = viewShare(); var nt = $('#tot4w', tmp2); if (tt && nt) tt.outerHTML = nt.outerHTML; }
    if (state.view === 'items') $$('.pi').forEach(function (card) {
      var i = +card.getAttribute('data-item'), p = pcItems(state.pc)[i];
      if (p && p.parts) { var sum = $('.part-f b', card); if (sum) sum.textContent = fmtN(n0(p.cost), 2); var ci = $('#f-i-' + i + '-cost', card); if (ci) ci.value = fmtIn(p.cost, 'dec'); }
    });
    if (state.view === 'fixed') FIXED_STEPS[state.k].f.forEach(function (k) {
      var f = fieldDef(k), node = $('[data-need="inp.' + k + '"]');
      if (f && f.show && node) node.hidden = !f.show(state.inp, state.model);
    });
    /* ช่องที่ขึ้นตามคำตอบ (VAT ขึ้นเมื่อมีค่าธรรมเนียม · ชิ้นต่อออร์เดอร์ขึ้นเมื่อมีค่าแพ็ก): วาดใหม่เมื่อเปลี่ยนเท่านั้น */
    if (state.view === 'ch') {
      var c = chList(state.pc)[state.k], needVat = n0(c && c.fee) > 0, needIpo = n0(c && c.perOrder) > 0;
      var hasVat = !!$('[data-need="c.' + state.k + '.vat"]'), hasIpo = !!$('[data-need="c.' + state.k + '.ipo"]');
      if (needVat !== hasVat || needIpo !== hasIpo) {
        var ae = document.activeElement, aid = ae && ae.id, pos0 = ae && ae.selectionStart;
        var y = window.scrollY; go('ch', false); window.scrollTo(0, y);
        var back = aid && document.getElementById(aid); if (back) { back.focus({ preventScroll: true }); try { back.setSelectionRange(pos0, pos0); } catch (er) { /* ignore */ } }
      }
    }
  }
  function onBlur(e) {
    var el = e.target;
    if (!el.hasAttribute) return;
    if (el.hasAttribute('data-path') && el.getAttribute('data-t') === 'money') { var v = getP(el.getAttribute('data-path')); if (v !== null && v !== undefined) el.value = fmtIn(v, 'money'); }
    if (el.hasAttribute('data-tv')) { var tv = tval(el.getAttribute('data-t'), +el.getAttribute('data-i'), el.getAttribute('data-tv'), undefined); if (tv !== undefined) el.value = tvFmt(tv); }
  }
  function onKey(e) {
    if (['ArrowRight', 'ArrowLeft', 'Home', 'End'].indexOf(e.key) >= 0 && e.target.getAttribute && e.target.getAttribute('role') === 'tab') {
      var tabs = $$('[role="tab"]', e.target.parentNode), ti = tabs.indexOf(e.target);
      var nx = e.key === 'Home' ? tabs[0] : e.key === 'End' ? tabs[tabs.length - 1] : tabs[(ti + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
      if (nx && nx !== e.target) { e.preventDefault(); nx.click(); }
      return;
    }
    if (e.key !== 'Enter' || !e.target.hasAttribute) return;
    if (e.target.hasAttribute('data-path') && FLOW_VIEWS.indexOf(state.view) >= 0) {
      var ins = $$('main input[data-path]:not([readonly])').filter(function (x) { return !x.closest('[hidden]'); }), i = ins.indexOf(e.target);
      e.preventDefault();
      if (i >= 0 && i < ins.length - 1) { ins[i + 1].focus(); return; }
      var btn = $('#foot [data-act="step-next"], #foot [data-act="step-done"]'); if (btn) btn.click();
    }
    if (e.target.hasAttribute('data-tv')) e.target.blur();
  }

  function start(data) {
    app = document.getElementById('app');
    if (!document.getElementById('sr-live')) { var lv = document.createElement('div'); lv.id = 'sr-live'; lv.className = 'sr'; lv.setAttribute('aria-live', 'polite'); document.body.appendChild(lv); }
    var r = data && data.view ? data : null;
    if (!r) { try { r = JSON.parse(sessionStorage.getItem('lab4') || 'null'); } catch (e) { r = null; } }
    restore(r);
    adoptShared();
    document.addEventListener('click', onClick);
    document.addEventListener('input', onInput);
    document.addEventListener('focusout', onBlur);
    document.addEventListener('keydown', onKey);
    window.addEventListener('resize', function () { var f = $('#foot'); document.documentElement.style.setProperty('--foot-h', (f ? f.offsetHeight : 0) + 'px'); });
    window.addEventListener('pageshow', function (ev) {
      if (!ev.persisted) return;
      hdepth = readDepth(history.state);
      try { var th2 = localStorage.getItem('lab-theme'); if (th2 === 'dark' || th2 === 'light') document.documentElement.setAttribute('data-theme', th2); } catch (e) { /* ignore */ }
      adoptShared(); render();
    });
    window.addEventListener('popstate', onPop);
    document.addEventListener('click', topUp, true);
    hdepth = readDepth(history.state);
    render();
  }
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) { try { hot.snapshot(snapshot); } catch (e) { /* ignore */ } }
  window.__lab4 = { state: state, render: render, go: go, R0: R0, useSample: useSample, chooseModel: chooseModel, startFlow: startFlow };
  if (hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : {});
})();
</script>
</body></html>
