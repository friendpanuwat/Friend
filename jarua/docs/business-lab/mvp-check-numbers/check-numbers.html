<title>เช็กตัวเลขร้าน</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Sora:wght@500;600&display=swap">
<style>
/* Layout: one mobile column (max 560px) on a soft grey ground · white cards without borders · black inverse panels hold the money
   Screens: start → wizard (one question per screen, live receipt) → home (summary) → finding detail / lab (own screens) */
:root {
  --bg: #f2f2f3;
  --card: #ffffff;
  --surface: #f2f2f3;
  --surface-2: #e6e6e9;
  --line: #e3e3e7;
  --line-strong: #c6c6cc;
  --ink: #0b0b0c;
  --ink-2: #393940;
  --muted: #696970;
  --faint: #a9a9b0;
  --panel: #0b0b0c;
  --panel-ink: #ffffff;
  --panel-muted: rgba(255, 255, 255, 0.64);
  --panel-line: rgba(255, 255, 255, 0.16);
  --panel-dot: rgba(255, 255, 255, 0.09);
  --panel-btn: #ffffff;
  --panel-btn-ink: #0b0b0c;
  --ghost: #b8b8be;
  --shadow: 0 1px 2px rgba(11, 11, 12, 0.04), 0 8px 24px rgba(11, 11, 12, 0.06);
  --font-th: "IBM Plex Sans Thai", "Noto Sans Thai", "Thonburi", system-ui, sans-serif;
  --font-num: "Space Grotesk", "IBM Plex Sans Thai", system-ui, sans-serif;
  --font-latin: "Sora", "IBM Plex Sans Thai", system-ui, sans-serif;
  --r: 20px;
  --r-sm: 14px;
  --col: 560px;
  --foot-h: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09090a; --card: #151517; --surface: #1d1d20; --surface-2: #27272b; --line: #2a2a2e; --line-strong: #3d3d43;
    --ink: #f4f4f5; --ink-2: #d4d4d8; --muted: #a1a1a9; --faint: #64646b;
    --panel: #ededef; --panel-ink: #0b0b0c; --panel-muted: rgba(11, 11, 12, 0.62); --panel-line: rgba(11, 11, 12, 0.14); --panel-dot: rgba(11, 11, 12, 0.07);
    --panel-btn: #0b0b0c; --panel-btn-ink: #ffffff; --ghost: #57575e;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09090a; --card: #151517; --surface: #1d1d20; --surface-2: #27272b; --line: #2a2a2e; --line-strong: #3d3d43;
  --ink: #f4f4f5; --ink-2: #d4d4d8; --muted: #a1a1a9; --faint: #64646b;
  --panel: #ededef; --panel-ink: #0b0b0c; --panel-muted: rgba(11, 11, 12, 0.62); --panel-line: rgba(11, 11, 12, 0.14); --panel-dot: rgba(11, 11, 12, 0.07);
  --panel-btn: #0b0b0c; --panel-btn-ink: #ffffff; --ghost: #57575e;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4); color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-th); font-size: 16px; line-height: 1.55; margin: 0; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 8px; }
.num { font-family: var(--font-num); letter-spacing: -0.02em; }
.muted { color: var(--muted); }
svg { flex: none; }

.wrap { max-width: var(--col); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { padding-bottom: calc(var(--foot-h) + 40px + env(safe-area-inset-bottom, 0px)); }

/* ---------- top bar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); }
.bar .wrap { display: flex; align-items: center; gap: 6px; min-height: 60px; }
.bar .ttl { flex: 1; min-width: 0; text-align: center; font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .ttl small { display: block; font-family: var(--font-latin); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.ib { width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center; color: var(--ink); }
.ib:hover { background: var(--surface-2); }
.ib svg { width: 22px; height: 22px; }
.tb { min-height: 44px; padding: 0 12px; border-radius: 22px; border: 0; background: transparent; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 4px; }
.tb svg { width: 20px; height: 20px; }
.tb:hover { background: var(--surface-2); }
.spacer44 { width: 44px; flex: none; }

/* ---------- buttons ---------- */
.btn { min-height: 54px; border-radius: 16px; border: 0; background: var(--ink); color: var(--bg); font-weight: 700; font-size: 17px; padding: 0 20px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn svg { width: 20px; height: 20px; }
.btn.ghost { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.35; cursor: default; }
.btn.on-panel { background: var(--panel-btn); color: var(--panel-btn-ink); }
.lnk { background: none; border: 0; padding: 0 4px; min-height: 44px; font-weight: 600; font-size: 15px; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1.5px; color: var(--ink); }

/* ---------- inverse panel (the money lives here) ---------- */
.panel {
  background-color: var(--panel); color: var(--panel-ink); border-radius: 28px; padding: 22px 20px 20px; position: relative; overflow: hidden;
  background-image: radial-gradient(var(--panel-dot) 1.2px, transparent 1.3px); background-size: 14px 14px; background-position: 7px 7px;
}
.panel .eyebrow { font-size: 13px; color: var(--panel-muted); font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.panel .tag { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--panel-line); color: var(--panel-ink); }
.bignum { font-family: var(--font-num); font-weight: 700; font-size: 60px; line-height: 1; letter-spacing: -0.045em; margin: 10px 0 6px; overflow-wrap: anywhere; }
.bignum .u { font-family: var(--font-th); font-size: 20px; font-weight: 600; letter-spacing: 0; margin-left: 8px; }
.panel .sub { font-size: 14px; color: var(--panel-muted); }
.panel .delta { font-family: var(--font-num); font-weight: 700; font-size: 16px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin-top: 18px; border-top: 1px solid var(--panel-line); padding-top: 14px; }
.stat { min-width: 0; padding-right: 8px; }
.stat + .stat { border-left: 1px solid var(--panel-line); padding-left: 12px; }
.stat .k { font-size: 12px; color: var(--panel-muted); line-height: 1.35; }
.stat .v { font-family: var(--font-num); font-weight: 700; font-size: 22px; line-height: 1.2; margin-top: 4px; letter-spacing: -0.02em; white-space: nowrap; }
.stat .v small { font-family: var(--font-th); font-size: 12px; font-weight: 600; letter-spacing: 0; margin-left: 2px; }
.stat .d { font-family: var(--font-num); font-size: 12px; font-weight: 700; margin-top: 2px; }
.panel .cta { margin-top: 18px; }
.up::before { content: "▲ "; font-size: 0.78em; }
.down::before { content: "▼ "; font-size: 0.78em; }

/* ---------- start ---------- */
.start-hero { margin-top: 8px; }
.start-hero h1 { font-size: 27px; line-height: 1.32; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.start-hero p { margin: 10px 0 0; color: var(--panel-muted); font-size: 15px; }
.demo { margin-top: 18px; border-top: 1px solid var(--panel-line); padding-top: 14px; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: end; }
.demo .k { font-size: 13px; color: var(--panel-muted); }
.demo .v { font-family: var(--font-num); font-weight: 700; font-size: 34px; letter-spacing: -0.03em; line-height: 1; }
.demo .d { font-family: var(--font-num); font-weight: 700; font-size: 15px; text-align: right; }
.demo .note { grid-column: 1 / -1; font-size: 13px; color: var(--panel-muted); }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 28px 2px 12px; }
.sec-h h2 { font-size: 20px; margin: 0; line-height: 1.3; }
.sec-h .aside { font-size: 14px; color: var(--muted); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { text-align: left; border: 0; background: var(--card); border-radius: var(--r); padding: 16px 14px 14px; min-height: 124px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); }
.tile:hover { box-shadow: inset 0 0 0 1.5px var(--ink); }
.tile .ic { width: 40px; height: 40px; border-radius: 12px; background: var(--surface); display: flex; align-items: center; justify-content: center; }
.tile .ic svg { width: 22px; height: 22px; }
.tile .t { font-weight: 700; font-size: 15px; line-height: 1.35; }
.tile .ex { font-size: 13px; color: var(--muted); line-height: 1.4; margin-top: auto; }
.fine { font-size: 13px; color: var(--muted); margin: 24px 2px 0; }

/* ---------- wizard ---------- */
.prog { display: flex; gap: 4px; margin: 4px 0 0; }
.prog i { flex: 1; height: 4px; border-radius: 2px; background: var(--surface-2); }
.prog i.on { background: var(--ink); }
.receipt-strip { margin-top: 14px; padding: 14px 16px; }
.receipt-strip .rs-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.receipt-strip .rs-k { font-size: 13px; color: var(--panel-muted); font-weight: 600; }
.receipt-strip .rs-v { font-family: var(--font-num); font-weight: 700; font-size: 30px; letter-spacing: -0.03em; line-height: 1.1; }
.receipt-strip .rs-v small { font-family: var(--font-th); font-size: 14px; font-weight: 600; letter-spacing: 0; margin-left: 4px; }
.receipt-strip .rs-lines { margin-top: 8px; display: grid; gap: 2px; font-size: 13px; }
.rs-line { display: flex; gap: 6px; align-items: baseline; color: var(--panel-muted); }
.rs-line i { flex: 1; border-bottom: 1px dotted var(--panel-line); transform: translateY(-3px); }
.rs-line b { font-family: var(--font-num); color: var(--panel-ink); font-weight: 600; }
.rs-empty { font-size: 14px; color: var(--panel-muted); margin-top: 4px; }
.q-head { margin: 26px 2px 6px; }
.q-head .step { font-size: 13px; color: var(--muted); font-weight: 600; }
.q-head h1 { font-size: 26px; line-height: 1.3; margin: 4px 0 0; text-wrap: balance; }
.q-head p { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
.qfields { display: grid; gap: 18px; margin-top: 18px; }
.field { display: grid; gap: 8px; min-width: 0; }
.field > label, .field > .lab { font-weight: 600; font-size: 15px; }
.field .help { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0; }
.inbox { display: flex; align-items: center; background: var(--card); border-radius: 16px; min-height: 60px; box-shadow: inset 0 0 0 1.5px var(--line); overflow: hidden; }
.inbox:focus-within { box-shadow: inset 0 0 0 2px var(--ink); }
.inbox input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 0 16px; font-family: var(--font-num); font-size: 24px; font-weight: 600; outline: none; height: 58px; letter-spacing: -0.01em; }
.inbox input::placeholder { color: var(--faint); font-weight: 500; }
.inbox .suf { padding: 0 16px 0 4px; color: var(--muted); font-size: 15px; white-space: nowrap; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 14px; padding: 4px; gap: 4px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 10px; min-height: 44px; padding: 0 16px; font-size: 15px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.inbox .seg { margin: 6px; padding: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 48px; padding: 0 18px; border-radius: 24px; border: 0; background: var(--card); box-shadow: inset 0 0 0 1.5px var(--line); font-weight: 600; font-size: 16px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: none; }
.chips input { width: 140px; min-height: 48px; border: 0; border-radius: 24px; padding: 0 16px; background: var(--card); box-shadow: inset 0 0 0 1.5px var(--line); font-size: 15px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.two > * { min-width: 0; }
.two .inbox input { font-size: 20px; }
.fee-help { display: grid; gap: 10px; padding: 14px; border-radius: 16px; background: var(--surface-2); }
.fee-help .fh-res { font-size: 14px; color: var(--ink-2); }
.fee-help .fh-res b { font-family: var(--font-num); color: var(--ink); }
.fee-help label { font-size: 13px; font-weight: 600; }
.adv-block { background: var(--card); border-radius: var(--r); padding: 4px 16px; box-shadow: var(--shadow); }
.adv-block summary { list-style: none; cursor: pointer; min-height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 700; font-size: 16px; }
.adv-block summary::-webkit-details-marker { display: none; }
.adv-block summary small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
.adv-block summary svg { width: 20px; height: 20px; transition: transform 0.2s; color: var(--muted); }
.adv-block[open] summary svg { transform: rotate(180deg); }
.adv-block .qfields { margin: 4px 0 18px; }
.adv-list { display: grid; gap: 10px; margin-top: 18px; }
.months { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.month { min-height: 48px; border-radius: 12px; border: 0; background: var(--surface); font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; }
.month small { font-size: 10px; font-weight: 700; }
.month[data-s="high"] { background: var(--ink); color: var(--bg); }
.month[data-s="low"] { background: var(--surface-2); box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: linear-gradient(to top, var(--bg) 70%, transparent); padding-bottom: env(safe-area-inset-bottom, 0px); }
.foot .wrap { display: flex; gap: 10px; padding-top: 18px; padding-bottom: 14px; }
.foot .btn { flex: 1; }
.foot .btn.back { flex: 0 0 auto; width: 60px; padding: 0; }
.skip { display: flex; justify-content: center; margin-top: 10px; }

/* ---------- review (แก้ตัวเลข) ---------- */
.rv { display: grid; gap: 8px; margin-top: 12px; }
.rv-row { width: 100%; text-align: left; border: 0; background: var(--card); border-radius: var(--r-sm); padding: 14px 16px; display: grid; grid-template-columns: 1fr 20px; gap: 2px 10px; align-items: center; box-shadow: var(--shadow); min-height: 64px; }
.rv-row .t { font-weight: 700; font-size: 15px; }
.rv-row .v { font-size: 14px; color: var(--muted); grid-column: 1; line-height: 1.45; }
.rv-row svg { grid-row: 1 / span 2; grid-column: 2; width: 18px; height: 18px; color: var(--muted); }

/* ---------- home ---------- */
.banner { margin-top: 4px; margin-bottom: 12px; padding: 10px 14px; border-radius: var(--r-sm); background: var(--card); box-shadow: var(--shadow); font-size: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.flist { display: grid; gap: 8px; }
.frow { width: 100%; text-align: left; border: 0; background: var(--card); border-radius: var(--r); padding: 16px; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; box-shadow: var(--shadow); min-height: 76px; }
.frow .ft { font-weight: 700; font-size: 16px; line-height: 1.4; grid-column: 1; }
.frow .fm { font-family: var(--font-num); font-weight: 700; font-size: 20px; letter-spacing: -0.02em; white-space: nowrap; text-align: right; }
.frow .fm small { display: block; font-family: var(--font-th); font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.frow .pill { grid-column: 1; justify-self: start; }
.frow svg { width: 18px; height: 18px; color: var(--muted); }
.frow .fr-r { grid-row: 1 / span 2; grid-column: 2; display: flex; align-items: center; gap: 6px; }
.pill { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px var(--line-strong); white-space: nowrap; letter-spacing: 0.01em; display: inline-block; }
.pill.high { background: var(--ink); color: var(--bg); box-shadow: none; }
.pill.mid { box-shadow: inset 0 0 0 1.5px var(--ink); }
.pill.watch { box-shadow: none; background: var(--surface-2); }
.pill.note { color: var(--muted); }
.ok-box { background: var(--card); border-radius: var(--r); padding: 18px 16px; box-shadow: var(--shadow); }
.ok-box b { font-size: 16px; }
.ok-box p { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
.cards { display: grid; gap: 12px; }
.card { background: var(--card); border-radius: var(--r); padding: 18px 16px; box-shadow: var(--shadow); min-width: 0; }
.card h3 { font-size: 16px; margin: 0; line-height: 1.4; }
.card .lead { font-size: 15px; color: var(--ink-2); margin: 4px 0 0; }
.card .lead b { font-family: var(--font-num); color: var(--ink); }

/* gauge */
.gauge { margin-top: 26px; padding-bottom: 24px; position: relative; }
.gauge .track { position: relative; height: 14px; border-radius: 7px; background: var(--surface-2); }
.gauge .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 7px; background: var(--ink); transition: width 0.35s cubic-bezier(.2, .8, .2, 1); }
.gauge .gfill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 7px; background: var(--ghost); }
.gauge .mark { position: absolute; top: -7px; bottom: -7px; width: 3px; border-radius: 2px; background: var(--ink); box-shadow: 0 0 0 2px var(--card); transform: translateX(-1.5px); transition: left 0.35s cubic-bezier(.2, .8, .2, 1); }
.gauge .ml { position: absolute; top: -26px; transform: translateX(-50%); font-size: 12px; font-weight: 700; white-space: nowrap; transition: left 0.35s; }
.gauge .nl { position: absolute; bottom: 0; transform: translateX(-50%); font-size: 12px; color: var(--muted); white-space: nowrap; transition: left 0.35s; }
.gauge .el { transform: none; } .gauge .er { transform: translateX(-100%); }

/* chart */
.chart { margin-top: 10px; position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .ax { font-family: var(--font-num); font-size: 11px; fill: var(--muted); }
.chart .axth { font-family: var(--font-th); font-size: 11px; fill: var(--muted); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .zero { stroke: var(--ink-2); stroke-width: 1; }
.chart .line { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .line.ghost { stroke: var(--ghost); stroke-width: 2; }
.chart .area { fill: var(--ink); opacity: 0.06; }
.chart .dot { fill: var(--ink); stroke: var(--card); stroke-width: 2; }
.chart .endlab { font-family: var(--font-num); font-size: 12px; font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: var(--card); stroke-width: 4px; stroke-linejoin: round; }
.chart .hit { fill: transparent; }
.chart .cross { stroke: var(--ink-2); stroke-width: 1; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 7px 10px; font-size: 13px; line-height: 1.4; white-space: nowrap; transform: translate(-50%, -100%); z-index: 3; }
.tip b { font-family: var(--font-num); }
.legend { display: flex; gap: 16px; margin-top: 8px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 16px; height: 3px; border-radius: 2px; background: var(--ink); }
.legend i.g { background: var(--ghost); }

/* receipt */
.receipt { position: relative; background: var(--card); padding: 22px 18px 20px; margin: 10px 0; box-shadow: var(--shadow); border-radius: 4px; }
.receipt::before, .receipt::after {
  content: ""; position: absolute; left: 0; right: 0; height: 10px;
  background: radial-gradient(circle at 7px 0, transparent 6px, var(--card) 6.5px) repeat-x; background-size: 14px 10px;
}
.receipt::before { top: -9px; transform: rotate(180deg); }
.receipt::after { bottom: -9px; }
.rc-head { text-align: center; padding-bottom: 12px; border-bottom: 1.5px dashed var(--line-strong); }
.rc-head .rt { font-weight: 700; font-size: 16px; }
.rc-head .rs { font-size: 13px; color: var(--muted); font-family: var(--font-num); letter-spacing: 0.04em; }
.rc-bar { display: flex; gap: 2px; height: 12px; margin: 14px 0 6px; border-radius: 3px; overflow: hidden; }
.rc-bar i { display: block; background: var(--ghost); height: 100%; transition: flex-grow 0.35s; }
.rc-bar i.k { background: var(--ink); }
.rc-lines { display: grid; gap: 6px; margin-top: 10px; font-size: 14px; }
.rc-line { display: flex; gap: 6px; align-items: baseline; }
.rc-line span { color: var(--ink-2); }

function num(v) {
  if (v === null || v === undefined || v === '') return null;
  var n = typeof v === 'number' ? v : parseFloat(String(v).replace(/[,\s]/g, ''));
  return isFinite(n) ? n : null;

function n0(v) { var n = num(v); return n === null ? 0 : n; }

/* ตัวเลขที่ขยับ 10% แล้วกำไรเปลี่ยนมากที่สุด (ใช้ค่าจาก v4 เมื่อเป็นธุรกิจขายเป็นหน่วย) */

   เกณฑ์ใช้ตัวเลขของร้านเอง ไม่เทียบร้านอื่น · เกณฑ์ที่ PL2 มีอยู่แล้วใช้ตัวเดียวกัน (ฉากแย่ −20% · ใช้กำลัง > 90% · ลูกค้า 1 คนกำไร < ค่าหา) */
var LV_ORDER = { high: 0, mid: 1, watch: 2, note: 3 };
function detect(S, inp, m) {
  var F = [];
  if (!S.ok) return F;
  var u = U(inp, m);
  var P = S.profit;

  /* เงินสดจะติดลบ */
  if (S.hasCash && S.lowest !== null && S.lowest < 0) {
    var short = -S.lowest;
    var timing = P >= 0;
    F.push({ id: 'cashout', lv: 'high', urgent: true,
      title: timing ? 'มีกำไร แต่เงินจะขาดมือ' : 'เงินสดจะหมด',
      money: short, unit: 'once', moneyText: fmtN(short) + ' บาท', moneyCap: 'เงินที่จะขาดในเดือน ' + monthLabel(S.lowestT, true) + ' (ช่วงที่เงินในมือต่ำที่สุด)',
      ev: [timing ? 'ทั้งปีร้านยังมีกำไร แต่เงินเข้าช้ากว่าเงินออก เงินในมือจะเริ่มติดลบเดือน ' + monthLabel(S.firstNegT, true)
                  : 'เงินที่มีตอนนี้ ' + fmtN(S.cashStart) + ' บาท จะหมดราวเดือน ' + monthLabel(S.firstNegT, true) + ' ถ้าตัวเลขยังเป็นแบบนี้'],
      q: P < 0 ? QSETS.gap[m].slice(0, 2).concat(QSETS.cash.all) : QSETS.cash.all, lever: 'cash' });
  }

  /* ขาดทุน */
  if (P < 0) {
    var neg = S.be && S.be.impossible;
    var ev = [];
    if (neg) ev.push('ราคาที่ได้ต่อ' + u + ' ยังไม่พอจ่ายต้นทุนที่ขึ้นลงตามยอดขาย ยิ่งขายมากยิ่งขาดทุนมาก');
    else if (S.be) ev.push('ต้อง' + volVerb(m) + 'อย่างน้อย ' + fmtN(S.be.vol, 1) + ' ' + volUnitText(inp, m) + ' ตอนนี้ ' + fmtN(S.vol) + ' ' + volUnitText(inp, m));
    if (S.owner > 0 && P + S.owner > 0) ev.push('ถ้าไม่นับเงินเดือนคุณ ร้านยังเหลือเงินเดือนละ ' + fmtN(P + S.owner) + ' บาท แปลว่าร้านจ่ายเงินเดือนคุณได้ ' + fmtN(P + S.owner) + ' จาก ' + fmtN(S.owner) + ' บาท');
    F.push({ id: 'loss', lv: 'high', title: neg ? 'ยิ่งขายมาก ยิ่งขาดทุน' : 'ร้านขาดทุนทุกเดือน',
      money: -P, unit: 'month', moneyText: fmtN(-P) + ' บาท/เดือน', moneyCap: 'ถ้าถึงจุดคุ้มทุน กำไรจะเพิ่มเท่านี้ (' + fmtN(-P * 12) + ' บาท/ปี)',
      ev: ev, ways: neg ? waysNeg(S, inp, m) : waysTo(-P, S, inp, m),
      waysTitle: neg ? 'ตัวเลขที่ทำให้ขายแล้วเริ่มมีเงินเหลือ (ขยับอย่างใดอย่างหนึ่ง)' : 'ตัวเลขที่ทำให้ไม่ขาดทุน (ขยับอย่างใดอย่างหนึ่ง)',
      q: neg ? QSETS.neg[m] : QSETS.gap[m] });
  }

  /* ยอดตก 20% ก็ขาดทุน (ฉาก "แย่" ของ PL2) */
  if (P >= 0 && S.be && !S.be.impossible) {
    var S20 = compute(scaleVol(inp, m, 0.8), m);
    if (S20.ok && S20.profit < 0) {
      F.push({ id: 'fragile', lv: 'mid', title: 'ยอดตกนิดเดียวก็ขาดทุน',
        money: -S20.profit, unit: 'month', moneyText: fmtN(-S20.profit) + ' บาท/เดือน',
        moneyCap: 'ขาดทุนต่อเดือน ถ้า' + (m === 'rental' ? 'คนเช่า' : 'ยอดขาย') + 'ลดลง 20% (เช่น เดือนที่ขายไม่ดี)',
        ev: ['ตอนนี้กำไรเดือนละ ' + fmtN(P) + ' บาท ' + (S.be.safety !== null ? ({ rental: 'คนเช่า', subscription: 'สมาชิก' }[m] || 'ยอดขาย') + 'ลดได้อีกแค่ ' + fmtPct(S.be.safety * 100) + ' ก่อนเริ่มขาดทุน' : '')],
        ways: waysTo(-S20.profit, S20, scaleVol(inp, m, 0.8), m, 0.8), waysTitle: 'ตัวเลขที่ทำให้ยอดตก 20% แล้วยังไม่ขาดทุน',
        q: QSETS.gap[m] });
    }
  }

  /* ยอดลดลงเรื่อยๆ / สมาชิกลดลง */
  if (S.cash.length === 12) {
    var rev1 = S.revenue, rev12 = S.cash[11].rev;
    var drop = S.profit - S.profit12;
    var declining = rev12 < rev1 * 0.95 && drop > 0 && !(hasSeason(inp) && n0(inp.growth) >= 0 && m !== 'subscription');
    if (m === 'subscription') declining = n0(inp.leaving) > n0(inp.newMembers) && drop > 0;
    if (declining) {
      var ev2 = m === 'subscription'
        ? ['สมาชิกเลิกเดือนละ ' + fmtN(n0(inp.leaving)) + ' คน แต่สมัครใหม่ ' + fmtN(n0(inp.newMembers)) + ' คน อีก 12 เดือนกำไรจะเหลือเดือนละ ' + fmtN(S.profit12) + ' บาท']
        : ['ยอดขายลดลงเดือนละ ' + fmtPct(-n0(inp.growth)) + ' อีก 12 เดือนกำไรจะเหลือเดือนละ ' + fmtN(S.profit12) + ' บาท'];
      if (m === 'subscription' && n0(inp.leaving) > 0) {
        var churn = n0(inp.leaving) / Math.max(1, n0(inp.members));
        ev2.push('ถ้าตัวเลขยังเป็นแบบนี้ สมาชิกจะลดลงไปนิ่งที่ราว ' + fmtN(n0(inp.newMembers) / churn) + ' คน');
      }
      F.push({ id: 'decline', lv: S.profit12 < 0 ? 'high' : 'mid', title: m === 'subscription' ? 'สมาชิกลดลงทุกเดือน' : 'ยอดขายลดลงเรื่อยๆ',
        money: drop, unit: 'month', moneyText: fmtN(drop) + ' บาท/เดือน', moneyCap: 'กำไรต่อเดือนที่จะหายไปภายใน 12 เดือน',
        ev: ev2, q: QSETS.decline[m] });
    }
  }

  /* ใกล้เต็มกำลัง */
  if (S.util && S.util.pct >= 90) {
    /* ปริมาณตอนนี้ในหน่วยเดียวกับเพดาน → กำไรที่ยังเพิ่มได้ = ที่ว่างที่เหลือ × กำไรต่อหน่วยของเพดาน */
    var curU = S.util.rental ? n0(inp.occupancy) : (S.util.conc || S.vol);
    var room = Math.max(0, S.util.max - curU);
    var headroom = curU > 0 && S.contribution > 0 ? room * S.contribution / curU : 0;
    var roomUnit = m === 'project' ? 'งานพร้อมกัน' : volUnitText(inp, m);
    F.push({ id: 'capacity', lv: 'watch', title: S.util.rental ? 'เกือบเต็มทุก' + periodWord(inp) + 'แล้ว' : 'ใกล้เต็มกำลังที่รับได้',
      money: headroom, unit: 'month', moneyText: fmtN(headroom) + ' บาท/เดือน', moneyCap: 'กำไรที่เพิ่มได้อีกไม่เกินนี้ ถ้ายังรับได้เท่าเดิม',
      ev: [S.util.rental ? 'มีคนเช่า ' + fmtPct(S.util.pct) + ' เหลือที่ว่างอีก ' + fmtPct(100 - S.util.pct)
        : 'ใช้กำลังไปแล้ว ' + fmtPct(S.util.pct) + ' รับเพิ่มได้อีก ' + fmtN(room, 1) + ' ' + roomUnit],
      q: QSETS.capacity.all });
  } else if (S.util && S.util.reachT) {
    var lost = 0;
    if (isVolModel(m) && S.r.projectionIfCapacityUnchanged) {
      S.r.projection.forEach(function (p, i) { lost += p.netCashFlow - S.r.projectionIfCapacityUnchanged[i].netCashFlow; });
    } else if (m === 'subscription') {
      var S4 = compute(withK(inp, 'maxMembers', null), m);
      if (S4.ok) S4.cash.forEach(function (c, i) { lost += c.net - S.cash[i].net; });
    }
    if (lost > 0) F.push({ id: 'capacity', lv: 'mid', title: 'จะเต็มกำลังภายใน 12 เดือน',
      money: lost / 12, unit: 'year', moneyText: fmtN(lost) + ' บาท', moneyCap: 'เงินที่จะเสียโอกาสใน 12 เดือนข้างหน้า ถ้ายังรับได้เท่าเดิม',
      ev: ['ถ้ายอดโตตามตัวเลขนี้ จะเต็มกำลังในเดือน ' + monthLabel(S.util.reachT, true)], q: QSETS.capacity.all });
  }

  /* ค่าหาลูกค้าใหม่แพงกว่ากำไรจากลูกค้าคนนั้น */
  if (S.cust && S.cust.ratio !== null && S.cust.ratio < 1 && S.cust.cac > 0 && S.cust.newPerMonth > 0) {
    var lossPer = S.cust.cac - S.cust.ltvProfit;
    F.push({ id: 'cac', lv: 'mid', title: 'ค่าหาลูกค้าใหม่แพงกว่ากำไรที่ได้จากลูกค้าคนนั้น',
      money: lossPer * S.cust.newPerMonth, unit: 'month', moneyText: fmtN(lossPer * S.cust.newPerMonth) + ' บาท/เดือน',
      moneyCap: 'เงินที่จ่ายเกินกำไรที่ลูกค้าใหม่สร้างให้ ทุกเดือน',
      ev: ['ได้ลูกค้าใหม่ 1 คน ใช้เงินการตลาด ' + fmtN(S.cust.cac) + ' บาท แต่ลูกค้าคนนั้นสร้างกำไรให้ ' + fmtN(S.cust.ltvProfit) + ' บาท ตลอดที่ซื้อกับคุณ'],
      q: QSETS.cac.all });
  }

  /* เงินสำรองบาง: เงินในมือช่วงต่ำสุด < ค่าใช้จ่ายคงที่ 1 เดือน */
  if (S.hasCash && S.lowest !== null && S.lowest >= 0 && S.lowest < S.fixed) {
    F.push({ id: 'thincash', lv: 'watch', title: 'เงินสำรองไม่พอจ่าย 1 เดือน',
      money: S.fixed - S.lowest, unit: 'once', moneyText: fmtN(S.fixed - S.lowest) + ' บาท',
      moneyCap: 'เงินที่ยังขาด ถึงจะมีเงินสำรองเท่าค่าใช้จ่ายคงที่ 1 เดือน (' + fmtN(S.fixed) + ' บาท)',
      ev: ['เงินในมือช่วงต่ำสุดเหลือ ' + fmtN(S.lowest) + ' บาท (' + monthLabel(S.lowestT, true) + ') ถ้าเดือนไหนขายไม่ได้ จะไม่พอจ่ายค่าใช้จ่ายคงที่'],
      q: QSETS.cash.all });
  }

  /* ยังไม่ได้ใส่เงินสด ทั้งที่เงินไหลออก */
  if (!S.hasCash && S.cash.some(function (c) { return c.net < 0; })) {
    F.push({ id: 'nocash', lv: 'note', title: 'ยังไม่รู้ว่าเงินพอใช้ถึงเดือนไหน', money: 0, unit: 'none',
      ev: ['มีเดือนที่เงินออกมากกว่าเงินเข้า ใส่เงินสดที่มีตอนนี้ เพื่อดูว่าเงินพอใช้ถึงเดือนไหน'], q: [] , editField: 'cash' });
  }

  /* ยังไม่นับเงินเดือนตัวเอง */
  if (S.owner === 0) {
    F.push({ id: 'nosalary', lv: 'note', title: 'กำไรนี้ยังไม่ได้หักเงินเดือนคุณ', money: 0, unit: 'none',
      ev: ['กำไร ' + fmtN(P) + ' บาทที่เห็น รวมค่าแรงของคุณไว้ด้วย ลองใส่เงินเดือนที่คุณควรได้ในส่วนทดลอง เพื่อดูกำไรจริงของร้าน'],
      q: [], tryLever: 'ownerSalary' });
  }

  F.forEach(function (f) {
    f.qs = (f.q || []).filter(function (id) { var b = QBANK[id]; return b && (!b.when || b.when(inp, m)); })
      .filter(function (id, i, a) { return a.indexOf(id) === i; }).slice(0, 5);
  });
  /* เรียง: เงินจะหมดก่อน → ระดับ → เงินต่อเดือน (เงินก้อนเดียวเทียบเป็นต่อเดือนไม่ได้ จึงเรียงตามระดับก่อน) */
  F.sort(function (a, b) {
    if (!!b.urgent !== !!a.urgent) return a.urgent ? -1 : 1;
    if (LV_ORDER[a.lv] !== LV_ORDER[b.lv]) return LV_ORDER[a.lv] - LV_ORDER[b.lv];
    return (b.unit === 'none' ? 0 : b.money) - (a.unit === 'none' ? 0 : a.money);
  });
  return F;
}

function waysNeg(S, inp, m) {
  var R = ROLE[m];
  var ways = [];
  /* หาค่าที่ทำให้เงินที่เหลือหลังต้นทุนผันแปรเริ่มเป็นบวก (เป็นเส้นตรง จึงใช้ 2 จุด) แล้วยืนยันด้วยการคำนวณจริง */
  function solve(k, dir) {
    var st = leverStep(k, inp, m), cur = n0(inp[k]);
    var S1 = compute(withK(inp, k, cur + st), m);
    if (!S1.ok) return null;
    var slope = (S1.contribution - S.contribution) / st;
    if ((dir > 0 && slope <= 0) || (dir < 0 && slope >= 0)) return null;
    var x = Math.round((cur - S.contribution / slope) * 1e6) / 1e6;
    x = dir > 0 ? Math.floor(x / st + 1) * st : Math.ceil(x / st - 1) * st;
    if (x < 0) return null;
    var S2 = compute(withK(inp, k, x), m);
    return S2.ok && S2.contribution > 0 ? x : null;
  }
  if (R.price) {
    var p = solve(R.price, 1);
    if (p !== null) ways.push({ text: priceVerb(m).replace('เป็น', '') + 'ต้องไม่ต่ำกว่า <b>' + fmtN(p) + '</b>' + (leverUnit(R.price, inp, m) === '%' ? '%' : ' บาท') + ' (ตอนนี้ ' + fmtN(n0(inp[R.price])) + ')', lever: R.price, value: p,
      label: priceVerb(m).replace('เป็น', '') + 'ต้องไม่ต่ำกว่า', big: fmtN(p) + (leverUnit(R.price, inp, m) === '%' ? '%' : ' บาท'), note: 'ตอนนี้ ' + fmtN(n0(inp[R.price])) });
  }
  if (R.cost) {
    var c = solve(R.cost, -1);
    var cname = { unit: 'ต้นทุนต่อ' + U(inp, m), service: 'ต้นทุนต่อ' + U(inp, m), resell: 'ราคาที่ซื้อมาต่อ' + U(inp, m), subscription: 'ต้นทุนต่อสมาชิก',
      project: 'ต้นทุนตรง', rental: 'ค่าใช้จ่ายต่อ' + periodWord(inp), commission: 'ส่วนแบ่งให้ทีม', other: 'ต้นทุน' }[m];
    var cunit = { project: '% ของมูลค่างาน', commission: '% ของค่าคอม', other: '% ของรายได้' }[m] || 'บาท';
    if (c !== null) ways.push({ text: cname + 'ต้องไม่เกิน <b>' + fmtN(c) + '</b>' + (cunit === 'บาท' ? ' บาท' : cunit) + ' (ตอนนี้ ' + fmtN(n0(inp[R.cost])) + ')', lever: R.cost, value: c,
      label: cname + 'ต้องไม่เกิน', big: fmtN(c) + (cunit === 'บาท' ? ' บาท' : cunit), note: 'ตอนนี้ ' + fmtN(n0(inp[R.cost])) });
  }
  if (n0(inp.feePct) > 0) {
    var f = solve('feePct', -1);
    if (f !== null) ways.push({ text: 'ค่าธรรมเนียมไม่เกิน <b>' + fmtN(f) + '%</b> ของยอดขาย (ตอนนี้ ' + fmtN(n0(inp.feePct)) + '%)', lever: 'feePct', value: f,
      label: 'ค่าธรรมเนียมต้องไม่เกิน', big: fmtN(f) + '% ของยอดขาย', note: 'ตอนนี้ ' + fmtN(n0(inp.feePct)) + '%' });
  }
  return ways;
}

/* ---------- ป้ายราคาของจุดที่ควรเช็ก ---------- */
function pointTag(bankLever, S, inp, m) {
  if (!bankLever || !S.ok) return '';
  var k = roleKey(m, bankLever);
  if (!k) return '';
  var u = U(inp, m);
  var d, st;
  if (k === 'creditDays' || k === 'stockDays') {
    var cur = n0(inp[k]);
    if (cur <= 0) return '';
    var alt = withK(inp, k, Math.max(0, cur - 15));
    var S2 = compute(alt, m);
    if (!S2.ok) return '';
    d = S2.lowest - S.lowest;
    if (d < 1) return '';
    return (k === 'creditDays' ? 'ลูกค้าจ่ายเร็วขึ้น 15 วัน' : 'ของค้างสต็อกสั้นลง 15 วัน') + ' = เงินในมือช่วงต่ำสุดเพิ่มขึ้น <b>' + fmtN(d) + '</b> บาท';
  }
  if (k === 'rent' || k === 'otherFixed') {
    var v = n0(inp[k]);
    if (v <= 0 || S.revenue <= 0) return '';
    return (k === 'rent' ? 'ค่าเช่า' : 'ค่าใช้จ่ายอื่น') + ' ' + fmtN(v) + ' บาท/เดือน = <b>' + fmtN(v / S.revenue * 100, 1) + '</b> บาทจากทุก 100 บาทที่ลูกค้าจ่าย';
  }
  if (k === 'marketing') {
    var mk = n0(inp.marketing);
    if (mk <= 0 || S.contribution <= 0 || !S.vol) return '';
    var perVol = S.contribution / S.vol;
    return 'งบการตลาด ' + fmtN(mk) + ' บาท/เดือน ต้องพา' + volVerb(m).replace('ให้ได้', '') + 'เพิ่มอย่างน้อย <b>' + fmtN(mk / perVol, 1) + '</b> ' + volUnitText(inp, m) + ' ถึงจะคุ้มเงินที่จ่าย';
  }
  if (k === 'staffCount') {
    var sal = n0(inp.staffSalary);
    if (sal <= 0 || S.contribution <= 0 || !S.vol) return '';
    return 'พนักงาน 1 คน = ค่าใช้จ่าย ' + fmtN(sal) + ' บาท/เดือน = ต้อง' + volVerb(m) + 'เพิ่ม <b>' + fmtN(sal / (S.contribution / S.vol), 1) + '</b> ' + volUnitText(inp, m) + ' ถึงจะคุ้มค่าจ้าง';
  }
  if (k === 'leaving' || k === 'newMembers') {
    var S5 = compute(withK(inp, k, Math.max(0, n0(inp[k]) + (k === 'leaving' ? -1 : 1))), m);
    if (!S5.ok) return '';
    d = S5.profit12 - S.profit12;
    return (k === 'leaving' ? 'คนเลิกน้อยลงเดือนละ 1 คน' : 'สมาชิกใหม่เพิ่มเดือนละ 1 คน') + ' = อีก 12 เดือน กำไรเพิ่มเดือนละ <b>' + fmtN(d) + '</b> บาท';
  }
  var dir = (k === ROLE[m].cost || k === 'feePct') ? -1 : 1;
  st = leverStep(k, inp, m);
  if (k === 'occupancy') st = 5;
  if (dir < 0 && n0(inp[k]) < st) return '';
  d = leverEffect(k, inp, m, dir * st);
  if (d === null || Math.abs(d) < 0.5) return '';
  var stepTxt;
  var pctUnit = leverUnit(k, inp, m) === '%';
  if (k === 'volume') stepTxt = (m === 'service' ? 'ลูกค้าเพิ่ม' : 'ขายเพิ่ม') + (inp.volumePer === 'month' ? 'เดือนละ ' : 'วันละ ') + fmtN(st) + ' ' + u;

/* ---------- คำอธิบายใต้ตัวเลขที่กำลังปรับ (เครื่องคิดเลขเล็กอยู่ตรงนี้) ---------- */
function leverInsight(k, base, trialInp, m, Sb, St) {
  if (!Sb.ok || !St.ok) return '';

      var pct = (need - 1) * 100;
      var who = m === 'rental' ? 'คนเช่า' : m === 'subscription' ? 'สมาชิก' : 'ลูกค้า';

      }

    }

  }

      return 'ลดงบ ' + fmtN(bv - tv) + ' บาท ถ้ายอดหายไปไม่เกิน <b>' + fmtN(-dv, 1) + '</b> ' + volUnitText(base, m) + ' ยังได้กำไรมากกว่าเดิม';
    }
    return tv > 0 ? 'งบ ' + fmtN(tv) + ' บาท ต้องพายอดขายได้อย่างน้อย <b>' + fmtN(tv / perVol, 1) + '</b> ' + volUnitText(base, m) + ' ถึงจะคุ้มเงินที่จ่าย' : '';
  }
  if (k === 'ownerSalary') {
    return 'ถ้าไม่นับเงินเดือนคุณ ร้านเหลือเงินเดือนละ <b>' + fmtN(St.profit + n0(trialInp.ownerSalary)) + '</b> บาท';
  }
  if (k === 'staffCount' || k === 'staffSalary') {

  }
  if (k === 'rent' || k === 'otherFixed') {

}

  var a = Math.abs(n);

  var s = a.toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: d });
  return (n < 0 && s !== '0' ? '−' : '') + s;
}

function fmtSignedPct(p) { return (p > 0 ? '+' : '') + fmtPct(p); }
function compactTH(n) {
  var a = Math.abs(n), s = n < 0 ? '−' : '';
  function t(x) { return (Math.round(x * 10) / 10).toLocaleString('th-TH'); }
  if (a >= 1e6) return s + t(a / 1e6) + ' ล้าน';
  if (a >= 1e5) return s + t(a / 1e5) + ' แสน';
  if (a >= 1e4) return s + t(a / 1e4) + ' หมื่น';

  return s + Math.round(a).toLocaleString('th-TH');
}

    S.push({ id: 'people', q: 'คนที่ทำงานในร้าน', p: 'รวมเงินเดือนของคุณเองด้วย', f: ['staffCount', 'staffSalary', 'ownerSalary'] });
    S.push({ id: 'fixed', q: 'ค่าใช้จ่ายที่จ่ายทุกเดือน', p: 'จ่ายเท่าเดิม ไม่ว่าจะขายได้มากหรือน้อย', f: ['rent', 'marketing', 'otherFixed'] });
    S.push({ id: 'cash', q: 'ตอนนี้มีเงินหมุนในร้านเท่าไหร่', p: 'ใช้ดูว่าเงินพอใช้ถึงเดือนไหน ไม่ใส่ก็ได้', f: ['cash'] });
    S.push({ id: 'adv', q: 'อยากให้ภาพ 12 เดือนตรงขึ้นไหม', p: 'ไม่ใส่ก็ได้ เลือกใส่เฉพาะเรื่องที่รู้', adv: true, f: [] });

  }
  function stepValid(st) {
    var m = state.model, inp = state.inp;
    return st.f.every(function (k) {
      var f = fieldDef(k);
      if (!f || !f.req) return true;
      if (f.show && !f.show(inp, m)) return true;
      return num(inp[k]) !== null;
    });
  }
  function placeholder(k) {
    var v = MODELS[state.model].sample[k];
    if (typeof v !== 'number') return '';
    return 'เช่น ' + (v >= 1000 ? Math.round(v).toLocaleString('th-TH') : v);
  }
  function fieldHtml(k) {
    var f = fieldDef(k);
    if (!f) return '';
    var m = state.model, inp = state.inp;
    var hidden = f.show && !f.show(inp, m) ? ' hidden' : '';
    var lab = esc(f.label(inp, m));
    var help = f.help ? '<p class="help">' + esc(f.help(inp, m)) + '</p>' : '';
    var id = 'f-' + k;
    if (f.t === 'unit') {
      var M = MODELS[m], cur = inp.unitLabel || M.defUnit;
      var chips = M.units.map(function (u) { return '<button type="button" class="chip" data-act="unit" data-v="' + esc(u) + '" aria-pressed="' + (cur === u) + '">' + esc(u) + '</button>'; }).join('');
      return '<div class="field" data-f="' + k + '"><span class="lab">' + lab + '</span><div class="chips">' + chips +
        '<input id="' + id + '" data-unit-custom placeholder="อื่นๆ พิมพ์เอง" value="' + esc(M.units.indexOf(cur) < 0 ? cur : '') + '" maxlength="12" aria-label="หน่วยอื่น"></div></div>';
    }
    if (f.t === 'cycle') {
      var c = num(inp.cycle) || 1;
      return '<div class="field"><span class="lab">' + lab + '</span><div class="seg">' + [1, 3, 6, 12].map(function (v) {
        return '<button type="button" data-act="cycle" data-v="' + v + '" aria-pressed="' + (c === v) + '">' + v + ' เดือน</button>'; }).join('') + '</div></div>';
    }
    if (f.t === 'period') {

      return '<div class="field"><span class="lab">' + lab + '</span><div class="seg">' +

        '<button type="button" data-act="period" data-v="month" aria-pressed="' + (pk === 'month') + '">ต่อเดือน</button></div></div>';
    }
    if (f.t === 'season') return seasonHtml();
    var mode = (f.t === 'money' || f.t === 'int') ? 'numeric' : 'decimal';
    var v = inp[k];
    var val = v === null || v === undefined || v === '' ? '' : (f.t === 'money' ? Math.round(v).toLocaleString('th-TH') : String(v));
    var input = '<input id="' + id + '" data-k="' + k + '" data-t="' + f.t + '" inputmode="' + mode + '" autocomplete="off" enterkeyhint="next" placeholder="' + esc(placeholder(k)) + '" value="' + esc(val) + '"' + (f.neg ? ' data-neg="1"' : '') + '>';
    var suf = f.t === 'volume' ? esc(U(inp, m)) + '/' + perWord(inp) : esc(f.suf ? f.suf(inp, m) : (f.t === 'pct' ? '%' : 'บาท'));
    var per = '';
    if (f.t === 'volume') {
      var pv = inp.volumePer || MODELS[m].defPer || 'day';
      per = '<div class="seg" role="group" aria-label="นับต่อวันหรือต่อเดือน"><button type="button" data-act="per" data-v="day" aria-pressed="' + (pv === 'day') + '">ต่อวัน</button>' +
        '<button type="button" data-act="per" data-v="month" aria-pressed="' + (pv === 'month') + '">ต่อเดือน</button></div>';
    }
    var extra = '';
    if (k === 'feePct' && (isVolModel(m) || m === 'rental')) {
      extra = state.feeHelp
        ? '<div class="fee-help"><div class="two"><div class="field"><label for="fh-share">ขายผ่านแอปกี่ % ของยอด</label><div class="inbox"><input id="fh-share" data-fh="share" inputmode="decimal" value="' + esc(state.fh.share) + '"><span class="suf">%</span></div></div>' +
          '<div class="field"><label for="fh-rate">แอปหักไปกี่ %</label><div class="inbox"><input id="fh-rate" data-fh="rate" inputmode="decimal" value="' + esc(state.fh.rate) + '"><span class="suf">%</span></div></div></div><div class="fh-res" id="fh-res">' + feeHelpText() + '</div></div>'
        : '<button type="button" class="lnk" data-act="fee-help" style="justify-self:start">ขายผ่านแอปบางส่วน? ให้ช่วยคิด</button>';
    }
    return '<div class="field" data-f="' + k + '"' + hidden + '><label for="' + id + '">' + lab + '</label>' + per + '<div class="inbox">' + input + '<span class="suf">' + suf + '</span></div>' + help + extra + '</div>';
  }
  function feeHelpText() {
    var a = num(state.fh.share), b = num(state.fh.rate);
    if (a === null || b === null) return 'ใส่ทั้งสองช่อง แล้วจะเติมค่าเฉลี่ยให้';
    return 'ค่าธรรมเนียมเฉลี่ย = <b>' + fmtN(a * b / 100, 2) + '%</b> ของยอดขายทั้งหมด (เติมให้แล้ว)';
  }
  function seasonHtml() {
    var s = state.inp.season || { high: [], low: [], highPct: 30, lowPct: 30 };

      var k = s.high.indexOf(c) >= 0 ? 'high' : s.low.indexOf(c) >= 0 ? 'low' : 'normal';
      ms.push('<button type="button" class="month" data-act="month" data-c="' + c + '" data-s="' + k + '" aria-label="' + TH_MONTHS[c - 1] + ' ' + { high: 'ขายดี', low: 'ขายแย่', normal: 'ปกติ' }[k] + '">' + TH_MONTHS[c - 1] + '<small>' + { high: 'ดี', low: 'แย่', normal: '' }[k] + '</small></button>');
    }
    return '<div class="field"><p class="help">แตะเดือนเพื่อสลับ ปกติ → ขายดี → ขายแย่</p><div class="months">' + ms.join('') + '</div><div class="two">' +
      '<div class="field"><label for="f-hp" class="help">ขายดีกว่าปกติ</label><div class="inbox"><input id="f-hp" data-season="highPct" inputmode="decimal" value="' + esc(s.highPct) + '"><span class="suf">%</span></div></div>' +
      '<div class="field"><label for="f-lp" class="help">ขายแย่กว่าปกติ</label><div class="inbox"><input id="f-lp" data-season="lowPct" inputmode="decimal" value="' + esc(s.lowPct) + '"><span class="suf">%</span></div></div></div></div>';
  }

  /* ใบเสร็จที่ค่อยๆ เติมระหว่างกรอก */
  function wizReceipt() {
    var m = state.model, inp = state.inp, steps = stepsFor(m);
    var sellOk = steps.filter(function (s) { return ['var', 'people', 'fixed', 'cash', 'adv'].indexOf(s.id) < 0; }).every(stepValid);
    var varStep = steps.filter(function (s) { return s.id === 'var'; })[0];
    var varIdx = varStep ? steps.indexOf(varStep) : -1;
    var varOk = !varStep || (stepValid(varStep) && (state.editing || state.step >= varIdx));
    var fx = fixedTotal(inp);
    var head = '<section class="panel receipt-strip" id="rstrip"><div class="rs-top"><span class="rs-k">';
    if (!sellOk) return head + 'ใบเสร็จร้านคุณ</span></div><div class="rs-empty">ตัวเลขจะค่อยๆ ขึ้นตรงนี้ระหว่างที่คุณกรอก</div></section>';
    var fill = Object.assign({}, inp);
    FIELDS.forEach(function (f) { if (f.req && (!f.models || f.models.indexOf(m) >= 0) && num(fill[f.k]) === null) fill[f.k] = 0; });
    var S = C(fill, m);
    if (!S.ok) return head + 'ใบเสร็จร้านคุณ</span></div><div class="rs-empty">ตัวเลขยังไม่ครบ</div></section>';
    var lines = '<div class="rs-line"><span>รายได้ต่อเดือน</span><i></i><b>' + fmtN(S.revenue) + '</b></div>';
    if (varOk) lines += '<div class="rs-line"><span>ต้นทุนที่ขึ้นลงตามยอดขาย</span><i></i><b>−' + fmtN(S.varCost) + '</b></div>';
    if (fx > 0) lines += '<div class="rs-line"><span>ค่าใช้จ่ายคงที่</span><i></i><b>−' + fmtN(fx) + '</b></div>';
    var topK = varOk ? (S.profit < 0 ? 'ขาดทุนต่อเดือน' : 'เหลือต่อเดือน') : 'รายได้ต่อเดือน';
    var topV = varOk ? S.profit : S.revenue;
    return head + topK + '</span><span class="rs-v">' + (varOk && S.profit < 0 ? '−' : '') + anim('rs', topV) + '<small>บาท</small></span></div><div class="rs-lines">' + lines + '</div></section>';
  }

  function viewWizard() {
    var m = state.model, steps = stepsFor(m);
    if (state.step >= steps.length) state.step = steps.length - 1;
    var st = steps[state.step];
    var prog = '<div class="prog">' + steps.map(function (s, i) { return '<i class="' + (i <= state.step ? 'on' : '') + '"></i>'; }).join('') + '</div>';
    var body;
    if (st.adv) {
      body = '<div class="adv-list">' + ADV_GROUPS.map(function (g) {
        var fs = FIELDS.filter(function (f) { return f.g === g[0] && (!f.models || f.models.indexOf(m) >= 0); });
        if (!fs.length) return '';
        var filled = fs.some(function (f) { return f.k === 'season' ? hasSeason(state.inp) : num(state.inp[f.k]) !== null; });
        return '<details class="adv-block"' + (filled ? ' open' : '') + '><summary><span>' + g[1] + (g[2] ? '<small>' + g[2] + '</small>' : '') + '</span>' + ICON.down + '</summary><div class="qfields">' +
          fs.map(function (f) { return fieldHtml(f.k); }).join('') + '</div></details>';
      }).join('') + '</div>';
    } else {
      body = '<div class="qfields">' + st.f.map(fieldHtml).join('') + '</div>';
    }
    var cashIdx = steps.map(function (s) { return s.id; }).indexOf('cash');
    var isLastReq = state.step === cashIdx, isAdv = !!st.adv;
    var allOk = steps.every(stepValid);
    var primary;
    if (state.editing) primary = '<button class="btn" data-act="see"' + (allOk ? '' : ' disabled') + '>ดูผล</button>';
    else if (isLastReq || isAdv) primary = '<button class="btn" data-act="see"' + (allOk ? '' : ' disabled') + '>ดูผล' + ICON.next + '</button>';
    else primary = '<button class="btn" data-act="next"' + (stepValid(st) ? '' : ' disabled') + '>ถัดไป' + ICON.next + '</button>';
    var foot = '<div class="foot" id="foot"><div class="wrap"><button class="btn ghost back" data-act="prev" aria-label="ย้อนกลับ">' + ICON.back + '</button>' + primary + '</div></div>';
    var more = isLastReq && !state.editing ? '<div class="skip"><button class="lnk" data-act="next">เพิ่มรายละเอียดให้แม่นขึ้น (ไม่ใส่ก็ได้)</button></div>' : '';
    return bar('<button class="ib" data-act="prev" aria-label="ย้อนกลับ">' + ICON.back + '</button>', MODELS[m].tile, 'ข้อ ' + (state.step + 1) + ' จาก ' + steps.length) +
      '<main class="screen"><div class="wrap">' + prog + wizReceipt() +
      '<div class="q-head"><h1>' + esc(st.q) + '</h1>' + (st.p ? '<p>' + esc(st.p) + '</p>' : '') + '</div>' + body + more + '</div></main>' + foot;
  }

  /* ============================================================ REVIEW (แก้ตัวเลข) */
  function stepSummary(st) {
    var m = state.model, inp = state.inp;
    if (st.adv) {
      var bits = [];
      if (num(inp.growth)) bits.push('โต ' + inp.growth + '%/เดือน');
      if (hasSeason(inp)) bits.push('มีฤดูกาล');
      if (num(inp.capacity) || num(inp.maxMembers) || num(inp.maxConcurrent) || num(inp.maxDeals)) bits.push('มีกำลังสูงสุด');
      if (num(inp.creditDays) || num(inp.stockDays)) bits.push('มีจังหวะเงินเข้าออก');
      if (num(inp.newCustomers)) bits.push('มีข้อมูลลูกค้า');
      if (num(inp.equipValue)) bits.push('มีอุปกรณ์');
      return bits.length ? bits.join(' · ') : 'ยังไม่ได้ใส่';
    }
    return st.f.map(function (k) {
      var f = fieldDef(k);
      if (!f || (f.show && !f.show(inp, m))) return '';
      if (f.t === 'unit') return 'นับเป็น' + U(inp, m);
      if (f.t === 'cycle') return 'จ่ายรอบละ ' + (num(inp.cycle) || 1) + ' เดือน';
      if (f.t === 'period') return inp.periodKind === 'month' ? 'คิดต่อเดือน' : 'คิดต่อคืน';
      var v = num(inp[k]);
      if (v === null) return '';
      var suf = f.t === 'volume' ? U(inp, m) + '/' + perWord(inp) : (f.suf ? f.suf(inp, m) : (f.t === 'pct' ? '%' : 'บาท'));
      return f.label(inp, m) + ' ' + fmtN(v, 2) + (suf.charAt(0) === '%' ? suf : ' ' + suf);
    }).filter(Boolean).join(' · ') || 'ยังไม่ได้ใส่';
  }
  function viewReview() {
    var steps = stepsFor(state.model);
    var ok = steps.every(stepValid);

      '<main class="screen"><div class="wrap">' + (state.isSample ? '<div class="banner"><span>กำลังใช้ตัวเลขร้านกาแฟตัวอย่าง</span><button class="lnk" data-act="to-start">เริ่มใหม่กับร้านคุณ</button></div>' : '') +

      }).join('') + '</div></div></main>' +
      '<div class="foot" id="foot"><div class="wrap"><button class="btn" data-act="see"' + (ok ? '' : ' disabled') + '>ดูผล</button></div></div>';
  }

  /* ============================================================ HOME */
  function statsHtml(S, base, m, prefix, B) {
    var u = volUnitText(base, m);
    var s1, s2, s3;
    if (!S.be || S.be.impossible) s1 = ['จุดคุ้มทุน', '—', '<small>ขายเท่าไหร่ก็ไม่คุ้ม</small>'];
    else s1 = ['จุดคุ้มทุน', anim(prefix + 'be', S.be.vol, 1), '<small>' + esc(u) + '</small>'];
    if (S.profit < 0 && S.be && !S.be.impossible) s2 = ['ต้อง' + (m === 'rental' ? 'มีคนเช่า' : 'ขาย') + 'เพิ่ม', anim(prefix + 'sf', (S.be.vol / S.vol - 1) * 100, 0), '<small>%</small>'];
    else if (S.be && !S.be.impossible) s2 = [(m === 'rental' ? 'คนเช่า' : m === 'subscription' ? 'สมาชิก' : 'ยอด') + 'ลดได้อีก', anim(prefix + 'sf', S.be.safety * 100, 0), '<small>%</small>'];
    else s2 = ['ขาดทุนทุก' + U(base, m) + 'ที่ขาย', '—', ''];
    if (S.hasCash && S.firstNegT) s3 = ['เงินสดหมดราว', '<span>' + monthLabel(S.firstNegT, true) + '</span>', ''];
    else if (S.hasCash) s3 = ['เงินสดอีก 12 เดือน', '<span>' + compactTH(S.cashEnd) + '</span>', ''];
    else s3 = ['เงินเพิ่มใน 12 เดือน', '<span>' + (S.cashEnd < 0 ? '−' : '') + compactTH(Math.abs(S.cashEnd)) + '</span>', ''];
    function d(a, b, dec) {
      if (!B || a === null || b === null || Math.abs(a - b) < 0.05) return '';
      return '<div class="d ' + (a > b ? 'up' : 'down') + '">' + fmtN(Math.abs(a - b), dec) + '</div>';
    }
    var dd = B ? [
      d(S.be && !S.be.impossible ? S.be.vol : null, B.be && !B.be.impossible ? B.be.vol : null, 1),
      d(S.be && !S.be.impossible ? S.be.safety * 100 : null, B.be && !B.be.impossible ? B.be.safety * 100 : null, 0),
      d(S.cashEnd, B.cashEnd, 0)
    ] : ['', '', ''];
    return '<div class="stats">' + [s1, s2, s3].map(function (s, i) {
      return '<div class="stat"><div class="k">' + s[0] + '</div><div class="v">' + s[1] + s[2] + '</div>' + dd[i] + '</div>';
    }).join('') + '</div>';
  }
  function moneyOf(f) {
    if (f.unit === 'month') return [fmtN(f.money), 'บาท/เดือน'];
    if (f.unit === 'year') return [fmtN(f.money * 12), 'บาท ใน 12 เดือน'];
    if (f.unit === 'once') return [fmtN(f.money), 'บาท'];
    return ['', ''];
  }
  var PILL = { high: ['high', 'หนัก'], mid: ['mid', 'ปานกลาง'], watch: ['watch', 'ควรจับตา'], note: ['note', 'ข้อสังเกต'] };

  function viewHome() {
    var m = state.model, base = state.inp, S = C(base, m);
    var head = bar('<button class="tb" data-act="review">' + ICON.back + 'แก้ตัวเลข</button>', 'เช็กตัวเลขร้าน', 'Business Lab');
    if (!S.ok) return head + '<main class="screen"><div class="wrap"><div class="ok-box"><b>ตัวเลขยังไม่ครบ</b><p>กด "แก้ตัวเลข" เพื่อกรอกให้ครบ</p></div></div></main>';
    var F = D(base, m), real = F.filter(function (f) { return f.lv !== 'note'; }), notes = F.filter(function (f) { return f.lv === 'note'; });
    var out = head + '<main class="screen"><div class="wrap">';
    if (state.isSample) out += '<div class="banner"><span>นี่คือร้านกาแฟตัวอย่าง</span><button class="lnk" data-act="to-start">ใส่ตัวเลขร้านคุณ</button></div>';
    out += '<section class="panel"><div class="eyebrow"><span>' + (S.profit < 0 ? 'ขาดทุนต่อเดือน' : 'กำไรต่อเดือน') + '</span>' + (state.isSample ? '<span class="tag">ตัวอย่าง</span>' : '') + '</div>' +
      '<div class="bignum">' + (S.profit < 0 ? '−' : '') + anim('hp', S.profit) + '<span class="u">บาท</span></div>' +
      '<div class="sub">' + (S.owner > 0 ? 'หักเงินเดือนคุณ ' + fmtN(S.owner) + ' แล้ว' : 'ยังไม่ได้หักเงินเดือนคุณ') + ' · รายได้ ' + fmtN(S.revenue) + '</div>' +
      statsHtml(S, base, m, 'h') +
      '<div class="cta"><button class="btn on-panel block" data-act="lab">' + ICON.sliders + 'ลองเปลี่ยนตัวเลข</button></div></section>';

    out += '<div class="sec-h"><h2>สิ่งที่ตัวเลขบอก</h2><span class="aside">' + (real.length ? real.length + ' เรื่อง' : '') + '</span></div>';
    if (real.length) {
      out += '<div class="flist">' + real.map(function (f) {
        var mo = moneyOf(f);
        return '<button class="frow" data-act="finding" data-f="' + f.id + '"><span class="pill ' + PILL[f.lv][0] + '">' + PILL[f.lv][1] + '</span><span class="ft">' + esc(f.title) + '</span>' +
          '<span class="fr-r"><span class="fm">' + mo[0] + '<small>' + mo[1] + '</small></span>' + ICON.chev + '</span></button>';
      }).join('') + '</div>';
    } else {
      out += '<div class="ok-box"><b>ยังไม่มีเรื่องที่น่าห่วง</b><p>ในเรื่องที่ตรวจได้จากตัวเลข ร้านคุณยังแข็งแรง ดูด้านล่างว่าตัวเลขไหนขยับแล้วได้เงินเพิ่มมากที่สุด</p></div>';
    }
    if (notes.length) out += '<div class="flist" style="margin-top:8px">' + notes.map(function (f) {
      return '<button class="frow" data-act="finding" data-f="' + f.id + '"><span class="pill note">ข้อสังเกต</span><span class="ft">' + esc(f.title) + '</span><span class="fr-r">' + ICON.chev + '</span></button>';
    }).join('') + '</div>';
    out += '<div style="margin-top:12px">' + nextStepCard() + '</div>';

  function beCard(S, base, m) {

    var lead = gap >= 0 ? 'ตอนนี้เกินจุดคุ้มทุน <b>' + fmtN(gap, 1) + '</b> ' + esc(ut) : 'ยังขาดอีก <b>' + fmtN(-gap, 1) + '</b> ' + esc(ut) + ' ถึงจะคุ้มทุน';

      '<div class="track"><div class="fill" style="width:' + pc(cur) + '%"></div><div class="mark" style="left:' + pc(be) + '%"></div></div>' +
      '<span class="nl' + ed(pc(cur)) + '" style="left:' + pc(cur) + '%">ตอนนี้ ' + fmtN(cur, 1) + '</span></div></section>';
  }
  function cashCard(S) {
    if (!S.cash.length) return '';
    var lead = S.hasCash ? (S.firstNegT ? 'เงินจะเริ่มติดลบเดือน <b>' + monthLabel(S.firstNegT, true) + '</b>' : 'สิ้น ' + monthLabel(12, true) + ' มีเงินสด <b>' + fmtN(S.cashEnd) + '</b> บาท')
      : (S.cashEnd >= 0 ? 'อีก 12 เดือน เงินเพิ่มขึ้น <b>' + fmtN(S.cashEnd) + '</b> บาท' : 'อีก 12 เดือน เงินลดลง <b>' + fmtN(-S.cashEnd) + '</b> บาท');
    return '<section class="card"><h3>เงินสด 12 เดือนข้างหน้า</h3><p class="lead">' + lead + '</p><div class="chart" data-chart="cash">' + cashSvg(S) + '</div></section>';
  }
  function cashSvg(S) {
    var W = 340, H = 190, L = 44, R = 12, T = 18, B = 26;
    var s1 = [S.cashStart].concat(S.cash.map(function (c) { return c.bal; }));
    var mn = Math.min(0, Math.min.apply(null, s1)), mx = Math.max(0, Math.max.apply(null, s1));
    if (mx === mn) mx = mn + 1;
    var step = niceStep((mx - mn) / 3), lo = Math.floor(mn / step) * step, hi = Math.ceil(mx / step) * step;
    function x(i) { return L + (W - L - R) * i / 12; }
    function y(v) { return T + (H - T - B) * (1 - (v - lo) / (hi - lo)); }
    var g = '';
    for (var v = lo; v <= hi + 1e-6; v += step) g += '<line class="' + (Math.abs(v) < 1e-6 && lo < 0 ? 'zero' : 'grid') + '" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '"/><text class="ax" x="' + (L - 6) + '" y="' + (y(v) + 4).toFixed(1) + '" text-anchor="end">' + compactTH(v) + '</text>';
    [0, 3, 6, 9, 12].forEach(function (i) { g += '<text class="axth" x="' + x(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="' + (i === 0 ? 'start' : i === 12 ? 'end' : 'middle') + '">' + (i === 0 ? 'ตอนนี้' : monthLabel(i, i === 12)) + '</text>'; });
    var path = s1.map(function (v, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); }).join(' ');
    var y0 = y(Math.max(lo, 0)).toFixed(1);
    var out = g + '<path class="area" d="' + path + ' L' + x(12).toFixed(1) + ' ' + y0 + ' L' + x(0).toFixed(1) + ' ' + y0 + ' Z"/><path class="line" d="' + path + '"/>';
    var ey = y(s1[12]);
    out += '<circle class="dot" cx="' + x(12).toFixed(1) + '" cy="' + ey.toFixed(1) + '" r="5"/><text class="endlab" x="' + (x(12) - 4).toFixed(1) + '" y="' + (ey < T + 14 ? ey + 20 : ey - 11).toFixed(1) + '" text-anchor="end">' + compactTH(s1[12]) + '</text>';
    if (S.firstNegT) out += '<circle class="dot" cx="' + x(S.firstNegT).toFixed(1) + '" cy="' + y(s1[S.firstNegT]).toFixed(1) + '" r="5"/>';
    for (var i = 0; i <= 12; i++) {
      var x0 = i === 0 ? L : (x(i) + x(i - 1)) / 2, x1 = i === 12 ? W - R : (x(i) + x(i + 1)) / 2;
      out += '<rect class="hit" data-i="' + i + '" x="' + x0.toFixed(1) + '" y="' + T + '" width="' + (x1 - x0).toFixed(1) + '" height="' + (H - T - B) + '"/>';
    }
    out += '<line class="cross" x1="0" x2="0" y1="' + T + '" y2="' + (H - B) + '" visibility="hidden"/>';
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="กราฟเงินสด 12 เดือน">' + out + '</svg>';
  }
  function receiptHtml(S, B) {
    if (!(S.revenue > 0)) return '';
    var segs = S.split.map(function (s) { return '<i style="flex-grow:' + Math.max(0, s.per100).toFixed(2) + '"></i>'; }).join('') + (S.keep100 > 0 ? '<i class="k" style="flex-grow:' + S.keep100.toFixed(2) + '"></i>' : '');

      '<div class="rc-bar" aria-hidden="true">' + segs + '</div><div class="rc-lines">' + lines + '</div>' +
      '<div class="rc-total"><span>' + (S.keep100 >= 0 ? 'เหลือเป็นกำไร' : 'ขาดทุน') + '</span><b>' + (S.keep100 < 0 ? '−' : '') + Math.abs(S.keep100).toFixed(2) + '</b></div>' +

  }
  function rankCard(S, base, m) {

  /* ============================================================ FINDING DETAIL */
  function viewFinding() {
    var m = state.model, base = state.inp, S = C(base, m);

  /* ============================================================ หาจุดที่ควรเช็ก → เครื่องมือ PL1 / แผนธุรกิจ PL2
     รวมคำถามของทุกเรื่องที่ตัวเลขบอกเป็นชุดเดียว (ไม่ถามซ้ำ) สลับกันทีละเรื่อง สูงสุด 5 ข้อ */
  function askList() {
    var F = D(state.inp, state.model).filter(function (f) { return f.lv !== 'note' && f.qs && f.qs.length; });
    var out = [], seen = {}, idx = F.map(function () { return 0; }), more = true;
    while (out.length < 5 && more) {
      more = false;
      for (var i = 0; i < F.length && out.length < 5; i++) {
        while (idx[i] < F[i].qs.length && seen[F[i].qs[idx[i]]]) idx[i]++;
        if (idx[i] < F[i].qs.length) { var q = F[i].qs[idx[i]++]; seen[q] = 1; out.push(q); more = true; }
      }
    }
    return out.map(function (q) { return { qid: q, fs: F.filter(function (f) { return f.qs.indexOf(q) >= 0; }) }; });
  }
  function askDone() { var L = askList(); return L.length > 0 && L.every(function (q) { return state.answers[q.qid]; }); }
  function askedCount() { return askList().filter(function (q) { return state.answers[q.qid]; }).length; }
  /* เรียงจุดที่ควรเช็กตามความหนักของเรื่องที่ตัวเลขบอก (ลำดับเดียวกับหน้าภาพรวม) แล้วตามลำดับคำถาม */
  function pointsList() {
    var order = D(state.inp, state.model).map(function (f) { return f.id; });
    var L = askList();
    return L.filter(function (q) { var a = state.answers[q.qid]; return a === 'yes' || a === 'unsure'; })
      .map(function (q) { return { q: q, r: Math.min.apply(null, q.fs.map(function (f) { return order.indexOf(f.id); })), i: L.indexOf(q) }; })
      .sort(function (a, b) { return a.r - b.r || a.i - b.i; }).map(function (x) { return x.q; });
  }
  function nextStepCard() {

      var i = ins.indexOf(e.target);
      if (i >= 0 && i < ins.length - 1) { ins[i + 1].focus(); e.preventDefault(); return; }
      var btn = $('#foot [data-act="next"]:not([disabled])') || $('#foot [data-act="see"]:not([disabled])');
      if (btn) { e.preventDefault(); btn.click(); }
    }
    if (e.target.hasAttribute('data-lv')) e.target.blur();
  }

  /* tooltip ของกราฟเงินสด */
  function onPointer(e) {
    var hit = e.target.closest && e.target.closest('.chart .hit');
    var chart = e.target.closest && e.target.closest('.chart');
    $$('.tip').forEach(function (x) { if (!chart || !chart.contains(x)) x.remove(); });
    $$('.chart .cross').forEach(function (c) { if (!chart || !chart.contains(c)) c.setAttribute('visibility', 'hidden'); });
    if (!hit) { if (chart) { var tp = $('.tip', chart); if (tp) tp.remove(); var cr = $('.cross', chart); if (cr) cr.setAttribute('visibility', 'hidden'); } return; }
    var i = +hit.getAttribute('data-i'), S = C(state.inp, state.model);
    var v = i === 0 ? S.cashStart : S.cash[i - 1].bal;
    var svg = $('svg', chart), vb = svg.viewBox.baseVal, rc = svg.getBoundingClientRect(), cb = chart.getBoundingClientRect();
    var hx = i === 0 ? +hit.getAttribute('x') : i === 12 ? +hit.getAttribute('x') + +hit.getAttribute('width') : +hit.getAttribute('x') + +hit.getAttribute('width') / 2;
    var px = hx / vb.width * rc.width + (rc.left - cb.left);
    var cross = $('.cross', chart); cross.setAttribute('x1', hx); cross.setAttribute('x2', hx); cross.setAttribute('visibility', 'visible');
    var tip = $('.tip', chart); if (!tip) { tip = document.createElement('div'); tip.className = 'tip'; chart.appendChild(tip); }
    tip.innerHTML = (i === 0 ? 'ตอนนี้' : 'สิ้น ' + monthLabel(i, true)) + ' · <b>' + fmtN(v) + '</b> บาท';
    var w = tip.offsetWidth;
    tip.style.left = Math.max(w / 2, Math.min(cb.width - w / 2, px)) + 'px'; tip.style.top = '14px';
  }

  function start(data) {
    app = document.getElementById('app');
    var r = data && data.model ? data : null;
    if (!r) { try { r = JSON.parse(sessionStorage.getItem('lab2') || 'null'); } catch (e) { r = null; } }
    restore(r);
    document.addEventListener('click', onClick);
    document.addEventListener('input', onInput);
    document.addEventListener('change', onChange);
    document.addEventListener('focusout', onBlur);
    document.addEventListener('keydown', onKey);
    document.addEventListener('pointermove', onPointer);
    document.addEventListener('pointerdown', onPointer);
    window.addEventListener('resize', function () { var f = $('#foot'); document.documentElement.style.setProperty('--foot-h', (f ? f.offsetHeight : 0) + 'px'); });
    render();
  }
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) { try { hot.snapshot(snapshot); } catch (e) { /* ignore */ } }
  window.__lab = { state: state, compute: compute, detect: detect, render: render, go: go };
  if (hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : {});
})();
</script>
