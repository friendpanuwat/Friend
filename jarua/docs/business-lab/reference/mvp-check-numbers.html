<style>
/* Layout: one mobile column, setup screen then three tabs (ภาพร้าน / อาการ / ทดลอง). Jarua monochrome: black, white, a little gray. */
:root {
  --bg: #FFFFFF;
  --surface: #F4F4F4;
  --surface-2: #E9E9E9;
  --line: #D6D6D6;
  --fg: #0A0A0A;
  --muted: #555555;
  --faint: #8C8C8C;
  --inv-bg: #0A0A0A;
  --inv-fg: #FFFFFF;
  --t1: #2E2E2E; --t2: #4A4A4A; --t3: #666666; --t4: #828282; --t5: #9E9E9E; --t6: #B8B8B8; --t7: #CFCFCF;
  --font-th: "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, sans-serif;
  --font-num: "Space Grotesk", "IBM Plex Sans Thai", system-ui, sans-serif;
  --font-brand: "Sora", "IBM Plex Sans Thai", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #0E0E0E; --surface-2: #1A1A1A; --line: #2B2B2B;
    --fg: #FFFFFF; --muted: #A8A8A8; --faint: #7A7A7A; --inv-bg: #FFFFFF; --inv-fg: #000000;
    --t1: #E6E6E6; --t2: #C4C4C4; --t3: #A3A3A3; --t4: #858585; --t5: #6B6B6B; --t6: #525252; --t7: #3D3D3D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #0E0E0E; --surface-2: #1A1A1A; --line: #2B2B2B;
  --fg: #FFFFFF; --muted: #A8A8A8; --faint: #7A7A7A; --inv-bg: #FFFFFF; --inv-fg: #000000;
  --t1: #E6E6E6; --t2: #C4C4C4; --t3: #A3A3A3; --t4: #858585; --t5: #6B6B6B; --t6: #525252; --t7: #3D3D3D;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-th); font-size: 15px; line-height: 1.6; }
.app { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 56px; display: flex; flex-direction: column; gap: 22px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; line-height: 1.3; text-wrap: balance; }
h1 { font-size: 27px; font-weight: 700; }
h2 { font-size: 18px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.stack-lg { display: flex; flex-direction: column; gap: 16px; }

/* header */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand b { font-family: var(--font-brand); font-size: 17px; letter-spacing: 0.01em; }
.brand span { font-family: var(--font-brand); font-size: 12px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); display: inline-flex; align-items: center; justify-content: center; }
.ghost-btn { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.eyebrow { font-size: 12px; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }

/* model picker */
.models { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.model { text-align: left; min-height: 78px; padding: 11px 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 2px; }
.model b { font-size: 14px; line-height: 1.35; }
.model small { font-size: 11.5px; color: var(--muted); line-height: 1.4; }
.model[aria-pressed="true"] { background: var(--inv-bg); color: var(--inv-fg); border-color: var(--inv-bg); }
.model[aria-pressed="true"] small { color: var(--inv-fg); opacity: 0.75; }

/* fields */
.group-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.field { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 12px; border-radius: var(--r); background: var(--surface); border: 1px solid transparent; }
.field.changed { border-color: var(--fg); }
.field-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.field-text label { font-size: 13.5px; line-height: 1.4; }
.field-text .was { font-size: 11.5px; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 4px; flex: none; }
.stepper button { width: 44px; height: 44px; border-radius: 11px; border: 1px solid var(--line); background: var(--bg); font-size: 20px; line-height: 1; }
.valbox { width: 92px; height: 44px; border-radius: 11px; background: var(--bg); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.valbox input { width: 86px; border: 0; background: transparent; text-align: center; font-family: var(--font-num); font-weight: 700; font-size: 16px; padding: 0; height: 22px; outline: none; }
.valbox input[type=number]::-webkit-inner-spin-button, .valbox input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.valbox input[type=number] { -moz-appearance: textfield; }
.valbox span { font-size: 10.5px; color: var(--muted); line-height: 1.1; }
.textfield { width: 128px; height: 44px; border-radius: 11px; border: 1px solid var(--line); background: var(--bg); padding: 0 10px; font-size: 15px; }
.lever { display: flex; flex-direction: column; gap: 4px; padding: 8px 8px 6px 12px; border-radius: var(--r); background: var(--surface); border: 1px solid transparent; }
.lever.changed { border-color: var(--fg); }
.lever .row { display: flex; align-items: center; gap: 10px; }
.lever input[type=range] { width: 100%; accent-color: var(--fg); height: 28px; margin: 0; }
.note { font-size: 12.5px; line-height: 1.55; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }

/* buttons */
.primary { min-height: 54px; border-radius: var(--r); border: 0; background: var(--inv-bg); color: var(--inv-fg); font-size: 16px; font-weight: 700; padding: 0 18px; }
.secondary { min-height: 46px; border-radius: 12px; border: 1px solid var(--fg); background: var(--bg); font-size: 14px; font-weight: 600; padding: 0 14px; }

/* tabs */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 8px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; border-bottom: 1px solid var(--line); }
.tab { min-height: 44px; border: 0; border-radius: 10px; background: transparent; font-size: 14px; font-weight: 600; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--inv-bg); color: var(--inv-fg); }

/* kpi */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.kpi { border-radius: var(--r); background: var(--surface); padding: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi .k-label { font-size: 12px; color: var(--muted); line-height: 1.4; }
.kpi .k-value { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
.kpi .k-sub { font-size: 11.5px; color: var(--muted); line-height: 1.4; }
.kpi .k-delta { font-family: var(--font-num); font-size: 12.5px; font-weight: 700; }
.kpi.hero { grid-column: 1 / -1; background: var(--inv-bg); color: var(--inv-fg); }
.kpi.hero .k-label, .kpi.hero .k-sub { color: var(--inv-fg); opacity: 0.75; }
.kpi.hero .k-value { font-size: 30px; }

/* panels */
.panel { border-radius: var(--r); border: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.chart { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 18px; vertical-align: middle; margin-right: 6px; }
.bars { display: flex; flex-direction: column; gap: 11px; }
.bar-row { display: flex; flex-direction: column; gap: 4px; }
.bar-top { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; align-items: baseline; }
.bar-top .num { font-weight: 700; white-space: nowrap; }
.track { position: relative; height: 8px; border-radius: 4px; background: var(--surface-2); }
.track .ghost { position: absolute; left: 0; top: 0; height: 8px; border-radius: 4px; background: var(--t6); }
.track .fill { position: absolute; left: 0; top: 0; height: 8px; border-radius: 4px; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: middle; border: 1px solid var(--line); }
.gauge { position: relative; height: 14px; border-radius: 7px; background: var(--surface-2); }
.gauge .fill { position: absolute; left: 0; top: 0; height: 14px; border-radius: 7px; background: var(--fg); }
.gauge .mark { position: absolute; top: -5px; width: 2px; height: 24px; background: var(--muted); left: 50%; }
.gauge-scale { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); }

/* symptoms */
.sym { border-radius: var(--r); border: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.sym.info { border-style: dashed; }
.sym-head { display: flex; flex-direction: column; gap: 6px; }
.sev { align-self: flex-start; font-size: 11.5px; font-weight: 700; letter-spacing: 0.03em; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--fg); }
.sev.high { background: var(--inv-bg); color: var(--inv-fg); border-color: var(--inv-bg); }
.sym ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; }
.worth { border-radius: 10px; background: var(--surface); padding: 10px 12px; font-size: 14px; font-weight: 600; line-height: 1.5; }
.qs { display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
.q { display: flex; flex-direction: column; gap: 6px; }
.q p { font-size: 14px; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.seg button { min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--inv-bg); color: var(--inv-fg); border-color: var(--inv-bg); font-weight: 600; }
.points { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); }
.tool { display: flex; flex-direction: column; gap: 3px; text-decoration: none; color: var(--fg); border-radius: 12px; border: 1px solid var(--fg); padding: 12px; }
.tool .t-k { font-size: 11.5px; color: var(--muted); }
.tool b { font-size: 15px; line-height: 1.4; }
.tool .t-s { font-size: 13px; line-height: 1.5; }
.tool .t-go { font-size: 13px; font-weight: 600; text-decoration: underline; }
.plan { border-radius: var(--r); background: var(--inv-bg); color: var(--inv-fg); padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.plan .soon { align-self: flex-start; font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--inv-fg); }
.plan p { font-size: 13px; opacity: 0.85; }

/* lab */
.labbar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 61px); z-index: 4; background: var(--bg); padding-block: 8px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.labbar div { display: flex; flex-direction: column; min-width: 0; }
.labbar span { font-size: 11px; color: var(--muted); }
.labbar b { font-family: var(--font-num); font-size: 16px; line-height: 1.2; overflow-wrap: anywhere; }
.labbar em { font-style: normal; font-family: var(--font-num); font-size: 11.5px; font-weight: 700; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--inv-bg); color: var(--inv-fg); padding: 10px 16px; border-radius: 12px; font-size: 13px; z-index: 20; max-width: calc(100% - 32px); }
.foot { font-size: 12px; color: var(--muted); line-height: 1.6; border-top: 1px solid var(--line); padding-top: 12px; }
@media (prefers-reduced-motion: no-preference) {
  .track .fill, .gauge .fill { transition: width .25s ease; }
}
</style>

  // ---------- charts ----------
  function cashChart(primary, ghost) {

    s += '<polyline points="' + pts(pv) + '" fill="none" stroke="var(--fg)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';

    s += '<circle cx="' + X(12).toFixed(1) + '" cy="' + Y(pv[12]).toFixed(1) + '" r="4" fill="var(--fg)"/>';
    s += '<text x="' + (L - 6) + '" y="' + (T + 4) + '" fill="var(--muted)" font-size="10.5" text-anchor="end" font-family="Space Grotesk, sans-serif">' + fmtK(hi) + '</text>';
    s += '<text x="' + (L - 6) + '" y="' + (H - B + 4) + '" fill="var(--muted)" font-size="10.5" text-anchor="end" font-family="Space Grotesk, sans-serif">' + fmtK(lo) + '</text>';

  var TONES = ['var(--t1)', 'var(--t2)', 'var(--t3)', 'var(--t4)', 'var(--t5)', 'var(--t6)', 'var(--t7)'];

    });
    h += '<button type="button" class="primary" data-act="go">ดูผลตรวจตัวเลขร้าน</button>';
    h += '<p class="foot">ไม่ต้องสมัคร ไม่มีค่าใช้จ่าย ตัวเลขอยู่ในเครื่องของคุณเท่านั้น</p>';
    document.getElementById('app').innerHTML = h;
  }

  function kpiCards(d, base) {
    var owner = d.v.owner > 0;
    function delta(cur, prev, invert) { if (!base) return ''; var x = cur - prev; if (!isFinite(x) || Math.round(x) === 0) return '<span class="k-delta">ไม่เปลี่ยน</span>'; return '<span class="k-delta">' + signed(x) + '</span>'; }
    var cashTxt = d.broke ? 'เงินหมดเดือนที่ ' + d.broke : fmt(d.cash12);
    var cashSub = d.broke ? 'ถ้าตัวเลขเป็นแบบนี้ต่อไป' : 'บาท เงินสดสิ้นเดือนที่ 12';
    var h = '<div class="kpis">';
    h += '<div class="kpi hero"><span class="k-label">' + (d.profit >= 0 ? 'กำไรต่อเดือน' : 'ขาดทุนต่อเดือน') + '</span><span class="k-value">' + fmt(d.profit) + '</span><span class="k-sub">บาท ' + (owner ? 'หักเงินเดือนตัวคุณแล้ว' : 'ยังไม่ได้หักเงินเดือนตัวคุณ') + '</span>' + delta(d.profit, base ? base.profit : 0) + '</div>';
    h += '<div class="kpi"><span class="k-label">จุดคุ้มทุน</span><span class="k-value" style="font-size:17px">' + esc(volText(d.m, d.v, d.beQ, d)) + '</span><span class="k-sub">ตอนนี้ ' + esc(volText(d.m, d.v, d.q, d)) + '</span></div>';
    h += '<div class="kpi"><span class="k-label">12 เดือนข้างหน้า</span><span class="k-value" style="font-size:17px">' + cashTxt + '</span><span class="k-sub">' + cashSub + '</span>' + (base && !d.broke && !base.broke ? delta(d.cash12, base.cash12) : '') + '</div>';
    h += '<div class="kpi"><span class="k-label">ส่วนต่างต่อหน่วย</span><span class="k-value">' + fmt(d.cmu) + '</span><span class="k-sub">บาท (' + fmt1(d.cmRatio * 100) + '% ของราคา)</span>' + delta(d.cmu, base ? base.cmu : 0) + '</div>';
    h += '<div class="kpi"><span class="k-label">' + (d.util !== null ? 'ใช้กำลังรับไปแล้ว' : 'ยอดลดลงได้อีกก่อนขาดทุน') + '</span><span class="k-value">' + (d.util !== null ? fmt(d.util * 100) + '%' : d.safety !== null ? fmt1(d.safety * 100) + '%' : '—') + '</span><span class="k-sub">' + (d.util !== null ? 'ของที่รับได้สูงสุด' : d.safety !== null ? 'ของยอดตอนนี้' : 'ตอนนี้ขาดทุนอยู่') + '</span></div>';
    return h + '</div>';
  }

  function planCard() {
    return '<div class="plan"><span class="soon">เร็วๆ นี้</span><b style="font-size:16px;line-height:1.4">สร้างแผนธุรกิจเต็มรูปแบบจากตัวเลขชุดนี้</b><p>แผนธุรกิจของ Jarua จะนำตัวเลขชุดนี้ไปต่อ พร้อมคำอธิบาย และแผนที่เชื่อมเรื่องลูกค้า การตลาด และการดำเนินงาน ไม่ต้องกรอกใหม่</p></div>';
  }

  function renderOverview() {
    var d = derive(S.model, S.base);
    var syms = symptoms(S.model, S.base).filter(function (x) { return !x.info; });
    var h = kpiCards(d, null);
    h += '<a href="#" class="tool" data-act="tab" data-tab="symptoms"><span class="t-k">ผลตรวจ</span><b>' + (syms.length ? 'เจอ ' + syms.length + ' เรื่องที่ควรดู' : 'ไม่เจอเรื่องที่น่าห่วงจากตัวเลข') + '</b><span class="t-go">ดูอาการและขนาดของแต่ละเรื่อง</span></a>';
    h += '<section class="panel"><h2>ห่างจากจุดคุ้มทุนแค่ไหน</h2>' + gauge(d) + '</section>';
    h += '<section class="panel"><div class="stack" style="gap:2px"><h2>เงิน 100 บาทที่ลูกค้าจ่าย ไปไหนบ้าง</h2><p class="tiny muted">เดือนปกติ 1 เดือน</p></div>' + moneyRows(d, null) + '</section>';
    h += '<section class="panel"><div class="stack" style="gap:2px"><h2>เงินสด 12 เดือนข้างหน้า</h2><p class="tiny muted">เริ่มจากเงินสดที่มีตอนนี้ ' + fmt(d.cashStart) + ' บาท' + (S.model === 'sub' ? ' สมาชิกเปลี่ยนตามคนเข้าและคนเลิก' : (d.v.growth ? ' ยอดขายโตเดือนละ ' + fmt1(d.v.growth) + '%' : ' ยอดขายเท่าเดิมทุกเดือน')) + '</p></div>' + cashChart(d, null) + '</section>';
    h += planCard();
    return h;
  }

  function renderSymptoms() {
    var list = symptoms(S.model, S.base), d = derive(S.model, S.base);
    var real = list.filter(function (x) { return !x.info; });
    var h = '<section class="stack"><h2>' + (real.length ? 'เจอ ' + real.length + ' เรื่อง เรียงจากเรื่องที่มีผลต่อเงินมากที่สุด' : 'ไม่เจอเรื่องที่น่าห่วงจากตัวเลข') + '</h2><p class="small muted">Lab บอกว่าเรื่องไหนหนักแค่ไหนจากตัวเลข ตอบคำถามสั้นๆ ใต้แต่ละเรื่อง เพื่อดูจุดที่ควรเช็ก และเครื่องมือที่ช่วยหาคำตอบต่อ</p></section>';
    if (d.revenue <= 0) return h + '<p class="note">ยังไม่มีรายได้ในตัวเลขที่กรอก ลองกลับไปแก้ตัวเลขร้าน</p>';
    list.forEach(function (s) {
      var ans = S.answers[s.id] || {};
      h += '<article class="sym' + (s.info ? ' info' : '') + '"><div class="sym-head"><span class="sev ' + s.sev[1] + '">' + s.sev[0] + '</span><h3 style="font-size:17px">' + esc(s.title) + '</h3></div>';
      h += '<ul>' + s.lines.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ul>';
      if (s.worth) h += '<div class="worth">' + esc(s.worth) + '</div>';
      h += '<button type="button" class="secondary" data-act="tryfix" data-id="' + s.id + '">' + esc(s.presetLabel) + '</button>';
      if (s.qs.length) {
        h += '<div class="qs"><p class="small muted">ตอบสั้นๆ เพื่อดูจุดที่ควรเช็ก</p>';
        s.qs.forEach(function (q, i) {
          var a = ans[i] || '';
          h += '<div class="q"><p>' + esc(q.t) + '</p><div class="seg" role="group" aria-label="' + esc(q.t) + '">' +
            [['yes', 'ใช่'], ['no', 'ไม่ใช่'], ['unsure', 'ไม่แน่ใจ']].map(function (o) { return '<button type="button" data-act="answer" data-id="' + s.id + '" data-q="' + i + '" data-v="' + o[0] + '" aria-pressed="' + (a === o[0]) + '">' + o[1] + '</button>'; }).join('') + '</div></div>';
        });
        h += '</div>';
        var points = [], tools = [];
        s.qs.forEach(function (q, i) { if (ans[i] === 'yes' || ans[i] === 'unsure') { points.push(q.p + (ans[i] === 'unsure' ? ' (ยังไม่แน่ใจ)' : '')); q.tools.forEach(function (t) { if (tools.indexOf(t) < 0) tools.push(t); }); } });
        if (points.length) {
          h += '<div class="points"><h3>จุดที่ควรเช็ก</h3><div class="chips">' + points.map(function (p) { return '<span class="chip">' + esc(p) + '</span>'; }).join('') + '</div><h3 style="margin-top:4px">เครื่องมือที่ช่วยหาคำตอบต่อ</h3>';
          tools.forEach(function (t) { h += toolCard(t); });
          h += '</div>';
        }
      }
      h += '</article>';
    });
    if (!real.length) {
      h += '<article class="sym"><h3 style="font-size:17px">ตัวเลขร้านแข็งแรงในเรื่องที่ตรวจได้จากตัวเลข</h3><p class="small">' + (d.safety !== null ? 'ยอดลดลงได้อีก ' + fmt1(d.safety * 100) + '% ก่อนจะขาดทุน' : '') + '</p><div class="points"><h3>เครื่องมือที่ช่วยต่อยอด</h3>' + ['swot4', 'idea8', 'bmc8', 'goal1'].map(toolCard).join('') + '</div></article>';
    }
    h += planCard();
    return h;
  }
  function toolCard(id) {
    var t = TOOLS[id];
    return '<a href="#" class="tool" data-act="tool"><span class="t-k">เครื่องมือ Jarua</span><b>' + esc(t[0]) + '</b><span class="t-s">ช่วยดูว่า: ' + esc(t[1]) + '</span><span class="t-go">เปิดเครื่องมือนี้ พร้อมตัวเลขร้านคุณ</span></a>';
  }

  function renderLab() {
    var h = '<div class="labbar" id="labbar"></div>';
    h += '<section class="stack"><div class="topbar" style="align-items:flex-start"><div class="stack" style="gap:2px"><h2>ลองเปลี่ยนตัวเลข</h2><p class="tiny muted">ตัวเลขร้านตอนนี้ไม่ถูกแก้ ลองได้เต็มที่</p></div><button type="button" class="ghost-btn" data-act="reset">กลับค่าตอนนี้</button></div><div id="labout"></div></section>';
    allFields(S.model).forEach(function (g) {
      h += '<section class="stack" id="grp-' + g.id + '"><h3>' + g.title + '</h3>';
      g.items.forEach(function (f) { h += fieldHTML('lab', f, S.lab, S.base); if (f[0] === PRICE_KEY[S.model]) h += '<p class="note" id="tolnote" hidden></p>'; });
      h += '</section>';
    });
    h += '<section class="panel"><div class="stack" style="gap:2px"><h2>เงิน 100 บาทที่ลูกค้าจ่าย ไปไหนบ้าง</h2><p class="tiny muted">แถบเทาจางคือตัวเลขร้านตอนนี้</p></div><div id="labmoney"></div></section>';
    h += '<section class="panel"><div class="stack" style="gap:2px"><h2>เงินสด 12 เดือนข้างหน้า</h2></div><div id="labcash"></div><div class="legend"><span><i style="border-top:2.5px solid var(--fg)"></i>ที่ทดลอง</span><span><i style="border-top:2px dashed var(--faint)"></i>ตัวเลขร้านตอนนี้</span></div></section>';
    h += planCard();
    return h;
  }
  function updateLab() {
    var d = derive(S.model, S.lab), b = derive(S.model, S.base);
    var bar = document.getElementById('labbar'); if (!bar) return;
    function dl(x) { return Math.round(x) === 0 ? '' : '<em>' + signed(x) + '</em>'; }
    bar.innerHTML = '<div><span>กำไรต่อเดือน</span><b>' + fmt(d.profit) + '</b>' + dl(d.profit - b.profit) + '</div>' +
      '<div><span>จุดคุ้มทุน</span><b style="font-size:13px">' + esc(volText(d.m, d.v, d.beQ, d)) + '</b></div>' +
      '<div><span>12 เดือน</span><b style="font-size:13px">' + (d.broke ? 'เงินหมดเดือนที่ ' + d.broke : 'เหลือ ' + fmtK(d.cash12)) + '</b></div>';
    var sb = symptoms(S.model, S.base).filter(function (x) { return !x.info; }).map(function (x) { return x.id; });
    var sl = symptoms(S.model, S.lab).filter(function (x) { return !x.info; });
    var names = {}; symptoms(S.model, S.base).forEach(function (x) { names[x.id] = x.title; });
    var gone = sb.filter(function (id) { return !sl.some(function (x) { return x.id === id; }); });
    var fresh = sl.filter(function (x) { return sb.indexOf(x.id) < 0; });
    var out = kpiCards(d, b);
    out += '<div class="panel" style="gap:8px"><h3>อาการหลังทดลอง</h3><p class="small">เหลือ ' + sl.length + ' เรื่อง จากตอนนี้ ' + sb.length + ' เรื่อง</p>';
    if (gone.length) out += '<div class="chips">' + gone.map(function (id) { return '<span class="chip">หายไป: ' + esc(names[id] || id) + '</span>'; }).join('') + '</div>';
    if (fresh.length) out += '<div class="chips">' + fresh.map(function (x) { return '<span class="chip">เกิดใหม่: ' + esc(x.title) + '</span>'; }).join('') + '</div>';
    out += '</div>';
    document.getElementById('labout').innerHTML = out;
    document.getElementById('labmoney').innerHTML = moneyRows(d, b);
    document.getElementById('labcash').innerHTML = cashChart(d, b);
    var pk = PRICE_KEY[S.model], tn = document.getElementById('tolnote');
    if (tn) {
      if (pk && S.lab[pk] !== S.base[pk] && S.base[pk] > 0) {
        var tol = priceTolerance(S.model, S.lab, b.profit), ch = (S.lab[pk] - S.base[pk]) / S.base[pk] * 100;
        var t;
        if (tol === null) t = 'ราคานี้ต่ำกว่าต้นทุนต่อหน่วย';
        else if (tol >= 0) t = (ch > 0 ? 'ขึ้นราคา ' : 'ลดราคา ') + fmt1(Math.abs(ch)) + '% ปริมาณที่ขายลดลงได้ไม่เกิน ' + fmt1(tol * 100) + '% กำไรยังไม่ต่ำกว่าตอนนี้';
        else t = (ch > 0 ? 'ขึ้นราคา ' : 'ลดราคา ') + fmt1(Math.abs(ch)) + '% ต้องขายเพิ่มอีก ' + fmt1(-tol * 100) + '% กำไรถึงจะเท่าตอนนี้';
        tn.textContent = t; tn.hidden = false;
      } else tn.hidden = true;
    }
    // per-field "ตอนนี้" notes
    allFields(S.model).forEach(function (g) { g.items.forEach(function (f) {
      var k = f[0], w = document.getElementById('wrap-lab-' + k), was = document.getElementById('was-lab-' + k);
      if (!w) return;
      var ch2 = S.lab[k] !== S.base[k];
      w.classList.toggle('changed', ch2);
      if (was) was.textContent = ch2 ? 'ตอนนี้ ' + fmt1(S.base[k]) + ' ' + fill(f[2], S.lab) : '';
    }); });
  }

  function renderResults() {
    var nSym = symptoms(S.model, S.base).filter(function (x) { return !x.info; }).length;
    var mName = MODELS.filter(function (x) { return x.id === S.model; })[0].name;
    var h = topbar('<button type="button" class="ghost-btn" data-act="back">แก้ตัวเลขร้าน</button>');
    h += '<section class="stack" style="gap:4px"><div class="eyebrow">ผลตรวจ · ' + esc(mName) + '</div><h1 style="font-size:24px">เช็กตัวเลขร้าน</h1></section>';
    h += '<nav class="tabs" role="tablist" aria-label="ส่วนของผลตรวจ">' +
      [['overview', 'ภาพร้าน'], ['symptoms', 'อาการ ' + nSym], ['lab', 'ทดลอง']].map(function (t) { return '<button type="button" class="tab" role="tab" data-act="tab" data-tab="' + t[0] + '" aria-selected="' + (S.tab === t[0]) + '">' + t[1] + '</button>'; }).join('') + '</nav>';
    h += '<div class="stack-lg" id="panel">' + (S.tab === 'overview' ? renderOverview() : S.tab === 'symptoms' ? renderSymptoms() : renderLab()) + '</div>';
    h += '<p class="foot">คำนวณจากตัวเลขที่กรอก ไม่รวมภาษี ภาพ 12 เดือนเป็นแบบง่าย ยังไม่คิดจังหวะเงินเข้าออกและฤดูกาล · MVP: ปุ่มไปเครื่องมืออื่นยังไม่เชื่อมจริง</p>';
    document.getElementById('app').innerHTML = h;
    if (S.tab === 'lab') updateLab();
  }

  function render() { if (S.screen === 'setup') renderSetup(); else renderResults(); }
  function toast(msg) { var t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(S.toastTimer); S.toastTimer = setTimeout(function () { t.hidden = true; }, 2600); }

  // ---------- events ----------
  function setVal(scope, key, n, syncInput) {
    var f = findField(key); if (!f || isNaN(n)) return;
    n = Math.max(f[4], Math.min(f[5], Math.round(n * 100) / 100));
    var obj = scope === 'lab' ? S.lab : S.base;
    obj[key] = n;
    var inp = document.getElementById(scope + '-' + key);
    if (syncInput && inp) inp.value = n;
    var rng = document.getElementById('rng-' + scope + '-' + key);
    if (rng && document.activeElement !== rng) { if (n > Number(rng.max)) rng.max = n; rng.value = n; }
    if (scope === 'lab') updateLab(); else save();
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'theme') {
      var root = document.documentElement, cur = root.getAttribute('data-theme');
      var dark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      var next = dark ? 'light' : 'dark'; root.setAttribute('data-theme', next);
      try { localStorage.setItem('jarua-lab-theme', next); } catch (er) {}
    } else if (act === 'model') {
      S.model = b.getAttribute('data-id'); S.base = copy(SAMPLES[S.model]); S.answers = {}; save(); renderSetup();
    } else if (act === 'sample') {
      S.base = copy(SAMPLES[S.model]); S.answers = {}; save(); renderSetup();
    } else if (act === 'step') {
      var scope = b.getAttribute('data-scope'), key = b.getAttribute('data-key'), dir = Number(b.getAttribute('data-dir'));
      var f = findField(key), obj = scope === 'lab' ? S.lab : S.base;
      setVal(scope, key, Number(obj[key]) + dir * f[3], true);
    } else if (act === 'go') {
      S.lab = copy(S.base); S.screen = 'results'; S.tab = 'overview'; S.answers = {}; render(); window.scrollTo(0, 0);
    } else if (act === 'back') {
      S.screen = 'setup'; render(); window.scrollTo(0, 0);
    } else if (act === 'tab') {
      e.preventDefault(); S.tab = b.getAttribute('data-tab'); render();
      var tabs = document.querySelector('.tabs'); if (tabs) window.scrollTo(0, Math.max(0, tabs.offsetTop - 8));
    } else if (act === 'answer') {
      var id = b.getAttribute('data-id'), qi = b.getAttribute('data-q'), val = b.getAttribute('data-v');
      S.answers[id] = S.answers[id] || {};
      S.answers[id][qi] = S.answers[id][qi] === val ? '' : val;
      var y = window.scrollY; render(); window.scrollTo(0, y);
    } else if (act === 'tryfix') {
      var sid = b.getAttribute('data-id');
      var sym = symptoms(S.model, S.base).filter(function (x) { return x.id === sid; })[0];
      S.lab = copy(S.base);
      if (sym && sym.preset) sym.preset(S.lab);
      S.tab = 'lab'; render();
      var target = sym && sym.focus ? document.getElementById('wrap-lab-' + sym.focus) : document.querySelector('.tabs');
      if (target) window.scrollTo(0, Math.max(0, target.getBoundingClientRect().top + window.scrollY - 150));
    } else if (act === 'reset') {
      S.lab = copy(S.base); var y2 = window.scrollY; render(); window.scrollTo(0, y2);
    } else if (act === 'tool') {
      e.preventDefault(); toast('MVP: ยังไม่เชื่อมกับเครื่องมือจริง ในเวอร์ชันจริงจะเปิดเครื่องมือพร้อมตัวเลขร้านคุณ');
    }
  });
  document.addEventListener('input', function (e) {
    var el = e.target, scope = el.getAttribute('data-scope'), key = el.getAttribute('data-key');
    if (!scope || !key) return;
    if (key === 'unitName') { S.base.unitName = el.value; save(); return; }
    if (el.value === '' || el.value === '-') return;
    var n = Number(el.value);
    if (el.type === 'range') { setVal(scope, key, n, true); }
    else setVal(scope, key, n, false);
  });
  document.addEventListener('change', function (e) {
    var el = e.target, scope = el.getAttribute('data-scope'), key = el.getAttribute('data-key');
    if (!scope || !key || key === 'unitName') return;
    if (el.type === 'number') { var obj = scope === 'lab' ? S.lab : S.base; el.value = obj[key]; }
  });

  render();
})();
</script>
