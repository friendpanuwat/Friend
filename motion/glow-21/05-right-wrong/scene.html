<!doctype html>
<html><head><meta charset="utf-8"><title>glow-line scene</title>
<script src="../../../.claude/skills/glow-line-motion/assets/glowline.js"></script></head>
<body><script>
/* ถูกกับผิด — แม่แบบ glow-line-motion. ข้อความทั้งหมดเป็นตัวอย่าง: แก้ได้ตรง ๆ ในบรรทัดที่มีเครื่องหมาย ✎ */
GL.run(() => {
  GL.stage();
  const { kit, parts, C, W, H } = GL;

  GL.text('ผิด vs ถูก', { y: 300, size: 120, at: .1 });
  const row = (y, ok, label, sub, at) => {
    const v = GL.art(p => kit.verdict(p, { r: 92, ok }), { x: 220, y, at });
    const a = GL.text(label, { x: 360, y: y - 4, size: 62, anchor: 'start', maxW: W - 480, at: at + .3 });
    const b = GL.text(sub, { x: 360, y: y + 70, size: 42, weight: 500, color: C.sub, glow: false, anchor: 'start', maxW: W - 480, at: at + .45 });
    return { els: [v.wrap, a, b], g: v.g, end: v.end };
  };
  const w = row(620, false, 'โพสต์ตอนว่าง', 'คนดูไม่รู้ว่าต้องมาเมื่อไหร่', .5);                                           // ✎
  GL.hline(900, 1.3, { x1: 120, x2: W - 120 });
  const r = row(1160, true, 'โพสต์เวลาเดิมทุกวัน', 'คนดูรอ แล้วกลับมาเอง', 1.6);                                        // ✎
  w.els.forEach(e => GL.tween(e, r.end + .3, .5, { o: 1 }, { o: .35 }));
  GL.pulse(r.g, r.end + .3);
});
</script></body></html>
