<!doctype html>
<html><head><meta charset="utf-8"><title>glow-line scene</title>
<script src="../../../.claude/skills/glow-line-motion/assets/glowline.js"></script></head>
<body><script>
/* เคล็ดลับ / ความลับ — แม่แบบ glow-line-motion. ข้อความทั้งหมดเป็นตัวอย่าง: แก้ได้ตรง ๆ ในบรรทัดที่มีเครื่องหมาย ✎ */
GL.run(() => {
  GL.stage();
  const { kit, parts, C, W, H } = GL;

  GL.title({ kicker: 'SECRET', main: 'เคล็ดลับ' });                                                                   // ✎
  const sh = GL.art(p => kit.lock(p, { size: 460, part: 'shackle' }), { x: 540, y: 960, at: .4 });
  const bd = GL.art(p => kit.lock(p, { size: 460, part: 'body' }), { x: 540, y: 960, at: .4 });
  GL.tween(sh.wrap, bd.end + .2, .45, { dy: 0 }, { dy: -70 });
  GL.art(p => { kit.sparkle(p, { x: -230, y: -200, r: 40 }); kit.sparkle(p, { x: 220, y: -260, r: 26, at: .1 }); kit.burst(p, { y: -80, r1: 290, r2: 340, n: 7, from: -90, spread: 140, at: .1 }); },
    { x: 540, y: 960, at: bd.end + .55 });
  GL.text('ที่คนขายเก่ง ๆ ไม่ค่อยบอก', { y: 1420, size: 66, at: bd.end + .6 });                                        // ✎
  GL.pulse(bd.g, bd.end + .7);
});
</script></body></html>
