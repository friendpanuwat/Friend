<!doctype html>
<html><head><meta charset="utf-8"><title>glow-line scene</title>
<script src="../../../.claude/skills/glow-line-motion/assets/glowline.js"></script></head>
<body><script>
/* เพิ่มขึ้น / ลดลง — แม่แบบ glow-line-motion. ข้อความทั้งหมดเป็นตัวอย่าง: แก้ได้ตรง ๆ ในบรรทัดที่มีเครื่องหมาย ✎ */
GL.run(() => {
  GL.stage();
  const { kit, parts, C, W, H } = GL;

  const part = (at, label, values, sign, n, sub) => {
    GL.text(label, { y: 480, size: 96, at });
    const a = GL.place(p => kit.chart(p, { w: 380, h: 320, values }), { y: 930, w: 760, at: at + .2 });
    const e = GL.count(n, { y: 1490, size: 210, prefix: sign, suffix: '%', at: a.end - .4, dur: .9 });
    GL.text(sub, { y: 1600, size: 50, weight: 600, color: C.soft, glow: false, at: e - .2 });
    GL.pulse(a.g, e);
    return e;
  };
  const t = GL.page(.3, at => part(at, 'ยอดขาย', [2, 2.6, 2.4, 3.8, 5.5], '+', 45, 'หลังเปลี่ยนรูปสินค้า'), { hold: 1 });      // ✎
  GL.page(t, at => part(at, 'ค่าโฆษณา', [5.5, 4.6, 4.9, 3, 1.6], '−', 30, 'เมื่อยิงแอดตรงกลุ่ม'), { out: false });           // ✎
});
</script></body></html>
