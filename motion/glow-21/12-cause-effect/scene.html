<!doctype html>
<html><head><meta charset="utf-8"><title>glow-line scene</title>
<script src="../../../.claude/skills/glow-line-motion/assets/glowline.js"></script></head>
<body><script>
/* เหตุกับผล — แม่แบบ glow-line-motion. ข้อความทั้งหมดเป็นตัวอย่าง: แก้ได้ตรง ๆ ในบรรทัดที่มีเครื่องหมาย ✎ */
GL.run(() => {
  GL.stage();
  const { kit, parts, C, W, H } = GL;

  GL.text('เหตุ', { y: 300, size: 46, ls: 8, color: C.kicker, at: .1 });
  GL.art(p => { parts.phone(p, 0, 0, 0); parts.moon(p, 150, -120, 46, .4, .3); parts.zzz(p, 150, -40, .6, .3); }, { x: 520, y: 560, s: .6, at: .2 });
  GL.text('เล่นมือถือก่อนนอน', { y: 790, size: 64, at: .8 });                                                           // ✎
  const a = GL.connect(540, 840, 540, 1000, { sw: 4, hs: 26, at: 1.3, d: .4 });
  GL.text('ผล', { y: 1080, size: 46, ls: 8, color: C.kicker, at: a - .1 });
  const f = GL.art(p => kit.face(p, { r: 130, mood: 'worried' }), { x: 540, y: 1260, at: a });
  GL.text('ตื่นมาสมองตื้อทั้งวัน', { y: 1490, size: 64, at: f.end - .2 });                                             // ✎
  GL.pulse(f.g, f.end + .1);
});
</script></body></html>
