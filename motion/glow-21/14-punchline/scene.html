<!doctype html>
<html><head><meta charset="utf-8"><title>glow-line scene</title>
<script src="../../../.claude/skills/glow-line-motion/assets/glowline.js"></script></head>
<body><script>
/* ประโยคเด็ด — แม่แบบ glow-line-motion. ข้อความทั้งหมดเป็นตัวอย่าง: แก้ได้ตรง ๆ ในบรรทัดที่มีเครื่องหมาย ✎ */
GL.run(() => {
  GL.stage();
  const { kit, parts, C, W, H } = GL;

  GL.art(p => kit.quote(p, { size: 150 }), { x: 210, y: 560, at: .2 });
  GL.text('ทำให้เสร็จ', { y: 860, size: 140, at: .5 });                                                                // ✎
  GL.text('ดีกว่าทำให้เป๊ะ', { y: 1040, size: 140, at: .8 });                                                           // ✎
  const u = GL.connect(180, 1100, 900, 1100, { style: 'swoosh', bend: .03, head: 'none', sw: 5, at: 1.3, d: .5 });
  GL.art(p => kit.quote(p, { size: 110, close: true }), { x: 860, y: 1260, at: u - .1 });
  GL.caption('— จำไว้ทุกครั้งที่ลังเล', { y: 1420, at: u });                                                              // ✎
});
</script></body></html>
